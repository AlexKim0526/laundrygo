다_x000D_\n멈춰주세요. 세탁비가 러그값보다 비싸서 안돼요", "answer": "이주희 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님의 러그 확보되어\n금일 출고 진행하겠습니다.\n\n오랜 시간 기다리시게 하는 불편을 드려 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801713", "date": "2026-05-12", "cat": "기타", "title": "침대 커버 세탁 요청", "question": "침대 커버도 세탁 해주세요. 생활 빨래 아니고 침대 커버 세탁으로 신청하겠습니다", "answer": "정해웅 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 생활빨래 관련 문의 주신 내용 확인 했습니다.\n\n생활빨래의 경우 보내주신 그대로 일괄 세탁 및 고온 건조가 진행되어\n일부 품목은 생활빨래 불가로 지정되어 있는데요,\n죄송하게도 말씀 주신 품목은 생활빨래 진행이 어려운 점 너른 양해 부탁 드립니다.\n \n\n고객님의 소중한 세탁물의 손상을 방지하고자\n생활빨래 불가한 품목을 지정하고 있는 점 고객님의 너른 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801709", "date": "2026-05-12", "cat": "결제/과금 문의", "title": "결제금액 오류", "question": "빨리 연락 바람", "answer": "황나현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의하신 **[런드리&드라이 스탠다드]** 요금제의 품목 차감 기준 및\n지난 4월 18일 이용 내역에 대해 안내드립니다.\n\n해당 구독 플랜은 다음과 같은 기준으로 품목권이 차감됩니다.\n\n- **개별 클리닝 의류:** 품목당 **1개** 차감 (단, 패딩류는 **2개** 차감)\n- **생활 빨래(4kg 기준):** **1개** 차감\n\n지난 4월 18일에 맡겨주신 세탁물은 위 기본 품목권 차감 기준에\n해당하지 않는 품목으로 확인되어,\n구독 혜택인 **20% 할인**이 적용된 금액으로 결제되었습니다.\n\n이용 중이신 요금제의 상세 차감 기준은 앱 내 **[My > 이용 중인 요금제 선택 > 구독 관리 > 차감 기준]** 메뉴에서 언제든지 확인하실 수 있습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801708", "date": "2026-05-12", "cat": "기타", "title": "런드랫 수거해감", "question": "Cctv 확인해보니 수거신청안했는데 런드렛 수거해감 다시 배달 요청", "answer": "이준수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 불편드린 부분 죄송한 말씀 드립니다.\n\n확인 요청 주신 수거 신청건 확인시 취소 처리 되어있는 부분 확인되어\n안내 드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801699", "date": "2026-05-12", "cat": "런드렛 이용 문의", "title": "라이트백을 구매하고 싶어요", "question": "오늘 첫 이용입니다. 라이트백은 어떻게 구매하나요?", "answer": "우신영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 요청해주신 방식과 다르게 라이트백으로 전달되어\n불편을 드린 점 진심으로 사과드립니다.\n\n확인해보니 이번 건은 **작업 과정에서의 실수로 라이트백에 담겨 전달된 것**으로 확인됩니다.\n다음 이용 시, 세탁물을 이번에 받아보신 라이트백에 담아주시고,\n수거 신청 화면에서 **세탁물 받는 방법을 [런드렛]으로 선택**해주시면\n착오없이 런드렛으로 배송해드리겠습니다.\n\n이번 건은 내부적으로 공유하여 같은 문제가 재발하지 않도록 개선하겠습니다.\n다시 한 번 불편을 드린 점 사과드리며,\n추가로 궁금하신 점이 있으시면 언제든 편하게 말씀해주세요.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801696", "date": "2026-05-12", "cat": "변형/변색/손상", "title": "옷감손상", "question": "올해구매하고 첫 드라이한 제품인데 _x000D_\n가랑이 부분 옷감손상되서 왔습니다._x000D_\n게다가 오염은 제거도 안됐습니다_x000D_\n_x000D_\n옷감복원 안될시 보상 해주세요_x000D_\n", "answer": "김아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 앞서 담당 부서 측과 소통해주신 이력 확인되어\n해당 문의글은 종료됨을 양해 부탁드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801695", "date": "2026-05-12", "cat": "오염 미 제거", "title": "오염물", "question": "검정색 묻어잇던건 혹시 안지워지나요 ㅠㅠ?", "answer": "정다운 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 믿고 맡겨주신 세탁물에\n만족을 드리지 못해 죄송합니다.\n\n원단 손상을 방지하기 위해 비비거나\n강한 마찰 없이 약품으로만 케어를 진행하고 있어,\n특정 오염은 100% 제거가 어려운 경우가 있습니다.\n\n또한, 원단의 염색 상태나 얼룩의 성분 등에 따라\n제거 여부가 달라질 수 있어\n앱 내 고지드리고 있는 점도 함께 참고 부탁드립니다.\n\n충분한 도움을 드리지 못해 죄송하며\n해당 세탁비에 대해 포인트로 환불 도와드렸으니\n다음 이용 시 사용 부탁드립니다.\n\n더 나은 세탁 품질로 보답드릴 수 있도록 계속해서 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801691", "date": "2026-05-12", "cat": "변형/변색/손상", "title": "단추깨짐", "question": "오늘 와이셔츠를 입을려고 했는데 _x000D_\n소매부분이 이상하기 접혀저 있고 단추가 깨져있었어요 _x000D_\n아마 소매가 접혀지면서 단추가 깨진거 같아요 _x000D_\n단추 새로 달아주세요", "answer": "김학유 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 소중한 세탁물을 믿고 맡겨주셨음에도\n단추 깨짐으로 불편을 겪으신 점 진심으로 사과드립니다.\n\n만족스러운 결과로\n보답해 드리지 못해 저희도 마음이 무겁습니다.\n\n이에 대해 저희가 책임감을 갖고\n신속하고 정확한 후속 조치를 진행하고자 합니다.\n\n가장 효과적인 해결을 위해,\n고객님께서 현재 세탁물의 상태를 사진으로 찍어\n앱 내 **[안심케어 요청]** 메뉴를 통해 접수해주시면 감사하겠습니다.\n\n이는 문제 상황을 정확히 기록하고,\n고객님께 최적의 솔루션(재세탁, 복원, 보상 등)을 제안 드리기 위한\n필수적인 절차이오니 조금 번거로우시더라도 협조 부탁드립니다.\n\n\n### **💡 세탁물 문제, 이렇게 접수해 주세요!**\n이제는 고객센터를 따로 거치지 않으셔도,\n앱에서 직접 사진과 함께 문제를 접수하고 **조치 요청**을 하실 수 있어요.\n\n세탁물에 이상이 있는 경우,\n접수 후 아래 두 가지 중 원하시는 방식으로 처리 요청하실 수 있습니다.\n\n\n- **안심케어 요청** (재세탁, 복원 등 가능한 경우)\n- **포인트 환불 요청**\n※ 모든 요청은 담당자가 실물 상태를 확인한 후,\n가장 적합한 방식으로 처리해 드리고 있어요.\n\n###\n**📱 접수 방법 안내**\n\n1. 앱을 최신 버전으로 업데이트해주세요\n2. **\"MY > 이용내역\"** 메뉴로 들어가 주세요\n3. 문제가 있는 세탁물의 수거 신청일을 선택\n4. 해당 품목을 누른 뒤 **[문의 하기]** 버튼 클릭\n5. **[안심케어 요청]** 선택\n6. 사진을 첨부하고, 문제 내용을 작성해주세요\n7. **신청건의 \"확정 알림톡\" 발생 이후, **\n수거 신청 시 상단에 표시되는 안심케어 서비스 선택\n8. 안심케어 품목을 선택하여 수거신청을 완료해 주세요.\n (참고하실 수 있는 이미지를 함께 첨부해 드립니다.)\n\n\n### **✅ 꼭 확인해 주세요!**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n1. 세탁물 수령일 기준 30일 이내에 접수해 주셔야 합니다.\n2. 승인 후 30일 안에 세탁물을 보내주셔야 합니다.\n3. 운송비는 요청건 확정 시 자동으로 포인트로 지급됩니다.\n4. 일반 세탁물과 함께 섞인채로 보내주시면 확인이 어려워요.\n따로 포장해 주시길 부탁드립니다.\n5. 접수해주신 세탁물은 **원상 복원을 최우선**으로 확인하고 있어요.\n담당자가 실물을 꼼꼼히 확인한 후,\n**재세탁·복원 등의 재처리가 가능한 경우에는 **\n**직접 작업이 진행**되며, 조치가 어려운 손상일 경우에는 **별도 안내**를 드립니다.\n\n고객님의 소중한 의견 하나하나를 귀 기울여 듣고,\n더 나은 서비스로 보답할 수 있도록 언제나 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801690", "date": "2026-05-12", "cat": "오염 미 제거", "title": "오염미제거 ", "question": "오염미제거.옷감손상._x000D_\n먼지제거 하나도 안됨", "answer": "허지은 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 먼저 믿고 맡겨주신 세탁물에서\n**[얼룩]**이 충분히 개선되지 않아 아쉬움을 드린 점 진심으로 사과드립니다.\n\n해당 내용은 내부적으로 다시 한번 확인하여\n같은 불편이 반복되지 않도록 꼼꼼히 점검하겠습니다.\n\n또한 이번 건에 대해서는 세탁 품질 미흡에 대한\n죄송한 마음을 담아 세탁비용 5,800원을 포인트로 지급해드렸습니다.\n\n말씀주신 얼룩은 일반 세탁만으로는 제거가 어려운 오염으로,\n보다 정밀한 약품 처리가 필요한 상태로 판단됩니다.\n\n이와 같은 경우에는 **‘집중케어’** 서비스를 통해\n보다 세심한 케어가 가능하여 함께 안내드립니다.\n\n**개별클리닝으로 접수 후 집중케어로 요청해주시면**\n**더 꼼꼼하게 확인하여 케어 도와드리겠습니다.**\n\n* * *\n✅ **집중케어 신청 방법**\n**①** **[수거신청] 선택**\n ****\n\n**② [개별클리닝] 선택**\n \n\n**➂ 품목 선택 후,**\n 화면 예시처럼 추가 케어 항목을 체크해주세요.\n \n\n* * *\n📌 **유의사항**\n**✔︎** 요청 시 **의류 전체 사진**을 찍어주신 후\n    **세심한 케어 필요 부위를 표시**해주시면\n    정확한 처리가 가능합니다.\n\n* * *\n런드리고는 고객님의 일상에\n여유와 가치를 더하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801689", "date": "2026-05-12", "cat": "런드렛 반납 문의", "title": "구독해지시 런드렛 반납", "question": "해당월분 이용후 잠시 구독해지 예정입니다._x000D_\n금일 서비스 이용예정으로 런드렛도 함께 반납하고 싶은데_x000D_\n런드렛 반납 신청이 되지 않아 문의드립니다.", "answer": "정필립 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n죄송하지만 런드렛 반납은\n고객님께서 직접 신청해주셔야 하는 점 안내드립니다.\n\n**런드리고 앱 > MY > 런드렛 반납**을 통해\n반납 희망하시는 날짜를 선택하시어 신청 부탁드립니다!\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801677", "date": "2026-05-12", "cat": "변형/변색/손상", "title": "가슴 로고 패치가 변형,탈락되었습니다", "question": "패딩 가슴팍에 디스커버리 로고가 변형되어 떨어져서 받았습니다..", "answer": "이정훈 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[단추 탈락]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.🙏🏻\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801674", "date": "2026-05-12", "cat": "월정액 가입/변경/해지 문의", "title": "해지신청", "question": "안녕하세요. 오늘부로 다시 새로운 월정기권이 결제 및 실행되었습니다. 오늘 결제된 정기권을 결제취소 요청드리며 구독해지처리도 부탁드립니다.", "answer": "김효진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요청해주신 **[런드리고X 베이직]** 요금제의\n즉시 해지 처리가 완료되었습니다.\n\n현재 **[대표 결제수단 39,500 원]** 환불 처리되었으며,\n환불 금액은 카드사 영업일 기준으로\n최대 5일 정도 소요될 수 있는 점 양해 부탁드립니다. 🙏\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801673", "date": "2026-05-12", "cat": "기타", "title": "오염 미 제거", "question": "신발 앞 쪽에 오염이 제거가 안됐어요", "answer": "임은희 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 보내주신 헌옷 포인트가 아직 지급되지 않아\n많이 기다리셨을 것 같아 죄송합니다.\n\n최근 급격한 날씨 변화로 인해 헌옷 물량이 증가하면서\n무게 계측 및 검수 과정이 순차적으로 진행되고 있어\n지급까지 다소 시간이 소요되고 있습니다.\n\n**현재 기준으로 포인트 지급까지 **\n**약 2주 정도 소요****될 수 있는 점 양해 부탁드립니다.**\n\n지급 완료 시 알림 수신 동의 여부에 따라\n푸시 알림으로 안내드릴 예정이오니 참고 부탁드립니다.\n최대한 빠르게 처리될 수 있도록 노력하겠습니다.\n\n불편을 드린 점 다시 한번 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801672", "date": "2026-05-12", "cat": "기타", "title": "수거를 다 안해가셨어요", "question": "세탁물이 많아 하나는 라이트 백에 하나는 호텔에서 가져온 런드리 백에 넣었는데 비닐 런드리백을 안가져가셨네요_x000D_\n할인쿠폰 적용하려고 서둘러서 더 내놓은건데…_x000D_\n같이 가져가주셔야할거 같네요", "answer": "양효실 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 믿고 맡겨주신 세탁물에 만족을 드리지 못해 죄송합니다.\n\n말씀 주신 세탁물 중\n**CFAB00147594 운동화는 타 세탁물과 함께 패킹되어**\n**정상적으로 출고**된 것으로 확인됩니다.\n\n번거로우시겠지만 런드렛 내부 또는 자택 내 다시 한 번 확인 부탁드립니다.\n\n또한, **CFAB00148178 운동화는 세탁물 이슈 접수 주신 내역 확인되며**\n**해당 운동화는 최대 케어가 완료된 것으로 확인**되어\n**세탁비를 포인트로 환불** 도와드렸으니 너른 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801668", "date": "2026-05-12", "cat": "기타", "title": "아래답변에 대한문의", "question": "제 말씀은 왜 고객에게 확인하지 않고 진품인지 아닌지를 확인하지 않고 진행하시는지를 문의드리는겁니다", "answer": "신경철 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 이용에 혼선을 드려 죄송합니다.\n\n이전 문의에 첨부 주신 사진 상\n전산 오류로 정장재킷이 중복으로 등록되어\n품목 6장 차감으로 확인된 점 사과의 말씀 드립니다.\n\n현재 전산상 정상적으로 5장 차감된 것으로 확인되며,\n**잔존품목 1장 확인되어 해당 품목으로 니트를 차감한 것으로 참작하여**\n**차액 1,000원을 부분 환불 처리 진행**하였습니다.\n\n환불은 카드사 영업일 기준에 따라 2~5일 정도\n소요될 수 있는 점 양해 부탁드립니다.\n\n다시 한 번 이용에 불편을 드려 죄송하며\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801666", "date": "2026-05-12", "cat": "기타", "title": "상품 차감", "question": "이 옷은 세탁보냈을때 얼룩이 안지워져서 왜 제가 다시 돈을 내야하는거죠??다시 보낸건데 왜 두개가 차감되는걸까요???", "answer": "신현빈 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의하신 압축 및 보관 서비스에 대해 안내해 드립니다.\n우선 압축 서비스는 세탁 완료 후 고객님 댁으로 배송해 드리는 과정에서\n부피를 줄이기 위해 제공되는 서비스입니다. 따라서 배송 시점에 선택하여 이용하실 수 있습니다.\n반면, 보관 서비스의 경우 의류의 최상의 컨디션을 유지하기 위해 압축하지 않은 상태로 보관을 진행하고 있습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801663", "date": "2026-05-12", "cat": "오염 미 제거", "title": "세탁미흡", "question": "스카프 다림질 안되어 있고 _x000D_\n블라우스 얼룩 그대로입니다.", "answer": "김찬윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n만족스럽지 않은 세탁 품질로 불편을 드리게 되어 많이 속상하셨을 것 같습니다.\n\n집중케어 및 개별클리닝 세탁 서비스 진행 시 세탁으로 지울 수 없는 얼룩은 약품을 통해 진행하고 있으나, 그로 인해 **변형/탈색이 발생될 우려가 있어 완벽한 제거가 어려웠던 것으로 보입니다.**\n\n**재세탁을 진행하여도 얼룩의 제거가 어려울 수 있고, 원단의 손상이 발생할 수 있어 도움을 드리기 어려운 점 사과드립니다.**\n\n이번에 만족스러운 서비스를 제공하지 못한 점에 대해 다시 한 번 사과의 말씀 드리며, 여러 항목에 걸친 공정 테스트를 통해 문제의 원인을 해결하기 위해 노력하고 있으며, 빠른 시일내에 더 우수한 상태로의 세탁물을 받아보실 수 있도록 하겠습니다.\n\n추가로 궁금하신 사항은 언제든지 문의 주시길 부탁 드리겠습니다.\n감사합니다.\n\n런드리고 드림", "status": "답변완료"}, {"id": "801661", "date": "2026-05-12", "cat": "결제/과금 문의", "title": "쿠폰 미적용", "question": "안녕하세요 간절기 이불인데 왜 쿠폰 적용이 안됐을까요?", "answer": "김영옥 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의주신 이불 세탁 무료 쿠폰 관련하여 안내드립니다.\n\n확인 결과, 이번 수거 신청 시에는 쿠폰이 별도로 선택되지 않은 상태로 접수된 것으로 확인됩니다.\n런드리고의 쿠폰은 수거 신청 시 고객님께서 직접 조건에 맞는 쿠폰을 선택해 적용하는 방식으로 운영되고 있어,\n신청 시 쿠폰을 사용하지 않으신 경우 이후 적용은 어려운 점 양해 부탁드립니다.\n\n쿠폰 사용은 아래 경로에서 가능합니다.\n\n[앱] > [수거 신청] > [쿠폰/포인트] > [사용하실 쿠폰 선택] > [할인 적용 확인 후 신청 완료]\n\n쿠폰이 정상 적용된 경우에는 배송 완료 후 결제 시 할인 금액이 자동 반영됩니다.\n\n아울러 고객님께서 보유하신 해당 쿠폰의 만료일은 2026년 5월 13일 23:59:59이며,\n만료일 이전에 수거 신청 시 선택하여 이용 가능한 점 함께 안내드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801660", "date": "2026-05-12", "cat": "배송시간/배송지연 문의", "title": "바지 언제 돌려주시는건가요?", "question": "시간이 지금 너무 많이 지났는데 대체 어떻게 된건가요", "answer": "이창수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 단추 탈락으로 안심케어 보내주신 내역 확인 했습니다.\n\n해당 의류는 현재 담당 부서 측에서 단추 확보중인 것으로 확인되며\n담당 부서 측으로 빠른 확인 요청 드린 상태입니다.\n\n추가 안내에 시일이 소요된 점 진심으로 사과 드리며\n빠른 시일내에 안내 드릴 수 있도록 하겠습니다.\n\n믿고 다시 보내주셨음에도 추가 안내가 미흡한 점\n고개 숙여 사과 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801659", "date": "2026-05-12", "cat": "세탁동의 및 미세탁 문의", "title": "확인했습니다", "question": "넵", "answer": "김해상 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 만족스러운 서비스로 안내드리지 못한 점에 대해 많이 속상하셨을 것으로 생각되며, 진심으로 사과드립니다.\n\n문의주신 제품은 스웨이드 원단 특성상 오염이 확인된 상태에서 세탁 진행 시 추가 손상 발생 우려가 높아, 부득이하게 세탁 반려로 판단된 것으로 확인됩니다.\n\n런드리고에서는 입고 검수 과정에서 세탁 시 손상 가능성이 크다고 판단되는 경우, 고객님의 의류 보호를 위해 세탁을 진행하지 않고 반려 처리하고 있습니다.\n\n특히 스웨이드 원단은 세탁 과정에서 변형, 탈색 등 손상 위험이 높은 소재이며, 오염이 심한 경우 다른 세탁물에 영향을 줄 수 있어 공정 진행이 어려운 점 양해 부탁드립니다.\n\n또한 서비스 특성상, 고객님의 의류에 대해 손상 발생 시 책임 보상 또는 원상복구를 원칙으로 하고 있어, 고객님 동의 여부와 관계없이 손상 위험이 큰 의류는 세탁 진행이 어려운 점 함께 안내드립니다.\n\n고객님의 기대에 부응하지 못한 점에 대해 저희도 안타깝게 생각하며, 너른 양해 부탁드립니다.\n\n보다 나은 서비스 제공을 위해 지속적으로 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801656", "date": "2026-05-12", "cat": "오염 미 제거", "title": "때가 안지워졌어요", "question": "오염이 그대로 있는 상태로 돌아왔네요_x000D_\n재세탁 요청합니다", "answer": "정영주 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 믿고 맡겨주신 세탁물에 오염이 확인되어\n많이 속상하셨을 것 같습니다.\n\n다만, 일반적인 서비스의 경우\n대량 세탁의 특성 상, 특정 부위에 집중된 오염/얼룩 등은\n일반적인 세탁 공정으로는 제거되지 않습니다.\n\n특정 오염(음식물, 화장품, 기름얼룩 등)이나\n마찰이 잦은 부위에 발생되어 다소 고착된 오염은\n집중케어로 신청해 주시기를 권장 드리고 있습니다.\n\n말씀주신 얼룩은 일반 세탁만으로는\n제거가 어려운 오염으로 확인되어\n세탁 외에도 보다 정밀한 약품 처리가\n필요한 상태로 판단됩니다.\n\n이 경우 **‘집중케어'**서비스를 권장드립니다.\n**개별클리닝 진행 후 요청사항을** 남겨주시면\n더 꼼꼼히 케어해드리겠습니다.\n\n눈에 보이는 얼룩이 있다면\n얼룩 부위는 고민하지마시고 꼭 알려주세요! 👀\n\n보다 나은 케어를 통해\n만족스러운 결과를 드릴 수 있도록 더욱 노력하겠습니다.\n\n* * *\n\n✅ **집중케어 신청 방법**\n**①** **[수거신청] 선택**\n ****\n\n**② [개별클리닝] 선택**\n \n\n**➂ 품목 선택 후,**\n화면 예시처럼 추가 케어 항목을 체크해주세요.\n \n\n* * *\n\n📌 **유의사항**\n**✔︎** 요청 시 **의류 전체 사진**을 찍어주신 후\n   **세심한 케어 필요 부위를 표시**해주시면\n   정확한 처리가 가능합니다.\n\n\n* * *\n\n해당 의류의 세탁비용은 예외적으로 포인트로 환불 드리오니,\n편하신 일정에 집중케어로 신청해 주시면 감사하겠습니다.\n\n런드리고는 고객님의 일상에\n여유와 가치를 더하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801653", "date": "2026-05-12", "cat": "기타", "title": "수거 신청 가능하게 해주세요", "question": "수거 신청이 아직 안되네요", "answer": "김희영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n4월 5일 수거 건은 완료되었고, 아직 분류 작업이 시작되지 않아 세탁물과 헌옷에 대한 확인이 되지 않았지만\n여러밤 배송에 맞춰 분류가 시작될 예정이고, 이때 헌옷도 함께 담당 부서 측으로 전달하여 무게 계측 후 포인트 지급될 예정입니다.\n이점 참고 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801651", "date": "2026-05-12", "cat": "수선 미이행 문의", "title": "허리줄임", "question": "가능한 선에서 최대로 줄이몀 몇cm인가요?", "answer": "이혜경 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[수선 누락]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801650", "date": "2026-05-12", "cat": "기타", "title": "쿠폰 사용 오류", "question": "첫 수거 신청시 이불 쿠폰을 적용 못 했습니다_x000D_\n방법을 잘 몰라서...첫 달 쿠폰을 포인트 등으로 차감해 주세요", "answer": "서혜원 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 말씀 주신 내용 참고하여\n해당 쿠폰 할인 금액인 7,000원을 포인트로 선 지급 및\n해당 쿠폰을 만료 처리 하였습니다.\n\n결제 시 포인트가 선 차감되는 점 안내드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801649", "date": "2026-05-12", "cat": "런드렛 반납 문의", "title": "런드렛 2개 반납", "question": "저번 세탁 수거 이용시 런드렛을 내놓지 못한 상태에서 런드렛 반납으로 요청한 관계로 런드렛 새거가 추가되었습니다. 현재 어플 내 다이얼키 등록되어있는 건 2번 사진 속 런드렛인데요, 이번에 세탁 수거 신청하려는데 런드렛 2개 다 내놓으려고 하는데 가능한가요? 추후 세탁물 수령 시 1번째 런드렛으로 반납 받고 싶습니다!", "answer": "정여진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요금제 해지로 인해 자동 런드렛 반납\n알림톡 발송으로 많이 당황스러우셨을 것 같습니다.\n\n요금제 해지 시 시스템 상 자동으로 런드렛 반납이 진행되어\n반납 관련 알림톡이 발송 되고 있습니다.\n다만 이 전 반납이 완료된 고객님께는\n알림톡이 동일하게 발송되오나 반납 취소 처리가 진행되기에\n방문 진행 하지 않는 점 안내 드립니다.\n\n알림톡으로 인해 혼선을 드린 점 진심으로 죄송하다는 말씀 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801643", "date": "2026-05-12", "cat": "월정액 가입/변경/해지 문의", "title": "일전에 문의한대로 해지 요청드립니다.", "question": "기존 요금제 사용 중 세탁 맡긴 건은 모두 결제처리 되었습니다. 10일에 신규로 구독결제된 것은 환불 부탁드립니다.", "answer": "서태경 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 요금제 해지 관련하여 문의주셨군요.\n\n다만 현재 이용 중이신 요금제는 **이전 버전 요금제**로,\n해지하실 경우 **동일한 조건으로 재가입이 어려운 점** 안내드립니다.\n\n이 부분 참고 부탁드리며,\n번거로우시겠지만 해지를 원하실 경우\n새로운 문의글을 통해 요청해주시면\n확인 즉시 신속히 처리 도와드리겠습니다.\n\n현재 바로 도움드리지 못한 점 죄송합니다. 🙏🏻\n\n**✅ 환불 가능 조건**\n① 결제일 포함 21일 이내\n② 기본 제공 서비스 품목을 전혀 사용하지 않은 경우\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801637", "date": "2026-05-12", "cat": "변형/변색/손상", "title": "니트 줄음", "question": "처음 배송왔을때 줄은것보다는 늘리셨는데 지금도 차이 보이시죠?눈으로 보십시요 제 니트 갖다주셔요 이게뭡니까?2달도 못입고 스트레스", "answer": "박우영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n맡겨주신 세탁물에서 불편을 겪으셔서\n많이 당황하셨을 것 같아 죄송한 마음입니다.\n\n확인 결과, 문의주신 세탁물은\n생활빨래로 접수된 건으로 확인됩니다.\n\n다만 죄송하게도 문제 접수주신 내용에 대해서는\n생활빨래 서비스 특성상 별도의 도움을 드리기\n어려운 점 너그럽게 양해 부탁드립니다.\n\n**📌 생활빨래 서비스 안내  **\n\n**-** **생활빨래는 검수 과정 없이  **\n** 보내주신 상태 그대로 세탁/건조가 진행****됩니다. **\n\n**- 이 때문에** **입고 시 상태와 배송 후 상태를  **\n** 정확히 비교하기 어려워  **\n** 재세탁이나 추가 케어가 제공되지 않습니다.  **\n\n- 기계 세탁/건조 방식으로 운영되므로\n 케어라벨 상 기계 세탁·건조가 불가한 의류는\n 번거로우시더라도 개별클리닝으로 맡겨주셔야 합니다.\n\n앞으로는 더 만족스러운 서비스 경험을\n드릴 수 있도록 계속 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801636", "date": "2026-05-12", "cat": "기타", "title": "세탁물 미배출건", "question": "문 앞에 런드렛도 있고 세탁물도 내놨는데 수거를 안 하셨으면서 과금이 되는 건 뭐죠??기사님이 제대로 오신 거 맞으실까요?", "answer": "강도한 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 서비스 이용에 불편을 드려 죄송합니다.\n\n런드리고는 수거 신청이 접수되면 기사님이 방문하여 수거를 진행하고 있으며,\n이 과정에서 수거·배송비가 발생하는 점 안내드립니다.\n\n다만 세탁이 완료된 세탁물이 수거되어 세탁 서비스를 이용하지 못하신 것으로 확인되어,\n앞서 담당자가 실결제가 이루어지지 않도록 포인트를 선지급 처리해 드린 것으로 확인됩니다.\n\n전산상 드리고 이용에 감사드립니다.\n\n확인 요청 주신 다림질 관련 안내 드립니다.\n\n일반적으로 런드리고는 바지 세탁시 기존에 앞주름이 있는 바지일 경우에는\n앞주름을 잡아 다림질 후 출고되는 점 안내 드립니다.\n\n앞주름이 없는 경우에는 따로 주름을 잡아서 다림질 하진 않는 부분으로\n참고 요청 드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801624", "date": "2026-05-12", "cat": "미수거/오수거 문의", "title": "미수거", "question": "런드렛이 내 아들이 신청했던것_x000D_\n내가 신청했더니 정보 불일치로 미수거._x000D_\n내용물만 빼서 다시 수거 신청함", "answer": "도은욱 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 이른 수거가 진행되어 많이 당황스러우셨을 것 같습니다.\n\n런드리고는 고객님께서\n**수거 신청을 하신 시점부터**\n순차적으로 수거가 진행되며,\n**신청 마감은 밤 10시(22시)**입니다.\n\n또한 정해진 운송 경로에 따라\n**일괄 수거 → 일괄 배송**이 이루어지고 있어\n경로에 따라 이른 방문이 진행될 수 있는 점 안내 드립니다.\n\n* * *\n✅ **운행 시간 안내**\n\n- **수거** : 오후 8시부터 진행\n- **배송** : 오후 10시 ~ 새벽 7시\n(운송 물량에 따라 다소 지연될 수 있습니다.)\n\n- **밤 10시까지 세탁물이 나오지 않으면 미수거로 간주**되며,\n이 경우 편도 **운송료 3,800원이 부과**됩니다.\n\n- **1차 방문 후 수거가 되지 않아도**\n**밤 10시까지 다시 확인 후 수거가 진행**되므로,\n**이른 방문 이후 곧바로 운송료가 청구되는 일은 없습니다. **\n\n- **밤 10시까지 세탁물이 나오지 않으면 미수거로 간주**되며,\n이 경우 편도 **운송료 3,800원이 부과**됩니다.\n\n- **1차 방문 후 수거가 되지 않아도**\n**밤 10시까지 다시 확인 후 수거가 진행**되므로,\n**이른 방문 이후 곧바로 운송료가 청구되는 일은 없습니다. **\n\n22시 이전 방문 시에도 런드렛이나\n런드리고에서 제공드린 라이트백/핸디백이 확인될 경우\n세탁물을 배출해 주신 것으로 인지하여 수거 진행 되고 있기에\n세탁물을 내어주시고 수거 신청해 주시기를 권장 드리고 있는 점 너른 양해 부탁 드립니다.\n\n해당 건은 예외적으로 수거배송비용\n3,800원은 세탁 포인트로 지급 드리도록 하겠습니다.\n\n서비스 이용에 불편을 드려 죄송하다는 말씀 드리며,\n새로 수거 신청해 주시면 감사하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801622", "date": "2026-05-12", "cat": "기타", "title": "비번 입력했고, 전화 달라고 메세지도 남겼는데 미수거 하셨습니다. 전화도 오지 않았습니다", "question": "비번 입력했고, 전화 달라고 메세지도 남겼는데 미수거 하셨습니다. 전화도 오지 않았습니다", "answer": "야자수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의주신 티셔츠(CFAB00035405)는\n안심케어 세탁물로 일반 세탁물과 달리\n케어 담당자의 실물 확인과 세심한 케어가 필요하여\n배송이 지연되는 점 안내드립니다.\n\n케어 결과에 따라 배송 혹은 추가 안내가 진행될 예정으로\n일반 세탁물 보다 최소 3~7일 정도의 추가 지연이 있는 점 양해 안내드립니다.\n\n사전에 정확하게 안내드리지 못해\n추가 불편을 드리게 된 것 같아 너무나 죄송스럽습니다.\n\n문제 부분에 대한 세심한 케어 진행하여\n만족스러운 상태로 받아보실 수 있도록 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801620", "date": "2026-05-12", "cat": "런드렛 반납 문의", "title": "런드렛 안가져가셨습니다", "question": "제 개인물품이 아니라, 저의 물품대신 잘못보내신 스카프를_x000D_\n언제고 가지고 있을수 없어 같이 수거하시라고 걸어둔건데_x000D_\n런드렛 안가져가셨네요. 이 스카프는 그럼 어떻게처리해야하나요", "answer": "강나연 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n런드렛 반납 신청해주셔서 4/28 23:18에 수거방문하였습니다만,\n런드렛이 비워져있지 않아 수거하지 않으신 것으로 기사님이 메모 남겨두셨습니다.\n이미지 첨부드리며, 런드렛 안에 고객님의 물품이 없는지 다시 한 번 확인 후 반납 신청 부탁 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801618", "date": "2026-05-12", "cat": "런드렛 반납 문의", "title": "저번 런드렛 반납했습니다.", "question": "구독해지전 렁드렛 반납했는데 수거기사님 온다는 알람 떠서 문의남깁니다. 자택에 런드렛 없습니다.", "answer": "정여진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요금제 해지로 인해 자동 런드렛 반납\n알림톡 발송으로 많이 당황스러우셨을 것 같습니다.\n\n요금제 해지 시 시스템 상 자동으로 런드렛 반납이 진행되어\n반납 관련 알림톡이 발송 되고 있습니다.\n다만 이 전 반납이 완료된 고객님께는\n알림톡이 동일하게 발송되오나 반납 취소 처리가 진행되기에\n방문 진행 하지 않는 점 안내 드립니다.\n\n알림톡으로 인해 혼선을 드린 점 진심으로 죄송하다는 말씀 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801616", "date": "2026-05-12", "cat": "다림질 미흡", "title": "제발 제대로 좀 부탁해요", "question": "정말 지긋지긋합니다._x000D_\n도대체 몇번을 다시 요청드려야하나요._x000D_\n_x000D_\n여전히 세탁이 안된게 있어요 ㅠㅠ _x000D_\n- 다림질 미흡 2장_x000D_\n- 얼룩제거 미흡 2장_x000D_\n얼룩은.. 계속 말씀드렸지만 그쪽에서 세탁하면서 생긴 얼룩입니다(동일 위치, 동일 얼룩이 생겨서 왔었어요)_x000D_\n_x000D_\n얼룩을 못지우신다면 셔츠비 보상 바랍니다.", "answer": "한영주 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 기대에 미치지 못한 상태로 의류가 전달되어\n실망하셨을 것 같아 진심으로 사과드립니다.\n\n저희는 스팀 다리미/스팀 기계를 사용해\n고온의 수증기로 주름을 정리하고 있습니다.\n\n직접 눌러 다림질하지는 않지만,\n이번 건은 과정에서 미흡함이 있었던 것으로 보입니다.\n\n해당 내용은 담당 부서에 공유하여\n재발 방지와 개선을 진행하겠습니다.\n\n**📌 추가 안내**\n\n- 세탁 시 **[집중케어]**로 요청해 주시면\n**얼룩 제거, 다림질, 보풀 제거** 등을 꼼꼼히 케어해 드립니다.\n\n- 이번 불편에 대해서는\n세탁비와 운송비를 포인트로 환불해드렸습니다.\n\n불편을 드려 죄송하며,\n다음 이용 시에는 더 세심하게 처리하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801613", "date": "2026-05-12", "cat": "기타", "title": "얼룩제거 안됨", "question": "얼룩 그대로 하나도안지워짐", "answer": "윤나 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 케어가 미흡한 상태로 수령하시어\n많이 속상하셨을 것 같아 정말 죄송합니다.\n\n다만 현재 문의글만으로는 정확한 상태 확인이 어려워,\n번거로우시겠지만 아래 경로를 통해\n사진과 함께 세탁물 이슈로 접수해주시면 빠르게 확인 도와드리겠습니다.\n\n불편을 드려 다시 한번 사과드리며,\n고객님의 접수 기다리겠습니다. 감사합니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801607", "date": "2026-05-12", "cat": "배송관련 불편사항접수", "title": "아니.. 출차 비밀번호 작설하라고 써두시던가 ", "question": "차로 수거한다는 내용도 없고 따러 내영 없던데 그냥 돌아가시는게 맞나요;; 새벽에 호출동의했는데 세대 알람도 안왔어요 그냥 안눌러보시고 간거같은데요; 집을 비워야해서 어제 맡긴건데 어제까지 제 구독 수거물품 마감인데 어떻게 되는거죠 다시 또 사진찍고 맡기고 아 너무 불편허고 번거옵네요..하", "answer": "미 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의주신 내용 확인하여\n담당부서로 재배송 접수 진행하였습니다.\n\n금일 저녁 10시 ~ 익일 오전 7시 사이\n배송 진행될 예정으로 세대호출로\n배송해 드릴 수 있도록 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801606", "date": "2026-05-12", "cat": "미수거/오수거 문의", "title": "미수거 관련", "question": "제대로 비밀번호 입력했음에도 오수거가 됐는데 비용이 청구가되나요? ", "answer": "주영민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801602", "date": "2026-05-12", "cat": "기타", "title": "오염이 묻어서 옴", "question": "시간이 없어서 세탁물을 다 본건 아니지만_x000D_\n일단 분홍 셔츠 뒷편에 뭐가 묻어서 왔습니다_x000D_\n세탁 전 찍은 사진에서 봤을 때는 없었고요_x000D_\n재세탁 및 제거해주세요", "answer": "양민지 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 먼저 믿고 맡겨주신 세탁물에서\n**[얼룩]**이 충분히 개선되지 않아 아쉬움을 드린 점 진심으로 사과드립니다.\n\n해당 내용은 내부적으로 다시 한번 확인하여\n같은 불편이 반복되지 않도록 꼼꼼히 점검하겠습니다.\n\n또한 이번 건에 대해서는 세탁 품질 미흡에 대한\n죄송한 마음을 담아 세탁비용 4,500원을 포인트로 지급해드렸습니다.\n\n말씀주신 얼룩은 일반 세탁만으로는 제거가 어려운 오염으로,\n보다 정밀한 약품 처리가 필요한 상태로 판단됩니다.\n\n이와 같은 경우에는 **‘집중케어’** 서비스를 통해\n보다 세심한 케어가 가능하여 함께 안내드립니다.\n\n**개별클리닝으로 접수 후 집중케어로 요청해주시면**\n**더 꼼꼼하게 확인하여 케어 도와드리겠습니다.**\n\n* * *\n✅ **집중케어 신청 방법**\n**①** **[수거신청] 선택**\n ****\n\n**② [개별클리닝] 선택**\n \n\n**➂ 품목 선택 후,**\n 화면 예시처럼 추가 케어 항목을 체크해주세요.\n \n\n* * *\n📌 **유의사항**\n**✔︎** 요청 시 **의류 전체 사진**을 찍어주신 후\n    **세심한 케어 필요 부위를 표시**해주시면\n    정확한 처리가 가능합니다.\n\n* * *\n런드리고는 고객님의 일상에\n여유와 가치를 더하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801600", "date": "2026-05-12", "cat": "기타", "title": "보관 비용 문의", "question": "안녕하세요. _x000D_\n제가 알기로는 요금제 구독하고 있으면 _x000D_\n보관 서비스 3개 기본 27000원은 무료고 _x000D_\n3개 초과부터 18000원 받는걸로 알고 있는데_x000D_\n_x000D_\n왜 이용내역에 기본 요금 27000원도 같이 부과되는건지 문의드립니다.", "answer": "아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 쿠폰 적용에 대해 관심을 가지고 문의 주셔서\n진심으로 감사드립니다.\n\n문의주신 [식목일엔겨울옷정리] 니트 1벌 천원 쿠폰은\n니트류 전체에 각각 적용되는 것이 아니라,\n니트 1벌에 대해서만 1,000원 혜택이 적용되는 점 안내해 드립니다.\n여러 벌을 맡기시더라도 그중 한 벌에 대해서만 할인이 적용됩니다.\n\n더불어, 또한, 해당 쿠폰을 사용하기 위해서는\n수거 신청 시 전체 세탁 비용의 합계가\n20,000원 이상이어야 정상적으로 적용이 가능합니다.\n\n이용 조건에 대해 미리 상세히 안내해 드리지 못해\n혼선을 드린 점 너그러운 양해를 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801599", "date": "2026-05-12", "cat": "변형/변색/손상", "title": "바지가 많이 작아졌습니다", "question": "드라이 츄리닝바지가 일반세탁한거처럼 바지가 축소 작아졌습니다. 바지통이며 길이가 다 짧아졌습니다", "answer": "박우영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n맡겨주신 세탁물에서 불편을 겪으셔서\n많이 당황하셨을 것 같아 죄송한 마음입니다.\n\n확인 결과, 문의주신 세탁물은\n생활빨래로 접수된 건으로 확인됩니다.\n\n다만 죄송하게도 문제 접수주신 내용에 대해서는\n생활빨래 서비스 특성상 별도의 도움을 드리기\n어려운 점 너그럽게 양해 부탁드립니다.\n\n**📌 생활빨래 서비스 안내  **\n\n**-** **생활빨래는 검수 과정 없이  **\n** 보내주신 상태 그대로 세탁/건조가 진행****됩니다. **\n\n**- 이 때문에** **입고 시 상태와 배송 후 상태를  **\n** 정확히 비교하기 어려워  **\n** 재세탁이나 추가 케어가 제공되지 않습니다.  **\n\n- 기계 세탁/건조 방식으로 운영되므로\n 케어라벨 상 기계 세탁·건조가 불가한 의류는\n 번거로우시더라도 개별클리닝으로 맡겨주셔야 합니다.\n\n앞으로는 더 만족스러운 서비스 경험을\n드릴 수 있도록 계속 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801598", "date": "2026-05-12", "cat": "보상처리 과정 문의", "title": "세탁불량 및 옷감훼손", "question": "ㅡ 5월 3일에 접수했는데, 8건 중 4건이 세탁불량 및 옷감훼손 등_x000D_\nㅡ 재접수 후 7일만에 도착했음. 2개는 옷감훼손, 1개는 완료, 1개는 얼룩 일부미제거_x000D_\nㅡ 런드리고의 서비스에 실망하였으며, 다시 맡겨아하나 고민중입니다. 안심케어 받은 옷중 일부는 버리려함._x000D_\nㅡ서비스가 저한테만 이러는건지? 아님 원래서비스가 이런지?_x000D_\nㅡ 원래. 이런 서비스라면 탈퇴하려합니다._x000D_\nㅡ답변 부탁드립니다.", "answer": "김아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서 제출해주신 증빙 서류는\n정상 접수되었으며, 관련 내용은 담당 부서에 전달하였습니다.\n\n담당자가 내역확인 후\n순차적으로 연락드릴 예정이오니,\n다소 시일이 소요될 수 있는 점 양해 부탁드립니다.\n\n고객님의 불편을 최소화할 수 있도록\n최대한 신속히 처리해드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801596", "date": "2026-05-12", "cat": "배송누락/분실접수", "title": "일반 빨래를 같이 맡겼는데 이용 내역에서도 누락되고 배송도 안 왔어요", "question": "안녕하세요_x000D_\n수선, 일반빨래(수건)를 같이 맡겼는데 수선품목만 배달되고 일반 세탁물은 아예 누락입니다_x000D_\n이용내역에 있었던 걸 확인했는데 지금은 그 부분에서도 빠져 있네요_x000D_\n수선 품목이랑 수건들을 같이 넣어 두었는데..._x000D_\n분실 확인 바랍니다", "answer": "전한별 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 선 안내 드렸으며,\n고객님의 의류 빠르게 확보하여 출고 드릴 수 있도록 하겠습니다.\n\n이용에 불편을 드려 죄송하며\n추후 동일한 문제가 생기지 않도록 주의하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801595", "date": "2026-05-12", "cat": "세탁 품목 오류접수", "title": "세탁 항목 오류", "question": "이게 왜 패딩이죠??_x000D_\n트렌치 코트와 같은건데_x000D_\n이런 식으로 항목 분류하면 앞으로 이용 어려울것 같네요", "answer": "이현서 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n우선 서비스 이용에 불편을 드린 점 진심으로 사과 드립니다.\n\n4/17 요청주신 품목 재분류는 승인해 드렸습니다.\n이용에 불편을 드린 점 다시 한번 사과 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801594", "date": "2026-05-12", "cat": "변형/변색/손상", "title": "옷을 옷입게 만들어 놓으셨네요", "question": "무엇을 안심케어 하신거죠?_x000D_\n오히려 옷이  구멍나서 상해서 왔네요.", "answer": "강창모 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[찢김]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801593", "date": "2026-05-12", "cat": "오염 미 제거", "title": "오염 미제거", "question": "오염이제거 되었으며 옷감이 상한거 같습니다.", "answer": "유하린 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 믿고 맡겨주신 세탁물이\n기대에 미치지 못한 상태로 전달되어\n많이 속상하셨을 것 같습니다.\n\n그 마음 충분히 공감되며,\n불편을 드려 진심으로 죄송합니다.\n\n다만 말씀해주신 **얼룩은 일반 세탁만으로는 **\n**제거가 어려운 오염**으로 확인되며,\n**보다 정밀한 약품 처리가 필요**한 상태로 판단됩니다.\n\n해당 경우에는 개별 클리닝 과정을 거친 후\n보다 정성스럽게 관리해드리는** **\n**‘집중케어’** 서비스 이용을 추천드리고 싶습니다.\n\n집중케어는 **[얼룩제거], [보풀제거], [다림질] 등의 **\n**섬세한 케어가 필요한 작업을 선택형 프리미엄 서비스**입니다.\n\n\n* * *\n\n✅ **집중케어 신청 방법**\n**①** **[수거신청] 선택**\n ****\n\n**② [개별클리닝] 선택**\n \n\n**➂ 품목 선택 후,**\n 화면 예시처럼 추가 케어 항목을 체크해주세요.\n \n\n* * *\n\n📌 **유의사항**\n**✔︎** 요청 시 **의류 전체 사진**을 찍어주신 후\n    **세심한 케어 필요 부위를 표시**해주시면\n    정확한 처리가 가능합니다.\n\n\n* * *\n\n이번 건에 대해서는 만족스러운 케어를\n도움드리지 못해 죄송한 마음담아** **\n**세탁비용은 포인트로 환불** 처리하도록 하겠습니다.\n\n추후 다시 한번 더 집중케어 요청을 통해\n맡겨주시면 좀 더 꼼꼼히 케어 도와드리겠습니다.\n\n런드리고는 앞으로도 고객님의 소중한 옷을\n더 건강하고 세심하게 케어해드릴 수 있도록\n지속적인 품질 개선과 서비스 고도화에 최선을 다하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801591", "date": "2026-05-12", "cat": "기타", "title": "옷감상했지만 그냥 받겠음", "question": "옷감상한거 그냥 끊어서 정리한것 같고, 세탁이 잘 안되었지만 그나마 이것은 그냥 받겠습니다.", "answer": "김혜영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n보내주신 세탁물의 반송을 요청하셨는데, 처리가 어떻게 진행되고 있는지 많이 궁금하셨을 것 같습니다.\n현재 고객님의 세탁물 상태를 확인해 보니, **아직 본격적인 분류 작업이 시작되기 전 단계**인 것으로 확인되었습니다. 요청하신 대로 해당 세탁물이 세탁 공정에 투입되지 않고 고객님께 안전하게 되돌아갈 수 있도록, **현장 담당 부서에 반송 처리를 위한 내용을 선제적으로 전달**해 두었습니다.\n이에 따라 많이 기다리시겠지만, **이번 주 목요일 또는 금요일 중에는 수령하실 수 있을 것으로 예상**됩니다.최근 급격한 날씨 변화로 주문량이 크게 증가하면서 분류 작업까지도 늦어지게 되어, 원하시는 도움을 못 드려서 죄송합니다.\n\n다시 한번 고객님께 불편을 드린 점 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801590", "date": "2026-05-12", "cat": "오염 미 제거", "title": "오염 미 제거", "question": "오염이 처음하고 동일합니다._x000D_\n오염 제거가 안되었습니다. 처음 세탁 맡길 시 해당 부분 오염 체크했는데 오염 제거가 안되었습니다.", "answer": "우수민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 집중케어로 요청해주신 부위가\n충분히 처리되지 않아 많이 아쉬우셨을 것 같습니다.\n이용에 불편을 드려 진심으로 사과드립니다.\n\n해당 부위는 작업자가 실물 확인 과정에서\n추가 케어 시 **섬유 손상이나 형태 변형의 우려가 있어**,\n부득이하게 집중케어 진행이 어려운 것으로 판단되었습니다.\n\n이 점 너그럽게 양해 부탁드립니다.\n\n요청하신 부분에 충분히 도움드리지 못한 점\n다시 한 번 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801589", "date": "2026-05-12", "cat": "건조/냄새", "title": "이불 빨긴한건가요?", "question": "냄새가 그대로 입니다_x000D_\n빨긴한건가요????_x000D_\n피죤사용은 안하나요?_x000D_\n그냥 다시 접어 포장만 해온거 같아요_x000D_\n이건 아닌것 같습니다.", "answer": "이회준 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 소중한 세탁물을 믿고 맡겨주셨음에도\n냄새로 불편을 겪으신 점 진심으로 사과드립니다.\n\n만족스러운 결과로\n보답해 드리지 못해 저희도 마음이 무겁습니다.\n\n전달해주신 내용을 확인한 결과,\n건조 미흡으로 인해\n만족스럽지 못한 결과가 발생한 것으로 보입니다.\n\n이에 대해 저희가 책임감을 갖고\n신속하고 정확한 후속 조치를 진행하고자 합니다.\n\n가장 효과적인 해결을 위해,\n고객님께서 현재 세탁물의 상태를 사진으로 찍어\n앱 내 **[안심케어 요청]** 메뉴를 통해 접수해주시면 감사하겠습니다.\n\n이는 문제 상황을 정확히 기록하고,\n고객님께 최적의 솔루션(재세탁, 복원, 보상 등)을 제안 드리기 위한\n필수적인 절차이오니 조금 번거로우시더라도 협조 부탁드립니다.\n\n\n### **💡 세탁물 문제, 이렇게 접수해 주세요!**\n이제는 고객센터를 따로 거치지 않으셔도,\n앱에서 직접 사진과 함께 문제를 접수하고 **조치 요청**을 하실 수 있어요.\n\n세탁물에 이상이 있는 경우,\n접수 후 아래 두 가지 중 원하시는 방식으로 처리 요청하실 수 있습니다.\n\n\n- **안심케어 요청** (재세탁, 복원 등 가능한 경우)\n- **포인트 환불 요청**\n※ le": "비밀번호 오류", "question": "보내주신 런드렛 비밀번호로 잠금장치가 해제가 안됩니다. 이런 일 처음이군요. 비밀번호 재확인 부탁드립니다.", "answer": "예리 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n\n배송된 런드렛의 비밀번호 확인이 되지 않아 불편하셨을 것 같습니다.\n\n먼저, 고객님께 제공 된 비밀번호는 (388)로 확인됩니다.\n\n런드렛 비밀번호는 배송 시 전송되는 알림톡을 통해서도 확인 가능하지만\n수거 신청 화면 우측 상단의 자물쇠 버튼을 눌러주신다면 보유 중이신 런드렛의 비밀번호 확인이 가능합니다.\n\n다만, 안내 된 비밀번호가 맞지 않는다면,\n다이얼 측면에 있는 화살표 ( 숫자 1 모양 ) 색상을 기준으로\n아래 표시되는 색상에 맞는 번호 확인 및 시도를 부탁 드리겠습니다.\n\n✅ 비밀번호 확인 방법 및 다이얼키 런드렛 사용 방법\n\n🔴🟠 - 122\n🟡 - 255\n🟢 - 388\n🔵 - 477\n🟣 - 511\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801549", "date": "2026-05-11", "cat": "쿠폰/포인트 문의", "title": "쿠폰 미적용 취소에 따른 후속조치 바로 해주세요", "question": "일반이블 쿠폰 적용 안하고 수거권 2개 차감하신거 일반이블 쿠폰 적용으로 변경했다고 응답 받았는데 수거권 2개 아직 원복 안됐습니다 바로 원복 해주세요", "answer": "장도완 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n쿠폰 사용과 관련하여 문의해 주셨습니다.\n요청하신 내역을 바탕으로 확인한 결과를 안내해 드립니다.\n\n**■ 쿠폰 적용 여부 확인**\n고객님의 이용 내역을 확인해 본 결과, 이번 수거 신청 시 **쿠폰을 선택하여 적용하지 않으신 것**으로 확인됩니다.\n쿠폰은 발급된 것만으로는 자동 적용되지 않으며, **결제 단계에서 직접 사용할 쿠폰을 선택**해 주셔야 혜택을 받으실 수 있습니다.\n만약 이미 결제가 완료된 이후라면 시스템상 소급 적용이 어려울 수 있는 점 양해 부탁드립니다.\n\n**■ 쿠폰 확인 및 사용 방법**\n\n1. **쿠폰 확인:** [앱 > MY > 쿠폰함]에서 현재 보유 중인 쿠폰이 있는지 먼저 확인해 주세요.\n2. **쿠폰 사용:** 결제 정보 단계에서 **[쿠폰 적용]** 버튼을 눌러 해당 쿠폰을 꼭 클릭해 주시기 바랍니다.\n\n혹시 쿠폰함에 쿠폰이 있음에도 불구하고 등록이나 선택 과정에서 오류 메시지가 떴다면, 해당 화면을 캡처하여 보내주세요.\n신속히 기술적인 점검을 도와드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801548", "date": "2026-05-11", "cat": "배송관련 불편사항접수", "title": "신발한짝을 수거 안했어요", "question": "수거완료라고 해서 봤더니 신발 한짝만 덩그러니 있네요?_x000D_\n그리고 벨 미동의 하고 비번 친절히 적어놓았는데 현관 호출했습니다 내일 신발 한짝 마저 수거해주세요", "answer": "황혜란 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n런드렛이 열리지 않아 많이 불편하셨을 것 같아 죄송한 마음입니다.🙏\n\n고객님께 제공된 🔑비밀번호는 **(388)** 로 확인되며,\n**해당 비밀번호는 배송 시 발송된 알림톡 또는**\n**수거 신청 화면 우측 상단의 자물쇠 버튼을 통해서도 확인하실 수 있습니다!**\n\n혹시 안내드린 비밀번호로도 열리지 않는 경우에는,\n**다이얼 옆에 있는 화살표의 색상을 기준**으로 (사진참고)\n아래쪽에 보이는 색상과 일치하는 번호를 맞춰 다시 한번 시도해보시길 부탁드립니다.\n\n\n> **✅ 비밀번호 확인 방법 및 다이얼키 런드렛 사용 방법**\n>\n> 🔴🟠 - 122\n> 🟡 - 255\n> 🟢 - 388\n> 🔵 - 477\n> 🟣 - 511\n\n\n혹여라도 임시 비밀번호 사용 시에도 오픈되지 않을 경우\n죄송하게도 지퍼 부분을 젓가락, 볼 등의\n얇은 물건으로 조심스럽게 눌러 런드렛 오픈을 부탁드립니다 🙏️\n\n다시 한 번 불편을 드린 점 깊이 사과드리며,\n앞으로는 비밀번호로 인한 불편이 없으시도록\n해당 내용은 내부적으로 꼼꼼히 점검하겠습니다.🙏\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801547", "date": "2026-05-11", "cat": "세탁동의 및 미세탁 문의", "title": "이불 세탁 집중 케어 및 수선, 바지 밑단 길이 수선 추가", "question": "- 이불 세탁 및 수선_x000D_\n(핏자국 집중 케어, 튿어진 부분 수선)_x000D_\n- 바지(회색 슬랙스) 밑단 박음질_x000D_\n- 바지(검정 슬랙스) 밑단 길이 회색 슬랙스에 맞춰 수선_x000D_\n_x000D_\n이렇게 총 세개 제품 맡겼는데 세부 주문 내용 남기지 못해 추가해두어요. 반영될 수 있게 해주세요!_x000D_\n_x000D_\n바지 세탁은 필요 없습니다._x000D_\n_x000D_\n", "answer": "손수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 이용에 불편을 드려 대단히 죄송합니다.\n문의하신 수선비와 관련하여 기존에 결제되었던 20,000원 중, 차액인 **5,000원**에 대한 환불 처리가 정상적으로 완료되었습니다.\n환불 금액은 등록된 대표 결제수단으로 취소되며, 카드사 사정에 따라 영업일 기준 최대 5일 이내 입금될 예정입니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801545", "date": "2026-05-11", "cat": "기타", "title": "냄세", "question": "이불 두개 빨래를 맡겼는데 한개는 괜찮은데 한개가 냄새가 나요..", "answer": "윤정 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드렛과 관련하여 만족스럽지 못한 경험을 드린 점 진심으로 사과드립니다.\n\n현재 런드렛은 **순환 이용 정책**에 따라 운영되고 있으며,\n고객님의 세탁물량에 맞는 사이즈로 지정되어 배송되고 있습니다.\n\n이에 따라 수거 신청 시마다 입고된 런드렛은 지속적으로 세탁 및 소독을 진행한 뒤,\n소독이 완료된 다른 공용 런드렛으로 교체하여 배송해드리고 있습니다.\n\n다만 이번에는 출고 과정에서 런드렛 상태 점검이 충분히 이루어지지 못했던 것으로 보이며,\n이로 인해 불편을 드리게 되어 더욱 죄송한 마음입니다.\n\n문의주신 내용은 관련 부서에 전달하였으며,\n이후 수거 신청 시 해당 런드렛을 함께 보내주시면 **깨끗한 런드렛으로 교체하여 배송**될 수 있도록 하겠습니다.\n\n또한 고객님께서 느끼셨을 불편에 비하면 부족하지만,\n죄송한 마음을 담아 **다음 이용 시 사용하실 수 있도록 소정의 포인트를 지급**해드렸습니다.\n\n다시 한 번 불편을 드린 점 진심으로 사과드리며,\n궁금한 점은 언제든 말씀해주세요.🙏🏻\n\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801544", "date": "2026-05-11", "cat": "기타", "title": "개별클리닝 방법 확인 요청", "question": "개별클리닝 요청해서 세탁물 받았습니다_x000D_\n개별 물빨래했는지, 드라이클리닝했는지 확인해서 알려주세요. 라벨이랑 속감이 쭈글쭈글하고 색이바래고 살짝_x000D_\n줄어들어 물빨래 의심되는데 정확한 확인필요합니다. ", "answer": "강수연 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 세탁 진행 관련 문의 주신 내용 확인 했습니다.\n\n런드리고 개별클리닝의 경우 세탁물의 케어라벨 및\n원단 확인으로 그에 맞는 세탁 방식으로 진행되고 있습니다.\n\n특정 세탁 방식 지정은 어려운 점 너른 양해 부탁드리며,\n보내주시는 이불은 케어라벨에 맞게 세탁 진행될 예정인 점 안내 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801543", "date": "2026-05-11", "cat": "기타", "title": "보풀제거로 자켓보내는데요", "question": "내용쓰는곳이 없어서요 _x000D_\n자켓밖이아니라 안쪽에 보풀제거를 해주세요 ", "answer": "이아름 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 이전에 보풀 제거 서비스를 이용해 주셨는데\n만족스러운 상태로 배송드리지 못해 죄송합니다.\n\n이번 맡겨주신 세탁물의 집중케어 내역을 확인하여\n보다 꼼꼼하게 케어 진행드릴 수 있도록 하겠습니다.\n\n혹 케어가 부족한 상태로 배송되는 경우에는\n꼭 수령일로부터 7일 이내 사진과 함께\n문의 접수해 주신다면 관련하여 정확한 내용 확인을 통해\n추가 안내 드릴 수 있도록 하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801540", "date": "2026-05-11", "cat": "재세탁 접수 및 과정 문의", "title": "안심케어 지연 문의", "question": "안녕하세요,_x000D_\n_x000D_\n해당 품목을 수선과 세탁을 맡긴 후 제품 원단손상 및 변색이 발생하여 5월 2일에 안심케어 요청 드렸으나 현재까지도 제품이 배송이 안되고 있는데, 현재 진행 사항 안내 부탁드립니다._x000D_\n제품이 복구가 안되어 현재까지 지연 중 인것인지 아니면 복구과정이 오래 걸리는 것일지요?_x000D_\n저도 새 제품 구입하자마자 수선 맡기고 제품이 망가져와 현재까지 지연된 기간이 너무 길어 정말 복구가 안되면 차라리 보상을 해주시면 저도 새제품 다시 구매 할 수 있을거 같습니다. 위아래 세트로 구매 하였는데 위에 상의자켓만 있다보니 위에 자켓도 입지 못하는 상황입니다.", "answer": "이시연 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[옷감 변형]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.🙏🏻\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801539", "date": "2026-05-11", "cat": "오염 미 제거", "title": "오염부분 미세탁", "question": "오염부분을 지정해서 세탁물 손상 동의하고 얼룩제거 요청하였으나 전혀 세탁이 안됨_x000D_\n하지만 깨끗하게 얼룩이 제거되었다고 코멘트 남겨있음_x000D_\n이건 무슨 경우인가? 얼룩 확인도 안하고 기계적으로 얼룩제거됐다고 시스템 처리한거라고밖에 볼수없음_x000D_\n얼룩 미제거 사진은 재세탁 신청 내역에서 확인바람", "answer": "김현주 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 먼저 믿고 맡겨주신 세탁물에서\n얼룩이 충분히 개선되지 않아 아쉬움을 드린 점 진심으로 사과드립니다. 🙏🏻\n\n해당 내용은 내부적으로 다시 한번 확인하여\n같은 불편이 반복되지 않도록 꼼꼼히 점검하겠습니다.\n\n또한 이번 건에 대해서는 세탁 품질 미흡에 대한\n**죄송한 마음을 담아 세탁비용 8,500원을 포인트로 지급**해드렸습니다.\n\n말씀주신 얼룩은 일반 세탁만으로는 제거가 어려운 오염으로,\n보다 정밀한 약품 처리가 필요한 상태로 판단됩니다.\n\n이와 같은 경우에는 **‘집중케어’** 서비스를 통해\n보다 세심한 케어가 가능하여 함께 안내드립니다.\n\n**개별클리닝으로 접수 후 집중케어로 요청해주시면**\n**더 꼼꼼하게 확인하여 케어 도와드리겠습니다.**\n\n* * *\n✅ **집중케어 신청 방법**\n**①** **[수거신청] 선택**\n ****\n\n**② [개별클리닝] 선택**\n \n\n**➂ 품목 선택 후,**\n 화면 예시처럼 추가 케어 항목을 체크해주세요.\n \n\n* * *\n📌 **유의사항**\n**✔︎** 요청 시 **의류 전체 사진**을 찍어주신 후\n    **세심한 케어 필요 부위를 표시**해주시면\n    정확한 처리가 가능합니다.\n\n* * *\n런드리고는 고객님의 일상에\n여유와 가치를 더하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801538", "date": "2026-05-11", "cat": "기타", "title": "5월16일 경기신문 마라톤 대회 참석입니다", "question": "대회 참여해야 하는 상황에 러닝화를 가져가서 이런 저런 얘기가 없는 이유가 뭔가요?_x000D_\n분명 담당부서에 연락준다고 답변을 본것 같은데요_x000D_\n_x000D_\n꼭 다른 기관을 통해 고발하고 내용을 공유하는 등 진상 짓을 하면 꼭 답변이 돌아오는 대한민국 기업행태 여기도 그런가요?", "answer": "김승민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 서비스 이용에 불편을 드려 죄송합니다.\n\n수거 신청 시 세탁물 간 구분이 어려워,\n부득이하게 세탁 없이 반송 처리된 점 너그러이 양해 부탁드립니다.\n\n▶ 신청서비스 : 개별클리닝, 생활빨래\n▶ 수거상태 : 혼입\n\n정확한 세탁 처리를 위해 아래와 같이\n서비스별 배출 방법을 확인하신 후 이용 부탁드립니다.\n\n[의류 배출방법]\n\n1. 런드렛을 사용하시는 경우\n① 생활빨래는 빨래망 안에 담기\n② 개별클리닝 의류는 런드렛 안에 넣기\n※ 런드렛 사용 시에는 망에 담긴 의류로 구분합니다.\n\n\n1. 런드렛을 사용하지 않는 경우\n① 생활빨래, 개별클리닝 의류를 서로 다른 배출 수단 [종이백 등]으로 따로 담기\n② 각 담긴 배출수단 [종이백 등]별로 바깥에 [개별클리닝], [생활빨래] 메모 붙이기\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801536", "date": "2026-05-11", "cat": "보상처리 과정 문의", "title": "이거 단추 없어진거 찾아주실수 있는거세요?", "question": "제가 환불요청이 아니라 케어로 누른건지 모르겠는데 _x000D_\n다시 보내달라는 배송비가 포인트로 입금되고 수거신청 버튼이 생겼는데 저거 보내면 런드리고세탁때 없어진 단추 붙여주시는건가요? ", "answer": "김민지 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 소중한 시간을 내어 다시 보내주신 의류인데\n아직 수령하지 못하시어 많이 걱정되셨을 것 같습니다.\n\n안심케어로 접수해주신 세탁물은\n현재 처리 상황을 확인 중이며,\n지연된 부분에 대해서는 담당 부서로 별도 확인 요청을 전달드린 상태입니다.\n\n최근 물량 증가로 인해 케어 및\n검수 과정이 다소 지연되고 있는 것으로 보이며,\n고객님의 세탁물 역시 보다 정확한 확인과 처리를 위해 시간이 소요되고 있는 점 양해 부탁드립니다.\n\n관련 내용은 확인되는 신속히 안내드릴 수 있도록 하겠으며,\n최대한 빠르게 처리될 수 있도록 지속적으로 살펴보겠습니다.\n\n기다리시게 해드려 죄송합니다.\n끝까지 책임감 있게 확인 후 안내드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801532", "date": "2026-05-11", "cat": "기타", "title": "속옷 분실", "question": "안녕하세요. 이번 수거 건과 관련하여 명확한 확인이 필요하여 문의드립니다._x000D_\n_x000D_\n■ 문제 상황_x000D_\n1. 수거 시 무게: 6kg 이상(6.5kg 요금 결제 완료)_x000D_\n   회수 시 무게: 5kg 미만_x000D_\n2. 수거 시 속옷: 20개 이상 포함_x000D_\n   회수 시 속옷: 6개_x000D_\n3. 수거 시 분류: 3개 망에 나누어 맡김_x000D_\n   회수 시 포장: 1개 봉투로 통합 배송_x000D_\n_x000D_\n젖은 상태로 맡긴 것이 아님에도 1kg 이상의 무게 차이가 발생했고, 분류해서 맡긴 망이 하나로 통합되어 온 점, 그리고 가장 결정적으로 속옷 14개 이상이 누락된 상황입니다._x000D_\n_x000D_\n■ 요청 사항_x000D_\n1. 세탁 분류 과정 영상 제공을 요청드립니다._x000D_\n   - 이전 상담 시 '3개 망으로 분실 없이 진행되었다'는 답변을 받았습니다._x000D_\n   - 해당 영상에서 속옷 개수를 육안으로 직접 확인하고자 합니다._x000D_\n2. 수거 시점과 회수 시점의 무게 측정 기록 확인 부탁드립니다._x000D_\n3. 3개 망이 1개 봉투로 통합된 사유에 대한 설명 부탁드립니다._x000D_\n_x000D_\n■ 참고_x000D_\n그동안 양말 한두 짝 분실 건은 포인트 보상으로 갈음하고 넘어갔습니다. 다만 한 짝당 5천 원 상당의 양말이 누적되어 분실되어 왔고, 이번에는 속옷이 대량으로 누락된 만큼 영상 확인 후 정식 보상 절차를 진행하고 싶습니다._x000D_\n_x000D_\n빠른 확인 부탁드립니다. 감사합니다.", "answer": "손민아 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n저희 런드리고의 카페트 분류 기준에 대해 안내 드립니다.\n\n**[일반러그(카펫) / 대형러그(카펫)]**\n\n- 사이즈 150 * 200 미만 [일반러그(카펫)]\n- 가로,세로 길이 중 짧은 쪽이 200cm 이상일 경우 [대형러그(카펫)]\n- 고무 패드 및 미끄럼 방지 처리가 되어있지 않은 경우에만 세탁 가능\n- 접히는(자유롭게 구겨지는) 소재이며, 런드렛 안에 수납 가능할 경우에만 세탁 가능\n\n**[스페셜 러그(카펫)-배송까지 5일 소요]**\n\n- 사이즈 150 * 200 미만 [스페셜 러그(카펫)]\n- 가로,세로 길이 중 짧은 쪽이 200cm 이상일 경우 [스페셜 대형 러그(카펫)]\n- 뒷면이 미끄럼 방지, 고무패드 등으로 딱딱하게 코팅 되어도 가능.\n- 유연하게 졉혀지지 않아도 가능\n\n안내드린 내용에 따라 분류 진행되고 있기에\n일반 세탁으로 서비스 진행이 어려운 경우\n스페셜 세탁 동의 안내를 진행드리고 있기에\n해당 부분 참고하시어 서비스 맡겨주시면 감사하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801531", "date": "2026-05-11", "cat": "서비스 불편사항 접수", "title": "자크 부분 디테일이 손상되었어요 ", "question": "자크 디테일(가죽) 부분이 낱낱이 갈라져 왔어요. 원래 붙어있던것인데. 다시 붙여주시든 갈아주시든 원상복구 요청 드립니다. ", "answer": "홍민지 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 서비스 이용 과정에서 위생 문제로 큰 불쾌감과 불편을 드린 점 진심으로 사과드립니다.\n\n런드렛에서 이물질(바퀴벌레)이 발견된 점은 매우 중대한 문제로 인지하고 있으며,\n저희 런드리고는 수거 물품에 대해 세척 및 소독 과정을 거쳐 재사용하고 있으나\n이번 건은 해당 과정이 미흡했던 것으로 확인되었습니다.\n\n고객님께 불쾌한 경험을 드린 점 다시 한 번 깊이 사과드립니다.\n\n문의주신 2026년 4월 15일 수거 신청 건의 결제 금액은 즉시 환불 처리해드렸으며,\n환불은 영업일 기준 3~5일 정도 소요될 수 있는 점 양해 부탁드립니다.\n\n또한 현재 요금제 서비스를 이용 중이신 것으로 확인되나,\n문의 내용만으로는 요금제 해지까지 요청하신 것인지 확인이 어려워 별도의 해지 처리는 진행하지 않았습니다.\n이용 중이신 요금제는 이전 버전 상품으로,\n해지 시 동일 조건으로 재가입이 어려운 점 참고 부탁드립니다.\n\n요금제 해지를 원하실 경우 회신 주시면 신속하게 처리 도와드리겠습니다.\n\n아울러 위생 관리 및 운영 절차 전반을 재점검할 수 있도록 해당 내용은 관련부서에 공유하겠습니다.\n또한 동일한 문제가 재발하지 않도록 철저히 개선하겠습니다.\n이번 일로 느끼셨을 실망과 불편에 대해 깊이 공감하며,\n보다 안전하고 신뢰할 수 있는 서비스로 보답드릴 수 있도록 최선을 다하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801530", "date": "2026-05-11", "cat": "프리미엄 세탁동의 및 미세탁 문의", "title": "프리미엄으로 안받고 싶을때", "question": "해당 품목을 프리미엄으로 받고 싶지 않습니다. 확인 부탁드려요!", "answer": "허정원 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n맡겨주신 프리미엄 브랜드 의류 일반 세탁 진행 관련 문의 주신 내용 확인 헀습니다.\n\n다만, 런드리고에서 지정한 **18대 명품 브랜드**에 포함될 경우\n프리미엄 세탁 서비스로 자동 분류되어\n일반 세탁으로 변경은 어려운 점 너른 양해 부탁드립니다.\n\n이 브랜드 의류는 일반 세탁 방법으로는\n손상 위험이 높아 모두 **[자동 분류] · [필수 전문 케어]**\n방식으로 프리미엄 서비스가 진행되고 있습니다.\n\n고객님의 소중한 세탁물 손상을 방지하고자\n특정 브랜드 의류는 프리미엄으로 자동 진행되고 있는 점 너른 양해 부탁드립니다.\n\n마지막으로, 18대 명품 브랜드 리스트는\n아래 링크에서 확인하실 수 있습니다.\n\n세탁을 맡기시기 전에 확인해주시면\n더 만족스러운 경험을 드릴 수 있을 것 같습니다. 🙏\n\n**➡️ [프리미엄 지정 브랜드 보러가기]**\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801529", "date": "2026-05-11", "cat": "수선 불만", "title": "밑단 수선 불량", "question": "진상으로 보여질수 있겠으나 지금 확인하여 글남깁니다.._x000D_\n바지 두벌을 밑단 박음질을 수선맡겼는데 사진처럼 겉으로 울퉁불퉁하고 티나게 수선이 되어있습니다._x000D_\n제가 갖고있는 다른 정장바지들을 봐도 이렇게 심하진 않습니다.", "answer": "김순철 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[오수선]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.🙏🏻\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801528", "date": "2026-05-11", "cat": "배송시간/배송지연 문의", "title": "5.11. 수거신청 건 배송 관련 ", "question": "5.11.(월) 수거 신청 _x000D_\n5.13.(수) 배송일로 지정했습니다. _x000D_\n이사 예정이라 이후에는 수령이 어렵습니다._x000D_\n배송일시 꼭 지켜 주세요. ", "answer": "김병수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서 예상하신 날짜보다\n세탁물이 일찍 도착해 많이 당황하셨을 것 같습니다.\n\n런드리고의 **여러밤 배송**은\n고객님께서 선택하신 날짜 기준으로 운영되지만,\n최근 수거 물량이 증가하면서\n**처리 가능한 범위 내에서는 세탁 및 배송이 조기 진행**될 수 있습니다.\n\n이는 세탁 적체를 방지하고\n공정 효율을 높이기 위한 운영 방식으로,\n쉽게 말해 음식 배달 앱의 알뜰배송처럼\n상황에 따라 예상보다 빠르게 도착할 수 있는 구조라고\n이해해 주시면 감사하겠습니다. 😊\n\n참고로,\n\n- **한밤 배송(23시~07시)** : 수거 즉시 세탁/배송 + 추가 요금 발생\n-\n\n**여러밤 배송(22시~07시)** : 설정된 날짜 내 순차 세탁/배송, 추가 요금 없음\n\n\n\n예정보다 빠르게 배송되더라도\n세탁 품질과 검수 기준은 동일하게 적용되니\n안심하고 이용 부탁드립니다. 🙇‍♀️\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801525", "date": "2026-05-11", "cat": "미수거/오수거 문의", "title": "오수거 관련", "question": "오늘 새로 수거신청한 세탁물 외에, 최초 이용한 세탁물 세탁후 집에 런드엣으로 걸려있던걸 다시 수거해 가셨습니다ㅠㅠ 코트 세벌 이미 세탁된 것이라 세탁하지 말고 다시 돌려주세요", "answer": "주영민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801523", "date": "2026-05-11", "cat": "미수거/오수거 문의", "title": "프리미엄 두개 미수거", "question": "프리미엄 두개 생활빨래랑 같이 신청하고 밖에 두었는데 미수거 되었습니다", "answer": "김예솔 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 수거신청 주신 세탁물의\n일부가 미수거되어 불편을 드린 점 사과드립니다.\n\n추후 이용 시 다시 한 번 맡겨주실 수 있도록\n수거배송비를 포인트로 적립하여 드렸습니다.\n\n또한, 세탁물 겉면에 [런드리고] 문구를 기재해주시면\n좀 더 원활한 수거가 진행될 수 있는 점 안내드립니다.\n\n다시 한 번 이용에 불편을 드려 죄송하며\n추후 동일한 문제가 생기지 않도록 주의하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801522", "date": "2026-05-11", "cat": "기타", "title": "비번", "question": "비번이 카톡을 안왔어요.  옷은 도착했어요 _x000D_\n비번 알려주세요", "answer": "남수진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n런드렛이 열리지 않아 많이 불편하셨을 것 같아 죄송한 마음입니다.🙏\n\n고객님께 제공된 🔑비밀번호는 **(388)** 로 확인되며,\n**해당 비밀번호는 배송 시 발송된 알림톡 또는**\n**수거 신청 화면 우측 상단의 자물쇠 버튼을 통해서도 확인하실 수 있습니다!**\n\n혹시 안내드린 비밀번호로도 열리지 않는 경우에는,\n**다이얼 옆에 있는 화살표의 색상을 기준**으로 (사진참고)\n아래쪽에 보이는 색상과 일치하는 번호를 맞춰 다시 한번 시도해보시길 부탁드립니다.\n\n\n> **✅ 비밀번호 확인 방법 및 다이얼키 런드렛 사용 방법**\n>\n> 🔴🟠 - 122\n> 🟡 - 255\n> 🟢 - 388\n> 🔵 - 477\n> 🟣 - 511\n\n\n혹여라도 임시 비밀번호 사용 시에도 오픈되지 않을 경우\n죄송하게도 지퍼 부분을 젓가락, 볼 등의\n얇은 물건으로 조심스럽게 눌러 런드렛 오픈을 부탁드립니다 🙏️\n\n다시 한 번 불편을 드린 점 깊이 사과드리며,\n앞으로는 비밀번호로 인한 불편이 없으시도록\n해당 내용은 내부적으로 꼼꼼히 점검하겠습니다.🙏\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801520", "date": "2026-05-11", "cat": "기타", "title": "허리끈", "question": "원피스 허리끈을 스카프로 분류", "answer": "최정은 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서 그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801514", "date": "2026-05-11", "cat": "런드렛 이용 문의", "title": "첫 이용 문의", "question": "처음 세탁 맡길옷이 롱패딩, 겨울패딩인데 이걸 넣을만한 봉투나 쇼핑백이 없는데 이럴때는 어떻게 해야하나요?_x000D_\n_x000D_\n그리고 세탁물 받는 방법에 런드렛이 없는데 이런경우에는 런드렛을 못받는건가요?_x000D_\n_x000D_\n", "answer": "민기 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n맡겨주실 세탁물을 담을만한 봉투나 쇼핑백이 없는 경우\n버리는 상자 등을 통해서도 배출이 가능합니다.\n\n다만 세탁물 포장에 사용된 봉투, 상자, 쇼핑백, 가방 등은\n수거 정책에 따라 입고시 폐기가 진행되는 상황으로\n다시 돌려드리는 작업을 진행드리지 않으니\n꼭 일회용품으로 사용해 주시길 안내드립니다.\n\n내어주시는 상자 겉면에는 [런드리고] 메모를\n크게 부착해 주시길 안내드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801512", "date": "2026-05-11", "cat": "배송시간/배송지연 문의", "title": "배송지연", "question": "세탁물 배송이 지연된다는 연락을 받았습니다. 제가 출장일정이 있어서 5/12 (화) 까지는 의류 배송을 받아야 합니다. 배송 될수 있게 처리 부탁드립니다", "answer": "최유미 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 예정하신 일정이 있으셨을 텐데\n약속드린 날짜에 맞춰 세탁물을 전달드리지 못해\n많이 불편하셨을 것 같아 진심으로 사과드립니다.\n\n최근 급격한 날씨 변화로 주문량이 크게 증가하면서\n일부 지역에서 배송이 지연된 점 너른 양해 부탁드립니다.\n\n현재 고객님의 세탁물은 세탁 마무리 단계이며,\n오늘 밤 10시부터 익일 오전 7시 사이 배송 예상되는 점 안내드립니다.\n\n기다려주신 만큼 더욱 꼼꼼히 확인하여\n문제없이 받아보실 수 있도록 끝까지 신경 써서 배송드리겠습니다.\n\n고객님께서 느끼신 불편에 비하면 부족한 수준이지만,\n조금이나마 마음을 전하고자 소정의 포인트를 지급해드렸습니다.\n너그럽게 양해해주시면 감사하겠습니다.\n\n앞으로는 보다 안정적인 서비스로 보답드릴 수 있도록 최선을 다하겠습니다.\n다시 한번 불편을 드린 점 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801507", "date": "2026-05-11", "cat": "오염 미 제거", "title": "세탁물받음고 열어보니", "question": "세탁물을받고 안꺼내보다가 꺼내 이는데 얼룩이 져서 와잇더라구요 ....바로 다 안열어보고 늦은탓도 있겟지만 _x000D_\n너무 심하게 무슨 걸레같이 만들어진건 심각한거 아닌가요 ??? 이번세탁물 보낼때 보냅니다 무료로 해주세여", "answer": "박성미 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n믿고 맡겨주신\n세탁물이 만족스럽지 못해\n많이 속상하셨을 마음 깊이 공감합니다. 🙏🏻\n\n말씀주신 얼룩은 일반 세탁만으로는\n제거가 어려운 오염으로 확인되어\n세탁 외에도 보다 정밀한 약품 처리가\n필요한 상태로 판단됩니다.\n\n이 경우 **‘집중케어'**서비스를 권장드립니다.\n**개별클리닝 진행 후 요청사항을** 남겨주시면\n더 꼼꼼히 케어해드리겠습니다.\n\n눈에 보이는 얼룩이 있다면\n얼룩 부위는 고민하지마시고 꼭 알려주세요! 👀\n\n보다 나은 케어를 통해\n만족스러운 결과를 드릴 수 있도록 더욱 노력하겠습니다.\n\n* * *\n\n✅ **집중케어 신청 방법**\n**①** **[수거신청] 선택**\n ****\n\n**② [개별클리닝] 선택**\n \n\n**➂ 품목 선택 후,**\n 화면 예시처럼 추가 케어 항목을 체크해주세요.\n \n\n* * *\n\n📌 **유의사항**\n**✔︎** 요청 시 **의류 전체 사진**을 찍어주신 후\n    **세심한 케어 필요 부위를 표시**해주시면\n    정확한 처리가 가능합니다.\n\n\n* * *\n\n런드리고는 고객님의 일상에\n여유와 가치를 더하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801505", "date": "2026-05-11", "cat": "기타", "title": "보관", "question": "이불도 보관서비스 이용하고싶어요!_x000D_\n되면 해주세요", "answer": "박화진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n요금제 해지 관련하여 문의주셨군요.\n\n다만 현재 이용 중이신 요금제는 **이전 버전 요금제**로,\n해지하실 경우 **동일한 조건으로 재가입이 어려운 점** 안내드립니다.\n\n이 부분 참고 부탁드리며,\n번거로우시겠지만 해지를 원하실 경우\n새로운 문의글을 통해 요청해주시면\n확인 즉시 신속히 처리 도와드리겠습니다.\n\n또한, 현재 요금제 품목 일부를 사용하신 상태셔서\n해지시 21,800원의 금액만 환불 진행되는 점 안내드립니다.\n\n현재 바로 도움드리지 못한 점 죄송합니다.\n\n**✅ 환불 가능 조건**\n① 결제일 포함 21일 이내\n② 기본 제공 서비스 품목을 전혀 사용하지 않은 경우\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801502", "date": "2026-05-11", "cat": "미수거/오수거 문의", "title": "잘못가져감", "question": "잘못가져겄어요!!!", "answer": "주영민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801501", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "추가금 문의", "question": "추가금이 붙은 이유가 있나요? 혹시 핑크색 오염을 제거하면서 추가결제가 된건가요? 만약 그렇다면 오염제거는 되었나요?", "answer": "유소연 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 서비스를 이용해 주셔서 감사합니다.\n\n문의주신 2026년 4월 20일 수거 신청 건의 경우,\n품목 재분류 접수를 통해 블라우스로 품목 변경이 승인된 것으로 확인되었습니다.\n\n다만, 이용 내역에는 기존 접수 품목 기준으로 표시되는 점 양해 부탁드립니다.\n또한 세탁비 차액에 대해서는 결제 취소가 진행된 점 이용에 참고 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801500", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "금액 이중 부과", "question": "수선은 소매 1곳만 진행되었는데 이중으로 4천원이 2번 부과되었어요. 수정해주세요.", "answer": "박선혜 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 말씀 주신 2026-04-05 수거신청 건을 확인 해보니\n니트 쿠폰 정상적으로 적용되었으며,\n**쿠폰은 니트 1벌에만 적용되는 점 참고 부탁**드립니다.\n\n따라서 5,500원이 정상적으로 할인되어 청구된 점 안내드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801498", "date": "2026-05-11", "cat": "기타", "title": "수거지역과 이사로 인해 배송지역이 상이할경우 신청방법문의", "question": "첫 수거되는 주소와 세탁 후에 받을 배송지주소가 다를경우 어떻게 신청해야되는지 궁금합니다._x000D_\n수거지역: 화성 병점, 배송지역: 오산", "answer": "오영주 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n세탁물이 수거된 이후에는 배송지 변경이 불가합니다.\n세탁물은 정해진 경로를 따라 **일괄 수거/배송**되므로 ** **\n**개별적으로 다른 주소로 출고**가 어렵습니다.\n\n확인해보니 고객님께서는 아직 수거요청을 안하신 것으로 확인됩니다.\n새로운 주소지가 런드리고 이용 가능 지역이라면\n런드렛을 함께 가져가셔서 계속 사용해 주시길 권유드립니다.\n이용이 어려우실 경우 앱 **[MY > 런드렛 반납]** 메뉴에서\n반납 신청해 주시면 됩니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801494", "date": "2026-05-11", "cat": "런드렛 이용 문의", "title": "런드렛회수했다구여", "question": "이미 런드렛회수눌러서 가져갔다구요 _x000D_\n3800원도 내면서요 ", "answer": "변예림 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 믿고 맡겨주신 의류의\n구김이 확인되어 많이 속상하셨을 것 같습니다.\n서비스 이용에 불편을 드려 정말 죄송합니다.\n\n다림질은 의류가 어느 정도 젖은 상태에서 진행되어야 하나,\n건조가 과하게 진행된 상태에서 다림질 되어 발생된 문제로 예상됩니다.\n\n문의주신 내용은 담당 부서에 전달하여\n앞으로의 서비스가 개선될 수 있도록 하겠습니다.\n또한 아직 착복 전이시라면 재 다림질로 도움드리고 싶으나,\n다림질은 어느 정도 의류가 젖어야 진행이 가능하기에 세탁도 함께 됩니다.\n\n다만 단 기간 내 세탁 진행 시 손상 우려가 있고,\n다시 보내주셔야 하는 번거로움이 있기에\n죄송한 마음을 담아 해당 의류 세탁으로 차감된\n세탁권 2장을 다시 지급해드렸습니다.\n\n세탁권 지급으로 고객님의 불편하신 마음을 대신할 순 없지만\n더 잘하겠다는 의미로 받아주시면 감사하겠습니다. 🙏\n이번 만족스러운 품질로 제공해 드리지 못한 점 다시 한번 죄송하다는 말씀 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801492", "date": "2026-05-11", "cat": "기타", "title": "자켓 부속품 분실", "question": "자켓부속품으로 팔 부분에 스트랩 2개, 허리스트랩 1개가 있는데 허리 스트랩은 분실되었습니다. 확인 부탁드립니다.", "answer": "김세영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 수선 관련 문의 주신 내용 확인 했습니다.\n\n허리 수선의 경우 허리만 줄이기는 불가하여\n허리에서 힙으로 이어지는 라인을 자연스럽게 연결하기 위해\n힙 윗부분까지 같이 깎아내게 되어 힙둘레가 줄어듭니다.\n\n허리 부분만 수선 진행될 경우\n힙 부분이 튀어나오거나 핏이 망가질 수 있어,\n라운드 형식으로 어느 정도 힙 줄임도 진행되는 점 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801490", "date": "2026-05-11", "cat": "세탁동의 및 미세탁 문의", "title": "세탁이 안된 이유가 궁금합니다", "question": "모두 세탁이 가능한 옷들인데 왜 세탁이 안된 상태로 왔는지 궁금해여", "answer": "조원아 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 만족스러운 서비스가 진행되지 않은 점 많이 속상하셨겠습니다.\n\n고객님께서 문의하신 제품은 기존 손상이 확인되어 세탁 후 추가 손상이 발생될 것을 우려해 **세탁이 반려**된 것으로 확인됩니다.\n\n손상도에 따라, **세탁이 어렵다 판단 되는 경우는 세탁 미진행**으로 진행되고 있습니다.\n해당 손상 부위는 하단에 첨부하여 드리오니 확인 부탁드리겠습니다.\n\n또한 런드리고 특성상, 고객님의 소중한 의류에 대해 책임지고 손상을 보상 또는 원상복구를 진행하는 원칙이 있어 고객님께서 동의를 하시더라도 세탁 진행은 어려운 점 안내드립니다.\n\n손상을 우려한 케어가 고객님 입장에서는 흡족하지 못할 수 있는 점 저희도 염려하고 있습니다.\n원하시는 결과 내용으로 전달 해 드리지 못하는 점 너른 양해 부탁드립니다.\n\n보다 나은 서비스 제공을 위해 노력하는 런드리고가 되겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801489", "date": "2026-05-11", "cat": "배송누락/분실접수", "title": "소매 버클 분실", "question": "이전 글에 이어쓰기가 안되어서 다시 글 남깁니다._x000D_\n버클은 검정색입니다._x000D_\n버클부분 사진 찍어서 다시 보내드리오니 확인 하시고 연락 부탁드립니다.", "answer": "전한별 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 선 안내 드렸으며,\n고객님의 의류 빠르게 확보하여 출고 드릴 수 있도록 하겠습니다.\n\n이용에 불편을 드려 죄송하며\n추후 동일한 문제가 생기지 않도록 주의하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801487", "date": "2026-05-11", "cat": "기타", "title": "케어 손상 문의", "question": "집중케어 요청했는데 색상 변형이 너무 심해서 못입게 되었어요..", "answer": "김가윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801482", "date": "2026-05-11", "cat": "건조/냄새", "title": "확인되시면 바로 전화주세요", "question": "이번에 처음으로 앱을 이용했고 처음 이용 시 신발 건조가 되지 않고 배송되는게 말이 되나요? 신발 10개정도를 맡겼는데_x000D_\n그럼 모든 신발을 다시 확인해야겠네요? 그리고 이건 사과받고 보상 받지는 못할망정 다시 수거 신청을 하고 일찍 받으려면 돈을 내라는데 이거 머 장난하는건가요? 바로 관리자분이 전화주세요. 01033993325", "answer": "지푸름 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n런드리고으니 세탁 서비스 관련하여\n문의주신 점으로 확인됩니다.\n\n다만 죄송하게로 캐리어 세탁 서비스는\n저희 런드리고 내 세탁 서비스로\n세탁 진행이 불가한 점 확인됩니다.\n\n현재 런드리고의 가방 세탁은\n금속이 전혀 없는 천으로 이루어진\n에코백에 한정하여 세탁이 진행되고 있는점 안내드립니다.\n\n문의주신 사항에 도웅드리지 못해 죄송하다는 말씀드리며,\n보다 다양한 서비스로 찾아 뵐 수 있도록 더욱 더 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801474", "date": "2026-05-11", "cat": "기타", "title": "확인 요청 건", "question": "세탁 불가 부속품이 있다고 조회되는데 이건 뭘까요?", "answer": "김진경 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 의류 부속품이 확인되지 않아 많이 당황스러우셨을 것 같습니다.\n\n다만 입고 당시 공정 영상 확인 결과,\n말씀 주신 부속품은 기존 분실된 상태로 입고된 것으로 확인되는 점 안내 드립니다.\n \n\n \n세탁 이후 발생된 문제가 아니기에\n추가 후속 처리가 어려운 점 너른 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801468", "date": "2026-05-11", "cat": "다림질 미흡", "title": "세탁 없이 다림질만 되는지", "question": "세탁 없이 다림질만 되는 건지 궁금해요_x000D_\n새옷 억지로 세탁해서 주름 싹 다 없애두셨던데 _x000D_\n여기서 집중케어로 또 맡기면 또 세탁해서 괜히 옷만 더 상할 거 같아서요_x000D_\n명확한 답변 부탁드려요_x000D_\n", "answer": "한영주 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 기대에 미치지 못한 상태로 의류가 전달되어\n실망하셨을 것 같아 진심으로 사과드립니다.\n\n저희는 스팀 다리미/스팀 기계를 사용해\n고온의 수증기로 주름을 정리하고 있습니다.\n\n직접 눌러 다림질하지는 않지만,\n이번 건은 과정에서 미흡함이 있었던 것으로 보입니다.\n\n해당 내용은 담당 부서에 공유하여\n재발 방지와 개선을 진행하겠습니다.\n\n**📌 추가 안내**\n\n- 세탁 시 **[집중케어]**로 요청해 주시면\n**얼룩 제거, 다림질, 보풀 제거** 등을 꼼꼼히 케어해 드립니다.\n\n- 이번 불편에 대해서는\n세탁비와 운송비를 포인트로 환불해드렸습니다.\n\n불편을 드려 죄송하며,\n다음 이용 시에는 더 세심하게 처리하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801467", "date": "2026-05-11", "cat": "기타", "title": "단추 분실", "question": "단추가 분실됐어요", "answer": "김율채 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801463", "date": "2026-05-11", "cat": "변형/변색/손상", "title": "안심케어 접수불가상태", "question": "답변 감사합니다._x000D_\n_x000D_\n안내해주신 대로 안심케어로 접수 진행하려했으나_x000D_\n접수불가 상태입니다._x000D_\n_x000D_\n다만 이번 건은 단순 재세탁 요청이 아니라,_x000D_\n세탁 이후 발생한 암막커튼 원단 손상 및 오염에 대한 확인과 배상 관련 문의 건이라는 점 참고 부탁드립니다._x000D_\n_x000D_\n특히 세탁 전에는 없던 원단 손상과 변형이 확인되었고,_x000D_\n암막 기능 저하 우려도 있는 상태라 실물 확인 후 정확한 처리 부탁드립니다.", "answer": "송승환 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[이염]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801460", "date": "2026-05-11", "cat": "배송시간/배송지연 문의", "title": "이불과 다른걸 내놓으려했는데 ", "question": "밤10시이후에 수거하시는거 아니셨을까요ㅠ_x000D_\n그렇게 카톡을 봐서 여유있게 생각하고_x000D_\n제가 이불 먼저내놓고 다른데 잠시 다녀온사이 가져가셨더라구요 그래서 뭐지? 싶었는데 밤에 또오나?싶어 옷내놓고 기다렸는데 안오시더라구요 그래서 배송비채우고 그 쿠폰은 담번에 쓰고 이불20%쓰려고했는데요 이게 무슨일 일까요?  ", "answer": "김수정 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 우선 약속드린 일정에 배송 드리지 못한 점 사과드립니다.\n예정된 일정에 불편을 드렸을까 걱정되는 마음입니다.😥️\n\n4월 8일 수거 신청건의 경우\n서비스 품질을 위한 추가 케어 진행으로 인해\n부득이 지연이 발생된 것으로 확인되며\n금일 새벽 2시 48분 경 배송이 완료된 것으로 확인됩니다.\n\n배송 지연으로 인해 불편을 드린 점 다시 한번 사과드리며\n세탁 품질을 위해 부득이 지연이 발생된 점 너른 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801459", "date": "2026-05-11", "cat": "기타", "title": "엘리베이터 운행중지 ", "question": "저희 집은 11층인데 아파트 엘리베이터 교체로 약 한달간 사용이 정지됩니다 .. 미리 수거 신청을 못해서 사용을 못하고 지나갈거 같아요 ..11층까지 걸어서 배송을 해주시진 않을거 같고 ..일시정지를 길게 한다거나 방법이 없을까요?? 공사는 5월 13일 부터 6월 11일까지 입니다. ", "answer": "최민호 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 안내 완료되어\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801456", "date": "2026-05-11", "cat": "세탁동의 및 미세탁 문의", "title": "세탁불가", "question": "세탁 불가라고 적혀있는데 왜 불가인지 알수 있을까요?", "answer": "김해상 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 만족스러운 서비스로 안내드리지 못한 점에 대해 많이 속상하셨을 것으로 생각되며, 진심으로 사과드립니다.\n\n문의주신 제품은 스웨이드 원단 특성상 오염이 확인된 상태에서 세탁 진행 시 추가 손상 발생 우려가 높아, 부득이하게 세탁 반려로 판단된 것으로 확인됩니다.\n\n런드리고에서는 입고 검수 과정에서 세탁 시 손상 가능성이 크다고 판단되는 경우, 고객님의 의류 보호를 위해 세탁을 진행하지 않고 반려 처리하고 있습니다.\n\n특히 스웨이드 원단은 세탁 과정에서 변형, 탈색 등 손상 위험이 높은 소재이며, 오염이 심한 경우 다른 세탁물에 영향을 줄 수 있어 공정 진행이 어려운 점 양해 부탁드립니다.\n\n또한 서비스 특성상, 고객님의 의류에 대해 손상 발생 시 책임 보상 또는 원상복구를 원칙으로 하고 있어, 고객님 동의 여부와 관계없이 손상 위험이 큰 의류는 세탁 진행이 어려운 점 함께 안내드립니다.\n\n고객님의 기대에 부응하지 못한 점에 대해 저희도 안타깝게 생각하며, 너른 양해 부탁드립니다.\n\n보다 나은 서비스 제공을 위해 지속적으로 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801454", "date": "2026-05-11", "cat": "변형/변색/손상", "title": "지퍼 손상", "question": "세탁 후 배송받은 스커트를 최근 보관하려고 다시 확인하던 중 지퍼 부분 고장을 발견했습니다.  _x000D_\n겨울 의류라 바로 착용하지 않아 이제 확인하게 되었고, 사진 첨부드립니다._x000D_\n세탁 전에는 문제 없이 사용하던 제품이라 확인해주세요.", "answer": "박경아 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 해당 의류는 세탁물 이슈 접수를 통해\n안심케어 신청해 주신 것으로 확인됩니다.\n\n승인 처리가 완료되어\n수거 신청 - 안심케어를 통해 보내주시면\n담당 부서 측 실물 확인 및 케어 진행 되는 점 안내 드립니다.\n\n \n\n번거로운 절차로 불편을 드려 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801453", "date": "2026-05-11", "cat": "기타", "title": "오염 제거 안되어 있네요?", "question": "먼지가 너무 묻어있어서 그건 그러려니 했는데.._x000D_\n오염부분까지 제대로 제거가 안되어있어 세탁이 의심스럽네요 _x000D_\n다시 세탁 부탁드릴게요_x000D_\n_x000D_\n추가로 10시 이전에 제품 내놓았는데_x000D_\n왜 추가 배송비가 붙을까요?_x000D_\n제대로 확인해주세요", "answer": "아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 쿠폰 적용에 대해 관심을 가지고 문의 주셔서\n진심으로 감사드립니다.\n\n문의주신 [식목일엔겨울옷정리] 니트 1벌 천원 쿠폰은\n니트류 전체에 각각 적용되는 것이 아니라,\n니트 1벌에 대해서만 1,000원 혜택이 적용되는 점 안내해 드립니다.\n여러 벌을 맡기시더라도 그중 한 벌에 대해서만 할인이 적용됩니다.\n\n더불어, 또한, 해당 쿠폰을 사용하기 위해서는\n수거 신청 시 전체 세탁 비용의 합계가\n20,000원 이상이어야 정상적으로 적용이 가능합니다.\n\n이용 조건에 대해 미리 상세히 안내해 드리지 못해\n혼선을 드린 점 너그러운 양해를 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801448", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "잔여 이용권 남았는데 결제가 되었습니다", "question": "잔여 이용 개별클리닝 남았는데 추가 결제가 되었습니다.", "answer": "서원주 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n품목 오등록으로 인해 불편을 드려 정말 죄송합니다.\n당분간 이용 계획이 없으시다고 하여,\n요청주신대로 품목 차감 대신 추가 결제가 발생한 건(자켓: 6,800원)에 대해 환불해 드렸습니다.\n\n더 궁금한 점은 언제든 말씀해주세요🙏🏻\n\n\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801447", "date": "2026-05-11", "cat": "월정액 가입/변경/해지 문의", "title": "구독해지", "question": "월정액 결제 된거 환불해주세요. 그리고 월정액 구독도 이제 안할거니까 정기결제 없애주세요!", "answer": "구가영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 서비스를 이용해 주시고 소중한 시간을 함께해 주셔서 진심으로 감사드립니다.\n문의하신 **요금제 해지 및 결제 취소 신청**이 정상적으로 접수되었습니다.\n그동안 저희 서비스를 이용하시면서 혹시라도 불편하셨던 점이나 아쉬웠던 부분이 있으셨을까요?\n고객님의 소중한 의견을 남겨주시면, 더 나은 서비스를 만들어가는 데 큰 힘이 될 것 같습니다.\n-\n결제 취소 건은 카드사 영업일 기준 약 **3~5일 정도** 소요될 수 있는 점 참고 부탁드리며,\n추후 세탁이 필요하실 때 언제든 다시 런드리고를 찾아주세요.\n더 발전된 모습으로 고객님을 모실 수 있도록 준비하고 있겠습니다.\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801446", "date": "2026-05-11", "cat": "기타", "title": "대체", "question": "대체 단추는 어디갔으며 얼룩은 뭡니까_x000D_\n이런적 한두번도 아니고 그동안 몇번째 넘어갔는데 세탁 개똥으로 하시네요 진짜_x000D_\n당장 입어야되는데 어떻게 보상하실래요", "answer": "이종민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 예정하신 일정이 있으셨을 텐데\n약속드린 날짜에 맞춰 세탁물을 전달드리지 못해\n많이 불편하셨을 것 같아 진심으로 사과드립니다.\n\n최근 급격한 날씨 변화로 주문량이 크게 증가하면서\n일부 지역에서 배송이 지연된 점 너른 양해 부탁드립니다.\n\n기다려주신 고객님의 시간을 무겁게 받아들이고 있으며,\n현재 전 공정의 작업 속도를 높이고\n세탁물 하나하나 꼼꼼히 검수하여\n보다 안전하고 신속하게 전달드릴 수 있도록 최선을 다하고 있습니다.\n\n현재 세탁된 세탁물은 출고 예정에 있으니 조금만 더 기다려 주시면 정성을 다해 문 앞까지 안전하게 전달해 드리겠습니다.\n죄송한 마음을 담아 런드리고 포인트 3,000P를 지급드렸습니다.\n\n앞으로는 이러한 불편이 반복되지 않도록\n보다 안정적인 운영과 안내를 위해 더욱 노력하겠습니다.\n\n다시 한번 고객님께 불편을 드린 점 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801444", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "와이셔츠 가격 문의", "question": "와이셔츠 2장이 똑같은 제품인데 하나는 와이셔츠 다른 하나는 일반셔츠 기준으로 과금되었습니다. 확인 요청드립니다.", "answer": "김종철 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n맡겨주신 셔츠가 세탁권 차감이 아닌\n별도 과금 처리되어 많이 당황스러우셨을 것 같습니다.\n\n현재 이용 중이신 **X 요금제**는\n차감 가능 품목과 제외 품목이 구분되어 있으며,\n제공 수량 내에서는 고비용 순으로 자동 차감되고\n초과되거나 제외된 품목은 별도 과금이 발생합니다.\n\n**✅ 차감 가능 품목  **\n- 개별클리닝 의류 (상의/하의/아우터)\n- 생활빨래\n- 이불\n- 신발\n\n**✅ 차감 제외 품목 (별도 과금)  **\n- 셔츠\n- 리빙류\n- 잡화류\n- 프리미엄(명품) 의류\n- 수선\n\n문의주신 셔츠는 **[와이셔츠, 일반셔츠]** 항목으로 분류되어\n현재 요금제의 차감 대상에 해당되지 않아\n별도 과금이 발생한 점 양해 부탁드립니다.\n\n단, 구독 고객님의 경우\n차감 불가·초과 과금 시에도\n자동으로 20% 할인 혜택이 적용됩니다.\n\n앱 내 **[가격표]** 탭에서 품목별 분류 및 요금을\n확인하실 수 있으니, 앞으로 이용 시 참고 부탁드립니다.\n\n또한, 일반셔츠로 구분된 2건은 아래의 사유로 처리 공정이 다르기 때문인 점 안내 드립니다.\n\n- 아래 -\n\n런드리고에서는 고객님의 소중한 의류를 보호하기 위해 품목별로 일괄 세탁하지 않고,\n케어라벨(세탁법)에 맞춰 웨트클리닝 또는 드라이클리닝을 개별적으로 진행합니다.\n두 품목의 가장 큰 차이는 **'다림질 공정'**에 있습니다.\n\n와이셔츠: 형태가 정형화되어 있어 기계 프레스 다림질이 가능합니다.\n기계 작업 후에도 부족한 부분은 숙련된 전문가가 다시 한번 손다림질로 꼼꼼하게 마무리합니다.\n\n일반 셔츠: 소재와 디자인이 매우 다양하여 기계 다림질이 어려운 경우가 많습니다.\n따라서 의류의 변형을 막고 디테일을 살리기 위해 추가적인 수작업 공정이 포함되는 것이 특징입니다.\n\n요약하자면, 와이셔츠는 표준화된 기계 프레스 공정을 활용하고,\n일반 셔츠는 개별 디자인에 맞춘 세심한 관리가 더해진다고 이해해 주시면 됩니다.\n\n\n항상 고객님의 의견에 귀 기울이며,\n더 나은 서비스로 보답할 수 있도록 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801440", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "추가 과금", "question": "월 결제 내역에 개별클리닝 > 에코백 포함아닌가요? _x000D_\n추가 과금이 왜 된건지 문의드려요", "answer": "고객님, 현재 성수기 물량 증가로 문의가 급격히 늘어난 상황입니다.\n문의는 순차적으로 확인하여 최대한 빠르게 안내드리고 있습니다.\n\n응대가 다소 지연된 점 진심으로 사과드리며,\n누락 없이 확인 후 신속하게 답변드릴 수 있도록 최선을 다하겠습니다.", "status": "답변완료"}, {"id": "801437", "date": "2026-05-11", "cat": "변형/변색/손상", "title": "이염 발생", "question": "흰 옷에 이염이 생겼어요.", "answer": "박우영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n맡겨주신 세탁물에서 불편을 겪으셔서\n많이 당황하셨을 것 같아 죄송한 마음입니다.\n\n확인 결과, 문의주신 세탁물은\n생활빨래로 접수된 건으로 확인됩니다.\n\n다만 죄송하게도 문제 접수주신 내용에 대해서는\n생활빨래 서비스 특성상 별도의 도움을 드리기\n어려운 점 너그럽게 양해 부탁드립니다.\n\n**📌 생활빨래 서비스 안내  **\n\n**-** **생활빨래는 검수 과정 없이  **\n** 보내주신 상태 그대로 세탁/건조가 진행****됩니다. **\n\n**- 이 때문에** **입고 시 상태와 배송 후 상태를  **\n** 정확히 비교하기 어려워  **\n** 재세탁이나 추가 케어가 제공되지 않습니다.  **\n\n- 기계 세탁/건조 방식으로 운영되므로\n 케어라벨 상 기계 세탁·건조가 불가한 의류는\n 번거로우시더라도 개별클리닝으로 맡겨주셔야 합니다.\n\n앞으로는 더 만족스러운 서비스 경험을\n드릴 수 있도록 계속 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.  말씀 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801388", "date": "2026-05-11", "cat": "기타", "title": "분실보상", "question": "선물받은 패딩이고 패딩안에 모델명이 적혀잇을텐데 찍어서 보내주세요 _x000D_\n제번호 01054052762 여기로요 그리구 문자로 통장사본 보낼게요 보낼번호도 알려주세요 ", "answer": "한승희 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서 제출해주신 증빙 서류는\n정상 접수되었으며, 관련 내용은 담당 부서에 전달하였습니다.\n\n담당자가 내역확인 후\n순차적으로 연락드릴 예정이오니,\n다소 시일이 소요될 수 있는 점 양해 부탁드립니다.\n\n고객님의 불편을 최소화할 수 있도록\n최대한 신속히 처리해드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801385", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "구독 취소(환불) 요청", "question": "이미 결제한 금액에 대해 환불 요청드립니다.", "answer": "변선영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 감사드립니다.\n\n확인 요청 주신 총 금액은 40,700원으로 확인되며,\n산정 기준은 아래와 같습니다.\n\n \n\n다만, 보내주신 세탁물 중 아동 신발 2건은 세탁 진행되지 않았으나\n오류로 인해 세탁비 과금되어 결제 진행되지 않도록 선처리 진행 도와드렸습니다.\n\n최종 결제 금액은 29,100원으로 확인 됩니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801383", "date": "2026-05-11", "cat": "변형/변색/손상", "title": "변색 손상", "question": "빨간색 새옷이었는데 목에 라운드부분이랑 어깨부분 변색되었어요 앞부분 아래도 줄어들었어요 _x000D_\n사진보다 실물이 더 심합니다 ", "answer": "김현진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 서비스 이용에 불편을 드려 죄송합니다.\n\n안심케어 진행건 관련하여\n자세한 내용 확인드리고자 두차례 연락 드렸으나\n부재로 확인되어 부득이 답변 드립니다.\n\n케어 담당자 확인시 발생된 수축에 대한\n복구를 진행한 부분 확인되고 있기에\n어느 부분에 케어가 미흡하다고 느껴지실지\n자세한 내용과 함께 다시 한번 문의해 주신다면\n담당부서로 전달하여 후속 케어를 진행드리고자 합니다.\n\n케어 불가시에는 추가 안내와 검토가\n이루어질 수 있도록 내용 전달하겠습니다.\n\n바쁘시겠지만 확인 후 회신을 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801379", "date": "2026-05-11", "cat": "기타", "title": "재세탁 신뢰 못함. 결제 쿠폰차감", "question": "무려 4건 중에 3건을 불편하게 받았는데 재세탁이 무슨 의미있나요. 신뢰를 못하는데요. 이미 하루종일 베란다와 방에 널어가면서 다 말렸ㅅ습니다. 돈은 돈대로 내고 제가 건조시킬거면 코인세탁을 갔었을텐데 아깝네요. 절반 이상을 제대로 된 세탁물을 못받았는데 뭘 믿고 재세탁을 맡기겠어요._x000D_\n_x000D_\n크폰듀 진짜 이렇게 저렇게 제한도 많네요. 가장 비싼것만 차감되는데 드것도 혜택 대상이 아니면 안된다니. 이벤트는 낚시성이었나봅니다. 이래서 안되고 저래서 안되고, 쿠폰 안내사항이 많아서 유동적으로 쓰는건줄 날았더니 본인 쿠폰 아니면 읽어볼 필요가 없는 내용이었더라구요. 마치 그 쿠폰에 대한 설명인 것처럼 다 써놓으면 소비자사 혼동할 수도 있지 않겠어요? 그 주의사항이 다른 쿠폰에 대한 것이라고 생각하면서 본적 없습니다. 보통 해당 쿠폰에 대한 설명들을 기재하니까요._x000D_\n이리저리 잘 써보겠다고 머리 굴리다가 이거 안되고 저거 안되고._x000D_\n저는 추가 결제 못합니다. 쿠폰 차감하면 되잖아요? 있는데도 왜 안된다는건지 모르겠네요. 커버도 이불이고 일일이 이게 어떻게 분류되는지 제가 어떻게 아나요? 저는 일반 이불 생각하고 보낸겁니다.", "answer": "이서윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 우선 런드리고 이용에 많은 불편을 겪으시게 하여\n마음이 무겁고 죄송하다는 말씀 드립니다.\n\n이전 이슈를 겪으신 지 얼마 되지 않아 비슷한 문제로\n또 다시 문의를 주시게 하여 죄송합니다.\n\n**CFAB00110400 의류에 대해, 작업자가 집중케어를 진행하려 하였으나**\n**약품을 활용한 얼룩제거 진행 시 의류의 손상 및 변형이 우려**되었으며,\n수거신청 시 해당 의류에 대해 **손상우려 케어진행 여부에 대해 동의하지 않으셨으므로**\n고객님의 소중한 의류를 손상시키지 않게 하기 위해\n**부득이하게 해당 얼룩 부위의 집중케어가 반려**된 점 너른 양해 부탁드립니다.\n\n또한, **CFAB00106868 바지에 대해 기존 얼룩 여부 확인을 위하여**\n**입고 검수 당시 사진을 확인**하였으며 말씀 주신 부위와 **동일한 부위에**\n**얼룩이 발생**되어 있는 것을 확인하였습니다.\n\n따라서 해당 얼룩은 세탁만으로는 지워지지 않는 고착화 된 얼룩으로 확인되며\n런드리고의 세탁 방식은 강한 마찰이나 비비는 방식의 세탁을 지양하므로\n완벽히 제거가 되지 않은 점 양해 부탁드립니다.\n\n다시 한번 만족스러운 서비스를 제공드리지 못해 죄송합니다.\n항상 보다 더 나은 품질과 서비스 제공드리기 위해 꾸준히 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801377", "date": "2026-05-11", "cat": "기타", "title": "방금 전에 세탁물을 받았는데 단추가 떨어져 있습니다", "question": "단추가 떨어진 채로 왔습니다", "answer": "서수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n패딩과 분리가 되는 부속품의 경우,\n입고 검수 시 별도로 분리하여 세탁이 진행되는 점 안내드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[단추 탈락]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니 군데 물이 빠져 가슴 주머니부분은 _x000D_\n얼룩이 져 있었습니다. _x000D_\n소매부분도 오래동안 착용하고 물빨래를 반복한듯하게 변해있었구요._x000D_\n구입한후 처음 드라이클리닝을 맡긴거라 맡기기전 원래 상태를 _x000D_\n잘 기억하고 있습니다._x000D_\n단순히 세탁의 질이 떨어진 세탁불량이라면 그냥 다른 세탁소에 다시 드라이클리닝을 맡겼을겁니다._x000D_\n그만큼 세탁전 상태와 너무 달리 손상된 상태라고 판단해서 보상을 요구한겁니다._x000D_\n세탁물 집으로 보내고 또 확인하고 다시 보내고 또 기다려 달라고하고.. 의미없는 시간끌기 그만하고 이제 그만 보상해 주세요._x000D_\n일주일만에 보상한다고 인스타에 홍보해놓고 한달이 다됐네요._x000D_\n이번에도 확실한 답변이 없다면소비자보호원에 신고하고 sns에 _x000D_\n진행상황 객관적으로 공유하겠습니다._x000D_\n충분이 오래 기다렸고 트랜치코트 손상부분도 많이 양보했습니다._x000D_\n_x000D_\n_x000D_\n", "answer": "아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 쿠폰 적용에 대해 관심을 가지고 문의 주셔서\n진심으로 감사드립니다.\n\n문의주신 [식목일엔겨울옷정리] 니트 1벌 천원 쿠폰은\n니트류 전체에 각각 적용되는 것이 아니라,\n니트 1벌에 대해서만 1,000원 혜택이 적용되는 점 안내해 드립니다.\n여러 벌을 맡기시더라도 그중 한 벌에 대해서만 할인이 적용됩니다.\n\n더불어, 또한, 해당 쿠폰을 사용하기 위해서는\n수거 신청 시 전체 세탁 비용의 합계가\n20,000원 이상이어야 정상적으로 적용이 가능합니다.\n\n이용 조건에 대해 미리 상세히 안내해 드리지 못해\n혼선을 드린 점 너그러운 양해를 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801331", "date": "2026-05-11", "cat": "런드렛 반납 문의", "title": "런드렛 반납 문의 답변에 답변", "question": "오늘은 엘베 사용이 가능하긴 하던데 이후는 모르겠고_x000D_\n1층으로 갖고 가셔도 되는데 저희가 2층이라 그냥 문 앞에 두면 수거해가시는건지 궁금하네요._x000D_\n전화주시는게 빠를텐데 답변이 느려서 시간차 생길거 같네요.", "answer": "김보경 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 감사드립니다.\n\n런드렛 반납 관련 확인 요청 주시어 유선 안내차 연락드렸으나\n연결이 닿질 않아 게시판 안내 드립니다.\n\n현재 런드렛 반납 신청은 완료되어 있는 부분 확인되어\n전산상으로는 런드렛 반납 일정 변경이 불가한 점 안내 드립니다.\n\n현재 확인시 잔존 품목 남아 있는 부분으로 추후 해당 품목 이용 예정이실 경우\n수거 신청시 수령방법을 라이트백으로 신청 주시면 런드렛은 자동 반납 처리 되는 점 안내 드립니다.\n\n품목 사용 예정이 없으실 경우에는 즉시 해지를 통해서만 런드렛 반납 신청일 변경 가능한 부분으로\n번거로우시겠지만 게시판 재문의 요청 드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801330", "date": "2026-05-11", "cat": "세탁 품목 오류접수", "title": "가디건인데, 자켓으로 분류가 되었습니다.", "question": "니트 재질의 가디건 입니다.", "answer": "이현서 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n우선 서비스 이용에 불편을 드린 점 진심으로 사과 드립니다.\n\n4/17 요청주신 품목 재분류는 승인해 드렸습니다.\n이용에 불편을 드린 점 다시 한번 사과 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801322", "date": "2026-05-11", "cat": "기타", "title": "보상 입금 확인", "question": "월요일 오후에 입금 주신다고 했는데 가능한건지 확인해주세요", "answer": "남연수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n세탁물의 상태가 좋지 않아 많이 속상하셨을 것 같습니다.\n\n말씀 주신 부분 확인시 2025년 7월 ~ 12월 사이에\n서비스 진행 받은 세탁물 관련하여 문의주신 내용 확인됩니다.\n\n너무 죄송하게도 앱내 고지사항에 제공하는 내용에 따라 세탁물 문제 접수의 경우,\n수령일로부터 7일 이내 문의주셔야 추가적인 도움을 드릴 수 있습니다.\n\n접수 시 착복 가능성 및 말씀주신 세탁물의 하자가 더 조치하기 힘든 상태로 변질될 수 있기 때문에 기간 내 접수를 요청드리고 있습니다.\n\n현재는 명확한 사유 확인이 어려우며, 문제 접수 기간 경과로 인해 별도로 도움드리기 어려운 점 양해 부탁드립니다.\n문의주신 내용으로 도움을 드리지 못한 점 진심으로 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "801321", "date": "2026-05-11", "cat": "변형/변색/손상", "title": "연락 안주세요?", "question": "기존에 4주 걸린다고 안내받았었는데 4주가 다 되도록 연락없어서 문의 남기니까 4월 말까지는 배송된다더니 또 연락 없어서 문의 남겼는데도 연락이 없네요? 발신 가능한 고객센터 번호도 없고 지금 런드리고 잘못으로 인한 내용 업데이트를 고객이 몇번이나 연락해야 하는 건가요? 변경 사항이 생겼으면 미리미리 연락하고 발신 전화가 없더라도 이런 사안은 고객이 연락할 수 있는 방법을 마련해야 하는거 아닌가요? 전화를 안받으면 문의사항에 답장이라도 남기든지요. 평일 오전 9시 혹은 오후 12시-6시 사이에 연락 바랍니다.", "answer": "김아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 빠르게 연락드리지 못해 죄송합니다.\n현재 확인해보니 담당 부서 측에 내용 접수가 정상적으로 되지 못한 점이 파악됩니다.\n금일 빠르게 재 접수 하여 신속히 연락 받아보실 수 있도록 하겠습니다.\n불편드려 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801320", "date": "2026-05-11", "cat": "기타", "title": "월정액 서비스 해지 요청", "question": "안내해 주신 즉시 해지 버튼을 찾을 수 없고_x000D_\n해지 하기를 누르면 이번 달 월정액 사용 후 해지가 가능함으로 안내 됩니다_x000D_\n즉시 해지 처리를 요청드립니다", "answer": "서민수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요청해주신 **[드라이온리 73]** 요금제의\n즉시 해지 처리가 완료되었습니다.\n\n현재 환불 처리되었으며,\n환불 금액은 카드사 영업일 기준으로\n최대 5일 정도 소요될 수 있는 점 양해 부탁드립니다. 🙏\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801314", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "개별크리닝 월정액에서 차감 안 됨", "question": "월정액 개별크리닝 이 남았는데 거기에서 차감되지 않고 초과 과금 되었습니다. 수정 부탁드립니다. ", "answer": "김영수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 4월 10일 보내주신 세탁물이\n구독권 차감되지 않아 문의주셨는데요!\n\n수거신청 당시 지급된 구독 품목을\n모두 사용해 주셨기에\n차감 가능한 품목이 없어\n초과 세탁비용이 발생된 점 안내드립니다.\n\n 런드리고 1:1문의 담당자입니다.\n\n고객님 쿠폰으로 인해\n문의하여 주신 것 같습니다.\n\n수거 신청 시 적용된 쿠폰은 시스템상\n이후 변경이 불가한 구조로 운영되고 있어\n이미 선택된 쿠폰을 다른 쿠폰으로 교체해 드리는 것은 어려운 점 양해 부탁드립니다.\n\n문의주신 사항에 도움드리지 못해 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801275", "date": "2026-05-11", "cat": "수선 미이행 문의", "title": "지퍼교체관련", "question": "지퍼가 빠져서 지퍼 교체를 요청 했는데 지퍼교체나 누빔수선 아무것도 이행안된채로 개별클리닝만 됐다고 뜨는데 맞나요? ", "answer": "김나연 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 답변 지연으로 서비스 이용에 불편을 드려 죄송합니다.\n\n문의주신 2026-04-19 수거 신청 CFAB00135755 원피스, 점프수트의 경우\n유사 지퍼가 팩토리내 확인되지 않아 부자재 구입 불가로\n수선 반려된 것으로 확인되었습니다.\n아울러 저희 런드리고는 서비스 정책상 수선 불가 품목은\n세탁도 함께 진행되지 않으며,\n즉시 출고팀으로 인계되어 세탁 진행이 어렵습니다.\n\n수선 서비스는 세탁과 함께 필수로 진행되는 항목이므로,\n수선이 불가한 경우 세탁 또한 반려(미진행)되는 점\n양해 부탁드립니다.\n\n해당 수거 신청건의 경우\n배송이 완료된 상태로 확인되었으며\n세탁만 원하실 경우에는 번거로우시더라도\n새롭게 접수해 주셔야 합니다.\n불편을 덜어드리고자 추후 서비스 이용시 사용 하실 수 있도록 운송비는\n포인트로 지급해드렸습니다.\n\n앞으로는 더 나은 서비스 경험을 드릴 수 있도록\n최선을 다하겠습니다.\n\n다시 한 번 불편을 드려 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801268", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "품목 구독 차감 제외 문의", "question": "현재 구독서비스 사용중이나, 모두 구독제에 포함되지 않앟습니다. 이유가 궁금합니다", "answer": "민경서 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n우선 서비스 이용에 불편을 드린 점 진심으로 사과 드립니다.\n\n문의주신 드라이온리 62 요금제에는\n셔츠류(일반셔츠,와이셔츠),운동화,리빙,이불,잡화 품목은\n미포함 품목인 점 안내 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801266", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "추가요금", "question": "추가요금  있는데요?_x000D_\n구독쿠폰_x000D_\n하나있는거로 차감이 안되나요?_x000D_\n개별크리닝은 드라이에서만 차감되나요?", "answer": "오새미 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n구독이용시 차감관련 문의주셨네요\n패딩의 경우, 세탁과 건조에서 공정이 더 소요되어 차감갯수 2개가 적용됩니다.\n\n맡기신 세탁물 중 일부 공정이 까다로운 세탁물은 품목 2개가 차감될 수 있습니다.\n\n**차감기준 안내**\n\n- **일반,롱,다운패딩 : 2장**\n- **리빙/잡화, 신발, 프리미엄, 수선** : 이용권 제공 없음.\n\n**구독권 차감 안내**\n• 차감시, 요금이 비싼 품목부터 우선 차감됩니다.\n\n•**남은 이용권보다 차감할 갯수가 큰 경우, 초과이용으로 적용**됩니다.\n예) 이용권 1개 남은 상태에서 2개짜리 차감 품목을 맡기면\n이용권 적용이 안되고 초과 이용 결제로 발생\n\n• 차감 가능 품목 외 세탁물은\n정가의 20% 할인 적용된 금액으로 결제됩니다.\n\n• 세탁 방법상 개별클리닝 분류라 하더라도\n요금제 차감 가능 품목이 아닐 경우 차감 불가합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801263", "date": "2026-05-11", "cat": "오염 미 제거", "title": "여행다녀와 배송온거 확인 후 문제발션 사진첨부", "question": "오늘 포장 뜯어 확인하며 몇군데 오염이 있어 사진찍고 문의 남깁니다_x000D_\n확인 후 답변 주세요", "answer": "유하린 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 믿고 맡겨주신 세탁물이\n기대에 미치지 못한 상태로 전달되어\n많이 속상하셨을 것 같습니다.\n\n그 마음 충분히 공감되며,\n불편을 드려 진심으로 죄송합니다.\n\n다만 말씀해주신 **얼룩은 일반 세탁만으로는 **\n**제거가 어려운 오염**으로 확인되며,\n**보다 정밀한 약품 처리가 필요**한 상태로 판단됩니다.\n\n해당 경우에는 개별 클리닝 과정을 거친 후\n보다 정성스럽게 관리해드리는** **\n**‘집중케어’** 서비스 이용을 추천드리고 싶습니다.\n\n집중케어는 **[얼룩제거], [보풀제거], [다림질] 등의 **\n**섬세한 케어가 필요한 작업을 선택형 프리미엄 서비스**입니다.\n\n\n* * *\n\n✅ **집중케어 신청 방법**\n**①** **[수거신청] 선택**\n ****\n\n**② [개별클리닝] 선택**\n \n\n**➂ 품목 선택 후,**\n 화면 예시처럼 추가 케어 항목을 체크해주세요.\n \n\n* * *\n\n📌 **유의사항**\n**✔︎** 요청 시 **의류 전체 사진**을 찍어주신 후\n    **세심한 케어 필요 부위를 표시**해주시면\n    정확한 처리가 가능합니다.\n\n\n* * *\n\n이번 건에 대해서는 만족스러운 케어를\n도움드리지 못해 죄송한 마음담아** **\n**세탁비용은 포인트로 환불** 처리하도록 하겠습니다.\n\n추후 다시 한번 더 집중케어 요청을 통해\n맡겨주시면 좀 더 꼼꼼히 케어 도와드리겠습니다.\n\n런드리고는 앞으로도 고객님의 소중한 옷을\n더 건강하고 세심하게 케어해드릴 수 있도록\n지속적인 품질 개선과 서비스 고도화에 최선을 다하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801257", "date": "2026-05-11", "cat": "세탁 품목 오류접수", "title": "누락사항이 있어요", "question": "접수할때 이불압축 요청사항 추가를했는데요_x000D_\n현제 이용확인을해보니 누락이되었는지 압축요청이 확인되지않네요ㅠㅠ", "answer": "최은실 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 이불 압축 서비스 신청 취소를 요청해 주셨으나\n이불은 이미 포장 후 배송된 상황으로\n요청주신 서비스에 대한 취소가 어려웠음을 안내 드립니다.\n\n소중한 시간 내어 문의해 주셨으나\n도움을 드리지 못해 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801252", "date": "2026-05-11", "cat": "월정액 가입/변경/해지 문의", "title": "월정액 환불 신청 및 구독 취소 요청", "question": "안녕하세요. 이번달 결제된 건에 대해서 전액환불 요청 드리고 구독 취소 원합니다. 처리 부탁드려요.", "answer": "손가영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 요금제 환불 관련하여 문의주신 내용 확인되었습니다.\n\n다만 현재 이용 중이신 요금제는 **이전 버전 요금제**로,\n해지하실 경우 **동일한 조건으로 재가입이 어려운 점** 안내드립니다.\n\n이 부분 참고 부탁드리며,\n번거로우시겠지만 해지를 원하실 경우
