, "status": "접수완료"}, {"id": "802726", "date": "2026-05-13", "cat": "런드렛 이용 문의", "title": "수거시간 지정", "question": "안녕하세요, 저희 오피스텔이 새벽자유출입 불가하고 새벽에는 입주민카드로만 출입이 가능한 세대인데요,_x000D_\n오전 6시 이후에는 자유출입이 가능한데 혹시 이같은 경우에는 런드리고 서비스를 아예 이용할 수 없는건가요?", "answer": "조소연 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n저희 수거 및 배송은 **심야 시간대에 기사님 동선에 따라 유동적으로 방문**되는 방식이라,\n아쉽게도 특정 시간대 **정확한 기사님 방문여부는 확인이 어렵습니다** 🙏\n심야 시간대에 방문 가능한 출입 가능 정보(공동 현관 비밀번호 등) 수거 신청 시 입력 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변진행중"}, {"id": "802725", "date": "2026-05-13", "cat": "기타", "title": "이전 문의 내역에 따른 문의입니다. ", "question": "확인 감사합니다._x000D_\n다행히 누락된 끈이 확인되어 안심했습니다._x000D_\n다만 이번 건은 타인 세탁물 오배송과 구성품 분리·누락까지 발생하며 실제 분실 가능성에 대한 우려가 있었고, 이용 과정에서 상당한 불편과 혼란이 있었습니다._x000D_\n_x000D_\n해당 구성품 회수와 별개로, 이번 주문 건에 대한 세탁비 환불 또는 보상 관련 처리 기준도 함께 안내 부탁드립니다.", "answer": "정강희 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n저희 런드리고를 믿고 소중한 의류를\n맡겨주셨는데 기대에 미치지 못해 정말 죄송한 마음입니다.\n\n만족스러운 케어를 제공해 드리지 못하고\n오히려 불편과 번거로움을 드린 점에 대해 깊이 사과드립니다.\n\n해당 부분 관련 기간 경과 건으로 세탁물 이슈 접수 및 안심케어 불가한 부분 확인되어\n재케어 안내 드리니 참고 요청 드립니다.\n\n문의 주신 세탁물(수거 요청일자 2026-03-10,  CFAB00117806 블라우스)은 번거로우시겠지만, 후속 조치를 위해 다시 한 번 런드리고로 보내주시면 감사하겠습니다.\n\n담당자가 실물을 직접 확인하여\n복원 가능 여부를 점검하고,\n복원이 가능한 경우 추가 케어를 진행해드릴 예정입니다.\n\n만약 복원이 어려운 손상으로 확인될 경우에는\n보상 절차 등 후속 안내를 위해\n담당자가 고객님께 직접 연락드릴 예정이오니 양해 부탁드립니다.\n\n앱 내에서 **일반 수거 신청(한밤 배송 선택)을 부탁드리며 **\n**안심케어 진행을 위한 안내 사항**은 아래 내용을 확인해주시면 감사하겠습니다.\n\n\n## ✅ 안심케어 - **수거 신청 방법**\n\n- 안심케어 대상 품목은\n**폐기 가능한 쇼핑백 또는 비닐에 담아 **\n**[런드리고_안심케어]** 라는 문구를 수기로 기재하여,\n문앞에 배출해 주시거나, 라이트백 또는 런드렛에 함께 동봉해 주세요.\n\n\n## ✅ 안심케어 - **안내 사항**\n\n- 수거/배송 시 고객님께 비용이 발생하지 않도록\n운송비(포인트) 또는 수거/배송 이용권이 제공됩니다.\n- 의류에 착복 흔적이 있거나,\n문의주신 품목과 상이할 경우 안심케어가 제한됩니다.\n- 안심케어는 상태에 따라 복원 정도가 다를 수 있으며,\n완벽한 복원이 어려운 경우도 있는 점 양해 부탁드립니다.\n- 안심케어는 **평균 3~7일 정도 소요되며, 타**\n** 세탁물과 함께 보내주시는 경우 전체 세탁 및 배송 일정이 지연**될 수 있습니다.\n- 월정액 고객님의 경우,\n수거/배송 이용권에서 차감이 발생할 수 있으나,\n이후 서비스 이용 시 포인트 결제도 가능합니다.\n\n서비스 이용 중 불편을 겪으셨음에도\n끝까지 믿음을 보내주셔서 진심으로 감사드리며,\n정성껏 처리 도와드릴 수 있도록 최선을 다하겠습니다.\n\  품목으로 상시 20% 할인된 금액으로 이용 가능합니다.\n\n두 요금제를 천천히 비교해 보시고, 고객님께 꼭 맞는 가장 편안한 요금제를 선택하시길 바랍니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802675", "date": "2026-05-13", "cat": "런드렛 이용 문의", "title": "수거신청이 안뜹니다", "question": "지난번 런드렛에 세탁물을 안넣어놨었는데 이후에 아직 세탁진행중으러 되어있어 수거신청이안되는중입니다", "answer": "엄보영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 감사드립니다.\n\n최근 수거 신청 건 확인시 수령방법을 라이트백으로 신청 주신 부분 확인되어\n안내 드립니다.\n\n \n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변진행중"}, {"id": "802667", "date": "2026-05-13", "cat": "결제/과금 문의", "title": "금일 결제진행", "question": "현재진행중인 세탁_14일 새벅도착건 에대해 금일 결제부탁드려요", "answer": "황나현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의하신 **[런드리&드라이 스탠다드]** 요금제의 품목 차감 기준 및\n지난 4월 18일 이용 내역에 대해 안내드립니다.\n\n해당 구독 플랜은 다음과 같은 기준으로 품목권이 차감됩니다.\n\n- **개별 클리닝 의류:** 품목당 **1개** 차감 (단, 패딩류는 **2개** 차감)\n- **생활 빨래(4kg 기준):** **1개** 차감\n\n지난 4월 18일에 맡겨주신 세탁물은 위 기본 품목권 차감 기준에\n해당하지 않는 품목으로 확인되어,\n구독 혜택인 **20% 할인**이 적용된 금액으로 결제되었습니다.\n\n이용 중이신 요금제의 상세 차감 기준은 앱 내 **[My > 이용 중인 요금제 선택 > 구독 관리 > 차감 기준]** 메뉴에서 언제든지 확인하실 수 있습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802649", "date": "2026-05-13", "cat": "세탁 품질 문의", "title": "얼룩", "question": "얼룩이 안지워져왔어요", "answer": "민호 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 안내 완료되어\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802639", "date": "2026-05-13", "cat": "기타", "title": "수거신청건", "question": "지난금요일 보관신청한 건을 수거해서_x000D_\n아직 진행중인데 이거 언제끝나나요?_x000D_\n이거 끝나기전에 수거신청이 안돼서요", "answer": "유은영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 서비스 이용에 불편을 드려 죄송합니다.\n\n문의주신 2026년 4월 9일 수거 신청 건의 경우,\n담당자 확인 결과 보상 진행 대상 의류로 최종 확인되어 배송 완료 상태로 전산 수정이 완료되었습니다.\n\n신규 수거 신청 접수를 위해서는 수령 확인 처리가 필요한 점 안내드립니다.\n해당 건은 보상 의류로 별도 배송이 진행되지 않는 점 참고 부탁드립니다.\n\n수령 확인 시 청구되는 수거·배송비는 안심케어 승인 과정에서 지급된 배송비 포인트로 차감될 예정입니다.\n다만, 현재 요금제를 이용 중이신 경우 포인트 차감이 아닌 수거·배송 품목에서 차감될 예정이며,\n기 지급된 포인트는 추후 수거 신청 시 사용될 예정입니다.\n\n서비스 이용에 혼란을 드린 점 다시 한번 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변진행중"}, {"id": "802638", "date": "2026-05-13", "cat": "기타", "title": "전화해주셨는데 스팸인줄 알고 넘겼어요.", "question": "전화해주셨는데 스팸인줄 알고 넘겼어요._x000D_\n다시 전화 주세요.", "answer": "고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n해당 내용 유선 상으로 안내 드렸습니다.\n고객님의 답답한 마음이 해소되었기를 바랍니다.\n\n추가로 궁금하신 사항은 언제든지 문의 주시기를 바랍니다.\n\n감사합니다.\n런드리고 드림", "status": "답변완료"}, {"id": "802635", "date": "2026-05-13", "cat": "기타", "title": "이불 세탁 신청했는데, 이용 요금을 미리 확인할 수가 없나요?", "question": "제목과 내용 동일합니다!", "answer": "김보민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 불편드린 부분 죄송한 말씀 드립니다.\n\n확인시 최근 신청 건에 수선 신청하신 부분은 확인이 되나\n의류 입고 되지 않은 부분 확인되어 안내 드립니다.\n\n수거 신청일 및 바코드 추가 확인 필요건으로 판단되나 번거로우실 수 있는 부분으로\n안심케어 신청 경로 안내 드리니 접수 요청 드립니다.\n\n\n### **💡 세탁물 문제, 이렇게 접수해 주세요!**\n이제는 고객센터를 따로 거치지 않으셔도,\n앱에서 직접 사진과 함께 문제를 접수하고 **조치 요청**을 하실 수 있어요.\n\n세탁물에 이상이 있는 경우,\n접수 후 아래 두 가지 중 원하시는 방식으로 처리 요청하실 수 있습니다.\n\n\n- **안심케어 요청** (재세탁, 복원 등 가능한 경우)\n- **포인트 환불 요청**\n※ 모든 요청은 담당자가 실물 상태를 확인한 후,\n가장 적합한 방식으로 처리해 드리고 있어요.\n\n###\n**📱 접수 방법 안내**\n\n1. 앱을 최신 버전으로 업데이트해주세요\n2. **\"MY > 이용내역\"** 메뉴로 들어가 주세요\n3. 문제가 있는 세탁물의 수거 신청일을 선택\n4. 해당 품목을 누른 뒤 **[문의 하기]** 버튼 클릭\n5. **[안심케어 요청]** 선택\n6. 사진을 첨부하고, 문제 내용을 작성해주세요\n7. **신청건의 \"확정 알림톡\" 발생 이후, **\n수거 신청 시 상단에 표시되는 안심케어 서비스 선택\n8. 안심케어 품목을 선택하여 수거신청을 완료해 주세요.\n (참고하실 수 있는 이미지를 함께 첨부해 드립니다.)\n\n\n### **✅ 꼭 확인해 주세요!**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n1. 세탁물 수령일 기준 30일 이내에 접수해 주셔야 합니다.\n2. 승인 후 30일 안에 세탁물을 보내주셔야 합니다.\n3. 운송비는 요청건 확정 시 자동으로 포인트로 지급됩니다.\n4. 일반 세탁물과 함께 섞인채로 보내주시면 확인이 어려워요.\n따로 포장해 주시길 부탁드립니다.\n5. 접수해주신 세탁물은 **원상 복원을 최우선**으로 확인하고 있어요.\n담당자가 실물을 꼼꼼히 확인한 후,\n**재세탁·복원 등의 재처리가 가능한 경우에는 **\n**직접 작업이 진행**되며, 조치가 어려운 손상일 경우에는 **별도 안내**를 드립니다.\n\n고객님의 소중한 의견 하나하나를 귀 기울여 듣고,\n더 나은 서비스로 보답할 수 있도록 언제나 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변진행중"}, {"id": "802634", "date": "2026-05-13", "cat": "결제/과금 문의", "title": "제멋대로 요금과금", "question": "문의 를 했는데_x000D_\n확인도 안하고 요금과금은 불공정 하네요_x000D_\n전화주세요_x000D_\n전화가 안되니 불편하네요", "answer": "민호 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 유선 상 안내드린 품목 지급과 부분 환불 처리를 완료 했으며,\n추가 오염 제거 진행을 위해 담당 부서 측으로 내용 전달 및\n수거배송 품목 지급 드렸습니다.\n\n수거 신청 - 개별클리닝으로 보내주시면 담당 부서 측으로\n인계되어 추가 케어 진행 될 예정이며\n아래 문의주신 티셔츠 최초 입고시 사진 첨부 드립니다.\n\n \n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802632", "date": "2026-05-13", "cat": "변형/변색/손상", "title": "마지막으로 요청드립니다.", "question": "정식으로 사과하시고_x000D_\n해결책 제시하세요._x000D_\n이런식으로 답변 종료하시는것은_x000D_\n무성의한 태도입니다._x000D_\n재세탁 해서 걸레가 된 옷감을 또 맡기라고요??_x000D_\n_x000D_\n빠른시일내 답변이 없거나 또.._x000D_\n일방적으로 종결하시면_x000D_\n소비자원에 심의요청하겠습니다.", "answer": "손수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 이용에 불편을 드려 대단히 죄송합니다.\n문의하신 수선비와 관련하여 기존에 결제되었던 20,000원 중, 차액인 **5,000원**에 대한 환불 처리가 정상적으로 완료되었습니다.\n환불 금액은 등록된 대표 결제수단으로 취소되며, 카드사 사정에 따라 영업일 기준 최대 5일 이내 입금될 예정입니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802629", "date": "2026-05-13", "cat": "변형/변색/손상", "title": "바지 구멍 ", "question": "안녕하세요 _x000D_\n오늘 오전 세탁물 확인하는데 바지에 구멍을 냈더라구요 _x000D_\n관련해서 문의글 남겼는데 이해가 안되어서요._x000D_\n구멍 났는데 안심케어 또는 환불 신청을 하라고 하셨는데_x000D_\n왜 보상 없나요? _x000D_\n", "answer": "박경아 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 해당 의류는 세탁물 이슈 접수를 통해\n안심케어 신청해 주신 것으로 확인됩니다.\n\n승인 처리가 완료되어\n수거 신청 - 안심케어를 통해 보내주시면\n담당 부서 측 실물 확인 및 케어 진행 되는 점 안내 드립니다.\n\n \n\n번거로운 절차로 불편을 드려 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802627", "date": "2026-05-13", "cat": "세탁 품목 오류접수", "title": "쿠폰 사용이 안된 점", "question": "와이셔츠는 왜 쿠폰차감이 안된건가요?", "answer": ">> 이전 답변에 남겨드린 내용 한번 더 답변 드립니다.\n\n신효식 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님. 고객님의 입고사진을 확인해 보니, 혹시 이번에 수거신청을 하실 때에 정장바지와 정장상의도 같이 맡기지 않으셨나요?\n\n고객님께서 4/24에 수거신청을 하신 세탁물을 확인해 보니, 저희 내부 AI의 문제로 생각되긴 합니다만, 바지 한벌이 일반셔츠로 정장상의 한벌이 와이셔츠로 과금이 된 부분이 확인이 되고 있습니다.\n\n- 바지는 5,800원 > 일반셔츠 (3,800원) [세탁물코드: CFAB00116187]\n- 정상재킷 6,500원 > 와이셔츠 (2,900원) [세탁물코드: CFAB00116093]\n\n만약 고객님께서 바지와 정장상의를 이번에 맡겨주신게 맞다면, AI품목 인식 과정에서 더 낮은 품목으로 품목 인식이 진행된 것으로 보이며, 이 부분에 대한 차액은 저희 내부 이슈이기 때문에, 고객님께 청구드리지 않고자 합니다.\n\n죄송하지만, 고객님께서 맡겨주신 세탁물 품목이 맞는지 한번 더 확인 부탁 드립니다.\n\n그리고, 품목이 잘못 인식된 경우에는 런드리고앱 > My > 이용내역 에서 잘못 인식된 품목을 클릭하시면, 품목 변경 요청하기 기능이 있고, 이 부분을 이용하시면 1:1 문의를 남기지 않더라도 품목 변경 요청을 하실 수 있는 점 같이 안내 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802623", "date": "2026-05-13", "cat": "기타", "title": "얼룩이 없는데 무슨 얼룩을 말씀하시는 건지 궁금합니다", "question": "원래 투톤으로 된 옷입니다", "answer": "심은미 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n맡겨주신 세탁물이 프리미엄 서비스로 등록되어\n조금 의아하셨을 것 같습니다. 😅\n\n확인 결과, 해당 의류는 런드리고에서 지정한\n**18대 명품 브랜드**에 포함되어\n프리미엄 세탁 서비스로 자동 분류된 건으로 확인되었습니다.\n\n이 브랜드 의류는 일반 세탁 방법으로는\n손상 위험이 높아 모두 **[자동 분류] · [필수 전문 케어]**\n방식으로 프리미엄 서비스가 진행되고 있습니다.\n\n또한 가품,진품 감별사가 있는게 아니기 때문에 구분이 어려워\n정책상 [공통적용]하여 진행하고 있습니다.\n\n따라서 안타깝게도 일반 세탁으로 변경은\n어려운 점 너른 양해 부탁드립니다.\n\n마지막으로, 18대 명품 브랜드 리스트는\n아래 링크에서 확인하실 수 있습니다.\n\n세탁을 맡기시기 전에 확인해주시면\n더 만족스러운 경험을 드릴 수 있을 것 같습니다. 🙏\n\n**➡️ [프리미엄 지정 브랜드 보러가기]**\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802622", "date": "2026-05-13", "cat": "기타", "title": "얼룩케어 문의", "question": "문자를 받았는데요 어느부분의 어떤 얼룩일까요_x000D_\n그리고 오염도가 어느정도인지 궁금합니다_x000D_\n사진 가능할까요", "answer": "이승준 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의주셔서 감사합니다.\n죄송하게도 아래 품목은 세탁 불가 품목으로 지정되어 있어, 세탁이 반려되는 점 안내드립니다.\n\n\n- 신발류: 반스 브랜드 운동화, 구두, 워커, 천연 가죽 신발, 어그류, 나무 재질 바닥 샌들 등\n\n소중한 시간을 내어 문의 주셨으나 도움을 드리지 못해 죄송합니다.\n\n궁금한 점은 언제든 편하게 말씀해 주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802621", "date": "2026-05-13", "cat": "타인 세탁물 발견", "title": "타인세탁물 발견", "question": "다른사람 셔츠가 왔어요 벌써 두번째네요 제 셔츠가 바뀐건지도 모르겠네요 불안해서 이거 사용하겠나요", "answer": "박찬민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 불편드린 부분 죄송한 말씀 드립니다.\n\n타인 세탁물은 오패킹 되어 오배송 된 부분 확인되어 안내 드립니다.\n\n해당 세탁물 런드리고에서 금일(4/15)수거 진행할 예정으로\n금일 저녁 9시 30분 전까지 폐기 가능한 쇼핑백 혹은 라이트백에 담아\n문 밖 배출 요청 드립니다.\n\n런드리고에서 수기 수거 진행 하도록 하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802620", "date": "2026-05 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802578", "date": "2026-05-13", "cat": "미수거/오수거 문의", "title": "미수거", "question": "매번 현관 앞 자전거 위에 올려두는데 어제 밤에는 수거해 가지 않았습니다. 급한 건이니 오늘 바로 수거 부탁드립니다", "answer": "주영민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변진행중"}, {"id": "802576", "date": "2026-05-13", "cat": "월정액 서비스 및 이용횟수 문의", "title": "기존 요금제 중단", "question": "안녕하세요 제가 이용하던 요금제가 중단된다고 들었습니다. _x000D_\n선택은 즉시 요금제를 변경하거나, 6월까지만 기존 요금제로 사용하다 자동 해지되는 것으로 이해했는데 맞을까요? _x000D_\n_x000D_\n변경 내용을 보니 개별품목 세탁이 1개 축소된 것 같던데, 그럼 기존 서비스 이용자들은 6월까지는 이용하되 6월부터 동의 여부에 따라 신규 요금제로 변경되는 선택은 할 수 없는 건가요? _x000D_\n_x000D_\n만일 자동 해지되면 그 이후에는 제안주신 요금제로의 신규 이용은 가능한 건가요? ", "answer": "수이 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 기존에 확인하셨던 요금제와 상이하여\n많이 당황스러우셨을 것 같습니다.\n\n최근 요금제 개편으로 인해 고객님께서 이용중이신\n와이셔츠가 포함된 요금제는 현재는 운영이 종료된 점 양해 부탁 드립니다.\n\n요금제 일시정지는 가능하나, 요금제 변경/해지 이후에는\n재가입이 어려운 점 요금제 이용에 참고 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802574", "date": "2026-05-13", "cat": "런드렛 반납 문의", "title": "런드렛 반납 비용", "question": "런드리고 정기 구독을 해지하고 런드렛 반납을 요청드렸는데 유의사항에 방문 비용이 따로 부과되는 건가요? 원래는 구독해지하면 런드렛 수거하러 오셧엇고 별도비용은 내지 않앗엇는데 확인부탁드립니다", "answer": "정여진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요금제 해지로 인해 자동 런드렛 반납\n알림톡 발송으로 많이 당황스러우셨을 것 같습니다.\n\n요금제 해지 시 시스템 상 자동으로 런드렛 반납이 진행되어\n반납 관련 알림톡이 발송 되고 있습니다.\n다만 이 전 반납이 완료된 고객님께는\n알림톡이 동일하게 발송되오나 반납 취소 처리가 진행되기에\n방문 진행 하지 않는 점 안내 드립니다.\n\n알림톡으로 인해 혼선을 드린 점 진심으로 죄송하다는 말씀 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802572", "date": "2026-05-13", "cat": "기타", "title": "반납", "question": "반납 문안열려서 못주셨다고_x000D_\n비번 알려달라하셔서 아파트 공동현관문 비번_x000D_\n비번 버튼 누르고 02272305호출", "answer": "남수진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n런드렛이 열리지 않아 많이 불편하셨을 것 같아 죄송한 마음입니다.🙏\n\n고객님께 제공된 🔑비밀번호는 **(388)** 로 확인되며,\n**해당 비밀번호는 배송 시 발송된 알림톡 또는**\n**수거 신청 화면 우측 상단의 자물쇠 버튼을 통해서도 확인하실 수 있습니다!**\n\n혹시 안내드린 비밀번호로도 열리지 않는 경우에는,\n**다이얼 옆에 있는 화살표의 색상을 기준**으로 (사진참고)\n아래쪽에 보이는 색상과 일치하는 번호를 맞춰 다시 한번 시도해보시길 부탁드립니다.\n\n\n> **✅ 비밀번호 확인 방법 및 다이얼키 런드렛 사용 방법**\n>\n> 🔴🟠 - 122\n> 🟡 - 255\n> 🟢 - 388\n> 🔵 - 477\n> 🟣 - 511\n\n\n혹여라도 임시 비밀번호 사용 시에도 오픈되지 않을 경우\n죄송하게도 지퍼 부분을 젓가락, 볼 등의\n얇은 물건으로 조심스럽게 눌러 런드렛 오픈을 부탁드립니다 🙏️\n\n다시 한 번 불편을 드린 점 깊이 사과드리며,\n앞으로는 비밀번호로 인한 불편이 없으시도록\n해당 내용은 내부적으로 꼼꼼히 점검하겠습니다.🙏\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802570", "date": "2026-05-13", "cat": "세탁 품질 문의", "title": "로고 오염 및 옷 오염됨", "question": "안녕하세요? 프리미엄 세탁 맡겼는데 로고에 오염이 되었고 흰색 옷주변에 검정색 잉크가 뭍어있습니다. 변상해주세요", "answer": "임혜진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 불편드린 부분 죄송한 말씀 드립니다.\n\n확인 요청 주신 패딩 모자는 현재 담당 부서에서 확인 중에 있는 부분으로\n실물 확인 후 추가 배송 될 예정으로 시간양해 요청 드립니다.\n\n출고 중 출고 오류로 확인되어 출고가 늦어지고 있는 점 안내 드립니다.\n\n실물 미확보시 후속 처리 안내를 위해 재안내 드릴 예정으로\n참고 요청 드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802568", "date": "2026-05-13", "cat": "변형/변색/손상", "title": "안심케어됐다고 받았으나 똑같아요 입으니", "question": "이미 옷감 자체가 상했어요_x000D_\n재케어 몇번째해도 우글거림 똗같아요_x000D_\n옷값 환불해주세요 옷구매비용이요", "answer": "김아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 앞서 담당 부서 측과 소통해주신 이력 확인되어\n해당 문의글은 종료됨을 양해 부탁드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802567", "date": "2026-05-13", "cat": "월정액 가입/변경/해지 문의", "title": "구독 환불 ", "question": "안녕하세요._x000D_\n결제일 21일 전에 월정액 해지를 했는데 환불이 안 되어 문의 남깁니다", "answer": "구가영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 서비스를 이용해 주시고 소중한 시간을 함께해 주셔서 진심으로 감사드립니다.\n문의하신 **요금제 해지 및 결제 취소 신청**이 정상적으로 접수되었습니다.\n그동안 저희 서비스를 이용하시면서 혹시라도 불편하셨던 점이나 아쉬웠던 부분이 있으셨을까요?\n고객님 ", "answer": "권인옥 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n기존에 런드렛을 이용하고 계셨는데,\n이번 세탁물이 라이트백으로 배송되어 많이 당황스럽고 불편하셨을 것 같습니다.\n\n우선 이용에 불편을 드려 진심으로 사과드립니다.\n확인 결과, 최근 주문량 급증으로 인해 일시적인 **런드렛 재고 부족 이슈**가 발생하였습니다.\n\n최대한 런드렛으로 배송해 드리고자 노력하였으나,\n원활한 배송 서비스를 유지하기 위해 부득이하게\n이번 건에 한해 라이트백으로 대체하여 배송해 드리게 되었습니다.\n고객님의 넓은 마음으로 너그러운 양해를 부탁드립니다.\n\n런드렛 수급이 안정화되는 대로 다시 기존처럼 안전하고 편리한\n런드렛 배송 서비스를 이용하실 수 있도록 최선을 다하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802551", "date": "2026-05-13", "cat": "쿠폰/포인트 문의", "title": "쿠폰사용관련", "question": "포인트를 미리 적용할수는없나요 ㅠㅠ 오늘까지 포인트인데 결제는 더 나중에 되면 5,000원 포인트가 날라가요 ㅠㅠㅠㅠ 세탁 진행때문에 이렇게된거라 너무 슬퍼요 ㅜㅜㅜ", "answer": "서세희 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 감사드립니다.\n\n현재 배송중인 세탁물 배송 완료 처리 되면서 포인트 선사용될 예정으로\n확인되어 안내 드립니다.\n\n사용될 포인트는 2,000점인 부분 안내 드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802542", "date": "2026-05-13", "cat": "기타", "title": "옷손상", "question": "지난번 커버가 찢겨서 온날 배송된 셔츠가 찢어졌음_x000D_\n사진은 별도 보내겠음", "answer": "김다인 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 런드리고 서비스를 이용해 주셔서 감사합니다.\n\n문의주신 2026-03-21 수거 신청건은 정상적으로 출고된 것으로 확인되었습니다.\n\n리빙 품목의 경우 다른 세탁물과 함께 폴딩되어 출고되므로,\n번거로우시겠지만 수령하신 세탁물의 비닐 포장을 제거하시고 개별 확인을 부탁드립니다.\n\n이번 안내로 충분한 답변이 되었기를 바라며, 다시 한번 불편을 드린 점 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802541", "date": "2026-05-13", "cat": "배송시간/배송지연 문의", "title": "4월 25일에 수거 배송 맡겼는데 아직 세탁물을 못받았어요", "question": "고생이 많으십니다._x000D_\n4월 25일에 세탁물 수거 요청을 드렸는데 아직 세탁물을 안 받아봐서 연락 드렸습니다. 돈은 나갔는데 세탁물은 언제쯤 받아볼 수 있는걸까요?", "answer": "빠른 회신 감사드립니다 고객님!\n\n전달 주신 서명 참고하여\n브랜드 A/S 접수 진행하도록 하겠습니다.\n\n이용에 불편을 드려 죄송하며\n추후 동일한 문제가 생기지 않도록 주의하겠습니다.\n\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802539", "date": "2026-05-13", "cat": "기타", "title": "보상금 지급 지연", "question": "5/11(월) 6시이후 입금하기로 약속된 보상금이 아직 입금되지않아서 문의합니다._x000D_\n언제 입금됩니까?", "answer": "김민주 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 보상 담당부서와 통화 후\n안내드렸던 보상 입금액은 200,000원으로 확인되고 있으며,\n\n보상금 **입금 예정일은 파손]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802532", "date": "2026-05-13", "cat": "배송누락/분실접수", "title": "분실물 오류", "question": "분실된 끈 다른 제품끈입니다. 보상 처리 문의드립니다.", "answer": "김희완 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 우선 순차적으로 답변을 드리고 있어\n안내가 늦어진 점 고개 숙여 사과 드립니다.\n\n고객님의 의류 공정 영상 확인 결과,\n세탁 공장 내에 배송지 자동 분류 기기에서\n의류 뒤엉킴이 발생하여 다른 고객님의 의류와 함께\n포장 및 배송 진행된 것으로 확인되었습니다.\n\n다른 고객님이 특정되어 소통 후 금일 공장으로\n입고가 완료 되었으며, 담당 부서 측으로 인계 후\n재세탁 및 추가케어 진행하여 최대한 빠른 시일내에\n별도 배송 드릴 예정입니다.\n\n해당 내용에 대해 사전에 안내가 미흡했던 점 진심으로 사과 드립니다.\n불편과 불안을 드린 점에 대해 죄송한 마음을 담아\n소정의 포인트 지급 도와드렸습니다.\n포인트가 고객님의 불편함을 해소 시켜드릴수는 없겠지만,\n더 잘 하겠다는 의미로 받아주시면 감사하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802528", "date": "2026-05-13", "cat": "기타", "title": "호텔 타올 반납수량 재확인 요청", "question": "금번 수거 시 지난달 개시된 타올 모두 반납되었으나 미수거 잔량이 있는 것으로 확인되오니, 재확인 부탁드립니다. ", "answer": "김헌우 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 우선 저희는 일일 배송비라는게 없는 상태입니다.\n자유 이용 서비스 이용중이신 고객님이실 경우,\n한밤 배송 추가 비용은 미과금으로 설정되는 점 안내드립니다.\n신속히 케어 후 배송드리는 것을 가장 최우선으로 하고 있으며,\n지연에 대한 보상으로는 앞서 포인트 지급드리게 된 점 안내드립니다.\n추후 동일한 문제가 발생치 않도록 주의하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\ 립니다.\n\n해당 1:1 문의는 이로써 마무리 안내드리며,\n추후에도 궁금하신 점이나\n도움이 필요하신 부분이 있다면 언제든지 편하게 말씀해주세요.\n\n앞으로도 더욱 만족스러운 품질과 서비스로\n보답드릴 수 있도록 최선을 다하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802374", "date": "2026-05-13", "cat": "기타", "title": "언제 출발하나요?", "question": "배송지연이라는데 언제 출발하나요?", "answer": "박민환 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 예정하신 일정이 있으셨을 텐데\n약속드린 날짜에 맞춰 세탁물을 전달드리지 못해\n많이 불편하셨을 것 같아 진심으로 사과드립니다.\n\n최근 급격한 날씨 변화로 주문량이 크게 증가하면서\n일부 지역에서 배송이 지연된 점 너른 양해 부탁드립니다.\n\n기다려주신 고객님의 시간을 무겁게 받아들이고 있으며,\n현재 전 공정의 작업 속도를 높이고\n세탁물 하나하나 꼼꼼히 검수하여\n보다 안전하고 신속하게 전달드릴 수 있도록 최선을 다하고 있습니다.\n\n이미 출고가 완료되어 배송중에 있고, 배송 일정을 확인해 보니 고객님의 세탁물은 오늘 밤 10시에서 다음 날 오전 7시 사이에 배송될 예정입니다.\n곧 깨끗하게 세탁된 세탁물을 받아 보실수 있습니다. 조금만 더 기다려 주시면 정성을 다해 문 앞까지 안전하게 전달해 드리겠습니다.\n죄송한 마음을 담아 런드리고 포인트 3,000P를 지급드렸습니다.\n\n앞으로는 이러한 불편이 반복되지 않도록\n보다 안정적인 운영과 안내를 위해 더욱 노력하겠습니다.\n\n다시 한번 고객님께 불편을 드린 점 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802371", "date": "2026-05-13", "cat": "기타", "title": "부속품 분실", "question": "세탁 후 벨트 버클 부분이 분실되어 배송되었습니다._x000D_\n빠른 확인 부탁드립니다.", "answer": "조문영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802367", "date": "2026-05-13", "cat": "수선 미이행 문의", "title": "누빔 누락", "question": "수선이 된 부분을 찾기 어려우며 누빔이 필요한 곳은 수선이 되어 있지 않음", "answer": "정승연 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 소중한 세탁물을 믿고 맡겨주셨음에도\n수선 누락으로 불편을 겪으신 점 진심으로 사과드립니다.\n\n만족스러운 결과로\n보답해 드리지 못해 저희도 마음이 무겁습니다.\n\n전달해주신 내용을 확인한 결과,\n수선 담당자의 수선 누락으로 확인 됩니다.\n\n이에 대해 저희가 책임감을 갖고\n신속하고 정확한 후속 조치를 진행하고자 합니다.\n\n가장 효과적인 해결을 위해,\n고객님께서 현재 세탁물의 상태를 사진으로 찍어\n앱 내 **[안심케어 요청]** 메뉴를 통해 접수해주시면 감사하겠습니다.\n\n이는 문제 상황을 정확히 기록하고,\n고객님께 최적의 솔루션(재세탁, 복원, 보상 등)을 제안 드리기 위한\n필수적인 절차이오니 조금 번거로우시더라도 협조 부탁드립니다.\n\n\n### **💡 세탁물 문제, 이렇게 접수해 주세요!**\n이제는 고객센터를 따로 거치지 않으셔도,\n앱에서 직접 사진과 함께 문제를 접수하고 **조치 요청**을 하실 수 있어요.\n\n세탁물에 이상이 있는 경우,\n접수 후 아래 두 가지 중 원하시는 방식으로 처리 요청하실 수 있습니다.\n\n\n- **안심케어 요청** (재세탁, 복원 등 가능한 경우)\n- **포인트 환불 요청**\n※ 모든 요청은 담당자가 실물 상태를 확인한 후,\n가장 적합한 방식으로 처리해 드리고 있어요.\n\n###\n**📱 접수 방법 안내**\n\n1. 앱을 최신 버전으로 업데이트해주세요\n2. **\"MY > 이용내역\"** 메뉴로 들어가 주세요\n3. 문제가 있는 세탁물의 수거 신청일을 선택\n4. 해당 품목을 누른 뒤 **[문의 하기]** 버튼 클릭\n5. **[안심케어 요청]** 선택\n6. 사진을 첨부하고, 문제 내용을 작성해주세요\n7. **신청건의 \"확정 알림톡\" 발생 이후, **\n수거 신청 시 상단에 표시되는 안심케어 서비스 선택\n8. 안심케어 품목을 선택하여 수거신청을 완료해 주세요.\n (참고하실 수 있는 이미지를 함께 첨부해 드립니다.)\n\n\n### **✅ 꼭 확인해 주세요!**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n1. 세탁물 수령일 기준 30일 이내에 접수해 주셔야 합니다.\n2. 승인 후 30일 안에 세탁물을 보내주셔야 합니다.\n3. 운송비는 요청건 확정 시 자동으로 포인트로 지급됩니다.\n4. 일반 세탁물과 함께 섞인채로 보내주시면 확인이 어려워요.\n따로 포장해 주시길 부탁드립니다.\n5. 접수해주신 세탁물은 **원상 복원을 최우선**으로 확인하고 있어요.\n담당자가 실물을 꼼꼼히 확인한 후,\n**재세탁·복원 등의 재처리가 가능한 경우에는 **\n**직접 작업이 진행**되며, 조치가 어려운 손상일 경우에는 **별도 안내**를 드립니다.\n\n고객님의 소중한 의견 하나하나를 귀 기울여 듣고,\n더 나은 서비스로 보답할 수 있도록 언제나 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802366", "date": "2026-05-13", "cat": "미수거/오수거 문의", "title": "수거", "question": "수거를 다시 해간다고 연락이 왔는데 해가지 않았습니다. ", "answer": "고동희 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님의 세탁물은 오늘 1:59에 안전하게 수거된 걸로 확인되었습니다.\n깨끗하게 세탁하여 약속된 배송일정 내에 전달드릴 수 있도록\n최선을 다 하겠습니다.\n\n더 궁금한 점은 언제든 말씀해주세요🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802365", "date": "2026-05-13", "cat": "기타", "title": "얼룩제거 안됐어요", "question": "얼룩제거 안됐어요 (오트밀가디건, 그레이 가디건)", "answer": "남경민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 서비스 이용에 불편을 드려 죄송합니다.\n\n2026년 04월 19일 수거 신청 당시,\n첫 이용 고객님에 한해 수거 신청 화면이 간소화되어 노출되는 프로세스가 적용된 것으로 확인됩니다.\n\n해당 경우, 수거 신청 단계에서 ‘전체 서비스 보기’를 선택해 주셔야\n집중케어 등 추가 서비스를 선택하실 수 있는 점 안내드립니다.\n\n다만, 해당 수거 신청 건은 세탁 공정이 완료되어 금일 정상 수령하신 것으로 확인됩니다.\n\n번거로우시겠지만 실물 확인 후 추가 이슈나 문의사항이 있으실 경우 재문의 부탁드립니다.\n\n만족스러운 안내를 드리지 못한 점 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802364", "date": "2026-05-13", "cat": "결제/과금 문의", "title": "세탁물 이용권 처리가 아닌 과금처리 ", "question": "안녕하세요 말 실망스럽습니다. 환불요청합니다. 또 왜 바지걸이로 걸어둔건데 그걸 가져가고 옷걸이에 반 접어서 주시나요? 제 바지걸이는 어지갔죠?", "answer": "김희성 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 서비스 이용에 불편을 드린 점 진심으로 사과드립니다.\n\n확인 결과, 수선 서비스가 중복으로 신청되어\n동일 작업이 2건으로 결제된 것으로 확인되었습니다.\n해당 부분은 바로 확인 후 7,000원에 대해 환불 처리 완료하였습니다.\n\n또한 문의 주신 재박음질 비용과 관련하여 안내드립니다.\n고객님 의류의 경우 소재 특성(핸드메이드 코트/유사 원단 등)으로 인해\n일반 수선이 아닌 **스페셜 수선**으로 분류되어 진행되었습니다.\n\n스페셜 수선의 경우 일반 재박음질(부위당 4,000원)과 달리\n부위당 7,000원 기준으로 비용이 산정되고 있는 점 안내드립니다.\n\n안내 과정에서 혼선을 드린 점 양해 부탁드리며,\n추가로 궁금하신 사항이 있으시면 언제든지 문의 부탁드립니다.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802293", "date": "2026-05-13", "cat": "기타", "title": "여러밤 배송에서 한밤배송으로 변경", "question": "혹시 한밤배송으로 변경가능한가요", "answer": "권민재 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서 요청주신 배송방법 변경을 확인해보니,\n죄송하게도 이미 수거가 완료되어,\n여러밤배송으로 분류된 상태입니다.\n\n수거신청 전인 경우\n고객님께서 직접 수거신청을 취소하시고\n변경이 가능하나 수거가 완료된 이후엔\n변경이 어려운 부분 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802292", "date": "2026-05-13", "cat": "기타", "title": "수거신청 취소가 안돼요 ", "question": "수거신청 취소가 안돼요", "answer": "천주영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 우선 니트 쿠폰 사용 원하셨으나\n가디건으로 분류되어 불편을 드린 점 사과드립니다.\n\n내부 분류 기준 상 여닫음이 가능한 니트 소재의 경우\n가디건으로 분류하고 있어 맡겨주신 의류도\n가디건으로 분류 되었습니다.\n\n고객님께서 말씀해 주신 내용에 대해 공감하기에\n세탁물 품목 변경 요청에 승인 처리 도와드렸으나,\n결제된 수거 신청건에 대해서는 취소 후 재결제 처리가 아닌\n차액 환불 처리만 가능합니다.\n\n담당자가 승인 처리 시 해당 내용에 대해 인지 하지 못하고\n추가 환불 처리 도와드리지 못한 것으로 확인됩니다.\n\n해당 의류의 추가 세탁비용은 부분 환불 처리 도와드리겠으며\n환불은 카드사 영업일 기준 3~5일 소요되는 점 안내 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802284", "date": "2026-05-13", "cat": "기타", "title": "셔츠 검은색 1개 체크 1개가 배송되지 않았습니다", "question": "셔츠 검은색 1개 체크 1개가 배송되지 않았습니다. 빨간색으로 표시된 셔츠입니다.", "answer": "김태균 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n2026-03-26 맡겨주신 의류는 모두 정상 출고된 것으로 확인됩니다.\n\n다만 운송 과정에서 흔들림으로 인해\n의류가 옷걸이에서 분리되어 런드렛 내부에 위치해 있을 가능성이 있어,\n번거로우시겠지만 런드렛 내부를 다시 한번 확인해주시면 감사드리겠습니다.\n\n이용에 불편을 드려 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802282", "date": "2026-05-13", "cat": "기타", "title": "평택... 평택도 서비스 런드리고 사용하고 싶어요.", "question": "안녕하세요, 런드리고의 편리한 서비스를 항상 눈여겨보고 있는 한 청년입니다! _x000D_\n현재 서울 및 수도권 주요 도시에서 훌륭한 세탁계의 애플과 같은 혁신적인 모습을 보여주고 계시지만, 경기도 내에서 가장 빠르게 성장하고 있는 평택 지역이 서비스 권역에서 제외되어 있어 매우 아쉬운 마음입니다. 런드리고가 평택 시장에 하루빨리 진출해야 하는 이유와 그 수요에 대해 제안드리고자 합니다._x000D_\n1. 폭발적인 인구 유입과 젊은 소비층의 거주_x000D_\n평택은 삼성전자 캠퍼스를 비롯한 대규모 산업 단지가 조성되면서 전국의 시·군·구 중 인구 증가율이 최상위권인 도시입니다. 특히 IT 및 제조업 종사자인 2040 세대의 비중이 매우 높아, 모바일 앱을 통한 비대면 서비스와 구독형 라이프스타일에 대한 수용도가 타 지역보다 훨씬 뛰어납니다._x000D_\n2. 고소득 1인 가구 및 맞벌이 부부 밀집_x000D_\n고덕국제신도시, 지제역 인근, 평택역 주변 그리고 제가 사는 용죽지구까지 신축 오피스텔과 대단지 아파트에는 바쁜 직장 생활로 세탁 시간을 확보하기 어려운 1인 가구와 맞벌이 가구가 밀집해 있습니다. 이들은 가사 노동 시간을 줄이기 위한 프리미엄 서비스에 기꺼이 비용을 지불할 의사가 충분한 타겟층입니다._x000D_\n3. 주변 인접 도시와의 시너지 (천안/아산 등)_x000D_\n평택은 경기도 남부의 거점이자 충청권으로 이어지는 관문입니다. 평택 서비스 안정화 이후 천안, 아산 등 배후 수요 도시로의 확장이 용이하여 전략적으로 매우 중요한 위치라고 생각합니다._x000D_\n4. 강력한 지역 커뮤니티의 니즈_x000D_\n현재 평택 내 지역 커뮤니티(맘카페 및 직장인 익명 커뮤니티 등)에서는 런드리고와 같은 체계적인 비대면 세탁 서비스에 대한 갈증이 큽니다. 서비스가 오픈된다면 초기 마케팅 없이도 입소문을 통해 빠르게 이용자를 확보할 수 있을 것입니다._x000D_\n**\"세탁 없는 일상\"**이라는 런드리고의 가치를 평택 시민들도 함께 누릴 수 있도록 긍정적인 검토를 간곡히 부탁드립니다._x000D_\n감사합니다. 땡큐. ", "answer": "김정민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 앞선 안내 과정에서 담당자 확인이 어려우셨던 점 확인되었습니다.\n\n저희 런드리고는 별도의 1:1 담당자를 지정하여 운영하고 있지 않아,\n문의글 답변 시 소속 및 이름을 별도로 안내드리지 않는 점 양해 부탁드립니다.\n이로 인해 안내가 미흡했던 점 진심으로 사과드립니다.\n\n다만 고객님께서 별도 담당자 배정 및 직접 소통을 요청해주신 내용 확인되어,\n마지막 문의글은 담당자가 직접 이어받아 고객님과 소통드릴 예정입니다. (런드리고 고객솔루션팀 사원 배지원)\n\n아울러 전달주신 내용 중 배송 누락과 관련하여 확인 결과,\n현재 전산상 4월 2일과 4월 4일 각각 두 차례에 걸쳐 배송이 완료된 것으로 확인되었습니다.\n\n고객님께서 겪으신 배송 누락이 실제 합배송이 아닌 각각의 배송 진행에 대한 불편 사항인지 확인이 필요하여,\n번거로우시겠지만 회신 부탁드립니다.\n\n추가 확인을 위해 정보가 필요한 점 조심스럽게 양해 말씀드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802277", "date": "2026-05-13", "cat": "월정액 가입/변경/해지 문의", "title": "구독해지", "question": "한달구독이 생긴줄알았는데 오늘 또 결제가되어서요_x000D_\n제가 착오가 있었던거같은데 조금전에 결제됐던 거_x000D_\n환불부탁드립니다 ㅠㅠ", "answer": "성제한 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요청해주신 **[드라이온리 베이직]** 요금제의\n즉시 해지 처리가 완료되었 탁이 된 건지 확인조차 어렵습니다. 반면 재킷, 치마, 코트 등은 세탁 상태나 라벨 손상, 오염, 변색 등이 눈에 띄게 보입니다. 특히 검은색 재킷은 색상상 티가 덜 날 뿐, 라벨 손상이 확인되고 세탁 상태 역시 신뢰하기 어려운 상황입니다._x000D_\n_x000D_\n옷이 이렇게까지 손상된 상태로 받아본 것은 처음입니다. 겨울 의류들이라 대부분 고가 제품이고 오래 보관하려고 맡긴 건데, 오히려 옷들이 전체적으로 손상되어 돌아온 것 같습니다. 지금까지 여러 번 세탁소를 이용해봤지만 이런 경우는 처음이라 너무 당황스럽습니다._x000D_\n_x000D_\n또 배송 과정에서도 오배송이 있었던 것으로 보이며, 비 오는 날 복도식 아파트에 방치되었다가 다시 재배송된 것 같습니다. 재사용은 해야겠지만 함께 온 런드리백에도 구멍이 난 상태로 배송되었습니다.", "answer": "이연희 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 안심케어로 다시 한번 믿고 맡겨주셨으나,\n개선이 되지 않은 상태로 배송되어 많이 당황스러우셨을 것 같습니다.\n구매하신지 얼마 지나지 않은 제품이라 더욱 속상하셨을 것 같아요.😥️\n\n**번거로우시겠지만 개별 클리닝으로 **\n**다시 한번 더 수거 신청 부탁드리며,**\n**담당 부서 측에 미리 내용 전달하여 **\n**입고 시 후속 처리 방안 확인을 위해 처리될 수 있도록 하겠습니다.**\n\n정상적인 서비스를 제공드리지 못하여,\n번거로운 절차를 드린 점 다시 한번 죄송합니다.\n빠르게 처리하도록 최선을 다하겠습니다.\n\n* * *\n \n\n* * *\n \n\n* * *\n번거로운 절차로 불편드려 죄송합니다.\n보다 나은 서비스로 찾아 뵐 수 있도록 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802265", "date": "2026-05-12", "cat": "기타", "title": "변색.얼룩", "question": "바지가 변색되고 하얀 줄무늬 얼룩들이 전체적으로 생겨 왔습니다. 좋은 바지라 드라이 세탁을 준건데 너무 속상합니다. 어떻게 세탁을 한건가요..드라이를 한게 맞나요??? 런드리고에 등록된 세탁물 수거 사진과 비교해 보시면 확연히 차이가 납니다.", "answer": "송지애 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[물빠짐]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구 사용한 리유저블백", "question": "세탁물 내놓을 때 사용한 리유저블백은 돌려주지 않나요..?_x000D_\n다른 세탁업체 사용했을 때는 돌려줬는데 해당 물품도 배송바랍니다.", "answer": "이연재 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 먼저 불편을 드려 진심으로 사과드립니다.\n\n런드리고에 입고되는 의류들은 공용 옷걸이로 교체되어 관리되고 있으며,\n입고 시 함께 보내주신 옷걸이들은 전량 폐기 처리되고 있는 점 안내드립니다.\n이에 따라, 세탁물을 보내주실 때에는 폐기가 가능한 쇼핑백, 비닐 또는 옷걸이를\n이용해주실 것을 권장드리고 있습니다.\n\n안타깝게도 해당 옷걸이는 당일 폐기된 것으로 확인되어 회수가 어려운 상황입니다.\n도움드리지 못해 정말 죄송합니다.\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802239", "date": "2026-05-12", "cat": "배송시간/배송지연 문의", "title": "배송 지연 중 이사로 인한 세탁물 배송 오류", "question": "지난 5월 5일 배송 신청한 세탁물 중 하나가, 배송이 지연되어 오늘(5월 12일)에 배송 완료되었습니다. 문제는 제가 해당 거주지에서 5월 8일에 다른 곳으로 이사를 진행하면서 세탁물을 못 받게 되었습니다. 수거 및 이사한 집으로 재배송을 원합니다.", "answer": "임은희 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 불편드린 부분 죄송한 말씀 드립니다.\n\n확인 요청 주신 가디건 추가 출고될 예정으로 확인되어 안내 드립니다.\n수령시까지 1~2일 정도 소요될 예정으로 시간양해 요청 드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802238", "date": "2026-05-12", "cat": "런드렛 이용 문의", "title": "런드렛 비번", "question": "최근 정장 + 드레스 세탁한 런드렛 베란다에 꺼내 놓고 까먹고 있다가 이제 찾았습니다! 비밀번호 확인 부탁드립니다", "answer": "오다현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n임시 비밀번호로도 런드렛이 열리지 않아\n많이 당황하셨을 것 같아 죄송한 마음입니다. 🙏\n\n런드렛 비밀 번호가 잘못 전달 되었다니 다시 한번 사과 말씀 전달 드립니다.\n\n안내드린 비밀번호로도 열리지 않는 경우에는,\n**다이얼 옆에 있는 화살표의 색상을 기준**으로 (사진참고)\n아래쪽에 보이는 색상과 일치하는 번호를 맞춰 다시 한번 시도해보시길 부탁드립니다.\n\n\n> **✅ 비밀번호 확인 방법 및 다이얼키 런드렛 사용 방법**\n>\n> 🔴🟠 - 122\n> 🟡 - 255\n> 🟢 - 388\n> 🔵 - 477\n> 🟣 - 511\n\n\n혹여라도 임시 비밀번호 사용 시에도 오픈되지 않을 경우\n죄송하게도 지퍼 부분을 젓가락, 볼 등의\n얇은 물건으로 조심스럽게 눌러 런드렛 오픈을 부탁드립니다 🙏️\n\n다시 한 번 불편을 드린 점 깊이 사과드리며,\n앞으로는 비밀번호로 인한 불편이 없으시도록\n해당 내용은 내부적으로 꼼꼼히 점검하겠습니다.🙏\n\n앞으로는 같은 불편이 없도록 개선하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802237", "date": "2026-05-12", "cat": "기타", "title": "배송안되었습니다", "question": "배송되지 않았습니다", "answer": "김태균 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n2026-03-26 맡겨주신 의류는 모두 정상 출고된 것으로 확인됩니다.\n\n다만 운송 과정에서 흔들림으로 인해\n의류가 옷걸이에서 분리되어 런드렛 내부에 위치해 있을 가능성이 있 n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.🙏🏻\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802204", "date": "2026-05-12", "cat": "수선 불만", "title": "단추 분실", "question": "단추 분실되어 문의 드립니다", "answer": "최종원 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 안내 완료되어\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802203", "date": "2026-05-12", "cat": "오염 미 제거", "title": "오염 미제거", "question": "오염 제거 신청하였으나 미제거되어 문의드립니다", "answer": "안녕하세요, 고객님!\n런드리고 1:1문의 담당자입니다.\n\n보내주신 문의 확인하여 이전 문의에 답변 안내 되었습니다.\n\n1:1 문의는 순차적 답변으로 인해 실시간 응대가 어려운 점 양해 말씀 드리며,\n추가로 궁금하신 사항은 언제든지 문의 주시기 바랍니다.\n\n감사합니다.\n런드리고 드림", "status": "답변완료"}, {"id": "802201", "date": "2026-05-12", "cat": "배송시간/배송지연 문의", "title": "패딩 누락", "question": "패딩 배송 주신다면서 아직까지 안왔어요_x000D_\n확인 부탁드립니다", "answer": "오병준 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 예정하신 일정이 있으셨을 텐데\n약속드린 날짜에 맞춰 세탁물을 전달드리지 못해\n많이 불편하셨을 것 같아 진심으로 사과드립니다.\n\n최근 급격한 날씨 변화로 주문량이 크게 증가하면서\n일부 지역에서 배송이 지연된 점 너른 양해 부탁드립니다.\n\n고객님의 세탁물은 2026-04-13 00:31:15\n안전하게 배송이 완료되었습니다.\n\n고객님께서 느끼신 불편에 비하면 부족한 수준이지만,\n조금이나마 마음을 전하고자 소정의 포인트를 지급해드렸습니다.\n너그럽게 양해해주시면 감사하겠습니다.\n\n앞으로는 보다 안정적인 서비스로 보답드릴 수 있도록 최선을 다하겠습니다.\n다시 한번 불편을 드린 점 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변진행중"}, {"id": "802195", "date": "2026-05-12", "cat": "배송누락/분실접수", "title": "분실 관련 문의", "question": "세탁된 옷이 돌아왔을때 옷의 일부 (후드 끈)이 없어진 상태였고, 재케어 신청하려고 보니 안심케어 탭에는 ‘분실’ 관련 항목이 없어 고객센터 탭에 들어왔고, 분실 관련 항목이 있길래 고객센터에 문의해아하는 건으로 판단하여 문의했습니다._x000D_\n_x000D_\n사실 요즘 시대에 전화 문의가 없는 건 그렇다 치더라도 온라인 문의가 이틀 씩이나 걸리는 것이 다소 놀라웠습니다. 그런데 오랜 시간 기다려 받은 답에는 ‘고객센터에서 처리가 불가하다. 안심케어 신청해야한다. 상담 종료하겠다.‘ 였습니다. _x000D_\n_x000D_\n저는 분실 관련 문의할 수 있는 곳을 찾아 문의한 것인데, 며칠이 걸린 것도 모자라서 이 일이 어떻게 된 것인지에 대한 설명은 전혀 듣지 못 한 것이 상당히 불쾌했습니다._x000D_\n_x000D_\n그로 인해 저는 옷의 일부가 ‘분실‘된 상황에서 돌아온 나머지 옷을 다시 보내라고 하시는 이유가 이해가 잘 안 됩니다. _x000D_\n_x000D_\n후드 끈을 따로 빼 놓고 세탁을 했는데 배송을 보내는 과정에서 누락이 생겨서 배송이 되지 못 한 것이라던지, 아니면 정말 세탁 과정에서 분실이 된 것이라던지, 어느 정도는 사태를 파악해서 저에게도 알려주셔야 저도 이해를 하고 기다릴 수 있지 않나 싶습니다. 저는 선물 받은 중요한 옷의 일부가 분실되어 며칠 째 전전긍긍하며 옷을 맡긴 제 선택을 후회하고 있으니까요. _x000D_\n_x000D_\n정리해서 질문드리겠습니다. 아래 사항은 빠짐없이 확인 후 답변 부탁드립니다._x000D_\n_x000D_\n1. 왜 후드 끈이 없이 돌아온 것인가요? 배송 누락인가요? 아니면 분실인가요? 제 후드 끈이 어디에 있는지 파악이 된 상태인지, 아닌지에 대한 질문입니다. 확실하게 파악 후 답변해주시길 바랍니다._x000D_\n_x000D_\n2. 후드 끈 없는 옷을 다시 보내라고 하시는 이유가 뭔가요? 후드 끈을 찾으셔서 다시 끼워서 돌려보내주기 위함인가요? 이게 아니라면 이해하기가 어려울 것 같은데 무슨 사유가 있는지 궁금합니다._x000D_\n_x000D_\n3. 런드리고 약관을 살펴보았습니다. 회사 측 과실로 인한  분실의 경우 옷 값에 대해 보상하는 것으로 알고 있습니다. 만약 아직 후드 끈을 찾지 못 한 상태라면 보상 신청하고자 하니 신청 방안 함께 안내해주시길 요청드립니다.", "answer": "차경환 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 불편드린 부분 죄송한 말씀 드립니다.\n\n공유주신 이메일 주소로 입고 영상 보내드렸으니\n영상 확인 요청 드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802194", "date": "2026-05-12", "cat": "기타", "title": "ㆍ", "question": "수거신청후 화면입니다_x000D_\n안심케어서비스 선택이 없습니다. 확인바랍니다. _x000D_\n그리고 애초에 런드리고측 실수로 의류가 오염이 됐는데 현재 응대는 고객을 점점 더 화가 나게 하는 대응이네요. 말씀하신대로 접수하려고 했지만 안심케어서비스탭은 없고 본인들이 잘못 했으면서 접수를 제대로 다시 안한 고객탓을 하는 것은 잘못된 것이죠. 런드리고측에서 수거 접수진행해서 다시 세탁해주세요. 계속해서 이런 식으로 응대시 소비자원에 신고하겠습니다.", "answer": "최경아 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 앞선 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802193", "date": "2026-05-12", "cat": "다림질 미흡", "title": "정윤구 팀장이 직접 확인하겠다더니", "question": "카라 망가뜨리고 복구를 못했으면 고객한테 의류를 보내지 _x000D_\n_x000D_\n말고 어떻게 할지 연락을 하라니까 두번 세번 이게 뭐하는 짓입니까?_x000D_\n_x000D_\n안심케어 맡기라더니 그대로 셔츠 보내는데 뭘 케어한 건가요?_x000D_\n_x000D_\n패딩 케어가 지연되면 지연 사유가 뭔지 기간은 얼마나 걸리는지 안내해야 하는거 아닌가요?_x000D_\n_x000D_\n010-7123-5386 전화 주세요", "answer": "김민우 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 안내 완료되어\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802192", "date": "2026-05-12", "cat": "타인 세탁물 발견", "title": "세탁물이 바뀌었어요", "question": "맡겼던 검은색 니트가 안 왔고, 사진 첨부한 타인의 세탁물(흰색 니트)이 왔습니다. 빠른 조치 부탁드려요. (이번주에 입어야 하는 일이 있어서 빠른세탁으로 진행했었습니다)", "answer": "지유민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 타인의 세탁물이\n배송되어 많이 놀라셨을 것 같습니다.\n\n이용에 불편을 드려 진심으로 사과드립니다.\n\n모든 생활빨래는 세탁 시 고객님의 의류만\n세탁망에 담아 개별로 진행되고 있습니다.\n다만 건조 과정에서는 세탁망에 넣을 경우\n주름이 과도하게 생기거나 건조가 원활하지 않아,\n고객님의 세탁물만 단독으로 건조하고 있습니다.\n\n이번 건은 건조 작업 중\n이전 고객님의 세탁물이 잔류한 상태에서\n고객님의 세탁물이 함께 투입되며 발생한 것으로 추정됩니다.\n\n오배송된 세탁물은\n버려도되는 쇼핑백 또는 비닐에 담아\n겉 면에 [타인세탁물] 이라고 메모해주신 후\n다음 수거 요청 시 함께 보내주시면\n내부적으로 확인 후 신속히 처리하겠습니다.\n\n또한, 이번 불편에 대한 보상으로\n다음 수거 요청 건에는 운송비용이\n과금되지 않도록 포인트를 지급드리겠습니다.\n\n다시 한 번 이용에 불편을 드려 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802188", "date": "2026-05-12", "cat": "기타", "title": "단체복 전기수거 단가 문의 드립니다.", "question": "백화점 내 위치한 점포(전국 21개 지점)에서 직원 유니폼 드라이 클리닝 수거 및 반납을 의뢰드리고자 합니다. 가능하다면 단가 문의 드려요.", "answer": "이미지 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n린넨 커튼 세탁도 가능합니다.\n소재에 따라 입고 시 품목이 확정되며,\n일반 커튼은 장당 17,000원, 암막 등 두꺼운 소재의 커튼은 25,000원입니다.\n\n수거신청 방법은 커튼을 폐기 가능한 비닐 또는 쇼핑백에 넣어 문 앞에 두시고,\n런드리고 앱에서 수거신청 탭 > 개별클리닝을 선택해서 맡겨주세요.\n\n더 궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802185", "date": "2026-05-12", "cat": "타인 세탁물 발견", "title": "배송 받아보니 남의 옷이 왔습니다.", "question": "제곧내", "answer": "빠른 회신 감사드립니다 고객님!\n\n해당 의류는 오후 9시 이후 수거 진행하도록 하겠습니다.\n\n이용에 불편을 드려 죄송하며\n추후 동일한 문제가 생기지 않도록 주의하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802183", "date": "2026-05-12", "cat": "오염 미 제거", "title": "문의내역 사라짐", "question": "오자마자 세탁 안된거 문의남겨놓고 내놧는데 안가저가셔서 보니 접수가 안되잇는데요...접수가 안됏나요_x000D_\n셔츠 세탁이 제대로 안됏어요", "answer": "서세찬 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 믿고 맡겨주신 세탁물이\n기대에 미치지 못한 상태로 전달되어\n많이 속상하셨을 것 같습니다.\n\n그 마음 충분히 공감되며,\n불편을 드려 진심으로 죄송합니다.\n\n다만 말씀해주신 **얼룩은 일반 세탁만으로는 **\n**제거가 어려운 오염**으로 확인되며,\n**보다 정밀한 약품 처리가 필요**한 상태로 판단됩니다.\n\n해당 경우에는 개별 클리닝 과정을 거친 후\n보다 정성스럽게 관리해드리는** **\n**‘집중케어’** 서비스 이용을 추천드리고 싶습니다.\n\n집  "answer": "정희선 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 서비스 이용에 불편드려 죄송합니다.\n현재 과금 발생하지 않도록 시스템 상 정정 처리해보고자 하였으나,\n이미 시스템 상으로 정정이 어려운 상태로 확인되어\n과금 발생하지 않도록 세탁비를 포인트로 지급드리겠습니다.\n이 점 양해 부탁드리며,\n운송비 또한 함께 지급드리오니 다음 수거 요청 건 통해 보내주시면 꼼꼼히 처리하겠습니다.\n다시 한번 더 불편드려 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802179", "date": "2026-05-12", "cat": "기타", "title": "10시 픽업", "question": "10시까지 준비 써있는데 항상 10시전에 픽업되서 당황했습니다. 아직 준비 안됐으면 항상 비운 상태로 놓았는데 그냥 픽업했어요… 송도에 있었을대 이런일 없었는데…", "answer": "권지현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 수거 과정에서\n혼란과 불편을 드린 점 진심으로 사과드립니다.\n\n**📌 수거 신청 마감 기준  **\n\n앱에 표시된 ‘22시’는 방문 시간이 아니라\n수거 신청 마감 시간을 의미합니다.\n\n22시 이전 접수 건은 당일 밤~익일 오전 사이\n기사님 동선에 따라 순차적으로 수거됩니다.\n22시 이후 접수 건은 익일 수거로 전환됩니다.\n\n**📌 수거 정책  **\n\n- **수거 신청이 접수되면**\n**기사 분의 동선에 따라 순차적으로 1차 방문**하고 있습니다.\n\n- **밤 10시까지 세탁물이 나오지 않으면 미수거로 간주**되며,\n이 경우 편도 **운송료 3,800원이 부과**됩니다.\n\n- **1차 방문 후 수거가 되지 않아도**\n**밤 10시까지 다시 확인 후 수거가 진행**되므로,\n**이른 방문 이후 곧바로 운송료가 청구되는 일은 없습니다.  **\n\n다음번 이용 시에는 위 내용을 참고해 주시면\n불필요한 재접수나 걱정 없이 편리하게 이용하실 수 있는점 안내드리며,\n**수거된 완성품은 별도 세탁없이 그대로 배송**처리될 수 있도록 조치하겠습니다.\n\n더 명확하고 편리한 서비스 제공을 위해\n지속적으로 개선해 나가겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802178", "date": "2026-05-12", "cat": "기타", "title": "제 물건을 돌려주세요 ", "question": "수거신청하고 물건을 내놓지 않앗는데 2분만에 수거를 해버려서 너무 당황스럽습니다_x000D_\n수거신청 시간 33분 수거완료 알람 시간 35분_x000D_\n긴급확인해주세요 ????", "answer": "한송이 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 세탁을 위해 맡겨주신 운동화가\n세탁 반려 처리되어 많이 당황스러우셨을 것 같습니다.\n\n해당 운동화는 작업자 실물 확인 시\n세탁이 진행될 경우 원단 손상 및 변형이 우려되어\n부득이 세탁 진행이 반려된 것으로 확인됩니다.\n\n고객님의 소중한 세탁물 손상을 방지하고자\n부득이 반려처리된 점 너른 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802177", "date": "2026-05-12", "cat": "미수거/오수거 문의", "title": "수거물을 내놓지 않앗는데 10시전에 가져갓어요 ", "question": "연락 방법을 알려주세요_x000D_\n안에는 세탁된 신발이 잇는데요???이게무슨일이죠 ", "answer": "주영민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 tus": "답변완료"}, {"id": "802160", "date": "2026-05-12", "cat": "기타", "title": "배송누락", "question": "본 상품 외 다른 상품은 모두 배송 완료되었습니다. 본 티셔츠 배송 언제 될까요?", "answer": "어플릭시 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 답변이 지연되어 서비스 이용에 불편을 드린 점 진심으로 사과드립니다.\n\n부속품 분실로 인해 안심케어로 접수해주신 의류의 경우,\n현재 팩토리 내 별도 보관 중인 부속품 리스트와 실물 의류를 대조하며 확인 작업을 진행 중인 것으로 확인되었습니다.\n\n다만, 최근 급격한 날씨 변화로 주문량이 크게 증가하여\n공정 및 안심케어 진행에 다소 시간이 소요되고 있는 점 양해 부탁드립니다.\n\n아울러 해당 수거 신청 건 중 안심케어를 제외한 의류는 금일 출고 예정이며,\n미출고가 발생하지 않도록 관련 내용을 담당 부서에 추가로 전달하였습니다.\n\n다시 한번 고객님께 불편을 드린 점 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802157", "date": "2026-05-12", "cat": "런드렛 오배송", "title": "오배송 / 타인세탁물", "question": "티셔츠가 안왔고 타인 세탁물이 하나 왔습니다", "answer": "이명선 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n소중한 세탁물이 정확히 전달되지 않아\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 [바지]은 현재 담당 부서에서\n세탁 > 건조 > 포장 > 출고 전 과정을 기준으로\n영상 및 RFID 기록을 확인 중입니다.\n\n특히, 다림질이나 포장 과정에서\nRFID 태그가 잠시 해제(또는 탈락)되며\n다른 고객님의 세탁물과 혼입되었을 가능성을\n포함해 전수 조사를 진행하고 있습니다.\n\n**📌 진행 절차  **\n- 동일 시점 출고 세탁물 확인\n- 전 공정 영상 및 RFID 기록 검토\n- 확인된 세탁물은 상태 점검 후 재배송\n- 일정 기간 내 확인 불가 시 분실 보상 절차 진행\n\n확인에는 **영업일 기준 5일 정도 소요**될 수 있으며,\n결과가 나오는 대로 즉시 안내드리겠습니다.\n\n불편을 드려 죄송하며,\n끝까지 책임지고 정확히 처리하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802156", "date": "2026-05-12", "cat": "기타", "title": "이불 맡겼는데 ", "question": "이불 맡겼는데 압축 포장 부탁드립니다", "answer": "이아름 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 신청 주신 이불이 아닌\n다른 이불이 압축되어\n이용에 불편을 드린 점 사과드립니다.\n\n해당 이불에 대해서는\n**번거로우시겠지만 개별 클리닝으로 **\n**다시 한번 더 수거 신청 부탁드리며,**\n**담당 부서 측에 미리 내용 전달하여 **\n**입고 시 후속 처리될 수 있도록 하겠습니다.**\n\n정상적인 서비스를 제공드리지 못하여,\n번거로운 절차를 드린 점 다시 한번 죄송합니다.\n빠르게 처리하도록 최선을 다하겠습니다.\n\n* * *\n \n\n* * *\n \n\n* * *\n번거로운 절차로 불편드려 죄송합니다.\n보다 나은 서비스로 찾아 뵐 수 있도록 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802155", "date": "2026-05-12", "cat": "기타", "title": "인조 가죽 가방도 세탁이 가능한가요?", "question": "안녕하세요,_x000D_\n겉감: 라미네이팅가죽_x000D_\n안감: 폴리에스터100% 가방 안에_x000D_\n음료수를 쏟았는데, _x000D_\n혹시 세탁이 가능할까요?_x000D_\n", "answer": "아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 쿠폰 적용에 대해 관심을 가지고 문의 주셔서\n진심으로 감사드립니다.\n\n문의주신 [식목일엔겨울옷정리] 니트 1벌 천원 쿠폰은\n니트류 전체에 각각 적용되는 것이 아니라,\n니트 1벌에 대해서만 1,000원 혜택이 적용되는 점 안내해 드립니다.\n여러 벌을 맡기시더라도 그중 한 벌에 대해서만 할인이 적용됩니다.\n\n더불어, 또한, 해당 쿠폰을 사용하기 위해서는\n수거 신청 시 전체 세탁 비용의 합계가\n20,000원 이상이어야 정상적으로 적용이 가능합니다.\n\n이용 조건에 대해 미리 상세히 안내해 드리지 못해\n혼선을 드린 점 너그러운 양해를 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802154", "date": "2026-05-12", "cat": "배송시간/배송지연 문의", "title": "구독 취소 ", "question": "배송 지연으로 구독 취소 한다고 했더니 _x000D_\n예전 요금이라고 해서 취소할 꺼면 다시 문의 남기라고 해서 _x000D_\n다시 남겼는데 또 똑같은 답변이네요 _x000D_\n이전 요금제인거 아니까 취소해주세요 ", "answer": "오병준 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 예정하신 일정이 있으셨을 텐데\n약속드린 날짜에 맞춰 세탁물을 전달드리지 못해\n많이 불편하셨을 것 같아 진심으로 사과드립니다.\n\n최근 급격한 날씨 변화로 주문량이 크게 증가하면서\n일부 지역에서 배송이 지연된 점 너른 양해 부탁드립니다.\n\n고객님의 세탁물은 2026-04-13 00:31:15\n안전하게 배송이 완료되었습니다.\n\n고객님께서 느끼신 불편에 비하면 부족한 수준이지만,\n조금이나마 마음을 전하고자 소정의 포인트를 지급해드렸습니다.\n너그럽게 양해해주시면 감사하겠습니다.\n\n앞으로는 보다 안정적인 서비스로 보답드릴 수 있도록 최선을 다하겠습니다.\n다시 한번 불편을 드린 점 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802149", "date": "2026-05-12", "cat": "기타", "title": "구독취소 부탁요", "question": "자동결제되서 구독취소했습니다_x000D_\n3일내로 취소가능하다햇으니취소부탁합니다", "answer": "조현정 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 요금제 해지 관련하여 문의주셨군요.\n\n다만 현재 이용 중이신 요금제는 **이전 버전 요금제**로,\n해지하실 경우 **동일한 조건으로 재가입이 어려운 점** 안내드립니다.\n\n이 부분 참고 부탁드리며,\n번거로우시겠지만 해지를 원하실 경우\n새로운 문의글을 통해 요청해주시면\n확인 즉시 신속히 처리 도와드리겠습니다.\n\n현재 바로 도움드리지 못한 점 죄송합니다. 🙏🏻\n\n**✅ 환불 가능 조건**\n① 결제일 포함 21일 이내\n② 기본 제공 서비스 품목을 전혀 사용하지 않은 경우\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802148", "date": "2026-05-12", "cat": "월정액 가입/변경/해지 문의", "title": "구독변경 ", "question": "어제까지 사용하지 못한 구독요금을 일주일 연장 바랍니다. 일시정지 시키려고 했으나 버튼을 못찾았고 고객센터에 일시정지 부탁드렸습니다. 구제 바랍니다. ", "answer": "양지영. 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서는 기존에 4월 23일부터 4월 29일까지 총 6일간의 일시정지를 신청하여 이용 중이셨습니다.\n요청하신 대로 일시정지 기간을 시스템상 가능한 최대 기간으로 연장해 드렸습니다.\n\n- **기존 기간:** 2026.04.23 ~ 2026.04.29 (6일)\n- **변경 기간:** 2026.04.30 ~ 2026.05.21 (22일 추가)\n\n구독 일시정지는 **원래 연 2회가 최대 횟수**이나, 이번에만 특별히 요청하신 대로 기간 연장 조치를 도와드렸습니다.\n다만, **다음번 이용 시에는 규정상 동일한 조치가 어려울 수 있는 점** 너그러운 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802147", "date": "2026-05-12", "cat": "기타", "title": "오늘까지 ", "question": "오늘까지 못써서 구독정지 시켰거든요 _x000D_\n6월 2일전까지 쓸수 있나요?? ", "answer": "김종성 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 우선 예정하셨던 일정이 있으셨을 텐데,\n약속드린 날짜에 세탁물을 배송드리지 못해 진심으로 사과드립니다.\n\n최근 급격한 날씨 변화로 인해 주문량이\n평소보다 크게 증가하면서\n일부 지역의 배송이 다소 지연되고 있습니다.\n\n소중한 의류를 기다려주시는 고객님께 불편을 드리지 않도록\n현재 전 공정의 작업 속도를 높이고,\n모든 세탁물을 한 벌 한 벌 꼼꼼히 검수하여\n안전하게 배송드릴 수 있도록 최선을 다하고 있습니다.\n\n빠른 시일 내 받아보실 수 있도록 최선을 다하겠으며,\n죄송한 마음을 담아 런드리고 포인트 3,000P를 지급드렸습니다.\n\n다시 한 번 이용에 불편을 드린 점 진심으로 사과드리며,\n앞으로는 동일한 불편이 재발되지 않도록 최선을 다하겠습니다.\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802145", "date": "2026-05-12", "cat": "수선 미이행 문의", "title": "밑단 박음질 완료했는지 확인이 안됩니다", "question": "슬랙스 맡긴 이유가 밑단 박음질 수선 때문인데, 이행 여부가 사진에서 확인이 안돼서요! 금액도 청구가 안됐길래 잘 이행이 된건지 궁금하여 문의 남깁니다", "answer": "유성현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 맡겨주신 세탁물의 수선이 진행되지 않아\n많이 당황하셨을 것으로 생각됩니다. 😥\n\n확인 결과, 해당 세탁물은\n저희 런드리고 내 **세탁 및 수선 미취급 품목(의사가운 류)에 **\n**해당**되어 부득이 세탁 및 수선 불가로\n반려 처리된 점 안내드립니다.\n\n**※ 수선 불가 품목에 대한 자세한 내용은**\n**첨부드린 사진을 참고 부탁드립니다.**\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802144", "date": "2026-05-12", "cat": "배송시간/배송지연 문의", "title": "10시 전에와서 초인종 여러번 누름", "question": "저녁 10시 이후에 수거하는거 아닌가요? 막 퇴근하고 집에와서 정리하고 있는데 8시 15분 경에 초인종을 3번이나 누르시네요. 당연히 10시 전까지 정리하고 내놓으려고 했는데! 헐레벌떡 대충 정리하고 문열어서 드렸더니 제게 10시 전에 문 앞에 놓으시라는데 이게 맞나요? 그래서 런드렛 빼고 그냥 대충 비닐에 쑤셔서 넣었네요. 분명 “밤 10시 이후 픽업”인데 뭐죠 이건?", "answer": "김유리 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n서비스 이용 과정에서 불편을 겪게 해 드려 진심으로 사과드립니다.\n고객님의 소중한 시간을 내어 문의 주셨을 텐데,\n만족스러운 서비스를 제공해 드리지 못한 점에 대해 무거운 책임감을 느낍니다.\n\n수거 관련 안내를 드리자면,  **수거 신  담당자입니다.\n\n먼저 만족스러운 서비스로 안내드리지 못한 점에 대해 많이 속상하셨을 것으로 생각되며, 진심으로 사과드립니다.\n\n문의주신 제품은 스웨이드 원단 특성상 오염이 확인된 상태에서 세탁 진행 시 추가 손상 발생 우려가 높아, 부득이하게 세탁 반려로 판단된 것으로 확인됩니다.\n\n런드리고에서는 입고 검수 과정에서 세탁 시 손상 가능성이 크다고 판단되는 경우, 고객님의 의류 보호를 위해 세탁을 진행하지 않고 반려 처리하고 있습니다.\n\n특히 스웨이드 원단은 세탁 과정에서 변형, 탈색 등 손상 위험이 높은 소재이며, 오염이 심한 경우 다른 세탁물에 영향을 줄 수 있어 공정 진행이 어려운 점 양해 부탁드립니다.\n\n또한 서비스 특성상, 고객님의 의류에 대해 손상 발생 시 책임 보상 또는 원상복구를 원칙으로 하고 있어, 고객님 동의 여부와 관계없이 손상 위험이 큰 의류는 세탁 진행이 어려운 점 함께 안내드립니다.\n\n고객님의 기대에 부응하지 못한 점에 대해 저희도 안타깝게 생각하며, 너른 양해 부탁드립니다.\n\n보다 나은 서비스 제공을 위해 지속적으로 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802125", "date": "2026-05-12", "cat": "월정액 가입/변경/해지 문의", "title": "월정액 환불", "question": "미사용 월정액 21일내 환불 신청합니다 ", "answer": "구가영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 서비스를 이용해 주시고 소중한 시간을 함께해 주셔서 진심으로 감사드립니다.\n문의하신 **요금제 해지 및 결제 취소 신청**이 정상적으로 접수되었습니다.\n그동안 저희 서비스를 이용하시면서 혹시라도 불편하셨던 점이나 아쉬웠던 부분이 있으셨을까요?\n고객님의 소중한 의견을 남겨주시면, 더 나은 서비스를 만들어가는 데 큰 힘이 될 것 같습니다.\n-\n결제 취소 건은 카드사 영업일 기준 약 **3~5일 정도** 소요될 수 있는 점 참고 부탁드리며,\n추후 세탁이 필요하실 때 언제든 다시 런드리고를 찾아주세요.\n더 발전된 모습으로 고객님을 모실 수 있도록 준비하고 있겠습니다.\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802120", "date": "2026-05-12", "cat": "세탁 품목 오류접수", "title": "이불이 아니라는데 이불 커버인데 그럼 뭐가 이불인가요????", "question": "이불 쿠폰 줘서 굳아 보낸건데 이게 뭐죠??", "answer": "이현서 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n우선 서비스 이용에 불편을 드린 점 진심으로 사과 드립니다.\n\n4/17 요청주신 품목 재분류는 승인해 드렸습니다.\n이용에 불편을 드린 점 다시 한번 사과 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802116", "date": "2026-05-12", "cat": "기타", "title": "세탁물 13건 분실", "question": "5/12 한밤배송으로 아침에 받아서 확인해봤는데,_x000D_\n선택한 13건의 옷이 안왔습니다._x000D_\n확인 부탁드립니다.", "answer": "권민재 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서 요청주신 배송방법 변경을 확인해보니,\n죄송하게도 이미 수거가 완료되어,\n여러밤배송으로 분류된 상태입니다.\n\n수거신청 전인 경우\n고객님께서 직접 수거신청을 취소하시고\n변경이 가능하나 수거가 완료된 이후엔\n변경이 어려운 부분 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802114", "date": "2026-05-12", "cat": "변형/변색/손상", "title": "세탁 전에 없던 얼룩이 생겨왔습니다", "question": "세탁 전에는 없던 얼룩이 생겨왔습니다_x000D_\n안심보상 신청했는데 거절되어 다시 문의드립니다", "answer": "박우영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n맡겨주신 세탁물에서 불편을 겪으셔서\n많이 당황하셨을 것 같아 죄송한 마음입니다.\n\n확인 결과, 문의주신 세탁물은\n생활빨래로 접수된 건으로 확인됩니다.\n\n다만 죄송하게도 문제 접수주신 내용에 대해서는\n생활빨래 서비스 특성상 별도의 도움을 드리기\n어려운 점 너그럽게 양해 부탁드립니다.\n\n**📌 생활빨래 서비스 안내  **\n\n**-** **생활빨래는 검수 과정 없이  **\n** 보내주신 상태 그대로 세탁/건조가 진행****됩니다. **\n\n**- 이 때문에** **입고 시 상태와 배송 후 상태를  **\n** 정확히 비교하기 어려워  **\n** 재세탁이나 추가 케어가 제공되지 않습니다.  **\n\n- 기계 세탁/건조 방식으로 운영되므로\n 케어라벨 상 기계 세탁·건조가 불가한 의류는\n 번거로우시더라도 개별클리닝으로 맡겨주셔야 합니다.\n\n앞으로는 더 만족스러운 서비스 경험을\n드릴 수 있도록 계속 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802113", "date": "2026-05-12", "cat": "변형/변색/손상", "title": "안심케어 수거 문의", "question": "안심케어인데 개별클리닝으로 접수해야하나요?_x000D_\n담당자 연락 주신다고 했었는데 글을 남겨도 연락이 없으시네요. 개별클리닝으로 접수하면 잘못 전달 될 수 있을 것 같아 어떻게 수거신청할지 다시 확인 요청드립니다. 안심케어수거 될 수 있도록 앱 열어주시던가요.", "answer": "남예원 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n비대면 서비스 특성상 전산에 접수된 내용 기준으로만 서비스 진행이 가능한 점 안내드립니다.\n\n고객님께서는 생활빨래로 접수해주신 건으로 확인되어, 개별클리닝 서비스로의 변경은 어려운 점 양해 부탁드립니다.\n\n차후 개별클리닝이 필요하신 경우 해당 서비스로 별도 접수해주시면 이용 가능하신 점 안내드립니다.\n\n고객님의 세탁물은 현재 배송 중에 있는 상태입니다.\n\n소중한 시간 내어 문의주셨음에도 도움을 드리지 못한 점 진심으로 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802111", "date": "2026-05-12", "cat": "배송시간/배송지연 문의", "title": "배송안옴", "question": "그레이 스커트가 안왔습니디", "answer": "고객님 금일 심야시간대에 정정배송 완료된 것으로 확인됩니다.\n\n죄송하게도, 요금제 차감의 경우\n수거 신청일을 기준으로 차감되고 있기에\n말씀 주신 갱신된 요금제에서 차감이\n시스템상 어려운 점 너른 양해 부탁 드립니다.\n\n해당 건으로 인해 불편드린점에 대해 죄송한 마음을 담아\n세탁 포인트 20,000P 지급 도와드리겠습니다.\n포인트가 고객님의 불편함을 해소 시켜드릴수는 없겠지만,\n더 잘 하겠다는 의미로 받아주시면 감사하겠습니다.\n\n또한 정정배송 진행 중 기사님의 언행으로\n불편을 드린 점 다시 한번 진심으로 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802110", "date": "2026-05-12", "cat": "기타", "title": "뭐하시는 거죠?", "question": "저 이 제품에대해 수선을 요청적도 없고 코트에 상태를 확인하기위해 제품을 보내달라요천 하신거면서 이 제품에대해 추가 쩡했던 마지막 단추가 사라진 상황임에도 기간이 다소 지났다는 이유로 제가 감당해야 되는 상황이라는 게 이해가 되지 않습니다._x000D_\n_x000D_\n애초에 고객 입장에서 당연히 이런 서비스를 이용하는 이유는 수선이 잘 되고, 깨끗하게 잘 해주시겠지 생각하며 믿고 맡기는 것이지 어디 잘 안된 부분있을까, 잘못된 곳 있을까 매번 살피려면 이 서비스를 이용할 필요가 없을 거라고 생각합니다._x000D_\n_x000D_\n귀사에서 보내주신 사진에도 마지막 단추는 분명히 있으니 첨부 파일 확인 부탁드린 뒤 다시 답변 부탁드립니다.", "answer": "이한나 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 신청해 주신 수선 서비스가 진행되지 않아\n의아하셨을 것 같습니다.\n\n문의 주신 내용 확인 결과,\n신청해 주신 똑딱이 달음 수선의 경우\n[실로 달음이 가능한 스냅(똑딱이) 달음 수선]만 가능하며\n고객님께서 요청하신 [스냅(똑딱이) 기계로 달음이 가능한 스냅(똑딱이) 달음 수선]은\n런드리고에서 진행이 어려운 수선으로 확인되며\n브랜드AS나 기계를 보유한 업체를 통해 진행 가능한 부분으로 확인됩니다.\n\n소중한 시간 내어 서비스 신청해 주셨으나\n도움을 드리지 못한 점 죄송하다는 말씀 드립니다.\n\n또한 수선은 세탁이 함께 진행되는 서비스 항목으로,\n수선이 불가한 경우 세탁 또한 함께 반려 처리됩니다.\n\n이에 따라 해당 의류는 **그대로 반송 처리**된 점 너른 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802082", "date": "2026-05-12", "cat": "결제/과금 문의", "title": "이해가 안가네요", "question": "세가지 의류 세탁 관련 이용권 차감 문의남겼고 첨부사진과 같이 답변 받음_x000D_\n_x000D_\n그런데 청남방을 일반 셔츠 처리하였는데 예전에는 개별 클리닝 처리했는데 어느 세탁물과 같이 의뢰하는지에 따라 과금이 달라지는게 합리적이라고 생각하십니까_x000D_\n_x000D_\n결제 다시 정정 요청드리고 아니면 정식으로 법적 문제 제기 하겠습니다.", "answer": "고객님, 현재 성수기 물량 증가로 문의가 급격히 늘어난 상황입니다.\n문의는 순차적으로 확인하여 최대한 빠르게 안내드리고 있습니다.\n\n응대가 다소 지연된 점 진심으로 사과드리며,\n누락 없이 확인 후 신속하게 답변드릴 수 있도록 최선을 다하겠습니다.", "status": "답변완료"}, {"id": "802080", "date": "2026-05-12", "cat": "프리미엄 서비스 문의", "title": "답변", "question": "답변 내용 연결해서 작성합니다._x000D_\n전 프리미엄 안내를 받은 적이 없습니다._x000D_\n비용을 지불할 수 없습니다.", "answer": "김선영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 안내 완료되어\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802063", "date": "2026-05-12", "cat": "런드렛 이용 문의", "title": "영상 추가 요청 ", "question": "영상을 보내주셨는데, 확장자가 exe더라구요. _x000D_\n제가 맥북만 써서 해당 파일을 열람할수가없는데 영상파일로 보내주실 수 있을까요? ", "answer": "김신혜 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n서비스 이용에 불편을 드려 죄송합니다.\n\n문의주신 내용은 담당부서로 전달하여\n추후 런드렛 재고가 부족하더라도\n고객님의 세탁물은 꼭 런드렛에 담아\n배송드릴 수 있도록 내용 공유하였습니다.\n\n다만, 이번에는 안내받으신 내용과 같이\n런드렛 제공이 어려운 상황으로 확인되어\n너그럽게 양해주시길 안내 드립니다.\n\n고객님께서 느끼신 불편에 비해\n한없이 부족한 금액이지만\n소정의 포인트를 적립 드리오니\n다시 한번 너그럽게 양해해 주시면 감사하겠습니다.\n\n다시 한번 이용중 불편을 드린 부분에 있어\n깊게 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변진행중"}, {"id": "802061", "date": "2026-05-12", "cat": "다림질 미흡", "title": "?", "question": "바지 칼주름 안잡혀서 보냈는데 또 칼주름 안잡아서 보낼꺼면 왜 가져가신건가요?보관하신건가요?바지 금액 청구하신거 아닌가요?니트 원상태로 복구한것도 아닌데 그냥보내시면 어찌하나요?상담사분과 통화할때 잘못 인정하시고 이번엔 줄었다,복구가 되었다 등등의 결과 상담 후 보내시기로 했는데 이게 뭔가요?전화 한통 없이", "answer": "성현희 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[다림질 미흡]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.🙏🏻\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802057", "date": "2026-05-12", "cat": "기타", "title": "세탁 배송 관련 문의", "question": "세탁을 요청하려고 하는데 세탁물 양이 너무 많아서 담을 수 없는데 어떻개 해야하나요", "answer": "김해란 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802055", "date": "2 면\n확인 즉시 신속히 처리 도와드리겠습니다.\n\n현재 바로 도움드리지 못한 점 죄송합니다. 🙏🏻\n\n**✅ 환불 가능 조건**\n① 결제일 포함 21일 이내\n② 기본 제공 서비스 품목을 전혀 사용하지 않은 경우\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801999", "date": "2026-05-12", "cat": "기타", "title": "기존에 맡겼었는데 왜금액이 다른가요?", "question": "제가 카펫을 처음 보낼때 답변처리를 못해서 취소가 됐는데 그때는 6만원이라했는데_x000D_\n제가 그대로 진행하려고 다시보냈거든요? _x000D_\n같은 세탁물인데 왜 10만원인가요?", "answer": "천주영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 우선 니트 쿠폰 사용 원하셨으나\n가디건으로 분류되어 불편을 드린 점 사과드립니다.\n\n내부 분류 기준 상 여닫음이 가능한 니트 소재의 경우\n가디건으로 분류하고 있어 맡겨주신 의류도\n가디건으로 분류 되었습니다.\n\n고객님께서 말씀해 주신 내용에 대해 공감하기에\n세탁물 품목 변경 요청에 승인 처리 도와드렸으나,\n결제된 수거 신청건에 대해서는 취소 후 재결제 처리가 아닌\n차액 환불 처리만 가능합니다.\n\n담당자가 승인 처리 시 해당 내용에 대해 인지 하지 못하고\n추가 환불 처리 도와드리지 못한 것으로 확인됩니다.\n\n해당 의류의 추가 세탁비용은 부분 환불 처리 도와드리겠으며\n환불은 카드사 영업일 기준 3~5일 소요되는 점 안내 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801997", "date": "2026-05-12", "cat": "기타", "title": "캐리어 세탁 가능 여부", "question": "안녕하세요._x000D_\n여행용 캐리어 내부세탁도 가능한지 문의드립니다._x000D_\n안에서 쥬스가 터졌어요.", "answer": "박효빈 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n이불 맡겨주시고자 하였으나\n건조기 사용 불가로 확인되어\n사전에 걱정이 많으셨을 것 같습니다.\n\n런드리고 내 이불 세탁은 케어라벨 확인 후 진행되고 있는 부분으로\n케어라벨 내 건조기 사용 불가로 확인되는 경우\n**자연 건조 환경으로 구성된 별도 장소에서 자연 건조로 진행**되고 있습니다.\n\n**높은 온도와 바람으로 자연건조 방식으로 최대한 케어가 진행되고 있으며,**\n**세탁물에 따라서 기본 배송 일보다 1~2일 가량의 시일이 더 소요될 수 있는점**\n**참고하시어 서비스 맡겨주시면 감사하겠습니다.**\n\n서비스 이용에 감사드리며,\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801994", "date": "2026-05-12", "cat": "배송시간/배송지연 문의", "title": "모자 안오는거 해결좀요", "question": "안녕하세요_x000D_\n하다하다 화가나서 연락드립니다_x000D_\n패딩에 붙은 부속품 모자가 안왔는데 뭐 연라도 없고_x000D_\n안심케어로 다시 배송신청을 하라는 얘기인가요? 다시 보낼게 없는데? 제대로된 절차에 대해 설명 전화 부탁드려요_x000D_\n온라인으론 이해가 안되네요_x000D_\n안심케어 신청까진 했는데 다시 보낼 옷이 없잖아요 _x000D_\n그냥 수거 신청하면 되는건가요? _x000D_\n전화로 안내 부탁드려요 01073086080", "answer": "노정현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 배송 지연으로 인해 불편과 불쾌감을 드린 점 진심으로 사과드립니다.\n\n해당 건은 성수기 물량 증가로 인해 일시적으로 처리 및 배송 일정이 지연된 상황으로 확인되었습니다.\n다만, 고객님께서 사전에 기 estion": "답변을 주겠다더니 문의 내역을 닫아버리면 어떡합니까?_x000D_\n언제까지 처리해주겠다고 기안을 주세요.", "answer": "문보영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 예정하신 일정이 있으셨을 텐데\n약속드린 날짜에 맞춰 세탁물을 전달드리지 못해\n많이 불편하셨을 것 같아 진심으로 사과드립니다.\n\n최근 급격한 날씨 변화로 주문량이 크게 증가하면서\n일부 지역에서 배송이 지연된 점 너른 양해 부탁드립니다.\n\n기다려주신 고객님의 시간을 무겁게 받아들이고 있으며,\n현재 전 공정의 작업 속도를 높이고\n세탁물 하나하나 꼼꼼히 검수하여\n보다 안전하고 신속하게 전달드릴 수 있도록 최선을 다하고 있습니다.\n\n고객님께서 느끼신 불편에 비하면 너무나 부족한 수준이지만,\n조금이나마 마음을 전하고자 소정의 포인트를 지급해드렸습니다.\n\n앞으로는 이러한 불편이 반복되지 않도록\n보다 안정적인 운영과 안내를 위해 더욱 노력하겠습니다.\n\n다시 한번 고객님께 불편을 드린 점 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801969", "date": "2026-05-12", "cat": "월정액 가입/변경/해지 문의", "title": "해지 신청 왜 안되나요?", "question": "해지신청 했는데 아직도 확인중이시네요. 해지 승인 및 환불 진행 해주시길 바랍니다.", "answer": "이민영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요청해주신 **[런드리고X 베이직]** 요금제의\n즉시 해지 처리가 완료되었습니다.\n\n현재 **[대표 결제수단 KB국민카드 44,000원]** 환불 처리되었으며,\n환불 금액은 카드사 영업일 기준으로\n최대 5일 정도 소요될 수 있는 점 양해 부탁드립니다.\n\n\n>  결제일로부터 3일 이내일 경우,\n> 앱을 통해 직접 즉시 해지가 가능하오니\n> 아래 경로를 참고 부탁드립니다.\n> [앱] > [MY] > [상단 요금제명 클릭] > [구독 관리] > [하단 ‘해지하기’] > [지금 즉시 해지하기] 버튼 선택\n\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801966", "date": "2026-05-12", "cat": "기타", "title": "니트케어", "question": "얼마전까지 니트를 맡기면 개어져서 왔는데 요즘엔 안그러더라구요? 이제 그 서비스는 안하는 건가요?", "answer": "썬 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[단추파손]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801965", "date": "2026-05-12", "cat": "기타", "title": "문의건 답변", "question": "세탁물 다시 맡겨달라는데_x000D_\n자주 약물이 묻어도 안좋은거거든요…;_x000D_\n찝찝하고 그냥 더이상 믿음이 없어서 거래가 하기싫습니다_x000D_\n런드리고 6개월 구독시 1회 주신다고해서 한건데 1회는 무료로 유지한채 나머지는 환불해주시면 좋겠어요_x000D_\n지금 이런 생각든게 한두번이 아니라서 이제 더이상 맡기기가 싫어요 _x000D_\n솔직히 깨끗해진지 모르겟는적이 먾아요", "answer": "이슬기 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n보관서비스의 경우, **3벌 보관 시 기본 6개월**이며,\n**추후 3벌을 추가로 보관 시**\n**해당 결제일로부터 6개월의 기간이 추가**되는 점\n참고 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801963", "date": "2026-05-12", "cat": "기타", "title": "월정액 사용", "question": "월정액사용이 되지않아 수거신청을하지 못 했디구요. 정말 이월도 안되고 한달 지나면 시용할수없게 되는게 사용하면서더늘 불편하고 불쾌했습니다. 왜 이렇게 고객을 호갱으로 만드시는 장침을 고수하시는지 참 불편하네요. ", "answer": "박현욱 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[찢김]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801961", "date": "2026-05-12", "cat": "런드렛 이용 문의", "title": "런드렛 신청", "question": "다시 서비스를 시작하려고하는데, 지난번 런드렛을 반납하여 보유하고있지 않습니다. 런드렛을 새로받기위해서는 어떻게 해야하나요?", "answer": "정도원 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n현재 런드렛을 보유하지 않으신 경우,\n수거 신청 시에 하단 이미지와 같이 런드렛 신청 부탁드립니다 .\n\n이번 첫 수거신청시 문 밖에 세탁물 내놓으실때,\n폐기 가능한 쇼핑백 혹은 비닐에 담아,\n**겉 면에 [런드리고 + 서비스명]**을 써주시면, 메모 확인 후기사님께서 세탁물을 수거하실 예정입니다.\n\n또한 집중 케어 서비스의 경우,\n개별클리닝 서비스를 선택하여 주신 후에\n집중 케어 추가 서비스를 신청하여 주셔야\n작업 진행 도와드리고 있습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801959", "date": "2026-05-12", "cat": "변형/변색/손상", "title": "머플러들 다 옷걸이 자국이 심하게 있습니다.", "question": "머플러들에 모두 자국이 심하게 나 있어요_x000D_\n이건 머 다시 맡겨야 할 판이네요_x000D_\n", "answer": "박우영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n맡겨주신 세탁물에서 불편을 겪으셔서\n많이 당황하셨을 것 같아 죄송한 마음입니다.\n\n확인 결과, 문의주신 세탁물은\n생활빨래로 접수된 건으로 확인됩니다.\n\n다만 죄송하게도 문제 접수주신 내용에 대해서는\n생활빨래 서비스 특성상 별도의 도움을 드리기\n어려운 점 너그럽게 양해 부탁드립니다.\n\n**📌 생활빨래 서비스 안내  **\n\n**-** **생활빨래는 검수 과정 없이  **\n** 보내주신 상태 그대로 세탁/건조가 진행****됩니다. **\n\n**- 이 때문에** **입고 시 상태와 배송 후 상태를  **\n** 정확히 비교하기 어려워  **\n** 재세탁이나 추가 케어가 제공되지 않습니다.  **\n\n- 기계 세탁/건조 방식으로 운영되므로\n 케어라벨 상 기계 세탁·건조가 불가한 의류는\n 번거로우시더라도 개별클리닝으로 맡겨주셔야 합니다.\n\n앞으로는 더 만족스러운 서비스 경험을\n드릴 수 있도록 계속 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801958", "date": "2026-05-12", "cat": "기타", "title": "세탁 서비스 문의", "question": "1.품목: 폴로 더블 니트 풀 지퍼 후디(에비에이터 네이비)_x000D_\n_x000D_\n2.상태: 세탁과 햇빛 노출로 인해 전체적으로 색이 바래고 붉은 기가 올라온 상태입니다._x000D_\n_x000D_\n3.요청사항: _x000D_\n•전체 염색을 통한 색상 복원이 가능한가요?_x000D_\n•가슴에 있는 폴로 자수 로고 색상이 염색되지 않게 마스킹(보호) 작업이 가능한지 궁금합니다._x000D_\n•지퍼나 후드 끈 마감재에 염색약이 묻지 않게 처리가 되나요?_x000D_\n_x000D_\n4.비용 및 기간: 대략적인 복원 비용과 작업 기간 수 과정 중 촬영된 이미지**임을 안내드립니다 😊\n\n의류는 케어라벨에 맞춰\n맞춤 세탁이 완료된 상태이며,\n현재는 **[배송중]** 상태로 확인되고 있습니다.🙏\n\n최종 케어 결과는 수령하신 실물을 통해\n확인해주시면 감사하겠습니다.\n이용에 혼선 드린 점 너그럽게 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801826", "date": "2026-05-12", "cat": "보상처리 과정 문의", "title": "보상", "question": "아니 세탁물 이슈 안심케러 들어가니 세탁비환불이랑 안심케어 밖에 없는데 뭘 선택하라는 거예요? 미듐사이즈가 스몰보다도 작아졌는데 못입으니까 당연히 새로 사게 195000원 주셔야죠 전화도 걸었는데 전화상담은 없다고 하고 이렇게 대응하시면 안되죠 자꾸 제 시간 낭비하지 마시고 전화주세요 피해받은 사람이 이렇게 힘들게 계속 문의글 남기는게 정상입니까? 런드리고 잘못해놓고 대처방식이 어이가 없네요 빨리 전화하세요", "answer": "김민지 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 소중한 시간을 내어 다시 보내주신 의류인데\n아직 수령하지 못하시어 많이 걱정되셨을 것 같습니다.\n\n안심케어로 접수해주신 세탁물은\n현재 처리 상황을 확인 중이며,\n지연된 부분에 대해서는 담당 부서로 별도 확인 요청을 전달드린 상태입니다.\n\n최근 물량 증가로 인해 케어 및\n검수 과정이 다소 지연되고 있는 것으로 보이며,\n고객님의 세탁물 역시 보다 정확한 확인과 처리를 위해 시간이 소요되고 있는 점 양해 부탁드립니다.\n\n관련 내용은 확인되는 신속히 안내드릴 수 있도록 하겠으며,\n최대한 빠르게 처리될 수 있도록 지속적으로 살펴보겠습니다.\n\n기다리시게 해드려 죄송합니다.\n끝까지 책임감 있게 확인 후 안내드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801825", "date": "2026-05-12", "cat": "기타", "title": "세탁물 바뀌었다고 문의한지 열흘이 다되어갑니다.", "question": "세탁물이 바뀌거나 분실된건 실수일수 있죠. 하지만 이렇게 처리현황을 전혀 알려주지않는건 다분히 의도적인거죠. 생활빨래면 필요해서 맡긴 거 아니겠어요? 지금 다 새로 사서 해결하고 있는데 이건 어떻게 보상하실건가요? 5월 5일에 전화해서 3일에서 5일 정도 확인에 소요된다고 하셨으면 그 사이에 확인을 못했으면 못했다고라고 연락을 주셔야 할 거 아니에요. 유선상담도 안받으면서 지금 저랑 뭐하시자는 거에요?", "answer": "이서윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 우선 런드리고 이용에 많은 불편을 겪으시게 하여\n마음이 무겁고 죄송하다는 말씀 드립니다.\n\n이전 이슈를 겪으신 지 얼마 되지 않아 비슷한 문제로\n또 다시 문의를 주시게 하여 죄송합니다.\n\n**CFAB00110400 의류에 대해, 작업자가 집중케어를 진행하려 하였으나**\n**약품을 활용한 얼룩제거 진행 시 의류의 손상 및 변형이 우려**되었으며,\n수거신청 시 해당 의류에 대해 **손상우려 케어진행 여부에 대해 동의하지 않으셨으므로**\n고객님의 소중한 의류를 손상시키지 않게 하기 위해\n**부득이하게 해당 얼룩 부위의 집중케어가 반려**된 점 너른 양해 부탁드립니다.\n\n또한, **CFAB00106868 바지에 대해 기존 얼룩 여부 확인을 위하여**\n**입고 검수 당시 사진을 확인**하였으며 말씀 주신 부위와 **동일한 부위에**\n**얼룩이 발생**되어 있는 것을 확인하였습니다.\n\n따라서 해당 얼룩은 세탁만으로는 지워지지 않는 고착화 된 얼룩으로 확인되며\n런드리고의 세탁 방식은 강한 마찰이나 비비는 방식의 세탁을 지양하므로\n완벽히 제거가 되지 않은 점 양해 부탁드립니다.\n\n다시 한번 만족스러운 서비스를 제공드리지 못해 죄송합니다.\n항상 보다 더 나은 품질과 서비스 제공드리기 위해 꾸준히 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801822", "date": "2026-05-12", "cat": "변형/변색/손상", "title": "보상", "question": "보시다시피 2025년에 레드컬러 스몰 사고 작아서 2026년에 카키색은 미듐 샀는데 카키색 니트 세탁 맡기고 완전히 줄어서 입을수가 없어요 같은 디자인 스몰사이즈보다 더 작아졌네요 보상해주세요 못입게 되어서 새로 구입해야 하니 이건 가져가시던가 하시고 새로 구입하게 195000원 보상해주세요", "answer": "전채원 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[수축]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.🙏🏻\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801819", "date": "2026-05-12", "cat": "월정액 가입/변경/해지 문의", "title": "구독문의", "question": "드라이 전용 베이직의 3개월구독하면  매달 개별클리닝8장 배송1장 주는걸로 나와있는데  와이셔츠를 주로 하는이용하는 경우에는 구독 안하고 직접결제하는게 훨씬 저렴해 보이는데 맞나요??", "answer": "이서윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n요청해주신 **[(구) 런드리고X 시그니처]** 요금제의\n즉시 해지 처리가 완료되었습니다.\n\n\n> 또한, 현재 보유 중이신 런드렛은\n> 자동 반납 처리가 필요하여\n> **금일 저****녁, 문 앞에 배출해 주시면 회수 진행될 예**정입니다.\n>\n>\n>\n> 번거로우시겠지만, 런드렛 이용 시 사용되었던\n> 구성품(안심고리, 세탁망 등)도 함께 동봉하여 문 앞 배출 부탁드립니다.\n\n\n\n> n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801804", "date": "2026-05-12", "cat": "런드렛 이용 문의", "title": "런드렛으로 받고싶어요", "question": "세탁물받는방법이 없어서 런드렛으로 신청을 못했는데 런드렛으로 받을수 있을까요?", "answer": "김소영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801802", "date": "2026-05-12", "cat": "변형/변색/손상", "title": "세탁비 환불이 아니라 운동화가 손상되었으니 보상해주세여!!!!!!!", "question": "세탁 후 운동화 불이 안들어옵니다_x000D_\n안심케어 접수로 세탁비 환불해 주셨는데 장난합니까?? _x000D_\n세탁비 환뷸이 아니라 새 운동화이니 운동화 비용 보상해주시기 바랍니다!! _x000D_\n전화주세요!!!!!!!", "answer": "김지호 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의주신 내용과 관련하여 이 전 문의글을 통해 답변이 완료된 것으로 확인되어\n본 문의글은 종료 진행하도록 하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801801", "date": "2026-05-12", "cat": "런드렛 이용 문의", "title": "속커튼 세탁 가능 여부 ", "question": "커튼 중 린넨소재의 속커튼(흰색), 일반 커튼 세탁 가능한지 문의_x000D_\n드립니다.  두개다 장식은 없습니다. 커튼 사진 첨부 했습니다. ", "answer": "이영하 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n**커튼핀을 제거하지 않은 상태로 세탁 진행은 불가**하며,\n입고 시 제거한 후 세탁이 진행되는 점 참고 부탁드립니다.\n따라서 이동 중 손상, 분실 등을 방지하기 위해 미리 제거한 후\n보내 주시면 감사하겠습니다!\n\n또한, 곰팡이 오염은 **일반 세탁만으로는 제거가 어려우며**,\n**표백 처리가 필요한 유형의 오염**입니다.\n\n다만 **표백은 흰색 또는 미색 계열 원단에 한해 가능**하며,\n작업 과정에서 **원단 손상이나 탈색 위험**이 있어\n임의로 진행하기 어려운 점 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801793", "date": "2026-05-12", "cat": "기타", "title": "헌옷수거 신청했는데 안가져갔어요", "question": "헌옷수거 신청했는데 헌옷을 안가져갔어요 ", "answer": "김희영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n4월 5일 수거 건은 완료되었고, 아직 분류 작업이 시작되지 않아 세탁물과 헌옷에 대한 확인이 되지 않았지만\n여러밤 배송에 맞춰 분류가 시작될 예정이고, 이때 헌옷도 함께 담당 부서 측으로 전달하여 무게 계측 후 포인트 지급될 예정입니다.\n이점 참고 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801783", "date": "2026-05-12", "cat": "월정액 가입/변경/해지 문의", "title": "해지요청", "question": "새벽에 결제되었는데 해지요청합니다", "answer": "김동진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요청해주신 **[드라이온리 스탠다드]** 요금제의\n즉시 해지 처리가 완료되었습니다.\n\n현재 **[대표 결제수단 82,000원]** 환불 처리되었으며,\n환불 금액은 카드사 영업일 기준으로\n최대 5일 정도 소요될 수 있는 점 양해 부탁드립니다.\n\n\n> 💁‍♀️ 결제일로부터 3일 이내일 경우,\n> 앱을 통해 직접 즉시 해지가 가능하오니\n> 아래 경로를 참고 부탁드립니다.\n> 👉 [앱] > [MY] > [상단 요금제명 클릭] > [구독 관리] > [하단 ‘해지하기’] > [지금 즉시 해지하기] 버튼 선택\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801781", "date": "2026-05-12", "cat": "재세탁 접수 및 과정 문의", "title": "어제 문의한부분 결과", "question": "어제 세탁물의 오염 혹은 세탁미흡에대해 문의했는데 회신부탁드립니다. 카톡으로 회신이 와서 이용내역은ㄴ_x000D_\n누르니 결과는 안보이고 이전세탁에대한 이용내역만 보입너다.", "answer": "최정아 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 이용에 불편을 드린 점 진심으로 사과드립니다.\n\n전달해주신 내용 확인 결과,\n작년 연말 손상 발생 이후 브랜드 AS 동의를 받아 진행 예정이었으나\n실제 수선이 이루어지지 않은 상태로 출고된 것으로 확인되었습니다.\n당시에는 재접수를 통해 다시 접수해 주시도록 안내드렸던 이력도 확인되었습니다.\n\n이후 브랜드 AS 진행 과정에서 구매 이력 확인(구매 인증) 등\n구매자 본인을 통한 접수가 필요한 이슈가 발생하여\n현재는 고객님께서 직접 브랜드 매장을 방문해 수선을 진행해 주셔야 하는 상황입니다.\n\n번거로우시겠지만 가까운 매장 방문 후 수선을 진행해 주시고,\nAS 진행 영수증을 전달해 주시면 발생 비용은 현금성으로 보상 도와드릴 예정입니다.\n\n해당 방식으로 진행 가능하신지 확인 후 회신 부탁드립니다.\n\n충분한 도움을 드리지 못한 점 다시 한 번 진심으로 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801776", "date": "2026-05-12", "cat": "런드렛 오배송", "title": "배송안옴", "question": "바지가 하나가 안왓고 다른바지가 왔네요", "answer": "허재영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 불편드린 부분 죄송한 말씀 드립니다.\n\n확인 요청 주신 정장 상의 확인시 정상 출고된 부분 확인되어 안내 드립니다.\n\n \n\n수령받으신 런드렛 내부 재확인 요청 드리며, 동거인분들께도 확인 요청 드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변진행중"}, {"id": "801773", "date": "2026-05-12", "cat": "변형/변색/손상", "title": "세탁 후 얼룩 문의", "question": "세탁 전 검수 사진에는 잘 보이지 않던 얼룩이 세탁 후에는 사진상으로 확인될 정도로 넓은 부위에 얼룩이 생겼습니다_x000D_\n말씀하시기를 기존에 있던 얼룩이라고 하더라도 세탁 후에 아예 변색된 것으로 보일 정도라면 추가 케어를 해주셔야 하는거 아닌가요?", "answer": "김태균 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 안내 완료되어\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801769", "date": "2026-05-12", "cat": "보풀/이물질/먼지", "title": "이염", "question": "저번에 문의하고 이용내역에서 문제 접수하라고 해서 했는데 이후 조치가 어떻게 됐는지 확인이 안돼요. 시스템이 너무 불편하고 고객센터 번호도 없고 정말 불친절하네요. 빨리 세탁물 가져가세요. 전화로 답변 주세요", "answer": "박우영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 답답한 마음으로 문의 남겨주셨을 텐데\n먼저 확인이 늦어져 죄송합니다.\n\n현재 문의글에 구체적인 상황이 기재되어 있지 않아\n사전에 정확한 내용 파악이 어려운 상태입니다.\n이로 인해 충분한 안내를 드리지 못하고 있는 점 양해 부탁드립니다.\n\n번거로우시겠지만,\n어떤 부분에 대한 도움이 필요하신지 간단하게라도 남겨주시면\n내용 확인 후 상황에 맞게 신속히 안내드리겠습니다.\n\n빠른 해결을 도와드리지 못한 점 다시 한번 사과드리며,\n고객님의 양해를 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801768", "date": "2026-05-12", "cat": "기타", "title": "한밤배송인데", "question": "아직 안와서요! 01054596996 전화로 답변부탁드릴게요!", "answer": "이슬기 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요청해주신 **[런드리고X 라이트]** 요금제의\n즉시 해지 처리가 완료되었습니다.\n\n현재 **[대표 결제수단 28,600 원]** 환불 처리되었으며,\n환불 금액은 카드사 영업일 기준으로\n최대 5일 정도 소요될 수 있는 점 양해 부탁드립니다. 🙏\n\n추가로 안내해 드릴 사항이 있습니다. 문의하신 상품은\n이전 버전의 구독 서비스로, 현재는 운영이 종료된 단종 상품입니다.\n따라서 현재 이용 중인 구독을 해지하실 경우 동일한 조건으로의\n재가입이 어려운 점 너그러운 양해를 부탁드립니다.\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801763", "date": "2026-05-12", "cat": "오염 미 제거", "title": "오염", "question": "오염이 그대로와서 어이가없어서 물티슈로 지우니 지워지는데요 세탁해도 안지워지는건 뭔가요_x000D_\n황당하네요…", "answer": "김혜정 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n집중케어로 요청해주신 부위가\n충분히 처리되지 않아 많이 아쉬우셨을 것 같습니다.\n이용에 불편을 드려 진심으로 사과드립니다.\n\n해당 부위는 작업자가 실물 확인 과정에서\n추가 케어 시 **섬유 손상이나 형태 변형의 우려가 있어**,\n부득이하게 집중케어 진행이 어려운 것으로 판단되었습니다.\n\n이 점 너그럽게 양해 부탁드립니다.\n\n요청하신 부분에 충분히 도움드리지 못한 점\n다시 한 번 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801762", "date": "2026-05-12", "cat": "기타", "title": "바뀐 요금제", "question": "변경되는 구독요금제를 살펴보니 와이셔츠 10벌 개별드라이4번 수거2회로 되어있언데 아무리 보아도 정기로 계산해도 할인가격이 안 나와서 산정하신 근거를 알고 싶습니다. 구독할인적용 안하고 정가로 계산해도 와이셔츠 2900원 양복바지 5800원 수거배송 7800으로 계산해도 할인금액이 안 나옵니다. 이경우 그냥 구독을 해지하는게 나은지 여쭤볼께요.", "answer": "이승우 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n이용하고 계신 요금제 내\n와이셔츠 수량 조절을 위해 문의남겨주셨는데요!\n\n수량 조절은 요금제 해지 > 재가입을 통해서 가능하나\n현재 와이셔츠 구독 요금제 단종으로 인해\n해지시 재가입이 불가한 상황입니다.\n\n따라서, 별도의 수량조절 진행이 어려운 점\n20장 구독을 원치 않으실 경
