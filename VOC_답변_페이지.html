<!DOCTYPE html>
<html lang="ko">
<head>

<title>런드리고 VOC 답변 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f0f2f5;color:#222;height:100vh;display:flex;flex-direction:column}
header{background:#1a3a5c;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0}
header h1{font-size:18px;font-weight:700}
.badge{background:#e74c3c;color:#fff;border-radius:12px;padding:2px 10px;font-size:12px}
.main{display:flex;flex:1;overflow:hidden}

/* 왼쪽 목록 */
.sidebar{width:380px;flex-shrink:0;background:#fff;border-right:1px solid #dde;display:flex;flex-direction:column}
.sidebar-header{padding:12px 14px;border-bottom:1px solid #eee;background:#f8f9fa}
.search-row{display:flex;gap:8px;margin-bottom:8px}
#searchInput{flex:1;border:1px solid #ccc;border-radius:6px;padding:7px 10px;font-size:13px}
#searchInput:focus{outline:none;border-color:#1a3a5c}
select{border:1px solid #ccc;border-radius:6px;padding:6px 8px;font-size:12px;background:#fff;cursor:pointer}
#catFilter{width:100%}
.count-row{font-size:12px;color:#666;padding:2px 0}

.list-wrap{flex:1;overflow-y:auto}
.q-item{padding:10px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s}
.q-item:hover{background:#f5f8ff}
.q-item.active{background:#e8f0fe;border-left:3px solid #1a3a5c}
.q-item .cat-tag{display:inline-block;background:#eef2ff;color:#3451b2;border-radius:4px;padding:1px 7px;font-size:11px;margin-bottom:4px}
.q-item .q-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-item .q-preview{font-size:12px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.q-item .q-meta{font-size:11px;color:#999;margin-top:3px}

.detail{flex:1;background:#f8f9fa;overflow-y:auto;display:flex;flex-direction:column}
.detail-placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:15px}
.detail-content{padding:24px;display:none}
.detail-content.visible{display:block}
.detail-meta{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.detail-meta .id{color:#888;font-size:13px}
.detail-meta .cat{background:#1a3a5c;color:#fff;border-radius:5px;padding:3px 10px;font-size:12px}
.detail-meta .date{color:#888;font-size:12px}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card-label{font-size:11px;font-weight:700;text-transform:uppercase;color:#888;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card-label.q{color:#c0392b}
.card-label.a{color:#1a6b3c}
.card-label::before{content:'';display:inline-block;width:3px;height:14px;border-radius:2px;background:currentColor}
.card-body{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.nav-row{display:flex;gap:10px;margin-top:8px}
.nav-btn{border:1px solid #ccc;background:#fff;border-radius:6px;padding:7px 16px;font-size:13px;cursor:pointer;transition:background .15s}
.nav-btn:hover{background:#f0f0f0}

/* 페이지네이션 */
.pagination{display:flex;gap:6px;padding:12px 14px;justify-content:center;flex-wrap:wrap;border-top:1px solid #eee}
.page-btn{border:1px solid #ddd;background:#fff;border-radius:5px;padding:4px 10px;font-size:12px;cursor:pointer;min-width:32px}
.page-btn.active{background:#1a3a5c;color:#fff;border-color:#1a3a5c}
.page-btn:hover:not(.active){background:#f5f5f5}
</style>
</head>
<body>
<header>
  <h1>🧺 런드리고 VOC 답변 관리</h1>

<div class="main">

</div>

 카드사 영업일 기준으로 최대 5일 정도 소요될 수 있는 점 양해 부탁드립니다. 🙏\n\n\n> 또한, 현재 보유 중이신 런드렛은\n> 자동 반납 처리가 필요하여\n> **5월 1일(금) 저녁, 문 앞에 배출해 주시면 회수 진행될 예**정입니다.\n>\n>\n>\n> 번거로우시겠지만, 런드렛 이용 시 사용되었던\n> 구성품(안심고리, 세탁망 등)이 있는 경우 함께 동봉하여 문 앞 배출 부탁드립니다.\n\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803762", "date": "2026-05-15", "cat": "수거세탁물 소지품 문의", "title": "속 치마가 누락됐습니다", "question": "맡길 땐 있었던 속치마가 배송 누락되었습니다. 유니폼이라 당장 착용해야하는데 없습니다. 확인 후 발송 부탁드립니다.", "answer": "전세준 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 맡겨주신 세탁물 일부가 확인되지 않아 많이 당황스러우셨을 것 같습니다.\n\n다만 4월 5일 수거 신청건 입고 영상 확인 시\n내어주신 쇼핑백 2개 내부에 말씀주신 품목은 확인되지 않으며\n보내주신 6벌 모두 정상 등록 및 출고 진행된 것으로 확인됩니다.\n\n현재 공정 영상 확인으로는 말씀 주신 품목이 확인되지 않기에\n추가 도움 드리기 어려운 점 너른 양해 부탁 드리며\n자택 내부 확인 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803758", "date": "2026-05-15", "cat": "기타", "title": "미 배송", "question": "완료 안되엇는지요??_x000D_\n_x000D_\n왜 늦게 되는지 알려주어야 되지ㅡ않니요_x000D_\n_x000D_\n빨리 받을려고 신청햇는데.. 아주 짜증잊니다_x000D_\n_x000D_\n진짜 서비스 개판이네요", "answer": "아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 쿠폰 적용에 대해 관심을 가지고 문의 주셔서\n진심으로 감사드립니다.\n\n문의주신 [식목일엔겨울옷정리] 니트 1벌 천원 쿠폰은\n니트류 전체에 각각 적용되는 것이 아니라,\n니트 1벌에 대해서만 1,000원 혜택이 적용되는 점 안내해 드립니다.\n여러 벌을 맡기시더라도 그중 한 벌에 대해서만 할인이 적용됩니다.\n\n더불어, 또한, 해당 쿠폰을 사용하기 위해서는\n수거 신청 시 전체 세탁 비용의 합계가\n20,000원 이상이어야 정상적으로 적용이 가능합니다.\n\n이용 조건에 대해 미리 상세히 안내해 드리지 못해\n혼선을 드린 점 너그러운 양해를 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803753", "date": "2026-05-15", "cat": "배송관련 불편사항접수", "title": "배송", "question": "완료된 세탁물을 복도 바닥에 눕혀놓는게 최선인가요? 복도 먼지가 그득한 세탁물(물론 커버가 있긴 하지만) 을 집으로 들여놓는 기분이 어떨까요?", "answer": "이수현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n세탁물이 바닥에 놓인 상태로 배송되어\n불편을 드린 점 진심으로 사과드립니다.\n\n기본적으로 세탁물은 도어 후크를 활용해\n문에 걸어 전달드리고 있습니다.\n다만, 아래와 같은 경우에는 부득이하게\n바닥에 안전하게 놓아드릴 수밖에 없습니다.\n\n- 문 구조상 후크 설치가 어려운 경우\n- 후크에 걸었을 때 낙하 위험이 있는 경우\n\n📌 보다 위생적인 배송을 원하실 경우\n앱에서 배송 방식을 **‘런드렛’**으로 선택해 주시면\n세탁물을 외부에 노출하지 않고\n런드렛 안에 담아 안전하게 전달됩니다.\n\n이번 사례는 관련 부서와 공유하여\n더 세심한 배송이 될 수 있도록 개선하겠습니다.\n불편을 드린 점 다시 한번 사과드립니다. 🙇‍♀️\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803751", "date": "2026-05-15", "cat": "월정액 가입/변경/해지 문의", "title": "5/14 월정액 결제건 취소 요청", "question": "5/14에 결제된 월정액을 사용하지 않을 계획이라 결제취소 요청합니다", "answer": "강민경 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요청해주신 **[런드리고X 스탠다드]** 요금제의\n즉시 해지 처리가 완료되었습니다.\n\n현재 **[대표 결제수단인 삼성카드로 89,200원]** 전액 환불 처리되었으며,\n환불 금액은 카드사 영업일 기준으로 최대 5일 정도 소요될 수 있는 점 양해 부탁드립니다. 🙏\n\n더 궁금한 점은 언제든 말씀 주세요.\n감사합니다.\n\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803746", "date": "2026-05-15", "cat": "기타", "title": "안심케어관련", "question": "현재 기존 본가주소에서 전주로 가져온 상황이라 전주쪽 주소알려드릴테니 수거요청드립니다.", "answer": "백소임 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 감사드립니다.\n\n확인 요청 주신 세탁물 확인시 현재 미수거 처리된 부분\n확인 됩니다.\n\n\n\n[출입불가] 공동현관 비밀번호 불일치/미기재\n\n해당 부분 재확인 요청드리며, 런드리고에서는 자동 세탁 시스템으로\n수거지와 배송지가 다를 경우에는 런드리고 사용이 불가합니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803742", "date": "2026-05-15", "cat": "기타", "title": "안심케어 재요청", "question": "5/12일 수거하여 14일 밤 도착한 재 안심케어(재 다림질) 처리건 중 와이셔츠들은 이번에 정상적으로 배송되었으나 점프수트는 옷걸이에서 흘러내려 런드렛 바닥에 떨어진채 배송되어 또다시 구김이 심한 상태로 배송되었음_x000D_\n도대체 몇번째인가요?_x000D_\n블라우스나처럼 부들부들한 소재면 논슬립처리된 옷걸이에 배송을 하셔야지 그냥 걸기만하면 배송중 흘러내리던말던 그만인가요? 너무 무성의하네요(과거에는 의류에 따라 논슬립옷걸이에 배송되어 흘러내린적이 없었음)_x000D_\n지난번 재 안심케어(재 다림질) 요청 의류들 중 상품확인과정에서 누락된 건들과 함께 다시 재 안심케어(재 다림질) 요청합니다_x000D_\n수거배송은 어떻게 되는지 알려주세요_x000D_\n개별클리닝 의류는 종이백에 따로 넣어서 드리면 같이 수거가능한가요?", "answer": "곽인경 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 우선 옷걸이 탈락으로 인해 불편을 드려 죄송합니다.\n일정으로 인해 빠른 착복을 하셔야 하는데 재세탁 처리로 도움을 드리지 못해\n무거운 마음입니다.\n\n안내드린 세탁물 이슈 접수를 통해\n해당 의류들의 세탁 비용을 포인트로 환불 받으실수 있는\n선택지도 제공하고 있습니다.\n\n \n\n번거로우시겠지만 안내드린 안심케어 통로를 통해\n세탁비용 환불 처리 요청해 주시면 감사하겠습니다.\n\n번거로운 절차로 불편을 드려 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803741", "date": "2026-05-15", "cat": "세탁동의 및 미세탁 문의", "title": "이거 니트재질인데", "question": "이거 니트티인데 일반티셔츠라고요???", "answer": "김해상 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 만족스러운 서비스로 안내드리지 못한 점에 대해 많이 속상하셨을 것으로 생각되며, 진심으로 사과드립니다.\n\n문의주신 제품은 스웨이드 원단 특성상 오염이 확인된 상태에서 세탁 진행 시 추가 손상 발생 우려가 높아, 부득이하게 세탁 반려로 판단된 것으로 확인됩니다.\n\n런드리고에서는 입고 검수 과정에서 세탁 시 손상 가능성이 크다고 판단되는 경우, 고객님의 의류 보호를 위해 세탁을 진행하지 않고 반려 처리하고 있습니다.\n\n특히 스웨이드 원단은 세탁 과정에서 변형, 탈색 등 손상 위험이 높은 소재이며, 오염이 심한 경우 다른 세탁물에 영향을 줄 수 있어 공정 진행이 어려운 점 양해 부탁드립니다.\n\n또한 서비스 특성상, 고객님의 의류에 대해 손상 발생 시 책임 보상 또는 원상복구를 원칙으로 하고 있어, 고객님 동의 여부와 관계없이 손상 위험이 큰 의류는 세탁 진행이 어려운 점 함께 안내드립니다.\n\n고객님의 기대에 부응하지 못한 점에 대해 저희도 안타깝게 생각하며, 너른 양해 부탁드립니다.\n\n보다 나은 서비스 제공을 위해 지속적으로 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803738", "date": "2026-05-15", "cat": "세탁 품질 문의", "title": "세탁 품질 문의로", "question": "전화통화 하고 싶습니다 셔츠 바지 가디건등 다림질도 엉망이고 점퍼는 뒤에 못보던 줄이 가있는데 올튕김인지 확인하고 싶네요_x000D_\n난감합니다", "answer": "박진아 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 먼저 믿고 맡겨주셨는데,\n**추가 손상이 발생되어** 정말 죄송합니다.\n\n말씀해주신 부위는 다시 한번 꼼꼼히 확인하여\n수선 진행 도와드리도록 하겠습니다.\n\n재처리 과정에서도 의류의 상태를 세밀하게 점검하겠습니다.\n번거로우시겠지만 정확한 접수 및 이력 확인을 위해\n아래 경로를 통해 안심케어 접수를 부탁드립니다.\n\n더불어, 말씀해주신 허리라인과 암홀라인은\n각각 수선으로 요청해주셔야 하는 점 참고 부탁드리겠습니다 !\n\n* * *\n**▣ 안심케어 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤,\n세탁물을 선택하고** ****세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n\n**▣ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후 **승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n**💡 안심케어 완료 후에는 즉시 출고될 예정이며,**\n**가장 빠른 일정으로 받아보실 수 있도록 진행하겠습니다.**\n\n**▣ 유의사항**\n**※ 확인 및 처리에는 일정 시간이 소요될 수 있습니다.**\n**※ 다른 세탁물을 함께 보내주실 경우 전체 세탁 및 배송이 지연될 수 있습니다.**\n\n※ 세탁물 수령일로부터 7일 이내 접수 및 승인 후,\n30일 내 발송해주셔야 후속 처리가 가능합니다.\n※ 착용 흔적이 있거나 문의 의류와 다른 경우 처리가 어려울 수 있습니다.\n※ 일반 세탁물과 안심케어 요청 세탁물은 반드시 구분하여 동봉 부탁드립니다.\n\n* * *\n앞으로도 고객님의 소중한 의견을\n바탕으로 더욱 세심하게 케어 하며\n신뢰받는 서비스를 제공하기 위해 최선을 다하겠습니다. 🙇‍♀️\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803734", "date": "2026-05-15", "cat": "기타", "title": "추갸 이염 및 다림질 미흡", "question": "프리미엄 세탁물에 까만 기름때 같은게 생걌구요. _x000D_\n흰 블라우스인데 재세탁해주세요. _x000D_\n다림질도 두깝고 빳빳한 [문의 하기]** 버튼 클릭\n5. **[안심케어 요청]** 선택\n6. 사진을 첨부하고, 문제 내용을 작성해주세요\n7. **신청건의 \"확정 알림톡\" 발생 이후, **\n수거 신청 시 상단에 표시되는 안심케어 서비스 선택\n8. 안심케어 품목을 선택하여 수거신청을 완료해 주세요.\n (참고하실 수 있는 이미지를 함께 첨부해 드립니다.)\n\n\n### **✅ 꼭 확인해 주세요!**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n1. 세탁물 수령일 기준 30일 이내에 접수해 주셔야 합니다.\n2. 승인 후 30일 안에 세탁물을 보내주셔야 합니다.\n3. 운송비는 요청건 확정 시 자동으로 포인트로 지급됩니다.\n4. 일반 세탁물과 함께 섞인채로 보내주시면 확인이 어려워요.\n따로 포장해 주시길 부탁드립니다.\n5. 접수해주신 세탁물은 **원상 복원을 최우선**으로 확인하고 있어요.\n담당자가 실물을 꼼꼼히 확인한 후,\n**재세탁·복원 등의 재처리가 가능한 경우에는 **\n**직접 작업이 진행**되며, 조치가 어려운 손상일 경우에는 **별도 안내**를 드립니다.\n\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803721", "date": "2026-05-15", "cat": "기타", "title": "잘못 수선된 티셔츠 수거 및 복구 문의", "question": "답변 내용이 언제 수거하러 오고 어떻게 재 수선 해주실건지 아무런 설명 없이 답변 완료하면 끝인가요?_x000D_\n이런 대응이면 티셔츠값으로 환불해주세요", "answer": "김주은 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 요금제 해지 관련하여 문의주셨군요.\n\n다만 현재 이용 중이신 요금제는 **이전 버전 요금제**로,\n해지하실 경우 **동일한 조건으로 재가입이 어려운 점** 안내드립니다.\n\n이 부분 참고 부탁드리며,\n번거로우시겠지만 해지를 원하실 경우\n새로운 문의글을 통해 요청해주시면\n확인 즉시 신속히 처리 도와드리겠습니다.\n\n현재 바로 도움드리지 못한 점 죄송합니다. 🙏🏻\n\n**✅ 환불 가능 조건**\n① 결제일 포함 21일 이내\n② 기본 제공 서비스 품목을 전혀 사용하지 않은 경우\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803719", "date": "2026-05-15", "cat": "세탁동의 및 미세탁 문의", "title": "바지수선 문의드립니다", "question": "바지수선을 따로 신청하지 않았능데 ㅇ영수증에 첨부되어있어서요. 어떤수선일까요?", "answer": "정민수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 만족스러운 서비스가 진행되지 않은 점 많이 속상하셨겠습니다.\n\n고객님께서 문의하신 제품은 세탁 후 이염 손상이 발생될 것을 우려해 **세탁이 반려**된 것으로 확인됩니다.\n\n**입고 검수시, 세탁이 어렵다 판단 되는 경우는 세탁 미진행**으로 진행되고 있습니다.\n\n또한 런드리고 특성상, 고객님의 소중한 의류에 대해 책임지고 손상을 보상 또는 원상복구를 진행하는 원칙이 있어 고객님께서 동의를 하시더라도 세탁 진행은 어려운 점 안내드립니다.\n\n손상을 우려한 케어가 고객님 입장에서는 흡족하지 못할 수 있는 점 저희도 염려하고 있습니다.\n원하시는 결과 내용으로 전달 해 드리지 못하는 점 너른 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803717", "date": "2026-05-15", "cat": "런드렛 이용 문의", "title": "수거물 ", "question": "안녕하세요 오늘 처음 깔았고 수거 신청은 해놨는데 제가 수거 희망하는 신발, 이불, 베개 커버를 종이 가방 같은데 한 곳에다 담아두면 되는 건가요?", "answer": "변예림 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 믿고 맡겨주신 의류의\n구김이 확인되어 많이 속상하셨을 것 같습니다.\n서비스 이용에 불편을 드려 정말 죄송합니다.\n\n다림질은 의류가 어느 정도 젖은 상태에서 진행되어야 하나,\n건조가 과하게 진행된 상태에서 다림질 되어 발생된 문제로 예상됩니다.\n\n문의주신 내용은 담당 부서에 전달하여\n앞으로의 서비스가 개선될 수 있도록 하겠습니다.\n또한 아직 착복 전이시라면 재 다림질로 도움드리고 싶으나,\n다림질은 어느 정도 의류가 젖어야 진행이 가능하기에 세탁도 함께 됩니다.\n\n다만 단 기간 내 세탁 진행 시 손상 우려가 있고,\n다시 보내주셔야 하는 번거로움이 있기에\n죄송한 마음을 담아 해당 의류 세탁으로 차감된\n세탁권 2장을 다시 지급해드렸습니다.\n\n세탁권 지급으로 고객님의 불편하신 마음을 대신할 순 없지만\n더 잘하겠다는 의미로 받아주시면 감사하겠습니다. 🙏\n이번 만족스러운 품질로 제공해 드리지 못한 점 다시 한번 죄송하다는 말씀 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803716", "date": "2026-05-15", "cat": "기타", "title": "기존회원입니다 수거다음으로 넘어가지않습니다", "question": "한참많에사용하려니 수거부분에서 사이트가넘어가지않습니다_x000D_\n전화부탁드립니다", "answer": "고객님, 답답한 마음으로 문의 남겨주셨을 텐데\n먼저 확인이 늦어져 죄송합니다.\n\n현재 문의글에 구체적인 상황이 기재되어 있지 않아\n사전에 정확한 내용 파악이 어려운 상태입니다.\n이로 인해 충분한 안내를 드리지 못하고 있는 점 양해 부탁드립니다.\n\n번거로우시겠지만,\n어떤 부분에 대한 도움이 필요하신지 간단하게라도 남겨주시면\n내용 확인 후 상황에 맞게 신속히 안내드리겠습니다.\n\n빠른 해결을 도와드리지 못한 점 다시 한번 사과드리며,\n고객님의 양해를 부탁드립니다.", "status": "접수완료"}, {"id": "803710", "date": "2026-05-15", "cat": "기타", "title": "와이셔츠 단추 세탁후 떨어져서 왔는 문제", "question": "답신에 사진을 찍어 보내라 했는데 세탁후 입을려하니 소매단추가 떨어져 있어서 그날 입지 못하고 다추를 새로 달아 입었습니다 그래서 드릴 사진이 없네요ᆢ단지 세탁후 확인을 하는지 궁금하였습니다", "answer": "이현진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[단추 탈락]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.🙏🏻\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803707", "date": "2026-05-15", "cat": "기타", "title": "책임 있는 태도 자주 이용하겠습니다", "question": "혹시 소비자에게 책임을 전가하면 어떻게 할까 걱정했는데..._x000D_\n책임있는 태도에 믿고 맡겨도 될것 같네요.._x000D_\n친절한 상담원분께 감사인사 전합니다_x000D_\n", "answer": "아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 쿠폰 적용에 대해 관심을 가지고 문의 주셔서\n진심으로 감사드립니다.\n\n문의주신 [식목일엔겨울옷정리] 니트 1벌 천원 쿠폰은\n니트류 전체에 각각 적용되는 것이 아니라,\n니트 1벌에 대해서만 1,000원 혜택이 적용되는 점 안내해 드립니다.\n여러 벌을 맡기시더라도 그중 한 벌에 대해서만 할인이 적용됩니다.\n\n더불어, 또한, 해당 쿠폰을 사용하기 위해서는\n수거 신청 시 전체 세탁 비용의 합계가\n20,000원 이상이어야 정상적으로 적용이 가능합니다.\n\n이용 조건에 대해 미리 상세히 안내해 드리지 못해\n혼선을 드린 점 너그러운 양해를 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803702", "date": "2026-05-15", "cat": "기타", "title": "런드리고 수거 후, 제 택배가 분실됐어요.", "question": "런드리고 수거 시 받은 사진에 보면 옷 봉투 위에 쿠팡 배달온게 있는데, 오늘 아침에 나가면서 보니까 사라져있어요._x000D_\n쿠팡에서 남긴 사진도 같이 첨부합니다._x000D_\n_x000D_\n수거 신청일은 15일입니다.", "answer": "윤가영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n현재 고객님의 성함과 연락처로 2개의 계정이 있는 것으로 확인됩니다.\n사진으로 첨부해주신 알림톡은 아래 아이디 계정에서 발송된 내용입니다.\n\n\n-\n\n아이디: dbs0622@hanmail.net\n\n\n\n해당 계정이 현재 와이셔츠&드라이47 요금제에 가입중입니다만,\n더 이상 이용하고 계시지 않는다면 해지를 도와드리겠습니다.\n필요 시 다시 한 번 문의 남겨주세요.\n\n감사합니다.\n\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803700", "date": "2026-05-15", "cat": "결제/과금 문의", "title": "과금", "question": "1. 이불 무료쿠폰 썼는데 과금_x000D_\n2. 개별클리닝 1개 남았는데 안쓰고 신발 추가 과금", "answer": "고객님, 현재 성수기 물량 증가로 문의가 급격히 늘어난 상황입니다.\n문의는 순차적으로 확인하여 최대한 빠르게 안내드리고 있습니다.\n\n응대가 다소 지연된 점 진심으로 사과드리며,\n누락 없이 확인 후 신속하게 답변드릴 수 있도록 최선을 다하겠습니다.", "status": "접수완료"}, {"id": "803688", "date": "2026-05-15", "cat": "프리미엄 서비스 문의", "title": "프리미엄으로 변경 부탁드려요", "question": "개별세탁으로 들어갔는데 프리미엄으로 변경 부탁드려요:)", "answer": "안지수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 만족스러운 서비스가 진행되지 않은 점 많이 속상하셨겠습니다.\n\n고객님께서 문의하신 제품은 프리미엄 품목으로 분류 불가인 부분으로\n세탁 후 추가 손상이 발생될 것을 우려해 **세탁이 반려**된 것으로 확인됩니다.\n\n또한 런드리고 특성상, 고객님의 소중한 의류에 대해 책임지고 손상을 보상 또는 원상복구를 진행하는 원칙이 있어 고객님께서 동의를 하시더라도 세탁 진행은 어려운 점 안내드립니다.\n\n손상을 우려한 케어가 고객님 입장에서는 흡족하지 못할 수 있는 점 저희도 염려하고 있습니다.\n원하시는 결과 내용으로 전달 해 드리지 못하는 점 너른 양해 부탁드립니다.\n\n보다 나은 서비스 제공을 위해 노력하는 런드리고가 되겠습니다.\n감사합니다.\n\n런드리고 드림", "status": "접수완료"}, {"id": "803686", "date": "2026-05-15", "cat": "기타", "title": "런드렛 비번", "question": "비번 확인이 안됩니다. 배송톡도 못받았고 앱 안에서도 확인이 안됩니다. 출근해야하는데 빨리 알수있을까요?", "answer": "김영민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님의 2026-04-11 수거신청 건은\n현재 입고 검수 완료되어 세탁이 진행중인 것으로 확인 됩니다.\n\n이용내역에서 현재 등록된 의류가 확인되지 않으실 경우,\n번거로우시겠지만 런드리고 앱 업데이트 또는\n앱 삭제 및 재설치를 요청드립니다.\n\n만약 위의 방법으로도 해결되지 않으실 경우\n새로운 문의를 통해 다시 한 번 말씀 주시면\n담당 부서 전달하여 확인 도와드리도록 하겠습니다.\n\n이용에 불편을 드려 죄송하며\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803682", "date": "2026-05-15", "cat": "런드렛 반납 문의", "title": "구독 끝나도 런드렛 보관해도 되나요?", "question": "런드렛을 구독 종료하고 보관하고 있다 다음 세탁물 맡길 때 사용해도 되나요? ", "answer": "정여진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요금제 해지로 인해 자동 런드렛 반납\n알림톡 발송으로 많이 당황스러우셨을 것 같습니다.\n\n요금제 해지 시 시스템 상 자동으로 런드렛 반납이 진행되어\n반납 관련 알림톡이 발송 되고 있습니다.\n다만 이 전 반납이 완료된 고객님께는\n알림톡이 동일하게 발송되오나 반납 취소 처리가 진행되기에\n방문 진행 하지 않는 점 안내 드립니다.\n\n알림톡으로 인해 혼선을 드린 점 진심으로 죄송하다는 말씀 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803680", "date": "2026-05-15", "cat": "결제/과금 문의", "title": "과금문의", "question": "지난번에 세탁은 왜 차감이 안되었을까요? 맡길옷이없는데 중단가능핳까요. 한개도 안썼는데요", "answer": "황나현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의하신 **[런드리&드라이 스탠다드]** 요금제의 품목 차감 기준 및\n지난 4월 18일 이용 내역에 대해 안내드립니다.\n\n해당 구독 플랜은 다음과 같은 기준으로 품목권이 차감됩니다.\n\n- **개별 클리닝 의류:** 품목당 **1개** 차감 (단, 패딩류는 **2개** 차감)\n- **생활 빨래(4kg 기준):** **1개** 차감\n\n지난 4월 18일에 맡겨주신 세탁물은 위 기본 품목권 차감 기준에\n해당하지 않는 품목으  "date": "2026-05-15", "cat": "기타", "title": "수거신청을 놓쳐 문의드립니다. ", "question": "안녕하세요. 월정액 한 달 가입하고 _x000D_\n날짜가 어제까지였는데 쿠폰이 남아서 수거 신청하려고 빨래는 런드렛에 넣어 놓고 신청 누르는 걸 깜빡해서 없어졌습니다ㅠㅠ 이월이 안되는 부분은 인지하고 있었지만 혹시 남은 이용권 이용이 가능할지 문의드립니다ㅠㅠ 가능하다면 오늘 수거신청 희망합니다. 감사합니다. ", "answer": "윤현화 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n최근 고객 문의가 급증하여, 답변이 늦어진 점 정말 죄송합니다.\n\n이불 압축포장 추가 문의주셨는데, 현재는 세탁물을 이미 수령하신 상태로 확인됩니다.\n다만, 수거신청 이후에 상담사가 임의로 서비스를 추가 신청해드릴 수는 없는 관계로\n추후 서비스 이용 시 참고하실 수 있도록 **이불 압축포장 신청 방법**도 함께 안내 드립니다.\n👉 **수거신청 > 개별클리닝 > 이불·리빙 선택 > 추가케어 > [이불 압축포장]**\n\n빠르게 답변 드리지 못해 다시 한 번 죄송하다는 말씀을 드리며,\n더 궁금한 점은 언제든 말씀해주세요.\n\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803641", "date": "2026-05-15", "cat": "기타", "title": "옷이 계속 손상되어 옵니다", "question": "3개월 내역만 조회가 되어 사진과는 다른 옷 입니다_x000D_\n_x000D_\n_x000D_\n세탁을 맡기고 계절이 지나 이제 꺼내보는 양복들 어깨가 처음엔 한개만 그런줄 알았는데 다 어깨 안감이 다 터져서 왔습니다", "answer": "조수정 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의주신 수거 세탁물 사진 조회 관련하여 답변드립니다.\n\n확인 결과, 고객님의 세탁물은 현재 팩토리에 안전하게 도착하여 입고 작업 대기 중입니다.\n\n개별 세탁물의 입고 사진은 입고 작업이 완료된 이후 확인 가능하며,\n작업 완료 시 알림톡으로 안내드리고 있습니다.\n\n조금만 기다려주시면 순차적으로 확인 가능하오니 참고 부탁드립니다.\n추가로 궁금하신 점이 있으시면 언제든 말씀해주세요.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803637", "date": "2026-05-15", "cat": "기타", "title": "압축서비스", "question": "이불세탁 맡겼는데요_x000D_\n압축서비스까지 요청드리고 싶어서요_x000D_\n확인 부탁드립니다._x000D_\n", "answer": "김하연 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 우선 이불 압축 신청해주셨는데\n일부만 압축이 진행되어 많이 당황스러우셨을 것 같습니다.\n\n런드리고 추가 서비스의 경우 수거 신청 단계에서\n신청해주신 내역을 바탕으로 전산 매칭 및\n담당 부서 확인이 진행됩니다.\n\n수선, 보관, 집중케어 등 모든 서비스는\n서비스를 원하시는 세탁물 1개씩 개별로 촬영해 주셔야하며,\n압축 서비스의 경우 2개를 한개로 압축하여 진행하는 방식은\n진행되고 있지 않은 점 너른 양해 부탁드립니다.\n\n해당 압축 비용은 예외적으로 부분환불처리 도와드리겠으며\n환불은 카드사 영업일 기준 3~5일 소요되는 점 안내 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803634", "date": "2026-05-15", "cat": "세탁 품목 오류접수", "title": "환불요청", "question": "배송기사님이 잘 못 수거하신 항목이 결제까지 되었습니다._x000D_\n자세한 내용은 이전 게시물에 설명해두었습니다._x000D_\n바로 환불처리 요청합니다.", "answer": "이현서 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n우선 서비스 이용에 불편을 드린 점 진심으로 사과 드립니다.\n\n4/17 요청주신 품목 재분류는 승인해 드렸습니다.\n이용에 불편을 드린 점 다시 한번 사과 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803632", "date": "2026-05-15", "cat": "미수거/오수거 문의", "title": "수거하러 들어오지는 못하시는데 ", "question": "이렇게 불편하게는 사용이 어려울 것 같습니다;; 경비실호출로 하고 수거 눌렀는데도 그냥가세요;;;", "answer": "주영민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803631", "date": "2026-05-15", "cat": "기타", "title": "구독초과 항목 분류 문의", "question": "일반셔츠인데 왜 추가 항목으로 됐는지 문의드입니다", "answer": "배소은 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n우선 서비스 이용에 불편을 드린 점 진심으로 사과 드립니다.\n\n품목 오등록으로 인해 결제된 세탁비 과금은 앞전 문의글에\n안내 드린 바와 같이 환불 진행해 드렸습니다.\n\n또한 다림질 관련하여 요청주신 사항은 아래의 안심케어 경로로\n세탁물 이슈 접수해 주신다면 담당부서 확인 후 진행해 드리도록 하겠습니다.\n\n**[세탁물 이슈 접수]****를 통해 **\n**정확하고 신속한 재세탁 처리가 가능하며,**\n**재세탁 후에는 더욱 만족스러운 결과물을 **\n**받아보실 수 있을 것으로 생각됩니다.**\n**번거로우시겠지만 세탁물 이슈 접수를 진행해 주시기 바랍니다.**\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n앞으로도 고객님의 소중한 의견을\n바탕으로 더욱 세심하게 케어 하며\n신뢰받는 서비스를 제공하기 위해 최선을 다하겠습니다. 🙇‍♀️\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803628", "date": "2026-05-15", "cat": "월정액 가입/변경/해지 반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803591", "date": "2026-05-15", "cat": "보상처리 과정 문의", "title": "어디업체입니까?", "question": "런드리고자체업체는 아닐테고 계약맺은 세탁소겠죠? _x000D_\n아니 ..ㅎ 앞 뒤로 로고가 포인트인 자켓은 _x000D_\n로고에 파랗게 다 물들어놓고  절대 입고나가지 못합니다. _x000D_\n가디건 단추도 깨트리고 장난합니까? _x000D_\n_x000D_\n다 배상요청 하구요 _x000D_\n010-3431-2100 연락 당장 주세요", "answer": "최성수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n번거로우셨을 텐데 직접 브랜드를 통해 수선을 진행해주셔서 감사드립니다.\n\n해당 수선 비용은 금일 중 고객님 계좌로 입금될 예정입니다.\n기다려주신 점 깊이 감사드립니다.\n\n궁금하신 점은 언제든 말씀해 주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변진행중"}, {"id": "803590", "date": "2026-05-15", "cat": "런드렛 반납 문의", "title": "반납", "question": "런드렛반납할거없는데 해지할때 지정헤야되서 16일로헸는데  문자와서요   문의납깁니다  반납취소해주세요", "answer": "정필립 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n죄송하지만 런드렛 반납은\n고객님께서 직접 신청해주셔야 하는 점 안내드립니다.\n\n**런드리고 앱 > MY > 런드렛 반납**을 통해\n반납 희망하시는 날짜를 선택하시어 신청 부탁드립니다!\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803589", "date": "2026-05-15", "cat": "기타", "title": "세탁물 없이 런드렛 수거후", "question": "안녕하세요_x000D_\n제가 지난달에 세탁물을 실수로 안 내놓고 수거 신청을해서_x000D_\n현재 사진과 같은 상태 입니다._x000D_\n금일 세탁을 맡기고 싶은데 저 화면으로만 떠서 수거 신청을할 수가 없어 문의드립미다.", "answer": "김민지 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 런드리고를 이용해 주셔서 감사드립니다.\n\n현재 수거 신청이 진행 중인 경우에는 **추가 수거 신청이 불가능한 점 안내드리며**,\n번거로우시겠지만 **세탁물 수령 완료 후 신규 수거 신청**을 부탁드립니다.\n\n문의주신 내용에 충분한 도움을 드리지 못해 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803588", "date": "2026-05-15", "cat": "쿠폰/포인트 문의", "title": "페이백서비스문의", "question": "제가 이번에 배송비제외 78500원을 포인트로 결제했습니다. 그리고 충전포인트 10%페이백 쿠폰을 사용했는데요, 그럼 7850원이 들어오는게 맞나요? ", "answer": "김연주 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 서비스 이용에 불편드려 죄송합니다.\n현재 확인해보니 전일 결제 취소 진행한 이력으로 인하여\n페이백 마저 함께 회수 처리가 된 것 같습니다.\n2,680 포인트는 제가 수동으로 다시 지급드리겠습니다.\n서비스 이용에 불편을 드려 진심으로 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803587", "date": "2026-05-15", "cat": "기타", "title": "신청한 회원정보와 런드렛 회원정보가 일치하지 않다는게 무슨말이죠?", "question": "신청한 회원정보와 일치하지 않아서 수거를 안했는데, 뭐죠?", "answer": "박지현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 현재 미수거 처리된 건은\n시스템상 재회수로 복구가 어려워\n번거로우시겠지만 다시 수거 요청을 진행해주셔야 하는 점 양해 부탁드립니다.\n\n수거 시 런드렛 옆에 끼워져있는 인수증의 회원카드 정보와\n요청해주시는 계정의 회원카드 정보가 일치할 경우 정상 수거가 가능하며,\n\n정보가 일치하지 않을 경우에는\n인수증을 제거한 후 요청해주시면 수거가 가능한 점 안내드립니다.\n이용에 참고 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803584", "date": "2026-05-15", "cat": "미수거/오수거 문의", "title": "오전 있는거 확인했는데 없다고 안가져가셨습니다", "question": "방금 연락 오셨는데, 제가 오전에 나갈때 분명히 있었고 세탁물 없다고 앱 알람오자마자 남편이 확인했는데 세탁물 그대로 있었습니다 문손잡이가 낮아서 왼쪽에 걸어뒀는데 안보이는 각도도 아닌데 없다고 안가져가셨어요", "answer": "오유정 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n세탁물이 모두 수거되지 않아, 많이 당황하셨을 것 같습니다.\n\n런드리고에서는 수거신청시,\n고객님께서 **[메모로 '런드리고'를 표기해주신 세탁물]**만 수거하고 있음을 안내드리고 있습니다.\n\n다만, 이용 중 모르고 놓치셨을 수 있는 고객님의 상황을 고려해\n이번 건에 한해 예외적으로\n고객님께 추가 배송비가 발생되지 않도록,\n수거배송비에 해당하는 포인트 3,800p를 지급드립니다.\n\n다음부턴 이용시, 수거신청 해주실 때,\n꼭 런드리고 메모를 남겨주세요.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803582", "date": "2026-05-15", "cat": "변형/변색/손상", "title": "손상된거 복구해주세여", "question": "의류 모자 팁이 손상됐는데 왜 안된다는가죠????_x000D_\n어이가_x000D_\n없네요?_x000D_\n안심케어 신청하라고해서 했는데_x000D_\n반려했네여", "answer": "박우영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n맡겨주신 세탁물에서 불편을 겪으셔서\n많이 당황하셨을 것 같아 죄송한 마음입니다.\n\n확인 결과, 문의주신 세탁물은\n생활빨래로 접수된 건으로 확인됩니다.\n\n다만 죄송하게도 문제 접수주신 내용에 대해서는\n생활빨래 서비스 특성상 별도의 도움을 드리기\n어려운 점 너그럽게 양해 부탁드립니다.\n\n**📌 생활빨래 서비스 안내  **\n\n**-** ** 로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.🙏🏻\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803579", "date": "2026-05-15", "cat": "변형/변색/손상", "title": "말씀하신대로 안심케어로 재접수 하였으나, 안심케어/포인트 원치 않고 즉시 환불 및 손상된 의류에 대한 변상 요청합니다.", "question": "최근에 맡긴 마지막 세탁건에 대해서 _x000D_\n에초에 세탁은 제대로 되질 않았고_x000D_\n고가의 셔츠를 먼지구덩이에 굴리다 온 마냥이_x000D_\n정체를 알 수 없는 회백색 가루가 잔뜩 묻어있고_x000D_\n일부 의류는 손상 정도가 심각하여_x000D_\n원상복구가 불가능한 지경인데_x000D_\n_x000D_\n어이없게 무슨 안심케어를 말하나요?? _x000D_\n_x000D_\n일단 안심케어로 접수하라고 해서 다시 접수했으나_x000D_\n더이상 런드리고 서비스를 신뢰할 수 없으며_x000D_\n_x000D_\n고가의 의류를 안심케어라는 명목하에 다시 보냈다가_x000D_\n어떤 사단이 일어날지 너무나 불안하고 믿을수 없습니다. _x000D_\n_x000D_\n안심케어 및 포인트 환불따위 원치 않습니다. _x000D_\n_x000D_\n문의 확인 즉시 담당자가 연락하여_x000D_\n이렇게 된 원인에 대해서 정직한 해명 바라며_x000D_\n_x000D_\n제대로 세탁조차 되지 않은 건에 대한 즉시 환불 및_x000D_\n원상복구 불가능할 정도로 손상된 의류에 대해서_x000D_\n변상 요구합니다. _x000D_\n_x000D_\n확인 즉시 연락바랍니다. ", "answer": "손수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 이용에 불편을 드려 대단히 죄송합니다.\n문의하신 수선비와 관련하여 기존에 결제되었던 20,000원 중, 차액인 **5,000원**에 대한 환불 처리가 정상적으로 완료되었습니다.\n환불 금액은 등록된 대표 결제수단으로 취소되며, 카드사 사정에 따라 영업일 기준 최대 5일 이내 입금될 예정입니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803578", "date": "2026-05-15", "cat": "배송관련 불편사항접수", "title": "오배송", "question": "배송도착사진보니까 다른 집에 배송이 되엇어요 .", "answer": "배양선 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 안내 완료되어\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803576", "date": "2026-05-15", "cat": "변형/변색/손상", "title": "세탁물 변색", "question": "세탁전에는 없던 얼룩이 세탁후 배송 받아보니 생겼습니다._x000D_\n이런 경우는 어떻게 처리해주시는지 문의드립니다._x000D_\n검수사진과 현재사진 첨부합니다.", "answer": "김태균 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 안내 완료되어\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803575", "date": "2026-05-15", "cat": "다림질 미흡", "title": "배송시 구김", "question": "배송시 옷이 다 쏟아져 전체적으로 구김현상 발생_x000D_\ 안되서 세탁요청하려구 합니다. 가능한지 확인 부탁드립니다. (울세탁 모드로 세탁 가능)", "answer": "김민우 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 런드리고 서비스를 이용해 주셔서 감사합니다.\n\n저희는 케어라벨을 준수하여 세탁 공정을 진행하고 있으며\n문의주신 2026-04-02 수거 신청건의 경우\n탁이 완료되어 금일 출고 예정으로 확인되었습니다.\n\n세탁물 수령 후 실물 확인을 부탁드리며,\n이용 중 이슈가 발생할 경우 문의글을 통해 접수해 주시면 신속히 확인 도와드리겠습니다.\n\n충분히 만족스러운 답변을 드리지 못한 점 양해 부탁드리며,\n더 나은 서비스로 보답할 수 있도록 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803437", "date": "2026-05-14", "cat": "미수거/오수거 문의", "title": "수거 오류", "question": "조금 전 답변 주신 내용 확인했습니다만,_x000D_\n“런드리고”라고 표기한 세탁물은 현관문 좌측에 놓여있었습니다. 배송기사님이 찍은 사진 내에 나와있지 않았을뿐._x000D_\n제가 런드리고를 한두번 이용하는 것도 어나고,_x000D_\n매 번 같은 곳에 세탁물을 놓아놓았고 이번에 잘 못 가져간 운동화도 항상 쇼핑백채로 밖에 놓여있었는데,_x000D_\n이전엔 단 한 번도 잘 못 가져간적이 없었습니다._x000D_\n_x000D_\n미수거하신 세탁물을 다시 가져가 주시고,_x000D_\n운동화는 다시 가져다주세요._x000D_\n_x000D_\n수거는 런드리고 측 실수이니 관련해서 배송비는 물지 않겠습니다. 등록되어있는 카드로 결제하지 마세요.", "answer": "문지 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 부분 미수거로 인해 불편을 드려 죄송하다는 말씀 드립니다.\n\n다만 수거 진행 시 런드리고에서 제공드린 런드렛, 라이트백/핸디백 이외에는\n폐기가능한 종이가방이나 비닐에 담아 [런드리고 메모]가 부착된 세탁물에 한해\n수거가 진행되고 있으며 메모가 기재되지 않은 세탁물은\n별도 수거 진행이 어려운 점 너른 양해 부탁 드립니다.\n\n \n\n해당 내용은 이용 가이드에도 안내 드리고 있는 점 참고 부탁드리며,\n번거로우시겠지만 현재 진행중인 세탁물 수령 완료 이후 재배출 부탁 드립니다.😥️\n\n또한 수거 진행되는 가방은 별도로 반환되지 않고 있기에\n폐기 가능한 종이가방 혹은 비닐에 담아 메모 기재해 주시면 감사하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803436", "date": "2026-05-14", "cat": "프리미엄 서비스 문의", "title": "세탁이 제대로 되고 있는 게 맞는 건가요", "question": "안심 케어 요청해서 방금 사진을 보았는데 왼쪽 주머니 위에 얼룩이 그대로 있습니다. 저것 때문에 안심 케어를 다시 요청한 건데 지워지지 않는건지 세탁을 하긴 한 건지 보낼 때도 저길 찍어서 보냈는데도 계속 똑같은 상황이네요.", "answer": "박하향 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 말씀 주신 이불에 대해 안심케어 경로로\n수거요청 주신 내역 확인하였습니다.\n\n안심케어의 경우, 의류 입고 후 작업자의 실물 확인 하에\n재세탁이 필요할 경우 재세탁을, 세탁물의 손상에 대한\n추가 케어가 필요할 경우 케어를 진행한 후 출고 드리고 있습니다.\n\n따라서 보내주신 이불은 재세탁 진행 후 출고드릴 예정입니다.\n\n다만, 최근 급격한 날씨 변화로 인해 주문량이\n평소보다 크게 증가하면서\n일부 지역의 배송이 다소 지연되고 있습니다.\n\n소중한 의류를 기다려주시는 고객님께 불편을 드리지 않도록\n현재 전 공정의 작업 속도를 높이고,\n모든 세탁물을 한 벌 한 벌 꼼꼼히 검수하여\n안전하게 배송드릴 수 있도록 최선을 다하고 있습니다.\n\n빠른 시일 내 받아보실 수 있도록 최선을 다하겠으며,\n앞으로는 동일한 불편이 재발되지 않도록 최선을 다하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803434", "date": "2026-05-14", "cat": "기타", "title": "해지", "question": "해지를했는데 1달뒤에 해지가된다고했었습니다.이제 17일이면 기한이되는데 결제했던 금액이 다시 환불되나요?", "answer": "손혜경 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요청해주신 **[런드리고X 베이직]** 요금제의\n해지 예약처리가 완료되어 다음 갱신일에 요금제 결제가 진행되지 않습니다.\n\n현재 보유중이신 **[포인트 117,646P]**는 유효기간내 고객님께서 원하시는 서비스로 이용하실 수 있습니다.\n이사하신 후 **[앱>MY>포인트]**에서 유효기간을 확인하신 후 기간내 사용해주세요. 🙏\n\n\n> 또한, 현재 보유 중이신 런드렛은\n> 자동 반납 처리가 필요하여\n> **4월 15일 (수요일) 저녁, 문 앞에 배출해 주시면 회수 진행될 예**정입니다.\n>\n>\n>\n> 번거로우시겠지만, 런드렛 이용 시 사용되었던\n> 구성품(안심고리, 세탁망 등)도 함께 동봉하여 문 앞 배출 부탁드립니다.\n\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803433", "date": "2026-05-14", "cat": "기타", "title": "처리결과가 어떻게 된건가요?", "question": "CFAB00136977, CFAB00135609, CFAB00156626_x000D_\n_x000D_\n건에 대한 처리가 어떻게 된건가요?_x000D_\n_x000D_\n카카오톡으로 결제정보가 확정되었다고 알림이 왔는데, 런드리고 앱에서 위 세탁물 처리가 어떻게 된건지 어디서 확인해야 하는 건가요??", "answer": "백재민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 불편드린 부분 죄송한 말씀 드립니다.\n\n확인 요청 주신 부분 확인시 입고 분류자의 오류로 확인 됩니다.\n\n해당 부분 담당 부서로 정정 처리 및 전달 드렸으며, 전상상으로는 변경 처리가 불가한 점\n양해 요청 드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803431", "date": "2026-05-14", "cat": "기타", "title": "수거 내역 중 문의", "question": "검수과정에서 후드티, 맨투맨이 오염 발생됐다고 하는데 따로 뭐 묻은게 없고 땀나서 맡긴건데 무슨 오염이요?", "answer": "윤승찬 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 소중한 세탁물이 정확히 전달되지 않아\n불편을 드린 점 진심으로 사과드립니다.\n\n관련하여 상세히 안내드리고자 조금전 연락드렸으나\n통화 어려우신 부분 확인되어 부득이 문의글 통해 안내 드립니다.\n\n문의주신 [후드]는 현재 담당 부서에서\n세탁 > 건조 > 포장 > 출고 전 과정을 기준으로\n영상 및 RFID 기록을 확인 중입니다.\n\n특히, 다림질 혹은 포장 과정에서\nRFID 태그가 잠시 해제(또는 탈락)되며\n다른 고객님의 세탁물과 혼입되었을 가능성을\n포함해 전수 조사를 진행하고 있습니다.\n\n**📌 진행 절차  **\n- 동일 시점 출고 세탁물 확인\n- 전 공정 영상 및 RFID 기록 검토\n- 확인된 세탁물은 상태 점검 후 재배송\n- 일정 기간 내 확인 불가 시 분실 보상 절차 진행\n\n확인에는 **영업일 기준 5일 정도 소요**될 수 있으며,\n결과가 나오는 대로 즉시 안내드리겠습니다.\n\n안내드린 사유로 인해 한밤 배송이 지연되었던 점 확인되며,\n동일한 문제가 발생하지 않도록 주의하겠습니다.\n\n이용중 불편을 드리게 된 점 진심으로 사과 드리며,\n고객님의 불편을 대신할 수 없으나 소정의 포인트 지급드리오니\n앞으로 더 잘하겠다는 의미로 받아주시면 감사하겠습니다.\n\n의류는 확인 즉시 배송 및 안내 진행드리거나\n안내드린 기간 내 찾지 못하는 경우 담당부서 통한\n보상 처리 안내 진행드릴 수 있도록 하겠습니다.\n\n이용에 불편드린 점 다시 한번 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803427", "date": "2026-05-14", "cat": "기타", "title": "커텐 세탁 후 오염 제거 안되어 문의드립니다.", "question": "커텐 세탁을 맡겼는데요..확인 해보니 얼룩제거가 안되어 있어서 문의 드립니다...", "answer": "심재혁 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 이용 과정에서 혼선을 드린 점 죄송합니다.\n\n집중케어 서비스는 개별클리닝 이용 시 선택 가능한 추가 옵션으로,\n오염 부위에 대한 약품 처리가 포함됩니다.\n다만 해당 과정에서 원단 손상 우려가 있을 경우\n집중케어는 진행되지 않고, 보다 안전한 범위 내에서\n기본 개별클리닝 공정으로 세탁이 진행됩니다.\n\n이로 인해 요청하신 방식과 다르게 느껴지셨을 수 있는 점\n양해 부탁드립니다.\n\n궁금하신 점은 언제든 말씀해 주세요.\n감사합니다.\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803426", "date": "2026-05-14", "cat": "쿠폰/포인트 문의", "title": "배송비 무료쿠폰 적용", "question": "5만원 이상이면 배송비 무료적용이 되는 쿠폰이 있는데 결제금액이 5만원 넘어서 적용 가능한지 문의드립니다. ", "answer": "변현정 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 쿠폰 이용에 혼선을 드린 점 양해 부탁드립니다.\n\n문의주신 쿠폰 변경 관련하여 확인해보니,\n수거 신청 시 선택하여 선적용된 쿠폰만 사용이 가능하며\n이미 적용된 쿠폰은 시스템상 다른 쿠폰으로 변경이 어려운 점 안내드립니다.\n\n다만, 쿠폰별로 적용 조건(최소 주문 금액 등)이 상이하여\n이용 전 확인이 필요한 점 참고 부탁드립니다.\n\n번거로우시겠지만 현재 주문 건은 기존 쿠폰 기준으로 이용 부탁드리며,\n이후 이용 시 원하시는 쿠폰을 선택하여 사용해주시면 감사하겠습니다.\n\n궁금하신 점은 언제든 편하게 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803421", "date": "2026-05-14", "cat": "기타", "title": "구매내역 첨부드립니다", "question": "배상 관련 구매내역 첨부드립니다", "answer": "유재용 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서 제출해주신 증빙 서류는\n정상 접수되었으며, 관련 내용은 담당 부서에 전달하였습니다.\n\n고객님의 불편을 최소화할 수 있도록\n최대한 신속히 처리해드리겠습니다.\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803414", "date": "2026-05-14", "cat": "기타", "title": "세탁물 결제문의", "question": "아니 진짜 저번부터 이해안가는게_x000D_\n_x000D_\n겨울패딩할인쿠폰잏길래_x000D_\n패딩4건보냈더니_x000D_\n왜 이걸 요금제 6건으로 다 차감하죠?_x000D_\n_x000D_\n일반셔츠6건을 요금제에서 차감하시고_x000D_\n겨울패딩은 따로 4건 30% 겨울패딩으로 차감해주세요_x000D_\n_x000D_\n런드리고는_x000D_\n저번에도 그렇고_x000D_\n구독권갯수에맞게 보내도_x00 3397", "date": "2026-05-14", "cat": "재세탁 접수 및 과정 문의", "title": "압축포장했는데 찢어졌네요?", "question": "오늘 세탁 맡길라고 전에꺼 꺼낼라고 열어봤더니 압축포장이 찢어쟈있네요? ", "answer": "최정아 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 이용에 불편을 드린 점 진심으로 사과드립니다.\n\n전달해주신 내용 확인 결과,\n작년 연말 손상 발생 이후 브랜드 AS 동의를 받아 진행 예정이었으나\n실제 수선이 이루어지지 않은 상태로 출고된 것으로 확인되었습니다.\n당시에는 재접수를 통해 다시 접수해 주시도록 안내드렸던 이력도 확인되었습니다.\n\n이후 브랜드 AS 진행 과정에서 구매 이력 확인(구매 인증) 등\n구매자 본인을 통한 접수가 필요한 이슈가 발생하여\n현재는 고객님께서 직접 브랜드 매장을 방문해 수선을 진행해 주셔야 하는 상황입니다.\n\n번거로우시겠지만 가까운 매장 방문 후 수선을 진행해 주시고,\nAS 진행 영수증을 전달해 주시면 발생 비용은 현금성으로 보상 도와드릴 예정입니다.\n\n해당 방식으로 진행 가능하신지 확인 후 회신 부탁드립니다.\n\n충분한 도움을 드리지 못한 점 다시 한 번 진심으로 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803395", "date": "2026-05-14", "cat": "미수거/오수거 문의", "title": "추가 문의", "question": "미수거된것 + 기존에 가져가신거 둘 다 배송비를 내야하나요??_x000D_\n그리고 추가로 다시 신청해야하나요? _x000D_\n자세하게 안내해 주시면 다시 진행할지 확인하려고 합니다! _x000D_\n_x000D_\n그리고 기존에 가져가신거 금액이 얼마인지 알고 싶습니다!", "answer": "주영민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803388", "date": "2026-05-14", "cat": "수선 불만", "title": "세탁물 손상으로 인한 보상케어 배송비 부과가 맞나요?", "question": "세탁물 맡기고 수축이 일어나서 다시 안심케어로 보낸 건인데 배송비가 부과되었네요.. 배송비 부과 없이 케어진행하는걸로 알고있습니다", "answer": "김민선 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 서비스 이용에 불편을 드린 점 사과드립니다.\n\n안심케어 관련 안내드립니다.\n세탁물 이슈 접수 후 담당자의 확인 및 승인이 완료되면,\n고객님께서 별도로 안심케어 수거 신청을 진행해 주셔야 합니다.\n이 과정에서 승인 시 지급된 포인트가 수거 배송비로 차감되며,\n별도의 수거 배송비가 추가 청구되지 않는 점 양해 부탁드립니다.\n\n또한 문의주신 수건 관련하여 확인한 결과,\n고객님께서 커머스 상품으로 구매하셨다는 내역을 전달해 주셨으나,\n2026-01-21 17:21:55 결제 건에서는 해당 수건 구매 내역이 확인되지 않았습니다.\n해당 결제 건은 이미 취소 처리된 것으로 확인되었습니다.\n\n본 안내가 문의하신 내용에 충분히 도움되길 바라며,\n추가 문의사항이 있으시면 언제든 편하게 연락 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803387", "date": "2026-05-14", "cat": "변형/변색/손상", "title": "전화상담", "question": "1대1문의도 느리고 전화상담 따로 불가능할까요 너무답답한데", "answer": "박우영 고객님, 안녕 D_\n런드렛을 못열고 있습니다", "answer": "김종민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n**런드렛 비밀번호는 해당 비밀번호는 배송 시 발송된 알림톡 또는**\n**수거 신청 화면 우측 상단의 자물쇠 버튼을 통해서 확인하실 수 있습니다.**\n\n**혹시 확인이 어려우신 경우, **\n**다이얼 옆에 있는 화살표의 색상을 기준**으로 (사진참고)\n아래쪽에 보이는 색상과 일치하는 번호를 맞춰 다시 한번 시도해보시길 부탁드립니다.\n\n\n> **✅ 비밀번호 확인 방법 **\n>\n> 🔴🟠 - 122\n> 🟡 - 255\n> 🟢 - 388\n> 🔵 - 477\n> 🟣 - 511\n\n\n혹여라도 임시 비밀번호 사용 시에도 비밀번호가 맞지 않는 경우에는\n맡기실 때 런드렛의 다이얼키를 잠그시지 않더라도 저희가 안전하게 수거하겠습니다.\n\n더 궁금한 점은 언제든 말씀해주세요🙏🏻\n감사합니다.\n\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803320", "date": "2026-05-14", "cat": "기타", "title": "얼룩케어", "question": "얼룩케어 요청하면서_x000D_\n스커트를 찍어보냈는데_x000D_\n자케의 얼룩케어를 진행한것으로_x000D_\n연락받았습니다", "answer": "이주원 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 런드리고 서비스를 이용해 주셔서 감사합니다.\n\n문의 주신 의류의 경우 얼룩 케어와 관련하여\n별도 추가 서비스가 접수된 내용은 없으나\n출고 과정에서 작업자 확인 시 추가 케어가 필요한 것으로 판단되어\n해당 케어가 진행된 것으로 확인되었습니다.\n\n이에 따른 별도 추가 청구 요금은 발생하지 않으며,\n보다 나은 서비스 제공을 위해 추가 확인이 진행된 점 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803316", "date": "2026-05-14", "cat": "기타", "title": "맡긴옷 품목확인", "question": "제가 맡긴옷은 내역을 못보나요?_x000D_\n그리고 쿠폰이있는데 적용언제되나요_x000D_\n겨울아우터 두벌맡겼는데 미적용이라뜨는데_x000D_\n결제가 자동으로 진행되는지 여쭤봅니다.", "answer": "김서연 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n니트 의류가 후드/맨투맨 티로\n오분류 처리 되면서\n쿠폰 사용이 어려웠던 점 안내드립니다.\n\n이미 결제된 내역에 대해\n취소 후 쿠폰 적용이 불가하여\n결제된 비용 내 3,400원을 환불 처리로\n진행드렸습니다.\n\n영업일 2~5일 이내 환불 예정으로 참고 부탁드리며,\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803313", "date": "2026-05-14", "cat": "오염 미 제거", "title": "오염", "question": "지금 계속 드라이 맡기고있는데 전에도 문의 드렸는데_x000D_\n자꾸 오염이 안지워지는건가요? 왜 세탁하는데 오염이 그대로죠??_x000D_\n이럴거면 돈을 왜 지불해야하는거죠…", "answer": "김혜정 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n집중케어로 요청해주신 부위가\n충분히 처리되지 않아 많이 아쉬우셨을 것 같습니다.\n이용에 불편을 드려 진심으로 사과드립니다.\n\n해당 부위는 작업자가 실물 확인 과정에서\n추가 케어 시 **섬유 손상이나 형태 변형의 우려가 있어**,\n부득이하게 집중케어 진행이 어려운 것으로 판단되었습니다.\n\n이 점 너그럽게 양해 부탁드립니다.\n\n요청하신 부분에 충분히 도움드리지 못한 점\n다시 한 번 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803312", "date": "2026-05-14", "cat": "보상처리 과정 문의", "title": "세탁 배송비 문의", "question": "블라우스 세탁과정에서 단추가떨어져서 접수하고 수거 맡기면 재수선해서 보내주신다고 하셨는데 이런경우에도 한밤배송 시 배송비를 내야하나요? ", "answer": "김민지 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 소중한 시간을 내어 다시 보내주신 의류인데\n아직 수령하지 못하시어 많이 걱정되셨을 것 같습니다.\n\n안심케어로 접수해주신 세탁물은\n현재 처리 상황을 확인 중이며,\n지연된 부분에 대해서는 담당 부서로 별도 확인 요청을 전달드린 상태입니다.\n\n최근 물량 증가로 인해 케어 및\n검수 과정이 다소 지연되고 있는 것으로 보이며,\n고객님의 세탁물 역시 보다 정확한 확인과 처리를 위해 시간이 소요되고 있는 점 양해 부탁드립니다.\n\n관련 내용은 확인되는 신속히 안내드릴 수 있도록 하겠으며,\n최대한 빠르게 처리될 수 있도록 지속적으로 살펴보겠습니다.\n\n기다리시게 해드려 죄송합니다.\n끝까지 책임감 있게 확인 후 안내드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803306", "date": "2026-05-14", "cat": "기타", "title": "해당 제품 도착을 안했습니다", "question": "해당제품이 도착하지 않았습니다._x000D_\n지난번에 문의 시 사진 클릭 후 작성했는데 왜 제품등 정보가 끌려오지 않은거죠…_x000D_\n배송 때문에도 실망인데, 앱 기능도 참…", "answer": "선주연 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 불편드린 부분 죄송한 말씀 드립니다.\n\n해당 의류 출고된 부분 확인되어 문의건 종결 합니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803305", "date": "2026-05-14", "cat": "결제/과금 문의", "title": "품목별 차감내역 및 결제정보확인", "question": "카톡알람으로 결제정보확인안내- 이용하기버튼을 눌러 신청내역 내 품목별 차감내역과 결제정보를 확인해보세오. 라고 받아서 이용내역보기 버튼을 눌렀는데 어플 홈화면만 뜹니다", "answer": "서진아 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n**헌옷은 순차적으로 무게 계측 후 포인트가 지급**되며,\n이로 인해 정확한 지급 일자를\n사전에 안내드리기 어려운 점 너른 양해 부탁드립니다.\n\n알림 수신 동의 상태라면 지급 완료 후\n푸시 알림을 통해 확인 가능하시니 참고 부탁드립니다.🙏\n\n빠른 처리를 도와드리지 못해 다시 한 번 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803303", "date": "2026-05-14", "cat": "오염 미 제거", "title": "오염물이 그대로 있습니다", "question": "오염물이 그대로있습니다", "answer": "유하린 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 믿고 맡겨주신 세탁물이\n기대에 미치지 못한 상태로 전달되어\n많이 속상하셨을 것 같습니다.\n\n그 마음 충분히 공감되며,\n불편을 드려 진심으로 죄송합니다.\n\n다만 말씀해주신 **얼룩은 일반 세탁만으로는 **\n**제거가 어려운 오염**으로 확인되며,\n**보다 정밀한 약품 처리가 필요**한 상태로 판단됩니다.\n\n해당 경우에는 개별 클리닝 과정을 거친 후\n보다 정성스럽게 관리해드리는** **\n**‘집중케어’** 서비스 이용을 추천드리고 싶습니다.\n\n집중케어는 **[얼룩제거], [보풀제거], [다림질] 등의 **\n**섬세한 케어가 -14", "cat": "증빙서류 제출", "title": "증빙 서류 없을 시", "question": "증빙 서류가 없을 시 어떻게 해야 할까요? ", "answer": "신관식 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n해당 내용 관련하여 담당자 유선 안내드린 것으로 확인되어\n문의글은 종료하도록 하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803203", "date": "2026-05-14", "cat": "런드렛 이용 문의", "title": "추가로 수거신청", "question": "수거신천 원합니다", "answer": "정진원 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n세탁물 배송 받는 방법 변경 관련하여 문의주신 내용 확인했습니다.\n\n죄송하게도 배송은 수거 신청 시 설정해주신 방법에 따라 진행되고 있어,\n이미 수거가 완료된 이후에는 배송 받는 방법 변경이 어려운 점 너른 양해 부탁드립니다.\n\n다음 수거 신청 시 **배송 받는 방법을 런드렛으로 선택**해주시면,\n해당 방식으로 배송 받아보실 수 있습니다.\n\n시간 내어 문의주셨으나 바로 도움드리지 못한 점 죄송합니다.\n\n추가로 궁금하신 점이 있으시면 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803193", "date": "2026-05-14", "cat": "기타", "title": "옷손상", "question": "세탁했는데옷구멍남", "answer": "문혜주 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[탈/변색, 이염]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.🙏🏻\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803191", "date": "2026-05-14", "cat": "증빙서류 제출", "title": "증빙서류", "question": "옷에 부착되잇던 택이랑 통장사본이요", "answer": "김민우 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서 제출해주신 증빙 서류는\n정상 접수되었으며, 관련 내용은 담당 부서에 전달하였습니다.\n\n담당자가 내역확인 후\n순차적으로 연락드릴 예정이오니,\n다소 시일이 소요될 수 있는 점 양해 부탁드립니다.\n\n고객님의 불편을 최소화할 수 있도록\n최대한 신속히 처리해드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803186", "date": "2026-05-14", "cat": "기타", "title": "배송 문의", "question": "아직 배송이 안된 상태인데 언제오는 걸까요?", "answer": "정원기 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 배송 일자 관련 문의 주신 내용 확인 했습니다.\n\n4월 20일 수거 신청해주신 의류들은 4월 23일 배송 완료된 것으로 확인됩니다.\n\n런드리고의 **여러밤 배송**은\n고객님께서 선택하신 날짜 기준으로 운영되지만,\n최근 수거 물량이 증가하면서\n**처리 가능한 범위 내에서는 세탁 및 배송이 조기 진행**될 수 있습니다.\n\n이는 세탁 적체를 방지하고\n공정 효율을 높이기 위한 운영 방식으로,\n쉽게 말해 음식 배달 앱의 알뜰배송처럼\n상황에 따라 예상보다 빠르게 도착할 수 있는 구조라고\n이해해 주시면 감사하겠습니다. 😊\n\n참고로,\n\n- **한밤 배송(23시~07시)** : 수거 즉시 세탁/배송 + 추가 요금 발생\n-\n\n**여러밤 배송(22시~07시)** : 설정된 날짜 내 순차 세탁/배송, 추가 요금 없음\n\n\n\n예정보다 빠르게 배송되더라도\n세탁 품질과 검수 기준은 동일하게 적용되니\n안심하고 이용 부탁드립니다. 🙇‍♀️\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803185", "date": "2026-05-14", "cat": "배송누락/분실접수", "title": "분실", "question": "아니 언제까지 계속 보내고 기다리고 받고를 반복해야되나요. 분실물만 찾으면 되지 계속 패딩 보내고 받고 이러면 세탁 맡긴 이유가 없죠 계속 더러워지고 끈은 없고 뭐하자는건가요. 그리고 답변중에 유사 부속품 대체라는말이 있던데 그건 또 무슨 말같지도 않은 소린가요. 정품끈 대체 혹은 보상안을 정확히 마련해서 답변주세요. 아니면 소보원에 문의하겠습니다.", "answer": "김희완 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 셔츠는 금일 케어 진행을 완료하여\n저녁 출고 및 배송을 진행드릴 예정입니다.\n\n오늘 밤 10시 ~ 익일 오전 7시 사이\n배송이 진행될 예정으로 참고해 주시면 감사하겠습니다.\n\n정확한 안내드리지 못해 불편함을 드린점 깊게 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803184", "date": "2026-05-14", "cat": "기타", "title": "압축", "question": "이불 둘 다 압축하신건가요? 아니면 하나만 압축하신 건가요?", "answer": "정말남 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 이불 압축포장의 경우\n수거신청 시 함께 선택하여 주셔야 하시며,\n아래 사진과 같이 '전체 서비스 보기'를 선택하시면\n압축포장이 가능하신 점 안내드립니다.\n\n \n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803180", "date": "2026-05-14", "cat": "증빙서류 제출", "title": "보상절차 서류제출(통장사본)", "question": "현대백화점에서 구매한 것 같으나 배우자 카드인지 본인카드인지 찾을수가 없네요", "answer": "김민우 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서 제출해주신 증빙 서류는\n정상 접수되었으며, 관련 내용은 담당 부서에 전달하였습니다.\n\n담당자가 내역확인 후\n순차적으로 연락드릴 예정이오니,\n다소 시일이 소요될 수 있는 점 양해 부탁드립니다.\n\n고객님의 불편을 최소화할 수 있도록\n최대한 신속히 처리해드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803173", "date": "2026-05-14", "cat": "배송관련 불편사항접수", "title": "니트", "question": "저번에는 니트가 다 접혀서 보관하기 편하게 왔는데 이번에는 옷걸이에 걸려서 왔어요 따로 신청을 해야 해주시는건가요?", "answer": "배양선 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 안내 완료되어\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803171", "date": "2026-05-14", "cat": "증빙서류 제출", "title": "보상관련서류첨부", "question": "선물받은거라 영수증은 없고 받은내역 등 첨부합니다", "answer": "강윤서 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서 제출해주신 증빙 서류는\n정상 접수되었으며, 관련 내용은 담당 부서에 전달하였습니다.\n\n고객님의 불편을 최소화할 수 있도록\n최대한 신속히 처리해드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803165", "date": "2026-05-14", "cat": "증빙서류 제출", "title": "증빙서류 제출", "question": "안녕하세요 증빙서류 제출합니다_x000D_\n바지는 이제  판매를 안하고 있고_x000D_\n구매영수증도 없고 카드내역도 확인이 어렵습니다", "answer": "유승선 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 첨부해 주신 자료는 담당자 확인 후\n보상 진행이 완료된 것으로 확인됩니다.\n\n해당 1:1문의글은 종료되는 점 너른 양해 부탁드리며,\n세탁 이후 발생된 문제로 인해 번거로운 절차로\n불편을 드린 점 다시 한번 사과 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803162", "date": "2026-05-14", "cat": "결제/과금 문의", "title": "갱신일 세탁권 차감 문의", "question": "14일까지 사용이고 15일 갱신 예정인데_x000D_\n세탁권 2장 남아있는 상태입니다._x000D_\n금일 접수시 남은 세턱권 사용 가능한지요? ", "answer": "배세란 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서 사용 중이신 런드리고 X 요금제의\n차감 기준 관련하여 문의 주신 내용에 대해 안내드립니다.\n\n현재 X 요금제는 차감 가능 품목과 제외 품목이 아래와 같이 구분되어 있으며,\n차감 가능 품목의 제공 수량을 초과하거나 차감 제외 품목을 이용하실 경우\n별도 과금이 발생합니다.\n단, 구독 고객님의 경우 별도 과금 시 20% 할인 혜택이 자동 적용됩니다.\n\n✅ 차감 가능 품목\n\n- 개별클리닝 의류 (상의 / 하의 / 아우터)\n- 생활빨래\n- 이불\n- 신발\n\n✅ 차감 제외 품목 (별도 과금)\n\n- 셔츠\n- 리빙류\n- 잡화류\n- 프리미엄(명품) 의류\n- 수선\n\n고객님께서 맡겨주신 암막커튼과 러그는 리빙류에 해당되어,\n요금제 차감 대상이 아닌 별도 과금 품목으로 처리된 점 확인됩니다.\n\n요금제 이용 기준 안내가 충분하지 않아 혼선을 드린 점 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803155", "date": "2026-05-14", "cat": "오염 미 제거", "title": "재케어 관련건 ", "question": "재케어 후 이번에는 오른쪽 아래에 오염이 있게 왔습니다. 확인 부탁 드립니다", "answer": "유하린 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 믿고 맡겨주신 세탁물이\n기대에 미치지 못한 상태로 전달되어\n많이 속상하셨을 것 같습니다.\n\n그 마음 충분히 공감되며,\n불편을 드려 진심으로 죄송합니다.\n\n다만 말씀해주신 **얼룩은 일반 세탁만으로는 **\n**제거가 어려운 오염**으로 확인되며,\n**보다 정밀한 약품 처리가 필요**한 상태로 판단됩니다.\n\n해당 경우에는 개별 클리닝 과정을 거친 후\n보다 정성스럽게 관리해드리는** **\n**‘집중케어’** 서비스 이용을 추천드리고 싶습니다.\n\n집중케어는 **[얼룩제거], [보풀제거], [다림질] 등의 **\n**섬세한 케어가 필요한 작업을 선택형 프리미엄 서비스**입니다.\n\n\n* * *\n\n✅ **집중케어 신청 방법**\n**①** **[수거신청] 선택**\n ****\n\n**② [개별클리닝] 선택**\n \n\n**➂ 품목 선택 후,**\n 화면 예시처럼 추가 케어 항목을 체크해주세요.\n \n\n* * *\n\n📌 **유의사항**\n**✔︎** 요청 시 **의류 전체 사진**을 찍어주신 후\n    **세심한 케어 필요 부위를 표시**해주시면\n    정확한 처리가 가능합니다.\n\n\n* * *\n\n이번 건에 대해서는 만족스러운 케어를\n도움드리지 못해 죄송한 마음담아** **\n**세탁비용은 포인트로 환불** 처리하도록 하겠습니다.\n\n추후 다시 한번 더 집중케어 요청을 통해\n맡겨주시면 좀 더 꼼꼼히 케어 도와드리겠습니다.\n\n런드리고는 앞으로도 고객님의 소중한 옷을\n더 건강하고 세심하게 케어해드릴 수 있도록\n지속적인 품질 개선과 서비스 고도화에 최선을 다하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803149", "date": "2026-05-14", "cat": "결제/과금 문의", "title": "왜 이용권이 차감되지 않고 추가 결제가 되나요?", "question": "이용권 1개 남아있는데 왜 차감 안 되고 전부 추가 결제가 이루어지죠? 좀 어이가 없네요;", "answer": "고객님, 현재 성수기 물량 증가로 문의가 급격히 늘어난 상황입니다.\n문의는 순차적으로 확인하여 최대한 빠르게 안내드리고 있습니다.\n\n응대가 다소 지연된 점 진심으로 사과드리며,\n누락 없이 확인 후 신속하게 답변드릴 수 있도록 최선을 다하겠습니다.", "status": "접수완료"}, {"id": "803148", "date": "2026-05-14", "cat": "세탁 품목 오류접수", "title": "이불 쿠폰", "question": "이불 쿠폰 사용하려고 맡겼는데 커버류로 분류되어 과금 되었습니다ㅠ 확인 부탁 드립니다", "answer": "문혜진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n혼선을 드려 죄송합니다. 품목 변경에 따라 아래 차액이 결제 취소 처리되었습니다.\n\n\n- 결제 취소 금액(환불 포인트 포함) : 900원(P)\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803147", "date": "2026-05-14", "cat": "기타", "title": "분실환불", "question": "세탁물분실로 인한 환불금액 입금 5/10 안내받았는데 입금되지 않았습니다", "answer": "이상훈 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n런드렛이 열리지 않아 많이 불편하셨을 것 같아 죄송한 마음입니다.🙏\n\n고객님께 제공된 🔑비밀번호는 **(122)** 로 확인되며,\n**해당 비밀번호는 배송 시 발송된 알림톡 또는**\n**수거 신청 화면 우측 상단의 자물쇠 버튼을 통해서도 확인하실 수 있습니다!**\n\n혹시 안내드린 비밀번호로도 열리지 않는 경우에는,\n**다이얼 옆에 있는 화살표의 색상을 기준**으로 (사진참고)\n아래쪽에 보이는 색상과 일치하는 번호를 맞춰 다시 한번 시도해보시길 부탁드립니다.\n\n\n> **✅ 비밀번호 확인 방법 및 다이얼키 런드렛 사용 방법**\n>\n> 🔴🟠 - 122\n> 🟡 - 255\n> 🟢 - 388\n> 🔵 - 477\n> 🟣 - 511\n\n\n혹여라도 임시 비밀번호 사용 시에도 오픈되지 않을 경우\n죄송하게도 지퍼 부분을 젓가락, 볼 등의\n얇은 물건으로 조심스럽게 눌러 런드렛 오픈을 부탁드립니다 🙏️\n\n다시 한 번 불편을 드린 점 깊이 사과드리며,\n앞으로는 비밀번호로 인한 불편이 없으시도록\n해당 내용은 내부적으로 꼼꼼히 점검하겠습니다.🙏\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803145", "date": "2026-05-14", "cat": "기타", "title": "배송", "question": "배송신청을 두개를 내놓았는데 한개만 가져가셨어요 한번에 한개씩만 신청이 가능한건가요???", "answer": "유승민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 세탁물이 미수거되어 많이 놀라셨을 것 같아\n먼저 깊이 양해의 말씀을 드립니다.\n\n문의 주신 내용을 확인한 결과,\n세탁물에 런드리고임을 표시하는 메모가\n부착되지 않아 미수거 처리된 것으로 확인되었습니다.\n\n세탁물을 런드렛 또는 라이트백 외의 봉투에\n배출해 주실 경우, 폐기 가능한 봉투나 쇼핑백에 담아\n[런드리고 + 세탁서비스명]을 종이에 기재 후\n부착해 주셔야 수거가 가능합니다.\n\n이는 폐기물 및 기타 물품과의 혼선을 방지하고\n정확한 수거를 위해\n사전에 안내드린 이용 가이드 사항으로,\n부득이하게 협조를 부탁드리는 점 양해 부탁드립니다.\n\n또한 서비스 이용 중에는 별도의 수거 방문이나\n자동 수거가 불가하므로, 세탁물을 수령하신 후\n고객님께서 직접 수거 신청을 진행해 주셔야 합니다.\n\n번거로우시겠지만 다시 한 번 안내드린 방법대로\n수거 신청 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803141", "date": "2026-05-14", "cat": "변형/변색/손상", "title": "옷에 얼룩이 생김", "question": "사진상으로 봤을땨 왼쪽 가슴위 쪽에 까맣게 얼룩이 져있는 상태로 세탁이 돼서 왔습니다. 옷을 맡길때엔 없던 흔적입니다", "answer": "박우영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n맡겨주신 세탁물에서 불편을 겪으셔서\n많이 당황하셨을 것 같아 죄송한 마음입니다.\n\n확인 결과, 문의주신 세탁물은\n생활빨래로 접수된 건으로 확인됩니다.\n\n다만 죄송하게도 문제 접수주신 내용에 대해서는\n생활빨래 서비스 특성상 별도의 도움을 드리기\n어려운 점 너그럽게 양해 부탁드립니다.\n\n**📌 생활빨래 서비스 안내  **\n\n**-** **생활빨래는 검수 과정 없이  **\n** 보내주신 상태 그대로 세탁/건조가 진행****됩니다. **\n\n**- 이 때문에** **입고 시 상태와 배송 후 상태를  **\n** 정확히 비교하기 어려워  **\n** 재세탁이나 추가 케어가 제공되지 않습니다.  **\n\n- 기계 세탁/건조 방식으로 운영되므로\n 케어라벨 상 기계 세탁·건조가 불가한 의류는\n 번거로우시더라도 개별클리닝으로 맡겨주셔야 합니다.\n\n앞으로는 더 만족스러운 서비스 경험을\n드릴 수 있도록 계속 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803140", "date": "2026-05-14", "cat": "기타", "title": "보관서비스", "question": "패딩을 맡겨서 세탁이 되어왔는데 _x000D_\n보관선택을 안해서 그냥왔어요_x000D_\n보관 맡기면 세탁차감없이 맡길수 있나요?", "answer": "강건우 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 불편드린 부분 죄송한 말씀 드립니다.\n\n해당 롱패딩[CFAB00149211]로 확인되며,\n세탁비 환불 처리 진행해 드렸습니다.\n\n환불 완료시까지 평일 영업일 기준 3~5일 정도 소요되는 점\n안내 드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803138", "date": "2026-05-14", "cat": "기타", "title": "세탁", "question": "안녕하세요_x000D_\n혹시 세탁 잘못해서 구겨진 바람막이도 펴 주시나요?", "answer": "이지애 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n런드리고를 처음 이용해주셔서 감사합니다.\n맡겨주신 세탁물의 가격과 진행 과정이 궁금하실텐데요.\n\n런드리고는 배송 일정에 따라 ‘한밤 배송’과 ‘여러밤 배송’으로 구분되어,\n각 일정에 맞춰 순차적으로 세탁과 배송이 진행됩니다.\n\n고객님께서는 여러밤 배송을 선택해주셔서\n4/7(화) 도착 예정이며,\n4/6(월) 중 세탁물 등록 및 검수가 완료되면\n품목별 가격 확정과 함께 세탁 시작 안내를 받아보실 수 있습니다.\n\n첫 이용 경험이 만족스러우실 수 있도록 꼼꼼히 진행하겠습니다.\n추가로 궁금하신 점은 언제든 편하게 말씀해주세요.\n\n감사합니다.\n\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803130", "date": "2026-05-14", "cat": "결제/과금 문의", "title": "이중결제 확인요망", "question": "최초 5/10 일요일_x000D_\n이불빨래 수거시 42,000원 결제 했는데...,_x000D_\n5/14일 목요일 08:40분에 70,200원에 또다시 결제됨._x000D_\n_x000D_\n보관료가 추가 되었다면,_x000D_\n5/10일 최초 수거시 비용은 취소해 주셔야 되지_x000D_\n않나요?  확인 해주시고 조치해주세요_x000D_\n_x000D_\n영수증 캡쳐 사진 첨부 합니다._x000D_\n", "answer": "유성식 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의주신 X 요금제의 차감 방식에 대해 안내드립니다.\n\n먼저 이용 내역을 보셨을 때, 맡기신 품목의 정찰가 합계가 지불하신 구독 요금보다 적게 느껴져 혼란스러우셨을 것 같습니다. 이 점 충분히 이해되며, 혼선을 드려 죄송합니다.\n\n런드리고 X 요금제는 다양한 품목을 보다 자유롭게 맡기실 수 있도록 설계된 통합형 구독 상품으로, 품목별 세탁 난이도, 부피, 자재 특성, 공정 리소스 등을 반영하여 차감 기준을 운영하고 있습니다.\n또한 구독 혜택에는 수거/배송비 7,600원 혜택과 초과 이용 시 품목별 정찰가격의 20% 할인 혜택도 함께 포함되어 있습니다.\n\n이와 같은 구독 상품은 개별 주문 1건의 정찰가 합계와 1:1로 정확히 대응되도록 설계되기보다는, 고객님의 전반적인 이용 패턴을 기준으로 혜택과 이용 편의를 함께 고려해 운영되는 구조입니다.\n\n따라서 일부 저렴한 품목 위주로 맡기시는 경우에는 해당 주문의 정찰가 합계가 지불하신 구독 요금보다 적게 느껴지실 수 있는 점 양해 부탁드립니다.\n\n혼선을 드린 점 다시 한 번 죄송하며,\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "803128", "date": "2026-05-14", "cat": "배송시간/배송지연 문의", "title": "배송지연", "question": "안녕하세요. 지난주 맡긴 원피스에 문제가 있어서 안심케어를 맡겼고, 추가 클리닝 신청하여 이틀이나 지연된다는 메세지를 받았습니다. 결국 원피스를 일주일째 못입고 있는데요. 최근 배송지연의 경우도 너무 빈번하고 이런 경우 답답합니다. 어떤 방법이 있을까요? ", "answer": "오병준 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 예정하신 일정이 있으셨을 텐데\n약속드린 날짜에 맞춰 세탁물을 전달드리지 못해\n많이 불편하셨을 것 같아 진심으로 사과드립니다.\n\n최근 급격한 날씨 변화로 주문량이 크게 증가하면서\n일부 지역에서 배송이 지연된 점 너른 양해 부탁드립니다.\n\n고객님의 세탁물은 2026-04-13 00:31:15\n안전하게 배송이 완료되었습니다.\n\n고객님께서 느끼신 불편에 비하면 부족한 수준이지만,\n조금이나마 마음을 전하고자 소정의 포인트를 지급해드렸습니다.\n너그럽게 양해해주시면 감사하겠습니다.\n\n앞으로는 보다 안정적인 서비스로 보답드릴 수 있도록 최선을 다하겠습니다.\n다시 한번 불편을 드린 점 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803120", "date": "2026-05-14", "cat": "런드렛 이용 문의", "title": "수거장소 및 배달 장소", "question": "저희 수거장소가 매장인데 혹시 문앞이 아니라 오시면 매장에서 전달드리고 받을수있을까요??  상시 주둔하고있습니다!", "answer": "고태훈 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 감사드립니다.\n\n런드렛은 출고시 매칭 진행이 되는 부분으로\n따로 출고는 어렵습니다.\n\n앱 내 수거 신청시 수령 방법을 런드렛으로 요청 주시면\n세탁 완료 후 런드렛에 담아 출고 진행되는 점 안내 드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803119", "date": "2026-05-14", "cat": "기타", "title": "어떻게 그냥 보내면되는가요?", "question": "문제있는 의류들_x000D_\n개별클리닝으로 신청해서 보내면 되나요?_x000D_\n명확히 알려줘요", "answer": "남예원 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n비대면 서비스 특성상 전산에 접수된 내용 기준으로만 서비스 진행이 가능한 점 안내드립니다.\n\n고객님께서는 생활빨래로 접수해주신 건으로 확인되어, 개별클리닝 서비스로의 변경은 어려운 점 양해 부탁드립니다.\n\n차후 개별클리닝이 필요하신 경우 해당 서비스로 별도 접수해주시면 이용 가능하신 점 안내드립니다.\n\n고객님의 세탁물은 현재 배송 중에 있는 상태입니다.\n\n소중한 시간 내어 문의주셨음에도 도움을 드리지 못한 점 진심으로 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "803118", "date": "2026-05-14", "cat": "기타", "title": "품목변경에 따른 이불 쿠폰 적용 및 환불 부탁드립니다", "question": "품목변경에 따른 이불 쿠폰 적용 및 환불 부탁드립니다", "answer": "김현지 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 품목 재분류로 요청 주신 내역 확인하였으며\n해당 건은 tion": "런드리고 한 밤 배송 서비스 미이행으로 구독 서비스 즉시 환불 요청합니다. 조속한 처리 바랍니다._x000D_\n되물을 필요 없이 바로 구독서비스 환불 바랍니다", "answer": "김규림 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 안내 완료되어\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802997", "date": "2026-05-14", "cat": "기타", "title": "체크한자켓이 오지읺았습니다", "question": "옷이 다오지 않았습니다", "answer": "야자수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의주신 티셔츠(CFAB00035405)는\n안심케어 세탁물로 일반 세탁물과 달리\n케어 담당자의 실물 확인과 세심한 케어가 필요하여\n배송이 지연되는 점 안내드립니다.\n\n케어 결과에 따라 배송 혹은 추가 안내가 진행될 예정으로\n일반 세탁물 보다 최소 3~7일 정도의 추가 지연이 있는 점 양해 안내드립니다.\n\n사전에 정확하게 안내드리지 못해\n추가 불편을 드리게 된 것 같아 너무나 죄송스럽습니다.\n\n문제 부분에 대한 세심한 케어 진행하여\n만족스러운 상태로 받아보실 수 있도록 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802995", "date": "2026-05-14", "cat": "기타", "title": "이불 망가짐에 대한 청구 비용", "question": "이불을 받으니까 까는 이불 밖에 없는데, (덮는 이불이 다 찢어졌다고 해서) _x000D_\n제가 까는 덮는 이불과 세트로 세탁을 맡겼는데, 까는 이불만 받은 상태에서 결제를 하는 게 맞을까 싶습니다", "answer": "바나 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 서비스 이용에 불편을 드린 점 진심으로 사과드립니다.\n\n문의 주신 세탁 진행 상태 관련하여 확인해보니,\n**개별 클리닝 / 생활빨래 / 운동화 등의 품목은 품목 등록 시간이 서로 상이할 수 있어 세탁 단계로 표시되기까지 다소 시간이 소요될 수 있습니다.**\n해당 안내가 사전에 충분히 전달되지 못한 점 죄송합니다.\n현재 고객님께서 보내주신 **이불은 정상적으로 품목 등록이 완료되어 세탁 진행 중인 것으로 확인됩니다.**\n\n다만 기존 **4/3 배송 예정이었으나, 현재 세탁 물량 증가로 인해 약 하루 정도 배송이 지연될 예정**으로 확인되었습니다.\n약속드린 일정에 맞춰 배송해드리지 못하게 된 점 진심으로 사과드립니다.\n하루 정도만 더 기다려주시면 신속히 처리하여 배송해드릴 수 있도록 하겠습니다.\n\n이와 관련하여 고객님의 실망감에 대해 다시 한번 사과의 말씀을 드리며\n또한, 고객님께서 차후 저희 서비스를 이용하실 때 조금이나마 도움이 될 수 있도록 포인트를 지급해 드렸습니다.\n비록 포인트가 고객님의 불편을 모두 해소할 수는 없겠지만, 이번 일을 계기로 더욱 정성을 다해 서비스 품질을 개선해 나가겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802990", "date": "2026-05-14", "cat": "기타", "title": "집중케어 품목 오류", "question": "바지 드라이를 두 장 맡겼고 그 중 앞부분에 끈 달린 조거팬츠에 집중케어 요청을 했는데 엉뚱하게 다른 바지에 집중케어가 되어 와서 정작 얼룩제거 요청했던 바지는 얼룩이 그대로 있고 얼룩제거 요청 없어도 기본 세탁으로 제거가 되어야하지않을까 싶은 오염 조차도 제거가 안 된 채로 왔네요", "answer": "김가윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802983", "date": "2026-05-14", "cat": "세탁 품질 문의", "title": "팔부분개선불가", "question": "수축후 늘려놓은건 그냥 넘어간다해도 팔부분 우글거리는건 진짜 심한데, 이것 다시 복구해주세요._x000D_\n그리고 배송료는 왜 결제된건가요?_x000D_\n안심케어 보내라고해서 보낸건데", "answer": "유혜선 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님. 런드리고 자유이용 서비스를 이용하실 때의 수거배송비는 19,500원 미만 이용 시 7,600원 19,500원 이상 이용 시 3,800원이 부과됩니다. 보다 상세한 내용은 런드리고앱 > 홈 > 가격표에서도 확인 가능합니다.\n\n**헌옷은 순차적으로 무게 계측 후 포인트가 지급**되며,\n이로 인해 정확한 지급 일자를\n사전에 안내드리기 어려운 점 너른 양해 부탁드립니다.\n\n알림 수신 동의 상태라면 지급 완료 후\n푸시 알림을 통해 확인 가능하시니 참고 부탁드립니다.🙏\n\n빠른 처리를 도와드리지 못해 다시 한 번 죄송합니다.\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802982", "date": "2026-05-14", "cat": "기타", "title": "완료되지 않았는데 완료 처리하신건가요?", "question": "제가 안심캐어 요청한 옷 왜 안주시나요? 언제 처리되죠? 처리량이 많아 답변 못한다는 말 마시도 빨리 답변해서 제 옷 사져다 주시죠?", "answer": "수현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 유선 상담 과정에서 충분히 만족스러운 안내를 드리지 못해 불편을 드린 점 진심으로 사과드립니다.\n\n해당 건은 현재 상위 부서로 이관되어 상세 내용 확인 및 추가 검토가 진행될 예정입니다.\n조사 및 검토가 완료되는 대로 별도로 안내드릴 예정이오니 참고 부탁드립니다.\n\n다시 한번 이용에 불편을 드린 점 사과드리며,\n신속히 확인하여 안내드릴 수 있도록 하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802978", "date": "2026-05-14", "cat": "기타", "title": "수선 가능 여부", "question": "원피스 기장 15cm 수선하고싶은데 밑단 디테일 살려서 수선할 수 있을까요?", "answer": "오선정 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n현재 **수선 서비스는 세탁과 함께  **\n**필수로 진행되는 서비스**입니다.\n따라서 세탁 없이 수선만 단독으로 진행하는 것은\n어려운 점 양해 부탁드립니다.\n\n이 방침은 수선 품질 유지와 작업 공정상\n불가피하게 운영되고 있으며,\n앱 내에서도 사전에 안내드리고 있습니다.\n관련 이미지를 함께 첨부드리니 참고 부탁드립니다.\n\n더불어, 기장 수선 요청주시는 경우\n5cm자른 후 밑단 접서 우선 진행하고 있습니다.\n이용에 참고해주시면 감사하겠습니다.\n\n앞으로 더 나은 서비스로 보답할 수 있도록\n최선을 다하겠습니다.\n\n다시 한 번 불편을 드려 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802976", "date": "2026-05-14", "cat": "기타", "title": "세탁 미진행", "question": "안녕하세요 _x000D_\n세탁을 진행했는데 , 세탁없이 그대로 담겨져 왔습니다. _x000D_\n그래서 다시 세탁 신청을 했는데 꼭 모든 세탁물 세탁 진행 요청드립니다.", "answer": "손민아 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n저희 런드리고의 카페트 분류 기준에 대해 안내 드립니다.\n\n**[일반러그(카펫) / 대형러그(카펫)]**\n\n- 사이즈 150 * 200 미만 [일반러그(카펫)]\n- 가로,세로 길이 중 짧은 쪽이 200cm 이상일 경우 [대형러그(카펫)]\n- 고무 패드 및 미끄럼 방지 처리가 되어있지 않은 경우에만 세탁 가능\n- 접히는(자유롭게 구겨지는) 소재이며, 런드렛 안에 수납 가능할 경우에만 세탁 가능\n\n**[스페셜 러그(카펫)-배송까지 5일 소요]**\n\n- 사이즈 150 * 200 미만 [스페셜 러그(카펫)]\n- 가로,세로 길이 중 짧은 쪽이 200cm 이상일 경우 [스페셜 대형 러그(카펫)]\n- 뒷면이 미끄럼 방지, 고무패드 등으로 딱딱하게 코팅 되어도 가능.\n- 유연하게 졉혀지지 않아도 가능\n\n안내드린 내용에 따라 분류 진행되고 있기에\n일반 세탁으로 서비스 진행이 어려운 경우\n스페셜 세탁 동의 안내를 진행드리고 있기에\n해당 부분 참고하시어 서비스 맡겨주시면 감사하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802974", "date": "2026-05-14", "cat": "결제/과금 문의", "title": "배송이 지연되어 그 사이 과금", "question": "세탁 8개, 배송 1개 있었으나_x000D_\n배송 지연으로 월정액 잔여 수량 사용 안하고_x000D_\n새로 과금되어 기존 갯수가 안보입니다._x000D_\n적용 해주시는거죠?", "answer": "이경민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 서비스 이용에 혼선을 드린 점 양해 부탁드립니다.\n\n최근 이란-이스라엘 전쟁 여파로 인한 원자재 가격 상승으로\n부득이하게 와이셔츠 세탁 요금이 2,400원에서 2,900원으로 인상되었으며,\n와이셔츠가 포함된 일부 요금제(와이셔츠&드라이, 올인원)는 운영 종료 및 개편이 진행되었습니다.\n\n해당 내용은 앱 내 팝업을 통해 안내드린 바 있으나,\n충분히 전달되지 못했다면 죄송한 마음입니다.\n\n요금 인상으로 불편을 드린 만큼,\n앞으로 더 정성스럽고 만족스러운 서비스로 보답드릴 수 있도록 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해 주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802972", "date": "2026-05-14", "cat": "배송관련 불편사항접수", "title": "와이셔츠 구겨짐", "question": "런드렛 오픈하니 와이셔츠 한개가 떨어져있어서 다 구겨진 상태로 배송되었습니다. 예전에도 한번 이랬었는데 배송시 신경좀 써주시면 감사하겠습니다.", "answer": "곽인경 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n우선 서비스 이용 중 불편을 드려 정말 죄송합니다.\n말씀하여 주신 사항에 대해서는 운송 담당 부서로 전달하여\n추후 동일한 문제 발생하지 않도록 서비스가 개선될 수 있도록 하겠습니다.\n\n보내주신 사진을 보니 전체적으로 의류의 구김 등 문제가 생긴 것으로 보여\n**[세탁물 이슈 접수]를 통해 재세탁을 통해 후속처리를 도와드리고 싶습니다. **\n아래 안내사항에 따라 안심케어를 신청해주시면,\n만족스러운 상태로 다시 전달드릴 수 있도록 최선을 다하겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의 수거 신청일을 선택한 뒤, 세탁물을 선택하고 **‘세탁물 이슈 접수’** 클릭\n3. 수거 신청 화면 상단의 **[안심케어]** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후 **승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n**✳️ 유의사항**\n\n- **세탁물 수령일로부터 7일 이내** 접수 및 승인 후, **30일 내 세탁물을 보내주셔야 후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우 후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과 **안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을 1차 확인 후 최대한 원상 복원을 진행하며, 완료 후 결과를 공유드립니다.\n- 검토하는 과정에서 의류 복구가 불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n\n진행하시면서 추가로 궁금하신 사항은 언제든지 문의 주시길 부탁드립니다.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802971", "date": "2026-05-14", "cat": "다림질 미흡", "title": "카라 다림질", "question": "카라를 접어서 다림질하지 말아주세요. _x000D_\n_x000D_\n차이나카라 자켓입니다.", "answer": "한영주 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 기대에 미치지 못한 상태로 의류가 전달되어\n실망하셨을 것 같아 진심으로 사과드립니다.\n\n저희는 스팀 다리미/스팀 기계를 사용해\n고온의 수증기로 주름을 정리하고 있습니다.\n\n직접 눌러 다림질하지는 않지만,\n이번 건은 과정에서 미흡함이 있었던 것으로 보입니다.\n\n해당 내용은 담당 부서에 공유하여\n재발 방지와 개선을 진행하겠습니다.\n\n**📌 추가 안내**\n\n- 세탁 시 **[집중케어]**로 요청해 주시면\n**얼룩 제거, 다림질, 보풀 제거** 등을 꼼꼼히 케어해 드립니다.\n\n- 이번 불편에 대해서는\n세탁비와 운송비를 포인트로 환불해드렸습니다.\n\n불편을 드려 죄송하며,\n다음 이용 시에는 더 세심하게 처리하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802968", "date": "2026-05-14", "cat": "오염 미 제거", "title": "오염 미 제거", "question": "안녕하세요._x000D_\n얼룩제거 요청드린 부분이_x000D_\n전혀 반영되지 않았습니다._x000D_\n확인부탁드릴게요._x000D_\n감사합니다.", "answer": "남보라 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n만족스럽지 않은 세탁 품질로 불편을 드리게 되어 많이 속상하셨을 것 같습니다.\n\n집중케어 및 개별클리닝 세탁 서비스 진행 시 세탁으로 지울 수 없는 얼룩은 약품을 통해 진행하고 있으나, 그로 인해 **변형/탈색이 발생될 우려가 있어 완벽한 제거가 어려웠던 것으로 보입니다.**\n\n**재세탁을 진행하여도 얼룩의 제거가 어려울 수 있고, 원단의 손상이 발생할 수 있어 도움을 드리기 어려운 점 사과드립니다.**\n\n이번에 만족스러운 서비스를 제공하지 못한 점에 대해 다시 한 번 사과의 말씀 드리며, 의류의 세탁비는 **세탁포인트****로 환불** 도와드렸습니다.\n\n여러 항목에 걸친 공정 테스트를 통해 문제의 원인을 해결하기 위해 노력하고 있으며, 빠른 시일내에 더 우수한 상태로의 세탁물을 받아보실 수 있도록 하겠습니다.\n\n추가로 궁금하신 사항은 언제든지 문의 주시길 부탁 드리겠습니다.\n감사합니다.\n\n런드리고 드림", "status": "접수완료"}, {"id": "802967", "date": "2026-05-14", "cat": "미수거/오수거 문의", "title": "수거 오류", "question": "런드리고 라고 써놓은 수거물 대신 (의류)_x000D_\n다른 개인 용품을 잘 못 수거해갔습니다 (운동화)", "answer": "주영민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802965", "date": "2026-05-14", "cat": "오염 미 제거", "title": "오염미제거", "question": "1. 남색 니트엔 무슨 먼지가 이렇게 많이 묻어왔나요 .. 고양이 털같은것도 있고... _x000D_\n2. 반팔 자켓은 주머니쪽에 검정색 오염 그대로고 겨드랑이랑 목쪽 누런자국도 안지워짐 이거 지우려고 세탁 맏긴건데_x000D_\n3. 흰색 트위드도 주머니쪽 오염 안지워짐", "answer": "유하린 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 믿고 맡겨주신 세탁물이\n기대에 미치지 못한 상태로 전달되어\n많이 속상하셨을 것 같습니다.\n\n그 마음 충분히 공감되며,\n불편을 드려 진심으로 죄송합니다.\n\n다만 말씀해주신 **얼룩은 일반 세탁만으로는 **\n**제거가 어려운 오염**으로 확인되며,\n**보다 정밀한 약품 처리가 필요**한 상태로 판단됩니다.\n\n해당 경우에는 개별 클리닝 과정을 거친 후\n보다 정성스럽게 관리해드리는** **\n**‘집중케어’** 서비스 이용을 추천드리고 싶습니다.\n\n집중케어는 **[얼룩제거], [보풀제거], [다림질] 등의 **\n**섬세한 케어가 필요한 작업을 선택형 프리미엄 서비스**입니다.\n\n\n* * *\n\n✅ **집중케어 신청 방법**\n**①** **[수거신청] 선택**\n ****\n\n**② [개별클리닝] 선택**\n \n\n**➂ 품목 선택 후,**\n 화면 예시처럼 추가 케어 항목을 체크해주세요.\n \n\n* * *\n\n📌 **유의사항**\n**✔︎** 요청 시 **의류 전체 사진**을 찍어주신 후\n    **세심한 케어 필요 부위를 표시**해주시면\n    정확한 처리가 가능합니다.\n\n\n* * *\n\n이번 건에 대해서는 만족스러운 케어를\n도움드리지 못해 죄송한 마음담아** **\n**세탁비용은 포인트로 환불** 처리하도록 하겠습니다.\n\n추후 다시 한번 더 집중케어 요청을 통해\n맡겨주시면 좀 더 꼼꼼히 케어 도와드리겠습니다.\n\n런드리고는 앞으로도 고객님의 소중한 옷을\n더 건강하고 세심하게 케어해드릴 수 있도록\n지속적인 품질 개선과 서비스 고도화에 최선을 다하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802964", "date": "2026-05-14", "cat": "기타", "title": "택배 오수거", "question": "세탁물을 수거를 제가 2개로 나눠서 내놨는데 1개만 가져가셨어요! ", "answer": "김지원 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n저희 런드리고 라이트백과 함께 비닐백 내어주셨으나 누락 수거되어 많이 당황스러우셨을 것 같습니다.\n\n다만 저희 서비스는 [런드리고 세탁물명] 메모를 부착해 주셔야\n세탁물(라이트백)과 함께 수거가 진행됩니다.\n\n타 업체 세탁물 혹은 버리는 의류가 지속적으로 오수거되는 상황이 발생하고 있기에\n메모 표기가 없는 경우 수거가 어려운 점 너그러운 양해 부탁드리겠습니다.\n\n번거로우시겠지만 현재 진행 중인 세탁물 세탁 완료 이후\n비닐백 겉면에 메모를 부착하여 다시 한번 수거 신청을 통해 맡겨주시길 바라겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802963", "date": "2026-05-14", "cat": "기타", "title": "옷안에 차키", "question": "맡긴 옷 중 정장 상의 오른쪽 주머니에  "cat": "런드렛 이용 문의", "title": "바지 수선 문의", "question": "안녕하세요 바지 기장 수선을 맡기려하는데_x000D_\n수선을 맡기면 세탁을 필수로한다는 문구가 잇어서_x000D_\n문의드립니다._x000D_\n택도 제거안한 새바지 기장만 줄이는데_x000D_\n세탁을 필수로 해야하나요? 그냥 바지수선만 하는건_x000D_\n불가능한가요??", "answer": "손수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 이용에 불편을 드려 대단히 죄송합니다.\n문의하신 수선비와 관련하여 기존에 결제되었던 20,000원 중, 차액인 **5,000원**에 대한 환불 처리가 정상적으로 완료되었습니다.\n환불 금액은 등록된 대표 결제수단으로 취소되며, 카드사 사정에 따라 영업일 기준 최대 5일 이내 입금될 예정입니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802818", "date": "2026-05-13", "cat": "기타", "title": "배송 지연에 따른 보상 요청", "question": "왜 지연이 되나요? 구독을 하고 서비스를 이용하는데_x000D_\n_x000D_\n지연에 따른 보상 처리 진행해주세요_x000D_\n_x000D_\n소비자는 돈을 내고 해당 서비스를 이용하는데 약속된 서비스를 제공하지 않는 것에 대해 보상 처리 바랍니다.", "answer": "박성훈 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 요청해주신 **[올인원 129]** 요금제의\n즉시 해지 처리를 도와드렸습니다.\n\n다만, 이번 달에는 서비스를 사용하지 않았다고 하셨는데,\n4/24일 요금제 갱신 후 4/24일 서비스 사용 이력(생활빨래 8.7kg, 바지 1장, 가디건 1장)이 있습니다.\n해당 이용 내역 정산 후, 잔여금액에 대한 환불이 진행되는 점 참고 부탁 드립니다.\n\n고객님의 대표결제수단인 신한카드로 84,400원이 환불 처리 완료되었으며,\n환불 금액은 카드사 영업일 기준으로 최대 5일 정도 소요될 수 있는 점 양해 부탁드립니다.\n\n그동안 이용하시면서 겪으신 불편에 대해 무겁게 받아들이고 있으며,\n고객님의 경험이 개선될 수 있도록 내부적으로 문제를 점검하고\n서비스 전반의 응대 및 운영 과정을 보완해 나가겠습니다.\n\n기대에 미치지 못한 점 다시 한 번 깊이 사과드리며,\n추후 더 나은 모습으로 서비스를 제공할 수 있도록 노력하겠습니다.\n\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802816", "date": "2026-05-13", "cat": "결제/과금 문의", "title": "꼼데 프리미엄인가요", "question": "?", "answer": "황나현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의하신 **[런드리&드라이 스탠다드]** 요금제의 품목 차감 기준 및\n지난 4월 18일 이용 내역에 대해 안내드립니다.\n\n해당 구독 플랜은 다음과 같은 기준으로 품목권이 차감됩니다.\n\n- **개별 클리닝 의류:** 품목당 **1개** 차감 (단, 패딩류는 **2개** 차감)\n- **생활 빨래(4kg 기준):** **1개** 차감\n\n지난 4월 18일에 맡겨주신 세탁물은 위 기본 품목권 차감 기준에\n해당하지 않는 품목으로 확인되어,\n구독 혜택인 **20% 할인**이 적용된 금액으로 결제되었습니다.\n\n이용 중이신 요금제의 상세 차감 기준은 앱 내 **[My > 이용 중인 요금제 선택 > 구독 관리 > 차감 기준]** 메뉴에서 언제든지 확인하실 수 있습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802812", "date": "2026-05-13", "cat": "기타", "title": "이전문의건 관련 사진첨부", "question": "검정색 캐시미어코트 블랙색상이고 브랜드텍 첨부합니다", "answer": "안규미 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서 이용한 개별클리닝은\n의류의 케어라벨에 맞춰진 최적의 세탁코스를 통해\n세탁/건조 과정이 진행됩니다.\n\n또한, 의류의 소재와 오염 유형에 따라 다음 두 가지 방식 중 하나로 진행됩니다.\n\n**웨트 드라이클리닝:** 물을 주성분으로 사용하는 세탁 방식으로, 수용성 오염 제거에 적합합니다.\n**드라이클리닝:** 유기 용제를 사용하는 세탁 방식으로, 지용성 오염 제거에 적합합니다.\n\n따라서 맡겨주신 의류가 캐시미어 소재라면,\n해당 소재에 따른 적합한 클리닝이 진행될 예정임을 안내드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802807", "date": "2026-05-13", "cat": "배송관련 불편사항접수", "title": "[배송 누락 및 분실 문의] 개인 쇼핑백 미반환 및 개별클리닝 백 미동봉 관련 확인요청", "question": "안녕하세요. 런드리고 배송 관련 문의드립니다._x000D_\n_x000D_\n이번에 빨래감을 보낼 때 제 개인 쇼핑백 안에 세탁물을 담아 보냈는데, 오늘 세탁물을 배송받아 확인해보니 해당 개인 쇼핑백이 함께 돌아오지 않았습니다._x000D_\n_x000D_\n개인 쇼핑백은 제가 따로 준비해서 세탁물을 담아 보낸 물품이라, 배송 또는 처리 과정에서 누락/분실된 것으로 보입니다. 어디에서 누락된 건지 확인 부탁드립니다._x000D_\n_x000D_\n그리고 함께 확인 요청드립니다. 원래 런드리고 안에 개별클리닝용 백이 있어야 생활빨래나 속옷류와 분리해서 맡길 수 있는데, 이번 배송분에는 개별클리닝 백도 동봉되어 있지 않았습니다._x000D_\n_x000D_\n개별클리닝 백이 없으면 의류를 속옷이나 생활빨래와 분리해서 맡기기 어려운데, 이런 상태면 개별클리닝을 맡기지 말라는 건지 의문입니다. 이전에도 분류 문제로 불편을 겪은 적이 있어서 더 신경 쓰이는 부분입니다._x000D_\n_x000D_\n정리해서 아래 두 가지 확인 부탁드립니다._x000D_\n_x000D_\n1. 제가 보낸 개인 쇼핑백이 왜 반환되지 않았는지  _x000D_\n2. 개별클리닝 백이 왜 동봉되지 않았는지, 그리고 앞으로 개별클리닝 의류는 어떻게 분리해서 보내야 하는지_x000D_\n_x000D_\n개인 쇼핑백은 분실 여부 확인 후 반환 가능 여부를 안내해주시고, 반환이 어렵다면 그에 대한 처리 방안도 함께 안내 부탁드립니다.", "answer": "양성현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 미수거로 인해 서비스 이용에 불편을 드린 점 진심으로 사과드립니다.\n\n고객님께서 말씀주신 것처럼 별도 쇼핑백에 담아 라이트백과 함께 배출해주신 것으로 확인되었습니다.\n\n다만 심야 시간대 수거 과정에서 기사님께서 해당 쇼핑백을 확인하지 못하고 라이트백만 수거된 것으로 확인되었습니다.\n\n말씀주신 바와 같이, 요청하신 서비스 내역과 실제 수거 내역이 상이한 경우 사전에 별도 안내가 이루어졌어야 하나,\n검수 및 품목 등록이 일부 심야 시간대에 진행되면서 즉각적인 안내가 이루어지지 못한 점에 대해 사과드립니다.\n\n해당 수선 건은 번거로우시겠지만 신규 수거 신청을 부탁드리며,\n동일한 불편이 재발하지 않도록 수거 과정 및 확인 절차에 대해 담당 부서에 강화 요청을 전달하겠습니다.\n\n아울러 번거로우시겠지만, 별도 쇼핑백이 있는 경우\n메모를 부착하신 후 라이트백과 함께 현관문에 걸어 배출해 주시기를 부탁드립니다.\n\n또한 이번 건으로 인해 불편을 겪으신 점을 고려하여,\n이번 서비스 이용 시 사용하실 수 있도록 소정의 포인트를 지급해드렸습니다.\n다만 단순한 보상이 충분한 해결이 되지 못한다는 점을 알고 있으며,\n서비스 개선으로 보답드릴 수 있도록 하겠습니다.\n\n만족스러운 답변을 드리지 못한 점 다시 한 번 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802806", "date": "2026-05-13", "cat": "기타", "title": "발매트", "question": "발매트는 보낸적이 없는데.. 혹시 어떤 제품인지 알 수 있을까요?", "answer": "조수민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n현재 고객님의 2026-04-06 수거신청 건은\n정상적으로 입고되어 세탁이 진행중인 것으로 확인되며,\n'여러밤배송' 특성상 입고 검수까지 다소 시간이 걸린 점\n너른 양해 부탁드립니다.\n\n최근 급격한 날씨 변화로 주문량이 크게 증가하면서\n일부 지역에서 배송이 지연된 점 너른 양해 부탁드립니다.\n\n기다려주신 고객님의 시간을 무겁게 받아들이고 있으며,\n현재 전 공정의 작업 속도를 높이고\n세탁물 하나하나 꼼꼼히 검수하여\n보다 안전하고 신속하게 전달드릴 수 있도록 최선을 다하고 있습니다.\n\n앞으로는 이러한 불편이 반복되지 않도록\n보다 안정적인 운영과 안내를 위해 더욱 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802805", "date": "2026-05-13", "cat": "프리미엄 세탁동의 및 미세탁 문의", "title": "세탁 미진행 관련", "question": "세탁 미진행으로 돌아왔는데, 세탁 비용은 결제가 되었어요. 확인 부탁드립니다.", "answer": "다인 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 서비스 이용에 불편을 드려 진심으로 사과드립니다.\n\n문의주신 [운동화 - 전체 세탁 / 가죽] 품목은 입고 후 검수 과정에서 프리미엄 브랜드의 부분 가죽 소재가 확인되었습니다.\n\n프리미엄 브랜드의 가죽 소재는 손상 우려가 있어 전문 업체를 통한 세탁을 권장드리는 점 양해 부탁드립니다.\n\n고객님의 소중한 세탁물을 안전하게 보호해드리기 위해 부득이하게 세탁은 진행하지 않고 반려 처리된 점 너그러운 양해 부탁드립니다.\n\n또한 사전에 별도로 연락을 드리지 못해 더욱 당황스러우셨을 것으로 생각됩니다.\n세탁이 어려운 품목의 경우 별도 동의 없이 반려 처리가 진행될 수 있는 점 참고 부탁드립니다.\n\n불편을 드린 점 다시 한 번 진심으로 사과드리며,\n앞으로 더 나은 서비스로 보답드릴 수 있도록 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802800", "date": "2026-05-13", "cat": "결제/과금 문의", "title": "수거비 문의", "question": "찢어짐 문제로 인해 세탁이 아예 안되었더라구요._x000D_\n그런데 문제는 처음 이용했던 수거비에 반해, 두번째건은 두배로 책정이되어있습니다._x000D_\n_x000D_\n정확한 계산 로직이 뭔지 알 수 있을까요?_x000D_\n아울러 찢어짐 문제로 인한 반려가 될 시 이렇게 시간과 돈만 낭비하는 꼴이 맞는지.. 문의드립니다._x000D_\n찢어진 부분도 적은 편인데 사전 알림없이 냅다 반려받으니 굉장히 난감하네요.", "answer": "양영혜 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의주신 가방 이용요금 관련하여 안내드립니다.\n\n말씀주신 가방이 토트백 형태에 해당하는 경우에는 토트백으로 분류되고 있습니다.\n다만 가방은 크기뿐 아니라 형태와 소재를 함께 확인하여 최종 분류하고 있어,\n실제 분류는 현장 검수 후 확정되는 점 참고 부탁드립니다.\n\n또한 가방 소재에 따라 세탁이 어려운 경우가 있을 수 있으며,\n이 경우에는 세탁 불가 처리 후 다시 배송해드리고 있습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802799", "date": "2026-05-13", "cat": "기타", "title": "배송", "question": "언제 답변 주시나요?", "answer": "고객님 알림으로 불편드려 죄송합니다.\n해당 건은 현재 전일 출고되지 못한 상황으로 파악되어\n담당 부서 측에 내용 전달하여 출고 진행하도록 하겠습니다.\n\n금일 출고 예정으로 해당 상담은 종료하겠습니다.\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802796", "date": "2026-05-13", "cat": "기타", "title": "배송 문의", "question": "도대체 언제 주시나요? 모자?_x000D_\n제품을 안줄꺼면 답글이라도 달아야죠_x000D_\n분실하샸나요?_x000D_\n다른곳에 간 거 찾으시나요?", "answer": "장진영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의하신 세탁물의 배송 일정을 확인해 보니, 지난 4월 6일에 정상적으로 수거가 완료된 것으로 확인됩니다.\n현재 여러밤 배송 서비스로 진행 중이며, 이에 따라 4월 11일에 배송될 예정입니다.\n자세한 배송 예정일은 런드리고 앱 내 주문 내역에서도 직접 확인해 보실 수 있습니다.\n\n정성을 다해 세탁하여 약속드린 일정에 맞춰 안전하게 보내드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802792", "date": "2026-05-13", "cat": "오염 미 제거", "title": "와이셔츠 카라 세탁이 제대로 지워지지 않았어요.", "question": "와이셔츠 두개 다 카라부분이 너무 더럽습니다._x000D_\n팔 소매도 더러워요.", "answer": "임수향 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의주신 내용과 관련하여 이 전 문의글을 통해 답변이 완료된 것으로 확인되어\n본 문의글은 종료 진행하도록 하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802791", "date": "2026-05-13", "cat": "변형/변색/손상", "title": "안심케어 승인되었는데요", "question": "줄어든 바지를 늘려주신다는걸까요..??_x000D_\n수거하면 뭘 해주신다는건지 안내도 없고 뭘 해주실 예정인지 답변부탁드립니다.", "answer": "박우영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n맡겨주신 세탁물에서 불편을 겪으셔서\n많이 당황하셨을 것 같아 죄송한 마음입니다.\n\n확인 결과, 문의주신 세탁물은\n생활빨래로 접수된 건으로 확인됩니다.\n\n다만 죄송하게도 문제 접수주신 내용에 대해서는\n생활빨래 서비스 특성상 별도의 도움을 드리기\n어려운 점 너그럽게 양해 부탁드립니다.\n\n**📌 생활빨래 서비스 안내  **\n\n**-** **생활빨래는 검수 과정 없이  **\n** 보내주신 상태 그대로 세탁/건조가 진행****됩니다. **\n\n**- 이 때문에** **입고 시 상태와 배송 후 상태를  **\n** 정확히 비교하기 어려워  **\n** 재세탁이나 추가 케어가 제공되지 않습니다.  **\n\n- 기계 세탁/건조 방식으로 운영되므로\n 케어라벨 상 기계 세탁·건조가 불가한 의류는\n 번거로우시더라도 개별클리닝으로 맡겨주셔야 합니다.\n\n앞으로는 더 만족스러운 서비스 경험을\n드릴 수 있도록 계속 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802789", "date": "2026-05-13", "cat": "배송시간/배송지연 문의", "title": "배송이 계속 지연되는 이유가 뭔가요", "question": "이유 없는 세탁물 배송 지연 및 빈 런드렛 수거로 인한 지연에 대한 보상을 요구합니다. 처음부터 제대로 세탁이 되지 않은 세탁물에 대해 세탁 재요청을 드렸는데 밤8시쯤 빈 런드렛만 수거하셔서 시간이 지연되었고 이제는 이유없이 배송이 지연되고 있습니다. 1. 세탁물이 제대로 세탁되지 않아서 재요청 할 수 밖에 없었던 상황 2. 밤8시에 빈 런드렛만 수거한 상황 3. 이유없이 며칠째 배송이 지연되는 상황에 대한 보상을 요청합니다.", "answer": "김태현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 안내 완료되어\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802787", "date": "2026-05-13", "cat": "런드렛 이용 문의", "title": "첫수거라 런드렛이 없어요", "question": "런드렛이 없는데 이불을 어디다 둬야할까요? ㅠ", "answer": "심보민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 이용에 감사드립니다.\n\n세탁물 배출시에는 폐기 가능한 쇼핑백 또는 비닐에 세탁물 담아\n문 밖 배출 요청 드립니다.\n\n세탁물 담아 보내주신 부속품은 폐기 처리 되어 반환이 불가한 부분으로\n의류 커버 이용은 권고드리지 않는 점 안내드립니다.\n\n또한, 수거 시간 관련 문의 주신 부분 확인되어 안내 드립니다.\n\n런드리고는 고객님께서\n**수거 신청을 하신 시점부터**\n순차적으로 수거가 진행되며,\n**신청 마감은 밤 10시(22시)**입니다.\n\n또한 정해진 운송 경로에 따라\n**일괄 수거 → 일괄 배송**이 이루어지고 있어\n고객님이 요청 주신 **정확한 시간**에\n맞춰드리기는 어려운 점 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802783", "date": "2026-05-13", "cat": "기타", "title": "헌옷 수거", "question": "런드렛 이용시 헌옷 수거도 같이 신청해서 내놓았는데 신청이 안된 것인지 런드렛만 가져가셨어요. 확인 부탁드립니다. ", "answer": "정지영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 수거 과정에서\n혼란과 불편을 드린 점 진심으로 사과드립니다.\n\n**📌 수거 신청 마감 기준  **\n\n앱에 표시된 ‘22시’는 방문 시간이 아니라\n수거 신청 마감 시간을 의미합니다.\n\n22시 이전 접수 건은 당일 밤~익일 오전 사이\n기사님 동선에 따라 순차적으로 수거됩니다.\n22시 이후 접수 건은 익일 수거로 전환됩니다.\n\n**📌 수거 정책  **\n\n- **수거 신청이 접수되면**\n**기사 분의 동선에 따라 순차적으로 1차 방문**하고 있습니다.\n\n- **밤 10시까지 세탁물이 나오지 않으면 미수거로 간주**되며,\n 이 경우 편도 **운송료 3,800원이 부과**됩니다.\n\n- **1차 방문 후 수거가 되지 않아도 **\n**밤 10시까지 다시 확인 후 수거가 진행**되므로,\n**이른 방문 이후 곧바로 운송료가 청구되는 일은 없습니다.  **\n\n👉 다음번 이용 시에는 위 내용을 참고해 주시면\n불필요한 재접수나 걱정 없이 편리하게 이용하실 수 있습니다.\n\n더 명확하고 편리한 서비스 제공을 위해\n지속적으로 개선해 나가겠습니다.\n\n또한, 수거 건이 있을 경우 추가 수거 신청이 불가한 부분으로\n수거 배송비 세탁 포인트로 선 적립 도와드렸습니다.\n\n해당 수거건 수령 확인 후 신규 수거 신청 요청 드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802781", "date": "2026-05-13", "cat": "오염 미 제거", "title": "사진상 분홍 얼룩이 보이는데요", "question": "분홍색 얼룩이 생겨서 안심세탁 보냈는데_x000D_\n사진상 분홍얼룩이 또 보입니다,_x000D_\n얼룩제거 전부 제대로 된거 맞나요?", "answer": "김지영 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저 소중한 세탁물을 믿고 맡겨주셨음에도 불구하고\n불편을 겪으신 점에 대해 깊이 공감하며, 진심으로 사과드립니다.\n\n문의주신 내용에 대해서는\n담당 부서 측 확인이 필요하여\n번거로우시겠지만 아래 경로를 통해 다시 한번 더 수거 진행을 부탁드리겠습니다.\n\n**[세탁물 이슈 접수]****를 통해 **\n**정확하고 신속한 재세탁 처리가 가능하며,**\n**재세탁 후에는 더욱 만족스러운 결과물을 **\n**받아보실 수 있을 것으로 생각됩니다.**\n**번거로우시겠지만 세탁물 이슈 접수를 진행해 주시기 바랍니다.**\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n앞으로도 고객님의 소중한 의견을\n바탕으로 더욱 세심하게 케어 하며\n신뢰받는 서비스를 제공하기 위해 최선을 다하겠습니다. 🙇‍♀️\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802780", "date": "2026-05-13", "cat": "기타", "title": "수선내용", "question": "바지 2벌 수선인데 남색 바지는 브라운색 바지 길이와 동일하게 맞춰서 수선해 주세요._x000D_\n브라운색 바지는 바깥쪽 옆라인이 오른쪽 왼쪽이 뜯어졌습니다", "answer": "고객님 회신 감사합니다.\n해당 의류는 금일 별도 수거 진행 하도록 하겠습니다.\n\n번거롭게 해드린 점 다시 한번 사과 말씀 드리며,\n해당 건에 대해서는 작업자 재교육 진행할 수 있도록 하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802779", "date": "2026-05-13", "cat": "기타", "title": "헌옷중량 동의의 건", "question": "답변주신대로 해 주시는데 동의 합니다._x000D_\n_x000D_\n답변에 감사드립니다", "answer": "김은주 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 현재 정상적으로 수거신청 완료 및\n수거가 완료된 상태로 확인됩니다.\n\n최근 성수기 물량 증가로 인해\n입고된 세탁물이 순차적으로 처리되고 있어\n등록까지 다소 시간이 소요되고 있는 점 너른 양해 부탁드립니다.\n\n현재 기준으로는 수거일 기준\n약 1~2일 내 등록이 완료될 것으로 예상되며,\n이후 세탁 및 배송까지 순차적으로 진행될 예정입니다.\n\n또한, 이전 문의주신 내용과 같은 오류가 재차 발생 시\n해당 화면을 캡처하여 문의 주시면\n좀 더 빠르게 도움을 드릴 수 있도록 하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802776", "date": "2026-05-13", "cat": "수선 불만", "title": "수선 기장 확인 요청", "question": "기장 3cm 수선요청인데 총장에서 3cm가 아닌 5cm 더 넘게 줄어서 왔어요; 기장 줄임 요청시 더 작은 cm를 입력해야하는건가요? 다른 바지들은 아직 확인 못해봤습니다", "answer": "윤일광 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802769", "date": "2026-05-13", "cat": "배송시간/배송지연 문의", "title": "배송 아직 안왔어요", "question": "배송지연된 옷, 어제 출고 될거라고 답변 주셨는데 아직 안왔어요._x000D_\n언제 도착하나요?_x000D_\n위치파악 부탁드려요.", "answer": "진새롬 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n해당 의류 관련 안내가 지연된 점 진심으로 사과드립니다.\n\n현재 단추 부속은 아직 확보되지 않은 상태이며, 담당 부서에서 후속 조치 방안을 확인 중에 있습니다.\n확인되는 대로 신속하게 별도 안내드릴 예정입니다.\n\n기다리시게 되어 불편을 드려 죄송하며, 조금만 시간 양해 부탁드립니다.\n\n다시 한번 불편을 드린 점 진심으로 사과드립니다.\n\n궁금하신 점은 언제든 편하게 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802767", "date": "2026-05-13", "cat": "미수거/오수거 문의", "title": "회색 모자 달린 후드티 미배송", "question": "안녕하세요,_x000D_\n이전에 미배송 접수했던 바지 2개(회색, 갈색)은 제가 옷장에 넣어두고 착각했었음을 먼저 말씀드립니다. 해당 건은 미배송아니므로 접수 취소 합니다._x000D_\n다만 5월 10일 배송 건에 회색 후드티(모자달린) 못 받았습니다. 모자 안달린 회색티만 왔어요._x000D_\n해당 세탁물 세탁 전 펼쳐 놓으신 사진 공유해 주시고 확인 요청드립니다.", "answer": "강지선 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n서비스 이용중 불편을 드리게 되어 죄송합니다.\n\n바코드 등록 과정에서 누락이 있었던 점 확인되며,\n해당 의류는 현재 저희가 보유중으로 확인되어\n금일 빠른 출고와 배송을 도움드리고자 합니다.\n\n추후 동일한 문제가 재발하지 않도록\n담당부서 측 강력한 주의 전달 요청드리도록 하겠으며,\n의류는 꼼꼼하게 확인 및 포장하여\n오늘 저녁 ~ 내일 오전 사이 배송 받아보실 수 있도록 조치하겠습니다.\n\n \n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802766", "date": "2026-05-13", "cat": "런드렛 이용 문의", "title": "아우터보관서비스", "question": "3개 무료 보관이 가능하다고 하는데 어떻게 해야하나요?_x000D_\n오늘밤 아우터를 맡기는데 부피가장 큰거 3개만무료보관신청하고 싶습니다", "answer": "이정은 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n우선 서비스 이용에 불편을 드린 점 진심으로 사과 드립니다.\n\n보관 서비스 신청은 수거신청 시 앱 내에서 신청해주시고\n분류해서 보내주셔야 서비스 신청 가능한 점 안내 드립니다.\n\n전산상으로 서비스 신청을 해주셔야하는 이유는\n수거신청 시 서비스 신청하는것으로 저희가 과금을 진행하고 있습니다.\n그러다보니 글로 써주시는 서비스 신청은 반영이 되지 않습니다.\n\n수거신청 기준으로 처리되다보니 고객님께서 원하시는 방향으로 진행은 어려운 점\n다시 한번 고개숙여 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "802761", "date": "2026-05-13", "cat": "기타", "title": "통장사본 ", "question": "옷안쪽에 제품명검색하면 나오겟지만 _x000D_\n70만원중반대로 알고잇고_x000D_\n텍은 이사오면서 분실됫어요 _x000D_\n", "answer": "아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 쿠폰 적용에 대해 관심을 가지고 문의 주셔서\n진심으로 감사드립니다.\n\n문의주신 [식목일엔겨울옷정리] 니트 1벌 천원 쿠폰은\n니트류 전체에 각각 적용되는 것이 아니라,\n니트 1벌에 대해서만 1,000원 혜택이 적용되는 점 안내해 드립니다.\n여러 벌을 맡기시더라도 그중 한 벌에 대해서만 할인이 적용됩니다.\n\n더불어, 또한, 해당 쿠폰을 사용하기 위해서는\n수거 신청 시 전체 세탁 비용의 합계가\n20,000원 이상이어야 정상적으로 적용이 가능합니다.\n\n이용 조건에 대해 미리 상세히 안내해 드리지 못해\n혼선을 드린 점 너그러운 양해를 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802752", "date": "2026-05-13", "cat": "변형/변색/손상", "title": "색이 푸른빛이나게 변색되었네요", "question": "구매하고 첫 세탁인대 입을수 없게 푸른빛으로 변색되어왔습니다_x000D_\n얼룩케어요청했는데 얼룩은 지워지지않고 옷 색만 변색되어욋내요 대책마련해주세요 ", "answer": "김아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 앞서 담당 부서 측과 소통해주신 이력 확인되어\n해당 문의글은 종료됨을 양해 부탁드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "접수완료"}, {"id": "802750", "date": "2026-05-13", "cat": "기타", "title": "패딩 미배송", "question": "4/30자 패딩누락으로 인해  문의남겼는데_x000D_\n언제까지 기다려야 하나요? 누락인지 다른곳에 오배송된건지_x000D_\n확인후 회신부탁드립니다.", "answer": "황대산 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n생활빨래망이 누락되어 많이\n불편하셨을 것 같습니다.\n\n저희 서비스 이용에 불편을 드려\n진심으로 사과드립니다.\n\n세탁물 물량 급증으로 인해\n생활빨래망 재고가 부족하여\n당분간 빨래망을 보내드리기가 어려운 상황입니다.\n\n너른 마음으로 양해를 부탁드립니다.\n\n대체 수거 방법으로는,\n임시 포장: 폐기가 가능한 일반 쇼핑백이나 비닐봉투를 준비해 주세요.\n메모 부착: 포장 겉면에 [런드리고 생활빨래] 라고 크게 메모를 붙여 문 앞에 배출해 주세요.\n\n입고 당시 보내주신 세탁물의 세탁방법을\n오처리하지 않도록(개별클리닝 진행) 확인하기 위한\n필수 조치이니 꼭 메모 기재를 부탁드립니다.\n\n이용에 불편을 드린 점 다시 한번 사과드리며,\n보다 안정적인 서비스를 제공할 수 있도록 최선을 다하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.
