당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[이염]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801152", "date": "2026-05-11", "cat": "기타", "title": "런드렛 반납비용", "question": "런드렛을 강제로 갖가 놓으시고 왜 반납비를 가져가시나요?? 전 러드렛을 신청한 적 없고 원한적이 없어요", "answer": "김민재 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n말씀 주신 내용 확인 해보니\n**2026-03-22 수거요청 주신 건의 배송 시**\n**런드렛을 함께 배송**하여 드린 후\n해당 런드렛에 대해 수거 및 입고된 내역이 없는 점 안내드립니다.\n\n따라서 자택 주변 런드렛 확인을 부탁드리며,\n**확인되는 런드렛이 없을 시 런드렛 분실로 추정** 됩니다.\n\n해당 런드렛 미확인 시 다시 한번 문의 주시면\n런드렛 분실에 대한 후속 방안 안내를 도와드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801149", "date": "2026-05-11", "cat": "배송시간/배송지연 문의", "title": "언제 배송", "question": "배송언제되나요", "answer": "오병준 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 예정하신 일정이 있으셨을 텐데\n약속드린 날짜에 맞춰 세탁물을 전달드리지 못해\n많이 불편하셨을 것 같아 진심으로 사과드립니다.\n\n최근 급격한 날씨 변화로 주문량이 크게 증가하면서\n일부 지역에서 배송이 지연된 점 너른 양해 부탁드립니다.\n\n고객님의 세탁물은 2026-04-13 00:31:15\n안전하게 배송이 완료되었습니다.\n\n고객님께서 느끼신 불편에 비하면 부족한 수준이지만,\n조금이나마 마음을 전하고자 소정의 포인트를 지급해드렸습니다.\n너그럽게 양해해주시면 감사하겠습니다.\n\n앞으로는 보다 안정적인 서비스로 보답드릴 수 있도록 최선을 다하겠습니다.\n다시 한번 불편을 드린 점 깊이 사과드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801138", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "세탁권 차감 여부", "question": "안녕하세요, 이용내역에는 품목세개만 기본 세탁권 차감이라고 되어있는데 6장을 다썼다고 나와서요, 다른 품목중 차감된것이 있을까요?", "answer": "이경희 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n구독요금제 이용 관련 문의주셨네요.\n수령확인 시점,\n고객님 앱에 최종 차감된 이용권수와 초과이용금액이 결제 진행됩니다.\n\n현재 고객님 이용권 확인하니,\n사용품목수 5개(반코트 2개차감)되어 잔여갯수 1개로 확인되십니다.\n\n해당 내용은 **앱>My 상단 요금제** 영역 혹은\n**이용내역**에서 확인 가능하십니다.\n\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801133", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "월결제됐는데 왜 두번결제가되고 어떻게 해지하냐고", "question": "아니 시발 여기는 뭐 연락도 안되. 돈은 쳐먹어. 어떤 시발같은회사야", "answer": "황나현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의하신 **[런드리&드라이 스탠다드]** 요금제의 품목 차감 기준 및\n지난 4월 18일 이용 내역에 대해 안내드립니다.\n\n해당 구독 플랜은 다음과 같은 기준으로 품목권이 차감됩니다.\n\n- **개별 클리닝 의류:** 품목당 **1개** 차감 (단, 패딩류는 **2개** 차감)\n- **생활 빨래(4kg 기준):** **1개** 차감\n\n지난 4월 18일에 맡겨주신 세탁물은 위 기본 품목권 차감 기준에\n해당하지 않는 품목으로 확인되어,\n구독 혜택인 **20% 할인**이 적용된 금액으로 결제되었습니다.\n\n이용 중이신 요금제의 상세 차감 기준은 앱 내 **[My > 이용 중인 요금제 선택 > 구독 관리 > 차감 기준]** 메뉴에서 언제든지 확인하실 수 있습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801130", "date": "2026-05-11", "cat": "런드렛 반납 문의", "title": "가져가라", "question": "ㅡㅡ버린다", "answer": "정필립 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n죄송하지만 런드렛 반납은\n고객님께서 직접 신청해주셔야 하는 점 안내드립니다.\n\n**런드리고 앱 > MY > 런드렛 반납**을 통해\n반납 희망하시는 날짜를 선택하시어 신청 부탁드립니다!\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801129", "date": "2026-05-11", "cat": "미수거/오수거 문의", "title": "왜 자꾸 엄한데로 들어오시나요?", "question": "같은 주소에서 정상적으로 수거와 세탁이 완료된 바 있습니다. _x000D_\n그런데 지금 이틀 연속으로 수거차량이 지상으로 들어오려고 하여 (원래 지상에 차량 운행 불가/지하 진입 가능) 수거가 안되고있어요. _x000D_\n수거지 정보에 지하로 진입 가능이라고 기재해놓았는데도 불구하고 반복되는 미수거 상황이 이해 가지 않습니다. ", "answer": "김수열 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n내어주신 세탁물의 일부가 미수거되어\n많이 당황스러우셨을 것 같습니다.\n\n문의 주신 내용을 확인한 결과,\n따로 봉투에 담아 배출주신 세탁물 봉투에는\n런드리고 세탁물임을 표시하는 메모가\n부착되지 않아 미수거 처리된 것으로 확인되었습니다.\n\n세탁물을 런드렛 또는 라이트백 외의 봉투에\n배출해 주실 경우, 폐기 가능한 봉투나 쇼핑백에 담아\n[런드리고 + 세탁서비스명]을 종이에 기재 후\n부착해 주셔야 수거가 가능합니다.\n\n이는 폐기물 및 기타 물품과의 혼선을 방지하고\n정확한 수거를 위해 사전에 안내드리는 이용 가이드 사항으로,\n부득이하게 협조를 부탁드리는 점 양해 부탁드립니다.\n\n또한 서비스 이용 중에는 별도의 수거 방문이나\n자동 수거가 불가하므로, 세탁물을 수령하신 후\n고객님께서 직접 수거 신청을 진행해 주셔야 합니다.\n\n번거로우시겠지만 세탁물 배송 이후\n다시 한 번 안내드린 방법대로\n수거 신청 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801128", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "현금결제, 세금계산서 처리 될까요?", "question": "현금결제, 세금계산서 처리 될까요? 안녕하세요", "answer": "민호 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n생활빨래 차감 관련하여 문의주신 내용 안내드립니다.\n\n현재 요금제는 차감 우선순위에 따라 개별클리닝 품목이 먼저 차감된 후, 생활빨래가 차감되는 구조로 운영되고 있습니다.\n또한 생활빨래는 4kg당 세탁권 2장 차감 기준으로, 해당 구간은 2장이 있어야 차감이 가능합니다.\n\n고객님의 경우 총 약 9kg 이용으로 확인되며,\n먼저 개별클리닝 품목 차감이 이루어진 이후 잔여 세탁권이 1장만 남아 생활빨래 차감이 추가로 진행되지 않았고,\n이로 인해 나머지 이용량은 초과 이용으로 과금된 점 안내드립니다.\n\n이용 방식이 다소 복잡하게 느껴지셨을 수 있는 점 너그러운 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801127", "date": "2026-05-11", "cat": "런드렛 반납 문의", "title": "런드렛 반납", "question": "반납날짜가 지났는데 반납이 안되고 있습니다. 탈퇴를 위해 반납 처리해주세요", "answer": "정필립 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n죄송하지만 런드렛 반납은\n고객님께서 직접 신청해주셔야 하는 점 안내드립니다.\n\n**런드리고 앱 > MY > 런드렛 반납**을 통해\n반납 희망하시는 날짜를 선택하시어 신청 부탁드립니다!\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801119", "date": "2026-05-11", "cat": "미수거/오수거 문의", "title": "오수거", "question": "박스위에 셔츠와 바지만 세탁을 맡길 생각이었는대, 밑에있던 겨울옷 박스까지 수거해가셨습니다. 이전에 똑같은 상황에서는 수거 안하셨는데.. ", "answer": "주영민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801118", "date": "2026-05-11", "cat": "세탁 품목 오류접수", "title": "세탁물 누락인가요?", "question": "교복재킷1, 이불 1  같이 요청했는데 내역에는 이불이 없습니다", "answer": "이현서 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n우선 서비스 이용에 불편을 드린 점 진심으로 사과 드립니다.\n\n4/17 요청주신 품목 재분류는 승인해 드렸습니다.\n이용에 불편을 드린 점 다시 한번 사과 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801117", "date": "2026-05-11", "cat": "기타", "title": "아파트 수거차량 시간", "question": "아파트 수거차량 금지시간이_x000D_\n밤11시50분-새벽5시50분입니다._x000D_\n그래서 어제 오셨다가 돌아가셨대요._x000D_\n어쩌지요?_x000D_\n오늘 수거신청했습니다.", "answer": "아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 쿠폰 적용에 대해 관심을 가지고 문의 주셔서\n진심으로 감사드립니다.\n\n문의주신 [식목일엔겨울옷정리] 니트 1벌 천원 쿠폰은\n니트류 전체에 각각 적용되는 것이 아니라,\n니트 1벌에 대해서만 1,000원 혜택이 적용되는 점 안내해 드립니다.\n여러 벌을 맡기시더라도 그중 한 벌에 대해서만 할인이 적용됩니다.\n\n더불어, 또한, 해당 쿠폰을 사용하기 위해서는\n수거 신청 시 전체 세탁 비용의 합계가\n20,000원 이상이어야 정상적으로 적용이 가능합니다.\n\n이용 조건에 대해 미리 상세히 안내해 드리지 못해\n혼선을 드린 점 너그러운 양해를 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801116", "date": "2026-05-11", "cat": "오염 미 제거", "title": "세탁 오염 ", "question": "세탁시 오염이 있으니 꼼꼼하게 부탁드립니다.", "answer": "유하린 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 믿고 맡겨주신 세탁물이\n기대에 미치지 못한 상태로 전달되어\n많이 속상하셨을 것 같습니다.\n\n그 마음 충분히 공감되며,\n불편을 드려 진심으로 죄송합니다.\n\n다만 말씀해주신 **얼룩은 일반 세탁만으로는 **\n**제거가 어려운 오염**으로 확인되며,\n**보다 정밀한 약품 처리가 필요**한 상태로 판단됩니다.\n\n해당 경우에는 개별 클리닝 과정을 거친 후\n보다 정성스럽게 관리해드리는** **\n**‘집중케어’** 서비스 이용을 추천드리고 싶습니다.\n\n집중케어는 **[얼룩제거], [보풀제거], [다림질] 등의 **\n**섬세한 케어가 필요한 작업을 선택형 프리미엄 서비스**입니다.\n\n\n* * *\n\n✅ **집중케어 신청 방법**\n**①** **[수거신청] 선택**\n ****\n\n**② [개별클리닝] 선택**\n \n\n**➂ 품목 선택 후,**\n 화면 예시처럼 추가 케어 항목을 체크해주세요.\n \n\n* * *\n\n📌 **유의사항**\n**✔︎** 요청 시 **의류 전체 사진**을 찍어주신 후\n    **세심한 케어 필요 부위를 표시**해주시면\n    정확한 처리가 가능합니다.\n\n\n* * *\n\n이번 건에 대해서는 만족스러운 케어를\n도움드리지 못해 죄송한 마음담아** **\n**세탁비용은 포인트로 환불** 처리하도록 하겠습니다.\n\n추후 다시 한번 더 집중케어 요청을 통해\n맡겨주시면 좀 더 꼼꼼히 케어 도와드리겠습니다.\n\n런드리고는 앞으로도 고객님의 소중한 옷을\n더 건강하고 세심하게 케어해드릴 수 있도록\n지속적인 품질 개선과 서비스 고도화에 최선을 다하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801113", "date": "2026-05-11", "cat": "배송누락/분실접수", "title": "단추분실", "question": "코트 우측 하단에 단추 분실되었습니다._x000D_\n_x000D_\n코트 드라이 배송받자마자, 접수하고 다시 재접수합니다._x000D_\n빠른 해결바랍니다.", "answer": "강혜진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 케어가 미흡한 상태로 수령하시어\n많이 속상하셨을 것 같아 정말 죄송합니다.\n\n다만 현재 문의글만으로는 정확한 상태 확인이 어려워,\n번거로우시겠지만 아래 경로를 통해\n사진과 함께 세탁물 이슈로 접수해주시면 빠르게 확인 도와드리겠습니다.\n\n불편을 드려 다시 한번 사과드리며,\n고객님의 접수 기다리겠습니다. 감사합니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801104", "date": "2026-05-11", "cat": "런드렛 이용 문의", "title": "런드렛 비번이 전달안되었습니다", "question": "런드렛 비밀번호가 따로 알림톡이안와서_x000D_\n확인부탁드립니다", "answer": "예리 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n\n배송된 런드렛의 비밀번호 확인이 되지 않아 불편하셨을 것 같습니다.\n\n먼저, 고객님께 제공 된 비밀번호는 (388)로 확인됩니다.\n\n런드렛 비밀번호는 배송 시 전송되는 알림톡을 통해서도 확인 가능하지만\n수거 신청 화면 우측 상단의 자물쇠 버튼을 눌러주신다면 보유 중이신 런드렛의 비밀번호 확인이 가능합니다.\n\n다만, 안내 된 비밀번호가 맞지 않는다면,\n다이얼 측면에 있는 화살표 ( 숫자 1 모양 ) 색상을 기준으로\n아래 표시되는 색상에 맞는 번호 확인 및 시도를 부탁 드리겠습니다.\n\n✅ 비밀번호 확인 방법 및 다이얼키 런드렛 사용 방법\n\n🔴🟠 - 122\n🟡 - 255\n🟢 - 388\n🔵 - 477\n🟣 - 511\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801100", "date": "2026-05-11", "cat": "기타", "title": "이전 문의내용에 추가적으로 말씀드리면", "question": "그렇다면, 그동안 생활빨래로 보낸 제가 그냥 세탁을 해주셔도 된다고했는데 절대 안된다고 매번 반송하던 세탁물들은요…..???_x000D_\n그리고 하얀세탁물이 변색이된건 문제가 있는게 아닌지여 _x000D_\n_x000D_\n그럼 런드리고에는 하얀 세탁물을 애초에 맡기먄 안되는걸까요 ", "answer": "신재식 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 최신 문의글 통해\n안내가 진행될 예정으로 확인되었습니다.\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801097", "date": "2026-05-11", "cat": "기타", "title": "세탁 후 옷 손상", "question": "세탁 후 옷의 구김이 심하여 일단 동네 세탁소에 문의하니 아ㄴ쪽 부분이 외피와 떨어져서 생긴 문제라고 하네요. 그 전에는 이런 일이 없없습니다. 수선비를 따로 환불해 주시나요 이런 경우는?", "answer": "곽동한 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 부분 미수거 처리되어 당황스러우셨을 것 같습니다.\n\n우선 런드리고 서비스 이용 시\n런드렛이나 런드리고에서 제공드린 라이트백/핸디백에 담아 주시거나\n폐기 가능한 종이가방/비닐에 담아 [런드리고 + 서비스명] 기재하여\n문 앞에 배출해 주시기를 안내 드리고 있습니다.\n\n \n\n4월 9일 새벽 4시 39분 경 기사님 자택 방문 당시\n문 앞에 걸어주신 라이트백 이외의 배출 품목은 확인되지 않으며\n정상 수거 진행된 점 안내 드립니다.\n\n번거로우시겠지만 수거 되지 않은 헌옷은\n다음 수거 신청 시 문 앞에 메모와 함께 내어주시면 정상 수거 진행될 예정인 점 안내 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801093", "date": "2026-05-11", "cat": "세탁 품목 오류접수", "title": "품목 변경 요청 결과", "question": "상기 4개 와이셔츠 제품이 일반셔츠로 등록되어 있어 품목 변경 요청드렸는데 3개만 변경해주셨더라고요 (3개만 차액 환불) 사진과 디테일 설명이 없어서 어느 제품이 빠진건지 그리고 이유가 뭔지 궁금합니다. ", "answer": ">> 이전 답변에 남겨드린 내용 한번 더 답변 드립니다.\n\n신효식 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님. 고객님의 입고사진을 확인해 보니, 혹시 이번에 수거신청을 하실 때에 정장바지와 정장상의도 같이 맡기지 않으셨나요?\n\n고객님께서 4/24에 수거신청을 하신 세탁물을 확인해 보니, 저희 내부 AI의 문제로 생각되긴 합니다만, 바지 한벌이 일반셔츠로 정장상의 한벌이 와이셔츠로 과금이 된 부분이 확인이 되고 있습니다.\n\n- 바지는 5,800원 > 일반셔츠 (3,800원) [세탁물코드: CFAB00116187]\n- 정상재킷 6,500원 > 와이셔츠 (2,900원) [세탁물코드: CFAB00116093]\n\n만약 고객님께서 바지와 정장상의를 이번에 맡겨주신게 맞다면, AI품목 인식 과정에서 더 낮은 품목으로 품목 인식이 진행된 것으로 보이며, 이 부분에 대한 차액은 저희 내부 이슈이기 때문에, 고객님께 청구드리지 않고자 합니다.\n\n죄송하지만, 고객님께서 맡겨주신 세탁물 품목이 맞는지 한번 더 확인 부탁 드립니다.\n\n그리고, 품목이 잘못 인식된 경우에는 런드리고앱 > My > 이용내역 에서 잘못 인식된 품목을 클릭하시면, 품목 변경 요청하기 기능이 있고, 이 부분을 이용하시면 1:1 문의를 남기지 않더라도 품목 변경 요청을 하실 수 있는 점 같이 안내 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801092", "date": "2026-05-11", "cat": "기타", "title": "언재 배송되나요?", "question": "배송시 누락됐다고 하던데 언제 배송되나요?", "answer": "김세은 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님의 2026-04-07 수거신청 건 배송 현황 확인 해보니\n**[2026-04-09 00:50:56] 배송이 완료된 것으로 확인** 됩니다.\n\n아래 배송 완료 사진을 참고 부탁드리며,\n혹 세탁물 은 상태에서 진행되어야 하나,\n건조가 과하게 진행된 상태에서 다림질 되어 발생된 문제로 예상됩니다.\n\n문의주신 내용은 담당 부서에 전달하여\n앞으로의 서비스가 개선될 수 있도록 하겠습니다.\n또한 아직 착복 전이시라면 재 다림질로 도움드리고 싶으나,\n다림질은 어느 정도 의류가 젖어야 진행이 가능하기에 세탁도 함께 됩니다.\n\n다만 단 기간 내 세탁 진행 시 손상 우려가 있고,\n다시 보내주셔야 하는 번거로움이 있기에\n죄송한 마음을 담아 해당 의류 세탁으로 차감된\n세탁권 2장을 다시 지급해드렸습니다.\n\n세탁권 지급으로 고객님의 불편하신 마음을 대신할 순 없지만\n더 잘하겠다는 의미로 받아주시면 감사하겠습니다. 🙏\n이번 만족스러운 품질로 제공해 드리지 못한 점 다시 한번 죄송하다는 말씀 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801066", "date": "2026-05-11", "cat": "기타", "title": "바지 맡겼는데 세탁+밑단수선 동시 진행 유무", "question": "패딩& 바지 수거해가셨고, 세탁 결졔 예정비용 확인했습니다._x000D_\n혹시 바지 세탁과 함께 밑단 수선 진행될까요? 밑단이 뜯어져서 세탁과 동시에 진행되길 희망합니다.", "answer": "조수연 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 먼저 소중한 세탁물을 맡겨주셨음에도\n불편을 드린 점 진심으로 사과드립니다.\n\n문의주신 건은 담당 부서에서\n실물 확인이 필요하여\n번거로우시겠지만 다시 한 번 수거 접수를 부탁드립니다.\n\n세탁물 이슈 경로에서 **[안심케어]**로 접수해 주시면,\n세탁 진행이 아닌 문의하신 **[변색]**에 대한\n후속 처리 방안을 확인해 드리겠습니다.\n\n* * *\n**🔷 세탁물 이슈 접수 방법**\n\n1. 앱에서 **MY > 이용내역**으로 이동\n2. 후속 처리가 필요한 세탁물의\n수거 신청일을 선택한 뒤, 세탁물을 선택하고** **\n**세탁물 이슈 접수** 클릭\n3. 수거 신청 화면 상단의 **안심케어** 항목 선택\n4. 세탁물을 선택한 후 완료 클릭\n5. 수거 신청 절차 완료\n\n**✳️ 안심케어 안내**\n\n- 접수 내용은 담당자 확인 후\n**승인** 또는 **반려**됩니다.\n- 승인 시, **운송비(포인트)가 자동 지급**됩니다.\n\n**✳️ 유의사항**\n**※ 확인 및 처리에 시간이 소요될 수 있으며,**\n**다른 세탁물을 함께 보내주실 경우 전체 세탁/배송이 지연될 수 있습니다.**\n\n- **세탁물 수령일로부터 7일 이내**\n접수 및 승인 후, **30일 내 세탁물을 보내주셔야 **\n**후속 처리가 가능**합니다.\n- 착용 흔적이 있거나, 문의하신 의류와 다른 경우\n후속 처리가 어려울 수 있습니다.\n- 안심케어 진행 시 처리 기간이 다소 추가될 수 있습니다.\n- 정확한 처리를 위해 **일반 세탁물**과\n**안심케어 요청 세탁물을** 반드시 구분하여 동봉해 주세요.\n- 원단 손상 수선의 경우, 담당자가 접수 내용을\n1차 확인 후 최대한 원상 복원을 진행하며,\n특이사항이 있을 경우 별도 연락드리고 있습니다.\n- 검토하는 과정에서 의류 복구가\n불가능하다고 판단될 경우, 별도로 연락드립니다.\n\n* * *\n번거로운 절차로 인하여\n다시 한 번 불편을 드려 죄송합니다.\n세탁 후 발생한 문제는 꼼꼼하게 확인 도와드리겠습니다.🙏🏻\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801065", "date": "2026-05-11", "cat": "기타", "title": "제 세탁물은 언제 보내주시는 걸까요? ", "question": "비니 문제가 있어 보내드렸는데 _x000D_\n언제 받을 수 있는지 문의드립니다 ", "answer": "최정은 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n앞서 문의주신 내용 관련하여 예상 배송일을 추가로 안내드립니다.\n\n2026-03-29 수거요청 주신 여러밤 배송 건은\n현재 세탁물에 대한 검수가 완료되어 세탁 진행 중이며\n4/4(토) 아침 7시 안으로 도착 예정인 점 안내드립니다.\n\n혹시라도 추가 지연이 발생하는 경우\n알림톡을 통해 다시 안내드릴 수 있도록 하겠습니다.\n\n서비스 이용에 불편을 드린 점 다시한번 사과드립니다.\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801061", "date": "2026-05-11", "cat": "런드렛 이용 문의", "title": "수선진행으로 인한 런드렛 이용 제한", "question": "안녕하세요.  현재 지금 해당 수선 제품을 런드렛으로 보내놓아서 추가 세탁물을 접수하지 못하는 불편함이 발생하고 있습니다. 본래 5월 11일이 출고 예정일이었으나 수선에 문제가 생겨 브랜드 AS 위임으로 진행해야하고 추가로 3-4주 시간이 소요된다는 안내를 어제 받았습니다._x000D_\n_x000D_\n5월 말까지 12장의 서비스를 이용해야해서 추가로 서비스를 신청할 수 있도록 빈 쇼핑백에 담아서 접수를할 수 있도록 해주시던가 아니면 런드렛을 다시 보내주시던가 하는 방법으로 이용할 수 있도록 조치를 요청드립니다.", "answer": "소정 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n배송 방법 변경이 가능한지 문의주셨네요.\n\n아쉽지만, 이미 수거가 완료되어 서비스가 진행 중인 수거신청건에 관해서는 중도 서비스 변경 처리가 어려운 점 안내드립니다.\n\n다음번 수거신청시,\n아래 수거신청 화면에서 배송방법을 선택하시면, 원하시는 방법으로 배송받으실 수 있습니다.\n \n\n문의 주신 내용으로 도움을 드리지 못해 정말 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801058", "date": "2026-05-11", "cat": "기타", "title": "불편사항", "question": "오전 7시면 전화를 하던 호출을 하면 되는데 사진과 비밀번호 오류 라고 하고 그냥 가시면 .._x000D_\n수거할 때는 다하시면서 배송은 왜 이렇게 하시는지? _x000D_\n많이 불편 하네요..그리고 공동비밀 번호 공유가 쉽나요?", "answer": "김서라 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n런드렛이 열리지 않아 많이 불편하셨을 것 같아 죄송한 마음입니다.🙏\n\n고객님께 제공된 🔑비밀번호는 **(388)** 로 확인되며,\n**해당 비밀번호는 배송 시 발송된 알림톡 또는**\n**수거 신청 화면 우측 상단의 자물쇠 버튼을 통해서도 확인하실 수 있습니다!**\n\n혹시 안내드린 비밀번호로도 열리지 않는 경우에는,\n**다이얼 옆에 있는 화살표의 색상을 기준**으로 (사진참고)\n아래쪽에 보이는 색상과 일치하는 번호를 맞춰 다시 한번 시도해보시길 부탁드립니다.\n\n\n> **✅ 비밀번호 확인 방법 및 다이얼키 런드렛 사용 방법**\n>\n> 🔴🟠 - 122\n> 🟡 - 255\n> 🟢 - 388\n> 🔵 - 477\n> 🟣 - 511\n\n\n혹여라도 임시 비밀번호 사용 시에도 오픈되지 않을 경우\n죄송하게도 지퍼 부분을 젓가락, 볼 등의\n얇은 물건으로 조심스럽게 눌러 런드렛 오픈을 부탁드립니다 🙏️\n\n다시 한 번 불편을 드린 점 깊이 사과드리며,\n앞으로는 비밀번호로 인한 불편이 없으시도록\n해당 내용은 내부적으로 꼼꼼히 점검하겠습니다.🙏\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801055", "date": "2026-05-11", "cat": "재세탁 접수 및 과정 문의", "title": "안심케어 담당 부서에 내용 전달되었나요?", "question": "안심케어 첫번째 보냈을때 모든 문제가 단 하나도 해결되지 않고, 심지어 잔주름조차 그대로인 상태로 돌아와서, 안심케어를 두번째 보냈습니다._x000D_\n두번째 보낼때 '담당부서측에 미리 내용 전달'해 준다고 하셨는데, 내용 전달된게 맞는지, 제 의류의 문제에 맞게 케어가 진행되고 있는지 알려 주세요.", "answer": "조수경 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 말씀 주신 내용 확인하였으며,\n혹시 **수거신청 시 아래 사진과 같이**\n**안심케어 버튼이 활성화 되어있는지**\n**확인** 한번 부탁드리겠습니다.\n\n\n \n\n\n위와 같이 **안심케어 버튼이 활성화 되어있다면**\n**해당 버튼을 눌러 수거신청**을 부탁드립니다.\n\n만약, **해당 버튼이 사라져있다면**\n**번거로우시겠지만 다시 한 번 문의 주시면**\n**후속 방안 안내**드릴 수 있도록 하겠습니다!\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801053", "date": "2026-05-11", "cat": "기타", "title": "블라우스 부자재가 배송되지 않았습니다", "question": "블라우스 부자재가 배송되지 않았습니다_x000D_\n세탁물 검수 사진에는 있었는데 배송이 오지 않아서 문의드립니다. ", "answer": "야자수 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의주신 티셔츠(CFAB00035405)는\n안심케어 세탁물로 일반 세탁물과 달리\n케어 담당자의 실물 확인과 세심한 케어가 필요하여\n배송이 지연되는 점 안내드립니다.\n\n케어 결과에 따라 배송 혹은 추가 안내가 진행될 예정으로\n일반 세탁물 보다 최소 3~7일 정도의 추가 지연이 있는 점 양해 안내드립니다.\n\n사전에 정확하게 안내드리지 못해\n추가 불편을 드리게 된 것 같아 너무나 죄송스럽습니다.\n\n문제 부분에 대한 세심한 케어 진행하여\n만족스러운 상태로 받아보실 수 있도록 노력하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801052", "date": "2026-05-11", "cat": "결제/과금 문의", "title": "환불", "question": "월정액 결제 후 사용하지 않았습니다 환불처리는 자동으로 되나요? ", "answer": "김창현 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 요금제 해지 관련하여 문의주셨군요.\n\n다만 현재 이용 중이신 요금제는 **이전 버전 요금제**로,\n해지하실 경우 **동일한 조건으로 재가입이 어려운 점** 안내드립니다.\n\n이 부분 참고 부탁드리며,\n번거로우시겠지만 해지를 원하실 경우\n새로운 문의글을 통해 요청해주시면\n확인 즉시 신속히 처리 도와드리겠습니다.\n\n현재 바로 도움드리지 못한 점 죄송합니다.\n\n**✅ 환불 가능 조건**\n① 결제일 포함 21일 이내\n② 기본 제공 서비스 품목을 전혀 사용하지 않은 경우\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801051", "date": "2026-05-11", "cat": "기타", "title": "세탁물이 많아요", "question": "세탁물이 많아 런드렛에 다 들어가질 않아요_x000D_\n런드렛안에도 옷이 들어있어서 런드렛과 파란색 개별크리닝 주머니를 따로 놔야하는데 구별 가능한건가요?", "answer": "김소윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n문의주셨던 카페트 및 러그는\n개별클리닝 서비스로만\n세탁 케어 서비스 진행이 가능합니다.\n\n4월 15일 수거 당시 [개별클리닝] 서비스로\n접수해 주신 내용 확인되어\n세탁물은 케어라벨 확인 후 서비스가 진행될 예정인 점 안내드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801050", "date": "2026-05-11", "cat": "미수거/오수거 문의", "title": "1층 현관문 고장으로 경비실 이용 바랍니다. ", "question": "세탁물 수거를 못 했다고 문자를 받았습니다. _x000D_\n공교롭게도 공동현관문 고장입니다. _x000D_\n경비실을 통해 출입을 해주시길 바랍니다. _x000D_\n경비실은 주민 주차장 출입구에 있습니다. ", "answer": "고동희 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님의 세탁물은 오늘 1:59에 안전하게 수거된 걸로 확인되었습니다.\n깨끗하게 세탁하여 약속된 배송일정 내에 전달드릴 수 있도록\n최선을 다 하겠습니다.\n\n더 궁금한 점은 언제든 말씀해주세요🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801041", "date": "2026-05-11", "cat": "오염 미 제거", "title": "얼룩 미제거 및 손상", "question": "안녕하세요. 2건 접수했는데 따로 연락이 없어서 글남깁니다", "answer": "유하린 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 믿고 맡겨주신 세탁물이\n기대에 미치지 못한 상태로 전달되어\n많이 속상하셨을 것 같습니다.\n\n그 마음 충분히 공감되며,\n불편을 드려 진심으로 죄송합니다.\n\n다만 말씀해주신 **얼룩은 일반 세탁만으로는 **\n**제거가 어려운 오염**으로 확인되며,\n**보다 정밀한 약품 처리가 필요**한 상태로 판단됩니다.\n\n해당 경우에는 개별 클리닝 과정을 거친 후\n보다 정성스럽게 관리해드리는** **\n**‘집중케어’** 서비스 이용을 추천드리고 싶습니다.\n\n집중케어는 **[얼룩제거], [보풀제거], [다림질] 등의 **\n**섬세한 케어가 필요한 작업을 선택형 프리미엄 서비스**입니다.\n\n\n* * *\n\n✅ **집중케어 신청 방법**\n**①** **[수거신청] 선택**\n ****\n\n**② [개별클리닝] 선택**\n \n\n**➂ 품목 선택 후,**\n 화면 예시처럼 추가 케어 항목을 체크해주세요.\n \n\n* * *\n\n📌 **유의사항**\n**✔︎** 요청 시 **의류 전체 사진**을 찍어주신 후\n    **세심한 케어 필요 부위를 표시**해주시면\n    정확한 처리가 가능합니다.\n\n\n* * *\n\n이번 건에 대해서는 만족스러운 케어를\n도움드리지 못해 죄송한 마음담아** **\n**세탁비용은 포인트로 환불** 처리하도록 하겠습니다.\n\n추후 다시 한번 더 집중케어 요청을 통해\n맡겨주시면 좀 더 꼼꼼히 케어 도와드리겠습니다.\n\n런드리고는 앞으로도 고객님의 소중한 옷을\n더 건강하고 세심하게 케어해드릴 수 있도록\n지속적인 품질 개선과 서비스 고도화에 최선을 다하겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801040", "date": "2026-05-11", "cat": "기타", "title": "영수증 첨부합니다", "question": "망가진 패딩에 대한 구매내역 영수증 첨부 드립니다. 상담은 유선으로 부탁드릴게요.  010-6557-0790", "answer": "박지민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님께서 제출해주신 증빙 서류는\n정상 접수되었으며, 관련 내용은 담당 부서에 전달하였습니다.\n\n담당자가 내역확인 후\n순차적으로 연락드릴 예정이오니,\n다소 시일이 소요될 수 있는 점 양해 부탁드립니다.\n\n고객님의 불편을 최소화할 수 있도록\n최대한 신속히 처리해드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801037", "date": "2026-05-11", "cat": "수선 미이행 문의", "title": "어플에 신청시 수선 항목을 못찾아서", "question": "어플 세탁물 신청 시 수선 관련 내용이 없어서 그냥 보내드렸는데, 별도 금액 발생은 괜찬으니 수선 및 드라이 진행 부탁드립니다._x000D_\n_x000D_\n앱상으로는 단순 세탁물 신청 밖에 안되더라고요._x000D_\n_x000D_\n제가 처음이라 못찾은 걸 수도 있지만, 수선 필요한 항목이라 부탁드립니다.", "answer": "이은주 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 수선을 원하셨던 의류가\n불가 처리되어 불편을 드린 점\n진심으로 사과드립니다. 🙏\n\n죄송하지만 서비스 정책상 수선 불가 품목은\n세탁도 함께 진행되지 않으며,\n즉시 출고팀으로 인계되어 세탁 진행이 어렵습니다.\n\n수선 서비스는 세탁과 함께 필수로 진행되는 항목이므로,\n수선이 불가한 경우 세탁 또한 반려(미진행)되는 점\n양해 부탁드립니다.\n\n세탁만 원하실 경우에는 번거로우시더라도\n새롭게 접수해 주셔야 합니다.\n\n요청해 주신 내용에 대해 도움을 드리지 못해 죄송합니다.\n\n앞으로는 더 나은 서비스 경험을 드릴 수 있도록\n최선을 다하겠습니다.\n\n다시 한 번 불편을 드려 죄송합니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801036", "date": "2026-05-11", "cat": "보상처리 과정 문의", "title": "단추 탈락 건에 대한 재접수 확인 요청", "question": "안내주신 것과 같이 일반 수거로 접수하였으며,_x000D_\n요청대로 세탁하지 않고 단추만 다시 찾아서 달아주시길 바라며_x000D_\n이번에는 누락되지 않도록 강력하게 유관 부서와 소통 바랍니다.", "answer": "김민지 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 소중한 시간을 내어 다시 보내주신 의류인데\n아직 수령하지 못하시어 많이 걱정되셨을 것 같습니다.\n\n안심케어로 접수해주신 세탁물은\n현재 처리 상황을 확인 중이며,\n지연된 부분에 대해서는 담당 부서로 별도 확인 요청을 전달드린 상태입니다.\n\n최근 물량 증가로 인해 케어 및\n검수 과정이 다소 지연되고 있는 것으로 보이며,\n고객님의 세탁물 역시 보다 정확한 확인과 처리를 위해 시간이 소요되고 있는 점 양해 부탁드립니다.\n\n관련 내용은 확인되는 신속히 안내드릴 수 있도록 하겠으며,\n최대한 빠르게 처리될 수 있도록 지속적으로 살펴보겠습니다.\n\n기다리시게 해드려 죄송합니다.\n끝까지 책임감 있게 확인 후 안내드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요.\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801033", "date": "2026-05-11", "cat": "세탁 품목 오류접수", "title": "오품목 차액 결제", "question": "오품목 차액결제는 언제 취소완료되나요? 반드시 카드 결제한 금액에서 결제취소해주세요. 포인트로 환불하지 마세요. ", "answer": "이현서 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n우선 서비스 이용에 불편을 드린 점 진심으로 사과 드립니다.\n\n4/17 요청주신 품목 재분류는 승인해 드렸습니다.\n이용에 불편을 드린 점 다시 한번 사과 드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801025", "date": "2026-05-11", "cat": "기타", "title": "배송기사", "question": "금일 4시 48분경_x000D_\n기흥구 한보라2로 85-21  101동 304호_x000D_\n배송기사 대물사고 건으로 연락하오니_x000D_\n바로 책임자 연락바랍니다._x000D_\n연락처 010-9549-7755 ", "answer": "아윤 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 런드리고 쿠폰 적용에 대해 관심을 가지고 문의 주셔서\n진심으로 감사드립니다.\n\n문의주신 [식목일엔겨울옷정리] 니트 1벌 천원 쿠폰은\n니트류 전체에 각각 적용되는 것이 아니라,\n니트 1벌에 대해서만 1,000원 혜택이 적용되는 점 안내해 드립니다.\n여러 벌을 맡기시더라도 그중 한 벌에 대해서만 할인이 적용됩니다.\n\n더불어, 또한, 해당 쿠폰을 사용하기 위해서는\n수거 신청 시 전체 세탁 비용의 합계가\n20,000원 이상이어야 정상적으로 적용이 가능합니다.\n\n이용 조건에 대해 미리 상세히 안내해 드리지 못해\n혼선을 드린 점 너그러운 양해를 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801018", "date": "2026-05-11", "cat": "기타", "title": "[긴급]보관중인 롱패딩들이 없어졌어요!!!!!!!", "question": "보관중인 옷들의 보관종료긴 7일후라고, 계속보관하려면 결제하라고 안내문이 떠서 결제하려고 보관항 갔더니,  보관중인 옷이 없다고 합니다!!!!!!!!_x000D_\n어떻게 된겁니까??_x000D_\n설마, 잃어버렸어요?_x000D_\n_x000D_\n아니면, 설마 또 그놈의 착오때문에  봉은사로 170 1419호 그 매음굴 깡패소굴 세상에서 제일 더러운 곳으로 내 소중한 보내버린건가요?? _x000D_\n이건 최악의 시나리오인데 제발 이것만은 아니길 바랍니다. 그 더러운 곳으로 내 소중한 옷을 보내버린거라면, 그 옷 못입습니다. 세상에서 제일 더러운 범죄자들이 그 더러운 손으로 내가 아끼는 옷들을 마음대로 만졌을꺼라 생각하면 평생남을 트라우마입니다. _x000D_\n_x000D_\n도대체 어떻게 된건지 제발 빨리 조사해서 알려주세요. _x000D_\n_x000D_\n런드리고가 초심을 잃고 서비스가 너무나 극악윽 상태로 나빠진 이후로 구독을 중단하기로 마음 먹고 보관료를 내고 보관하려고 했습니다._x000D_\n그런데 그 옷들을 잃어버렸거나 그 최악의 더러운 소굴로 또 보낸거라면 진짜 견딜 수 없습니다. _x000D_\n_x000D_\n이거 답장 받을 때까지 나 아무것도 못합니다. 제발 빠른답변 주세요. ", "answer": "최경아 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 문의주신 내용은 토요일 오후 22시,\n일요일 오전 10시 문의주신 내용 통해\n안내 완료되어 해당 1:1 문의 답변은 마치도록 하겠습니다.\n\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801017", "date": "2026-05-11", "cat": "기타", "title": "추가 수선 요청 건", "question": "신발세탁요청드렸는데_x000D_\n뒷굽이 신발신다가 자꾸 무너지는데 이 부분 보수가 가능한가요?", "answer": "염수진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님 패브릭 돗자리를 말씀하시는 걸까요?\n\n돗자리 품목은 현재 마련되어 있지 않아\n크기가 작을 경우 담요, 크기가 클 경우 일반이불로 분류될 수 있는 점\n참고 부탁드립니다.\n\n또한 패브릭 돗자리가 아닌 일반 돗자리는\n세탁이 불가한 품목인 점 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801014", "date": "2026-05-11", "cat": "기타", "title": "개별클리닝 2건 미진행 문의", "question": "총 4건 맡겼고 원피스 2개를 미진행한다고 하는데_x000D_\n미진행 하는 이유 좀 알 수 있을까요?_x000D_\n그냥 원피스인데 왜 진행을 안하는지.._x000D_\n저 두벌때문에 맡긴건데 진행을 안한다고 하면 좀 곤란합니다", "answer": "이중민 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n먼저, 서비스 이용에 불편을 드린 점 진심으로 죄송합니다.\n문의주신 러그 세탁 미진행 사유에 대해 안내드립니다.\n\n앞서 문자로 안내드린 것처럼, 고객님께서 신청해주신\n프리미엄 서비스는 의류 품목에 한해 적용 가능하며,\n러그를 포함한 리빙 품목에는 프리미엄 공정이 적용되지 않아\n세탁 진행이 어려운 점 다시 한번 안내드립니다.\n\n또한 고객님의 사전 동의 없이 임의로 일반 개별클리닝으로 변경하여 진행해드리기 어려워,\n부득이하게 세탁을 진행하지 않은 상태로 출고된 점 너른 양해 부탁드립니다.\n\n번거로우시겠지만 해당 러그는\n일반 개별클리닝으로 다시 수거 신청해주시면 접수 도와드리겠습니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801013", "date": "2026-05-11", "cat": "미수거/오수거 문의", "title": "세탁물을 내 놓았는데 하나를 미수거해가셨어요", "question": "세탁물을 총 2개 내 놓았는데 하나는 미수거해 가셨습니다.._x000D_\n다시 수거 하려면 배송비를 부담해야하는 건가요?", "answer": "김수열 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n내어주신 세탁물의 일부가 미수거되어\n많이 당황스러우셨을 것 같습니다.\n\n문의 주신 내용을 확인한 결과,\n따로 봉투에 담아 배출주신 세탁물 봉투에는\n런드리고 세탁물임을 표시하는 메모가\n부착되지 않아 미수거 처리된 것으로 확인되었습니다.\n\n세탁물을 런드렛 또는 라이트백 외의 봉투에\n배출해 주실 경우, 폐기 가능한 봉투나 쇼핑백에 담아\n[런드리고 + 세탁서비스명]을 종이에 기재 후\n부착해 주셔야 수거가 가능합니다.\n\n이는 폐기물 및 기타 물품과의 혼선을 방지하고\n정확한 수거를 위해 사전에 안내드리는 이용 가이드 사항으로,\n부득이하게 협조를 부탁드리는 점 양해 부탁드립니다.\n\n또한 서비스 이용 중에는 별도의 수거 방문이나\n자동 수거가 불가하므로, 세탁물을 수령하신 후\n고객님께서 직접 수거 신청을 진행해 주셔야 합니다.\n\n번거로우시겠지만 세탁물 배송 이후\n다시 한 번 안내드린 방법대로\n수거 신청 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801011", "date": "2026-05-11", "cat": "기타", "title": "기장줄임 여부 확인 부탁드립니다.", "question": "기장줄임으로 요청했는데 수선비용 0원으로 기장줄임 완료 여부 확인부탁드립니다.", "answer": "궁가네 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 바지(CFAB00103438)는\n수거 단계에서 신청주신 수선 서비스가 없었기에\n수선 없이 세탁 후 출고 진행된 점 확인됩니다.\n\n비대면 서비스로 어플 내\n신청하신 수선서비스가 없는 경우\n수선 처리가 어려운 점 안내드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료"}, {"id": "801010", "date": "2026-05-11", "cat": "기타", "title": "이불 무료 쿠폰", "question": "극세사 이불패드랑 이불이랑 이용권차감이 같은데 패드에 사용해도되나요?", "answer": "이예진 고객님, 안녕하세요.\n런드리고 1:1문의 담당자입니다.\n\n고객님, 문의주신 내용은 유선으로 안내 완료되어\n해당 1:1 문의 답변은 마치도록 하겠습니다.\n이 점 너그러이 양해 부탁드립니다.\n\n궁금한 점은 언제든 말씀해주세요. 🙏🏻\n감사합니다.\n\n런드리고 담당자 드림", "status": "답변완료   if (curPage < totalPages) range.push({label:'›', page:curPage+1});
  range.forEach(r => {
    const b = document.createElement('button');
    b.className = 'page-btn' + (r.page===curPage&&r.label===curPage?' active':'');
    b.textContent = r.label;
    b.onclick = () => { curPage = r.page; render(); };
    pg.appendChild(b);
  });
}

function showDetail(idx) {
  curIdx = idx;
  const item = ALL_DATA[idx];
  document.getElementById('placeholder').style.display = 'none';
  const dc = document.getElementById('detailContent');
  dc.className = 'detail-content visible';
  document.getElementById('dId').textContent   = '티켓 #' + item.id;
  document.getElementById('dCat').textContent  = item.cat;
  document.getElementById('dDate').textContent = item.date;
  document.getElementById('dTitle').textContent    = item.title || '';
  document.getElementById('dQuestion').textContent = item.question || '';
  document.getElementById('dAnswer').textContent   = item.answer  || '';
  document.getElementById('prevBtn').disabled = idx <= 0;
  document.getElementById('nextBtn').disabled = idx >= ALL_DATA.length-1;
  render();
  document.getElementById('detailPanel').scrollTo(0,0);
}

document.getElementById('prevBtn').onclick = () => { if(curIdx>0) showDetail(curIdx-1); };
document.getElementById('nextBtn').onclick = () => { if(curIdx<ALL_DATA.length-1) showDetail(curIdx+1); };
document.getElementById('searchInput').addEventListener('input', filterData);
catSel.addEventListener('change', filterData);

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

render();
</script>
</body>
</html>
