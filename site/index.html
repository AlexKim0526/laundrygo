<style>

:root{
  
  --bg:#EEF1EE; --surface:#FFFFFF; --soft:#F4F6F3; --line:#DFE4DF; --line-strong:#C9D1CA; --fg:#14201A; --muted:#56635B; --faint:#7C8880;
  --accent:#13BF8A; --accent-ink:#0A6F4E; --accent-soft:#E6F6EE; --onaccent:#FFFFFF; --ink:#13281F; --onink:#F1F7F3;
  --promo:#C2410C; --promo-soft:#FFF1E7; --warn-ink:#9A3412; --disabled:#C3CBC5;
  --map-bg:#E6EEF0; --map-land:#FBFBFA; --map-has:#EEF2F0; --map-line:#D3D9D6;
  --font:'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --num:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --shadow:0 1px 2px rgba(20,32,26,.04), 0 6px 24px -12px rgba(20,32,26,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171D1A; --soft:#1E2522; --line:#2A332E; --line-strong:#38433D; --fg:#E9EFEB; --muted:#A3AFA8; --faint:#7D8983;
  --accent:#2BD39E; --accent-ink:#6FE0BA; --accent-soft:#163128; --onaccent:#06231A; --ink:#2BD39E; --onink:#06231A;
  --promo:#FF9A5C; --promo-soft:#3A2418; --warn-ink:#FFB88C; --disabled:#36403B; --map-bg:#0F1A1D; --map-land:#1E2422; --map-has:#252C29; --map-line:#38403C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171D1A; --soft:#1E2522; --line:#2A332E; --line-strong:#38433D; --fg:#E9EFEB; --muted:#A3AFA8; --faint:#7D8983;
  --accent:#2BD39E; --accent-ink:#6FE0BA; --accent-soft:#163128; --onaccent:#06231A; --ink:#2BD39E; --onink:#06231A;
  --promo:#FF9A5C; --promo-soft:#3A2418; --warn-ink:#FFB88C; --disabled:#36403B; --map-bg:#0F1A1D; --map-land:#1E2422; --map-has:#252C29; --map-line:#38403C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:6px;font-weight:700;font-size:19px}
.brand b{color:var(--accent)} .brand span{font-weight:500;font-size:15px}
.tabs{display:flex;gap:4px}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.hero{padding-block:32px 8px}
.hero h1{margin:0;font-size:clamp(24px,3.2vw,32px);line-height:1.35;text-wrap:balance}
.hero p{margin:8px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;padding-block:16px 64px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.step{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.step h2{margin:0;font-size:18px;display:flex;align-items:center;gap:10px}
.num{width:26px;height:26px;border-radius:13px;background:var(--fg);color:var(--surface);font-size:13px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.sub{font-size:13.5px;color:var(--muted)}
.prod{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.prod+.prod{border-top:1px solid var(--line);padding-top:18px}
.prod-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prod-h h3{margin:0;font-size:16px}
.ex{border:0;background:transparent;color:var(--accent-ink);font-size:13.5px;font-weight:500;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.badge{padding:2px 8px;border-radius:999px;background:var(--promo-soft);color:var(--promo);font-size:12px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.types{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:620px){.types{grid-template-columns:minmax(0,1fr)}}
.tile{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 13px}
.tile strong{font-size:15px} .tile small{font-size:12.5px;color:var(--muted)} .tile em{font-style:normal;font-size:13.5px;font-weight:500}
.tile .min{color:var(--promo);font-weight:700;font-size:13px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row>.lbl{font-size:14px;color:var(--muted);min-width:64px;line-height:40px;align-self:flex-start}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:4px;box-sizing:border-box;height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:14px;line-height:1;white-space:nowrap;vertical-align:middle}
.chip.auto{cursor:default}.chip.auto small{font-size:12px;font-weight:500;opacity:.9}
.chip[aria-pressed="true"]{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--onaccent);font-weight:700}
.chip{min-width:64px}
.chan{display:flex;gap:6px;flex-wrap:wrap}
.chan span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.chan span.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
#hb-qty,#smp-qty,#dep-note{display:flex;flex-direction:column;gap:12px}#hb-qty .linked,#smp-qty .linked{margin:0}#hb-qty:empty,#smp-qty:empty,#dep-note:empty{display:none}
.note{padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px}
.warn{padding:12px 14px;border-radius:12px;background:var(--promo-soft);color:var(--warn-ink);font-size:13.5px}
.quote{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:900px){.quote{position:static}}
.lines{display:flex;flex-direction:column;gap:9px}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.line span:last-child{white-space:nowrap;font-weight:500;font-variant-numeric:tabular-nums}
.line.plus span:last-child{color:var(--promo)} .line.minus span:last-child{color:var(--accent-ink)}
.hr{height:1px;background:var(--line)}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.tot b{font-size:26px}
.btn{height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--onaccent);font-weight:700;font-size:16px}
.btn:disabled{background:var(--disabled);color:var(--surface);cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:500;height:46px}
.fine{font-size:12px;color:var(--faint)}
.mine{display:flex;flex-direction:column;gap:8px}
.req{padding:12px 14px;border-radius:12px;background:var(--soft);display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.status{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap;align-self:flex-start}
.linkbtn{border:0;background:transparent;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;font-size:13.5px;padding:4px 2px}
.exg{display:grid;gap:10px}.exg.two{grid-template-columns:1fr 1fr;align-items:start}@media (max-width:480px){.exg.two{grid-template-columns:1fr}}.exg figure{margin:0}.exg figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.vol{min-width:0;width:100%;max-width:560px}.vol td,.vol th{padding:8px 10px}
.guide{margin-top:14px;font-size:13.5px;line-height:1.6}.guide summary{cursor:pointer;font-weight:500}.guide ol{padding-left:18px;margin:8px 0}.guide code{background:var(--soft);padding:1px 5px;border-radius:5px}.guide pre{background:var(--soft);padding:10px 12px;border-radius:10px;overflow:auto;font-size:12.5px;margin:6px 0 0}
.pf{border:0;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:2px}.pf legend{font-weight:700;font-size:15px;margin-bottom:8px}
.pf-row{display:grid;grid-template-columns:minmax(0,1fr) auto 110px;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pf-in{display:flex;align-items:center;gap:6px}.pf-in input{width:130px;height:40px;text-align:right;font:inherit;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}.pf-in em{font-style:normal;color:var(--muted);font-size:12.5px;min-width:72px}
.pf-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
@media (max-width:640px){.pf-row{grid-template-columns:1fr;gap:6px}.pf-in input{width:100%}}
.linked{margin:10px 0 8px;padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;line-height:1.5}
.per{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}.per .line b{color:var(--accent-ink)}
.flow{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 4px;padding:0}
.flow li{background:var(--soft);border-radius:10px;padding:8px 6px;font-size:12px;text-align:center;line-height:1.35}
.flow b{display:block;color:var(--accent);font-size:12px;margin-bottom:2px}
@media (max-width:480px){.flow{grid-template-columns:repeat(3,1fr)}}
.exi{width:100%;max-width:100%;display:block;background:var(--soft)}
.modal:has(.ex-modal){max-width:640px;padding:0;overflow:auto}
.ex-fig{position:relative;margin:0;background:var(--soft);display:flex;justify-content:center;border-bottom:1px solid var(--line)}
.ex-fig .exi{max-height:min(56vh,460px);width:auto;max-width:100%;object-fit:contain}
.ex-fig .mock{width:100%;height:auto;display:block}
.x.on-img{position:absolute;top:12px;right:12px;background:color-mix(in srgb,var(--surface) 88%,transparent);box-shadow:var(--shadow)}
.ex-body{padding:22px 26px 24px;display:flex;flex-direction:column;gap:14px}
.ex-body h3{font-size:21px;letter-spacing:-.02em}
.ex-lead{margin:0;font-size:15px;line-height:1.7;color:var(--fg);max-width:60ch}
.ex-pts{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ex-pts div{padding:12px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.ex-pts dt{font-size:12px;font-weight:600;color:var(--accent-ink);margin-bottom:4px}
.ex-pts dd{margin:0;font-size:13.5px;line-height:1.55}
@media (max-width:560px){.ex-pts{grid-template-columns:minmax(0,1fr)}.ex-body{padding:18px}}
.mock .m-bg{fill:var(--soft)} .mock .m-dev{fill:var(--fg)} .mock .m-scr{fill:var(--surface)} .mock .m-t{fill:var(--fg);font-family:var(--font)}
.mock .m-l{fill:var(--line)} .mock .m-card{fill:var(--soft);stroke:var(--line)} .mock .m-ad{fill:#2E3A8C} .mock text{font-family:var(--font)}
.mock .m-dot{fill:var(--line)} .mock .m-dot.on{fill:var(--fg)} .mock .m-ok{fill:var(--accent-soft)} .mock .m-btn{fill:var(--ink)}
.mock .m-call{stroke:var(--faint);stroke-width:1.2;stroke-dasharray:3 3} .mock .m-cap{fill:var(--fg);font-size:12.5px;font-weight:600} .mock .m-cap2{fill:var(--muted);font-size:11px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:20px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-size:19px}
.modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.ill{width:100%;max-width:100%;background:var(--soft);border-radius:14px;display:block}
.ill .a{fill:var(--accent)} .ill .as{fill:var(--accent-soft)} .ill .s{fill:var(--surface)} .ill .l{fill:var(--line)} .ill .f{fill:var(--fg)} .ill .m{fill:var(--faint)} .ill .p{fill:var(--promo)} .ill .ps{fill:var(--promo-soft)}
.ill .st{stroke:var(--faint);fill:none;stroke-width:2} .ill text{fill:var(--fg);font-family:var(--font);font-size:13px}
.x{border:0;background:transparent;width:40px;height:40px;border-radius:20px;font-size:22px;line-height:1;color:var(--muted)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
input,textarea,select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-weight:400}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.two{grid-template-columns:minmax(0,1fr)}}
.err{color:var(--warn-ink);font-size:13px}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12.5px}
