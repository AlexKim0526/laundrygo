<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>브랜드 인식 체크</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f6fa; color: #222; }

/* API Bar */
#apiBar { background: #1a1a2e; color: #eee; padding: 8px 20px; display: flex; align-items: center; gap: 10px; font-size: 12px; flex-wrap: wrap; }
#apiBar label { color: #aaa; white-space: nowrap; }
#apiKeyInput { background: #2a2a3e; border: 1px solid #444; border-radius: 6px; padding: 4px 10px; color: #fff; font-size: 12px; font-family: monospace; width: 320px; }
#apiKeySave { background: #3b5bdb; color: #fff; border: none; border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
#apiStatus { font-size: 11px; color: #4caf50; }

/* Header */
#header { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 1px solid #e0e0e0; padding: 12px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
#header h1 { font-size: 17px; font-weight: 700; margin-bottom: 10px; color: #1a1a2e; }
#stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.stat-card { background: #f0f4ff; border-radius: 10px; padding: 8px 14px; flex: 1; min-width: 150px; }
.stat-card .label { font-size: 11px; color: #666; margin-bottom: 2px; }
.stat-card .value { font-size: 18px; font-weight: 700; color: #3b5bdb; }
.stat-card .sub { font-size: 11px; color: #888; margin-top: 1px; }
.stat-card.brand { background: #fff8e1; }
.stat-card.brand .value { color: #e67700; }
.stat-card.unknown { background: #f3f0ff; }
.stat-card.unknown .value { color: #7048e8; }
#controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#controls label { font-size: 12px; color: #555; }
#userInput { border: 1px solid #ccc; border-radius: 6px; padding: 4px 8px; font-size: 13px; width: 120px; }
#pageInfo { font-size: 12px; color: #666; }
button { cursor: pointer; border: none; border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; }
#prevBtn, #nextBtn { background: #3b5bdb; color: #fff; }
#prevBtn:disabled, #nextBtn:disabled { background: #ccc; cursor: default; }
#exportBtn { background: #2f9e44; color: #fff; }
#importBtn { background: #e67700; color: #fff; }
#jumpInput { width: 60px; border: 1px solid #ccc; border-radius: 6px; padding: 4px 6px; font-size: 12px; text-align: center; }
select { border: 1px solid #ccc; border-radius: 6px; padding: 4px 8px; font-size: 12px; }

/* Grid */
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; padding: 16px; }

/* Card */
.card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border: 2px solid transparent; }
.card.checked-ok { border-color: #40c057; }
.card.checked-fail { border-color: #fa5252; }
.card.checked-unknown { border-color: #7950f2; }
.card-img-wrap { position: relative; overflow: hidden; height: 200px; background: #eee; cursor: zoom-in; }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.25s ease; }
.card-img-wrap:hover img { transform: scale(1.08); }
.card-body { padding: 10px 12px; }
.card-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.card-name { font-size: 13px; font-weight: 700; }
.card-brand { font-size: 12px; color: #555; background: #f0f0f0; border-radius: 4px; padding: 2px 6px; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-id { font-size: 10px; color: #bbb; margin-bottom: 6px; }
.section-label { font-size: 11px; color: #666; margin-bottom: 5px; padding-top: 4px; }
.check-row { display: flex; gap: 6px; margin-bottom: 8px; }
.check-btn { flex: 1; padding: 6px 4px; border-radius: 7px; font-size: 11px; font-weight: 600; border: 2px solid transparent; background: #f5f5f5; color: #555; cursor: pointer; }
.check-btn.active-ok { background: #40c057; color: #fff; }
.check-btn.active-fail { background: #fa5252; color: #fff; }
.check-btn.active-unknown { background: #7950f2; color: #fff; }
.card-user { font-size: 10px; color: #888; margin-top: 4px; }

/* Hover preview */
#hoverPreview { display: none; position: fixed; z-index: 400; pointer-events: none; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2); }
#hoverPreview img { width: 600px; height: 600px; object-fit: contain; background: #111; display: block; }

/* Lightbox */
#lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500; overflow-y: auto; }
#lightbox.open { display: block; }
#lightboxInner { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; min-height: 100%; }
#lightboxClose { position: fixed; top: 16px; right: 20px; color: #fff; font-size: 32px; cursor: pointer; background: none; border: none; line-height: 1; opacity: 0.7; z-index: 501; }
#lightboxClose:hover { opacity: 1; }
#lightboxImg { max-width: 90vw; max-height: 70vh; object-fit: contain; border-radius: 8px; }
#lightboxMeta { color: #fff; margin-top: 14px; text-align: center; line-height: 2; }
#lbName { font-size: 17px; font-weight: 700; }
#lbBrand { color: #ffd43b; font-size: 15px; }
#lbId { color: #666; font-size: 12px; }
#lightboxNav { display: flex; gap: 12px; margin-top: 12px; }
#lightboxNav button { background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 8px; padding: 7px 20px; font-size: 13px; cursor: pointer; }
#lightboxNav button:hover { background: rgba(255,255,255,0.3); }

/* Brand analysis */
#brandAnalysis { margin-top: 18px; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 16px 20px; max-width: 520px; width: 100%; text-align: left; }
#brandAnalysis .ba-title { font-size: 12px; color: #aaa; margin-bottom: 10px; }
#baResult { font-size: 15px; color: #fff; line-height: 1.8; }
.ba-brand { font-size: 20px; font-weight: 700; color: #ffd43b; }
.ba-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
#logoZoom { display: none; margin-top: 12px; border-radius: 8px; border: 2px solid #ffd43b; max-width: 90vw; }
#logoZoomLabel { font-size: 11px; color: #ffd43b; margin-top: 6px; text-align: center; display: none; }

/* Toast */
#toast { position: fixed; bottom: 24px; right: 24px; background: #333; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 999; }
#toast.show { opacity: 1; }

/* Import modal */
#modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 600; align-items: center; justify-content: center; }
#modal.open { display: flex; }
#modalBox { background: #fff; border-radius: 14px; padding: 24px; max-width: 440px; width: 90%; }
#modalBox h2 { font-size: 16px; margin-bottom: 10px; }
#modalBox p { font-size: 13px; color: #555; margin-bottom: 12px; line-height: 1.6; }
#importText { width: 100%; height: 120px; border: 1px solid #ccc; border-radius: 8px; padding: 8px; font-size: 12px; font-family: monospace; resize: vertical; }
.modal-btns { display: flex; gap: 8px; margin-top: 12px; }
.modal-btns button { flex: 1; padding: 8px; }
#importOkBtn { background: #3b5bdb; color: #fff; }
#importCancelBtn { background: #eee; color: #333; }
  #resetBtn { background: #ff6b6b; color: #fff; }

  /* Batch processing */
  #batchBar { background: #0f172a; color: #e2e8f0; padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid #1e293b; }
  #batchBar label { font-size: 12px; color: #94a3b8; white-space: nowrap; }
  #batchCount { width: 80px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 4px 8px; color: #fff; font-size: 12px; text-align: center; }
  #batchConcurrency { width: 60px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 4px 8px; color: #fff; font-size: 12px; text-align: center; }
  #batchStartBtn { background: #6366f1; color: #fff; border: none; border-radius: 6px; padding: 6px 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
  #batchStartBtn:hover { background: #4f46e5; }
  #batchStartBtn:disabled { background: #334155; color: #64748b; cursor: default; }
  #batchPauseBtn { background: #f59e0b; color: #fff; border: none; border-radius: 6px; padding: 6px 16px; font-size: 12px; font-weight: 600; cursor: pointer; display: none; }
  #batchStopBtn  { background: #ef4444; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; display: none; }
  #batchProgress { flex: 1; min-width: 200px; }
  #batchProgressBar { width: 100%; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  #batchProgressFill { height: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6); border-radius: 3px; width: 0%; transition: width 0.3s; }
  #batchStatusText { font-size: 11px; color: #94a3b8; }
  #batchErrCount { font-size: 11px; color: #f87171; margin-left: 8px; }
  #batchStrategySelect { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 4px 8px; color: #fff; font-size: 12px; }
</style>
</head>
<body>

<!-- API Key Bar -->
<div id="apiBar">
  <label>🔑 Anthropic API Key:</label>
  <input id="apiKeyInput" type="password" placeholder="sk-ant-..." />
  <button id="apiKeySave">저장</button>
  <span id="apiStatus"></span>
  <span style="margin-left:auto;color:#555;font-size:11px;">이미지 클릭 시 Claude Vision으로 브랜드 분석</span>
</div>

<div id="batchBar">
  <span style="font-size:13px;font-weight:600;color:#a5b4fc;">🤖 자동 체크</span>
  <label>처리 건수:</label>
  <input id="batchCount" type="number" value="5000" min="1" max="58677" />
  <label>동시 요청:</label>
  <input id="batchConcurrency" type="number" value="3" min="1" max="10" />
  <label>시작 위치:</label>
  <select id="batchStrategySelect">
    <option value="unchecked">미체크 항목부터</option>
    <option value="first">처음부터</option>
  </select>
  <button id="batchStartBtn">▶ 자동 체크 시작</button>
  <button id="batchPauseBtn">⏸ 일시정지</button>
  <button id="batchStopBtn">⏹ 중지</button>
  <div id="batchProgress">
    <div id="batchProgressBar"><div id="batchProgressFill"></div></div>
    <span id="batchStatusText">대기 중</span>
    <span id="batchErrCount"></span>
  </div>
</div>

<!-- Header -->
<div id="header">
  <h1>🔍 브랜드 인식 체크 <span style="font-size:11px;font-weight:400;color:#999;margin-left:6px;">v2.6</span></h1>
  <div id="stats">
    <div class="stat-card brand">
      <div class="label">🏷️ 브랜드 인식률</div>
      <div class="value" id="brandRate">-</div>
      <div class="sub" id="brandSub">체크 필요</div>
    </div>
    <div class="stat-card" style="background:#fff0f0;">
      <div class="label">❌ 오인식</div>
      <div class="value" style="color:#e03131;" id="failCount">-</div>
      <div class="sub" id="failSub">건</div>
    </div>
    <div class="stat-card unknown">
      <div class="label">🚫 확인불가</div>
      <div class="value" id="unknownCount">-</div>
      <div class="sub" id="unknownSub">건</div>
    </div>
    <div class="stat-card" style="background:#e8f5e9;">
      <div class="label">✅ 전체 진행</div>
      <div class="value" style="color:#2e7d32;" id="totalChecked">0</div>
      <div class="sub" id="totalSub">건 체크 완료</div>
    </div>
  </div>
  <div id="controls">
    <label>작업자:</label>
    <input id="userInput" type="text" placeholder="이름 입력" />
    <select id="filterSelect">
      <option value="all">전체</option>
      <option value="unchecked">미체크</option>
      <option value="ok">정상 인식</option>
      <option value="fail">오인식</option>
      <option value="unknown">확인불가</option>
    </select>
    <select id="pageSizeSelect">
      <option value="20">20개</option>
      <option value="50" selected>50개</option>
      <option value="100">100개</option>
    </select>
    <button id="prevBtn">◀ 이전</button>
    <span id="pageInfo">-</span>
    <button id="nextBtn">다음 ▶</button>
    <input id="jumpInput" type="number" min="1" placeholder="페이지" />
    <button id="exportBtn">📤 내보내기</button>
    <button id="importBtn">📥 병합 가져오기</button>
    <button id="resetBtn">🗑️ 데이터 초기화</button>
  </div>
</div>

<!-- Grid -->
<div id="grid"></div>

<!-- Hover Preview -->
<div id="hoverPreview"><img id="hoverPreviewImg" src="" alt="" /></div>

<!-- Lightbox -->
<div id="lightbox">
  <button id="lightboxClose">✕</button>
  <div id="lightboxInner">
    <img id="lightboxImg" src="" alt="" />
    <div id="lightboxMeta">
      <div id="lbName"></div>
      <div id="lbBrand"></div>
      <div id="lbId"></div>
    </div>
    <div id="lightboxNav">
      <button id="lbPrev">◀ 이전</button>
      <button id="lbNext">다음 ▶</button>
    </div>
    <div id="brandAnalysis">
      <div class="ba-title">🤖 Claude Vision 브랜드 분석</div>
      <div id="baResult">이미지를 클릭하면 분석을 시작합니다.</div>
    </div>
    <canvas id="logoZoom"></canvas>
    <div id="logoZoomLabel"></div>
  </div>
</div>

<!-- Import Modal -->
<div id="modal">
  <div id="modalBox">
    <h2>📥 결과 병합 가져오기</h2>
    <p>다른 작업자가 내보낸 JSON을 붙여넣으세요.<br>기존 내용과 병합됩니다 (충돌 시 가져온 데이터 우선).</p>
    <textarea id="importText" placeholder='{"results": {...}}'></textarea>
    <div class="modal-btns">
      <button id="importOkBtn">병합하기</button>
      <button id="importCancelBtn">취소</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const STORAGE_KEY = 'brand_check_v2';
const USER_KEY = 'brand_check_user';
const API_KEY_STORAGE = 'anthropic_api_key';

let allData = [];
let results = {};
let currentPage = 1;
let pageSize = 50;
let filterMode = 'all';
let filteredIds = [];
let currentPageIds = [];

// ── Persistence ──────────────────────────────────────────
function loadResults() {
  try { const s = localStorage.getItem(STORAGE_KEY); if (s) results = JSON.parse(s); } catch(e) { results = {}; }
}
function saveResults() { localStorage.setItem(STORAGE_KEY, JSON.stringify(results)); }

// ── Stats ─────────────────────────────────────────────────
function updateStats() {
  const vals = Object.values(results);
  const brandChecked = vals.filter(r => r.brandOk !== null && !r.brandUnknown).length;
  const brandOk      = vals.filter(r => r.brandOk === true && !r.brandUnknown).length;
  const brandFail    = vals.filter(r => r.brandOk === false && !r.brandUnknown).length;
  const brandUnk     = vals.filter(r => r.brandUnknown).length;

  document.getElementById('brandRate').textContent = brandChecked ? (brandOk/brandChecked*100).toFixed(1)+'%' : '-';
  document.getElementById('brandSub').textContent  = '정상 '+brandOk+' / 체크 '+brandChecked+'건';
  document.getElementById('failCount').textContent = brandFail.toLocaleString();
  document.getElementById('failSub').textContent   = '/ 체크 '+brandChecked+'건';
  document.getElementById('unknownCount').textContent = brandUnk.toLocaleString();
  document.getElementById('unknownSub').textContent   = '/ 전체 '+vals.length.toLocaleString()+'건';
  document.getElementById('totalChecked').textContent = vals.length.toLocaleString();
  document.getElementById('totalSub').textContent     = '/ '+(allData.length||0).toLocaleString()+'건';
}

// ── Helpers ───────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function cardClass(r) {
  if (!r) return 'card';
  if (r.brandOk === null && !r.brandUnknown) return 'card';
  if (r.brandUnknown) return 'card checked-unknown';
  if (r.brandOk === true)  return 'card checked-ok';
  return 'card checked-fail';
}

function btnCls(type, val, r) {
  if (!r) return 'check-btn';
  if (type === 'name') {
    if (val === 'ok'      && r.nameOk === true  && !r.nameUnknown) return 'check-btn active-ok';
    if (val === 'fail'    && r.nameOk === false && !r.nameUnknown) return 'check-btn active-fail';
    if (val === 'unknown' && r.nameUnknown)                         return 'check-btn active-unknown';
  } else {
    if (val === 'ok'      && r.brandOk === true  && !r.brandUnknown) return 'check-btn active-ok';
    if (val === 'fail'    && r.brandOk === false && !r.brandUnknown) return 'check-btn active-fail';
    if (val === 'unknown' && r.brandUnknown)                          return 'check-btn active-unknown';
  }
  return 'check-btn';
}

// ── Render ────────────────────────────────────────────────
function getFilteredIds() {
  return allData.filter(row => {
    const r = results[row.id];
    if (filterMode === 'all')       return true;
    if (filterMode === 'unchecked') return !r || (r.nameOk === null && r.brandOk === null && !r.nameUnknown && !r.brandUnknown);
    if (filterMode === 'ok')        return r && r.nameOk === true && r.brandOk === true;
    if (filterMode === 'fail')      return r && (r.nameOk === false || r.brandOk === false);
    if (filterMode === 'unknown')   return r && (r.nameUnknown || r.brandUnknown);
    return true;
  }).map(row => row.id);
}

function renderPage() {
  filteredIds = getFilteredIds();
  const total = Math.max(1, Math.ceil(filteredIds.length / pageSize));
  if (currentPage > total) currentPage = total;
  const start = (currentPage - 1) * pageSize;
  currentPageIds = filteredIds.slice(start, start + pageSize);

  document.getElementById('pageInfo').textContent = currentPage+' / '+total+' 페이지 ('+filteredIds.length.toLocaleString()+'건)';
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= total;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  currentPageIds.forEach(id => {
    const row = allData[id];
    const r   = results[id] || null;

    const card = document.createElement('div');
    card.className = cardClass(r);

    const wrap = document.createElement('div');
    wrap.className = 'card-img-wrap';

    const img = document.createElement('img');
    img.src = row.img_url || '';
    img.loading = 'lazy';
    img.alt = row.name || '';
    img.onerror = function() { this.style.objectFit='contain'; this.style.padding='20px'; };

    // ─ Hover preview ─
    img.addEventListener('mouseenter', function(e) {
      const src = this.src;
      if (!src || src.startsWith('data:')) return;
      document.getElementById('hoverPreviewImg').src = src;
      document.getElementById('hoverPreview').style.display = 'block';
      movePreview(e);
    });
    img.addEventListener('mousemove', movePreview);
    img.addEventListener('mouseleave', function() {
      document.getElementById('hoverPreview').style.display = 'none';
    });

    // ─ Click → lightbox ─
    wrap.addEventListener('click', function() {
      openLightbox(id);
    });

    wrap.appendChild(img);
    card.appendChild(wrap);

    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML =
      '<div class="card-id">#'+(id+1)+'</div>'+
      '<div class="card-meta"><div class="card-name">'+esc(row.name)+'</div><div class="card-brand">'+esc(row.brand)+'</div></div>'+
      '<div class="section-label">🏷️ 브랜드 인식</div>'+
      '<div class="check-row">'+
        '<button class="'+btnCls('brand','ok',r)+'" data-id="'+id+'" data-type="brand" data-val="ok">✅ 정상</button>'+
        '<button class="'+btnCls('brand','fail',r)+'" data-id="'+id+'" data-type="brand" data-val="fail">❌ 오인식</button>'+
        '<button class="'+btnCls('brand','unknown',r)+'" data-id="'+id+'" data-type="brand" data-val="unknown">🚫 확인불가</button>'+
      '</div>'+
      (r ? '<div class="card-user">👤 '+esc(r.user||'?')+' · '+new Date(r.ts).toLocaleDateString('ko-KR')+'</div>' : '');

    card.appendChild(body);
    grid.appendChild(card);
  });

  updateStats();
}

// ── Hover Preview Position ────────────────────────────────
function movePreview(e) {
  const pw = 604, ph = 604;
  let x = e.clientX + 20;
  let y = e.clientY - ph / 2;
  if (x + pw > window.innerWidth  - 8) x = e.clientX - pw - 20;
  if (y < 8)                           y = 8;
  if (y + ph > window.innerHeight - 8) y = window.innerHeight - ph - 8;
  const pv = document.getElementById('hoverPreview');
  pv.style.left = x + 'px';
  pv.style.top  = y + 'px';
}

// ── Check buttons (event delegation on grid) ──────────────
document.getElementById('grid').addEventListener('click', function(e) {
  const btn = e.target.closest('.check-btn');
  if (!btn) return;
  const id   = parseInt(btn.dataset.id);
  const type = btn.dataset.type;
  const val  = btn.dataset.val;
  const user = document.getElementById('userInput').value.trim() || '익명';

async function analyzeBrand(imgUrl, row) {
  const apiKey = localStorage.getItem(API_KEY_STORAGE);
  if (!apiKey) {
    document.getElementById('baResult').innerHTML = '⚠️ 상단에 Anthropic API 키를 먼저 입력해주세요.';
    return;
  }

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5',
        max_tokens: 400,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'url', url: imgUrl } },
            { type: 'text', text: '이 세탁물 이미지를 분석하세요.\n기록된 품목: '+row.name+'\n기록된 브랜드: '+row.brand+'\n\n이미지에서 브랜드 로고나 텍스트가 보이는지 확인하고, 아래 JSON 형식으로만 응답하세요:\n{"brand_visible":true/false,"identified_brand":"브랜드명 또는 null","confidence":"high/medium/low","logo_region":{"x":0.0,"y":0.0,"w":1.0,"h":1.0},"description":"한줄설명"}' }
          ]
        }]
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(()=>({error:{message:resp.status}}));
      document.getElementById('baResult').innerHTML = '❌ API 오류: ' + (err.error?.message || resp.status);
      return;
    }

    const data = await resp.json();
    const text = data.content[0].text.trim();
    const match = text.match(/\{[\s\S]*\}/);
    if (!match) { document.getElementById('baResult').innerHTML = text; return; }

    const res = JSON.parse(match[0]);
    const conf = res.confidence === 'high' ? '🟢 높음' : res.confidence === 'medium' ? '🟡 보통' : '🔴 낮음';
    let html = '';
    if (res.brand_visible && res.identified_brand) {
      const matchLabel = res.match === true
        ? '<span style="color:#40c057;font-size:12px;margin-left:8px;">✅ 기록 브랜드와 일치</span>'
        : '<span style="color:#fa5252;font-size:12px;margin-left:8px;">❌ 기록 브랜드와 불일치</span>';
      html += '<div class="ba-brand">🏷️ ' + esc(res.identified_brand) + matchLabel + '</div>';
      html += '<div style="color:#ccc;font-size:13px;">신뢰도: ' + conf + '</div>';
    } else {
      html += '<div style="color:#888;">🚫 브랜드 로고/텍스트 식별 불가</div>';
    }
    html += '<div style="color:#aaa;font-size:13px;margin-top:6px;">' + esc(res.description||'') + '</div>';
    document.getElementById('baResult').innerHTML = html;

    // Draw cropped logo region
    if (res.brand_visible && res.logo_region) drawLogoZoom(imgUrl, res.logo_region);

  } catch(e) {
    document.getElementById('baResult').innerHTML = '❌ ' + e.message;
  }
}

function drawLogoZoom(imgUrl, region) {
  const canvas = document.getElementById('logoZoom');
  const label  = document.getElementById('logoZoomLabel');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    const pad = 0.04;
    const sx  = Math.max(0, region.x - pad) * img.naturalWidth;
    const sy  = Math.max(0, region.y - pad) * img.naturalHeight;
    const sw  = Math.min(1 - (region.x - pad), region.w + pad*2) * img.naturalWidth;
    const sh  = Math.min(1 - (region.y - pad), region.h + pad*2) * img.naturalHeight;
    const outW = 480;
    const outH = Math.min(Math.round(outW * sh / sw), 320);
    canvas.width  = outW;
    canvas.height = outH;
    canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
    canvas.style.display      = 'block';
    label.style.display       = 'block';
    label.textContent = '📍 로고/브랜드 텍스트 확대 영역';
  };
  img.src = imgUrl;
}

function normBrand(s) {
  return (s||'').toLowerCase().replace(/[\s\-_\.'·]/g,'').replace(/[^\w가-힣]/g,'');
}

function brandMatch(identified, defined) {
  if (!identified || !defined) return false;
  const a = normBrand(identified);
  const b = normBrand(defined);
  if (!a || !b) return false;
  if (a === b || a.includes(b) || b.includes(a)) return true;
  // 동의어 사전 검색
  for (const group of BRAND_SYNONYMS) {
    const normGroup = group.map(normBrand);
    if (normGroup.includes(a) && normGroup.includes(b)) return true;
  }
  return false;
}

async function analyzeForBatch(row) {
  const apiKey = localStorage.getItem(API_KEY_STORAGE);
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5',
      max_tokens: 200,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'url', url: row.img_url } },
          { type: 'text', text: `이 세탁물 이미지를 분석하세요. 기록된 브랜드명: "${row.brand}"

이미지에서 브랜드 로고나 텍스트를 찾아 아래 기준으로 판단하세요:
- brand_visible: 브랜드 로고/텍스트가 이미지에 보이면 true
- match: 보이는 브랜드가 기록된 브랜드와 같은 브랜드면 true (한글/영문 표기 차이 무관. 예: 아디다스=ADIDAS=Adidas)
- identified_brand: 이미지에서 인식한 브랜드명 (없으면 null)

반드시 JSON만 응답:
{"brand_visible":true/false,"match":true/false,"identified_brand":"브랜드명 또는 null"}` }
        ]
      }]
    })
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const data = await resp.json();
  const text = data.content[0].text.trim();
  const match = text.match(/\{[\s\S]*?\}/);
  if (!match) throw new Error('parse error');
  return JSON.parse(match[0]);
}

async function runBatch() {
  const apiKey = localStorage.getItem(API_KEY_STORAGE);
  if (!apiKey) { alert('상단에 Anthropic API 키를 먼저 입력해주세요.'); return; }

  const count       = parseInt(document.getElementById('batchCount').value) || 5000;
  const concurrency = Math.min(parseInt(document.getElementById('batchConcurrency').value) || 3, 10);
  const strategy    = document.getElementById('batchStrategySelect').value;
  const userName    = document.getElementById('userInput').value.trim() || 'AI자동체크';

  // Build target list
  let targets = allData.filter(row => row.img_url);
  if (strategy === 'unchecked') {
    targets = targets.filter(row => !results[row.id] ||
      (results[row.id].nameOk === null && results[row.id].brandOk === null &&
       !results[row.id].nameUnknown && !results[row.id].brandUnknown));
  }
  targets = targets.slice(0, count);

  if (targets.length === 0) { showToast('처리할 항목이 없습니다.'); return; }

  batchRunning = true;
  batchPaused  = false;
  batchStop    = false;
  batchErrors  = 0;

  document.getElementById('batchStartBtn').disabled = true;
  document.getElementById('batchPauseBtn').style.display = 'inline-block';
  document.getElementById('batchStopBtn').style.display  = 'inline-block';

  let done = 0;
  const total = targets.length;

  function updateBatchUI() {
    const pct = (done / total * 100).toFixed(1);
    document.getElementById('batchProgressFill').style.width = pct + '%';
    document.getElementById('batchStatusText').textContent =
      (batchPaused ? '⏸ 일시정지 ' : '처리 중 ') + done + ' / ' + total + '건 (' + pct + '%)';
    document.getElementById('batchErrCount').textContent =
      batchErrors > 0 ? '오류: ' + batchErrors + '건' : '';
    updateStats();
    // Re-render current page to reflect new checks
    renderPage();
  }

  // Process with concurrency pool
  let idx = 0;
  async function worker() {
    while (idx < targets.length && !batchStop) {
      // Wait if paused
      while (batchPaused && !batchStop) {
        await new Promise(r => setTimeout(r, 300));
      }
      if (batchStop) break;

      const row = targets[idx++];
      if (!row.img_url) { done++; updateBatchUI(); continue; }

      try {
        const res = await analyzeForBatch(row);

        const id = row.id;
        if (!results[id]) results[id] = { nameOk: null, brandOk: null, nameUnknown: false, brandUnknown: false, user: userName, ts: Date.now() };
        results[id].user = userName;
        results[id].ts   = Date.now();

        if (!res.brand_visible || !res.identified_brand) {
          // 확인불가 (로고/텍스트 없음)
          results[id].brandUnknown = true;
          results[id].brandOk      = null;
        } else if (res.match === true || brandMatch(res.identified_brand, row.brand)) {
          // 정상 (Claude 판단 또는 로컬 사전 일치)
          results[id].brandOk      = true;
          results[id].brandUnknown = false;
        } else {
          // 오인식
          results[id].brandOk      = false;
          results[id].brandUnknown = false;
          results[id].aiDetected   = res.identified_brand;
        }

      } catch(e) {
        batchErrors++;
        // 잠시 대기 후 계속 (rate limit 등)
        await new Promise(r => setTimeout(r, 1000));
      }

      done++;
      if (done % 5 === 0) saveResults(); // 5건마다 저장
      updateBatchUI();
    }
  }

  // Launch workers
  const workers = Array.from({ length: concurrency }, () => worker());
  await Promise.all(workers);

  saveResults();
  batchRunning = false;
  document.getElementById('batchStartBtn').disabled = false;
  document.getElementById('batchPauseBtn').style.display = 'none';
  document.getElementById('batchStopBtn').style.display  = 'none';

  if (batchStop) {
    document.getElementById('batchStatusText').textContent = '⏹ 중지됨 (' + done + '/' + total + '건 처리)';
    showToast('자동 체크가 중지되었습니다. (' + done + '건 처리)');
  } else {
    document.getElementById('batchStatusText').textContent = '✅ 완료! ' + total + '건 처리 (오류: ' + batchErrors + '건)';
    document.getElementById('batchProgressFill').style.width = '100%';
    showToast('🎉 자동 체크 완료! ' + total.toLocaleString() + '건 처리되었습니다.', 6000);
  }
  renderPage();
  updateStats();
}

    if (savedFingerprint && savedFingerprint !== dataFingerprint) {
      if (confirm('데이터가 변경되었습니다 (이전: ' + savedFingerprint.replace('data_count_','') + '건 → 현재: ' + allData.length + '건).\n기존 체크 데이터를 초기화하시겠습니까?')) {
        results = {};
        saveResults();
      }
    }
    localStorage.setItem('brand_check_fingerprint', dataFingerprint);
    renderPage();
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div style="padding:60px;text-align:center;color:#e03131;grid-column:1/-1;line-height:2;">⚠️ brand-check-data.json 을 불러올 수 없습니다.<br><small>같은 폴더에 있는지 확인하세요.</small></div>';
  }
}

init();
</script>
</body>
</html>
