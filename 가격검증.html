<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>브랜드·가격 검증</title>
<style>
:root{
  --bg:#eceef1; --card:#fff; --line:#e2e5ea; --line2:#f0f1f4;
  --txt:#141821; --sub:#6b7280; --dim:#9ca3af;
  --ok:#0f9d58; --err:#e5484d; --hold:#e08b00; --accent:#141821;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --r:14px; --r-in:9px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.5; color:var(--txt); background:var(--bg);
  word-break:keep-all; overflow-wrap:anywhere; -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
button{font:inherit; cursor:pointer}

/* ── header ─────────────────────────────── */
.hdr{
  position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) 0;
}
.hdr-in{max-width:1240px; margin:0 auto}
.hdr-top{display:flex; align-items:flex-end; gap:var(--s4); flex-wrap:wrap}
h1{font-size:17px; font-weight:800; letter-spacing:-.4px; margin:0}
h1 span{display:block; font-size:11.5px; font-weight:600; color:var(--sub); letter-spacing:0; margin-top:2px}
.spacer{flex:1}
.count{font-size:13px; color:var(--sub); font-weight:600}
.count b{color:var(--txt); font-size:15px}
.bar{height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin:10px 0 0; display:flex}
.bar i{height:100%; transition:width .25s ease-out}
.tools{display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap; padding:var(--s3) 0}
.chip{
  border:1px solid var(--line); background:var(--card); color:var(--sub);
  border-radius:20px; padding:7px 13px; font-size:13px; font-weight:600; letter-spacing:-.2px;
  min-height:34px; transition:background .2s ease-out,color .2s ease-out,border-color .2s ease-out;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.chip .n{font-variant-numeric:tabular-nums; opacity:.65; margin-left:5px}
input[type=search],input[type=text]{
  font:inherit; font-size:14px; border:1px solid var(--line); background:var(--card);
  border-radius:10px; padding:8px 12px; min-height:34px; color:var(--txt); outline:none;
}
input[type=search]{width:190px}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #2f6fed; outline-offset:2px}
select{font:inherit; font-size:13px; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:8px 10px; min-height:34px}

/* ── grid ───────────────────────────────── */
main{max-width:1240px; margin:0 auto; padding:var(--s4)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:var(--s3)}
.item{
  background:var(--card); border-radius:var(--r); overflow:hidden; position:relative;
  border:1px solid transparent; transition:border-color .2s ease-out;
}
.item.s-ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.item.s-price,.item.s-brand,.item.s-both{border-color:color-mix(in srgb,var(--err) 45%,transparent)}
.item.s-hold{border-color:color-mix(in srgb,var(--hold) 50%,transparent)}
.thumb{
  display:block; width:100%; aspect-ratio:1/1; border:0; padding:0; background:#f6f7f9;
  position:relative; overflow:hidden;
}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.thumb .fail{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  font-size:12px; color:var(--dim); padding:var(--s3); text-align:center;
}
.thumb.broken .fail{display:flex}
.idx{
  position:absolute; top:8px; left:8px; background:rgba(20,24,33,.72); color:#fff;
  font-size:11px; font-weight:700; padding:3px 7px; border-radius:6px;
  font-variant-numeric:tabular-nums; backdrop-filter:blur(4px);
}
.mark{
  position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%;
  display:none; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:800;
}
.item.s-ok .mark{display:flex; background:var(--ok)}
.item.s-price .mark,.item.s-brand .mark,.item.s-both .mark{display:flex; background:var(--err)}
.item.s-hold .mark{display:flex; background:var(--hold)}
.meta{padding:10px var(--s3) var(--s3)}
.brand{font-size:13.5px; font-weight:700; letter-spacing:-.2px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.price{font-size:16px; font-weight:800; letter-spacing:-.4px; margin-top:1px}
.price em{font-style:normal; font-size:12px; font-weight:600; color:var(--sub); margin-left:2px}
.flag{
  display:inline-block; margin-top:6px; font-size:11px; font-weight:700; color:var(--hold);
  background:color-mix(in srgb,var(--hold) 12%,#fff); border-radius:5px; padding:2px 6px;
}
.empty{text-align:center; color:var(--sub); padding:64px var(--s4); font-size:14px}
.empty b{display:block; color:var(--txt); font-size:15px; margin-bottom:6px}

/* ── review panel ───────────────────────── */
.ovl{position:fixed; inset:0; z-index:100; background:rgba(20,24,33,.55); backdrop-filter:blur(3px); display:none}
.ovl.on{display:block}
.panel{
  position:absolute; inset:auto 0 0 0; background:var(--bg); border-radius:18px 18px 0 0;
  max-height:96vh; overflow:auto; padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));
}
@media(min-width:900px){
  .panel{inset:0; border-radius:0; display:grid; grid-template-columns:minmax(0,1.15fr) 380px; gap:var(--s4); padding:var(--s4); max-height:none}
  .pv{position:relative; background:#0f1116; border-radius:var(--r); overflow:hidden; display:flex; align-items:center; justify-content:center}
  .pv img{max-width:100%; max-height:100%; object-fit:contain}
  .pside{overflow:auto}
}
.pv{position:relative; background:#0f1116; border-radius:var(--r); overflow:hidden; text-align:center; min-height:180px}
.pv img{max-width:100%; max-height:56vh; display:block; margin:0 auto; object-fit:contain}
.pv .fail{color:#8b919e; font-size:13px; padding:48px var(--s4)}
.nav{position:absolute; top:50%; transform:translateY(-50%); width:44px; height:64px; border:0; border-radius:8px;
  background:rgba(255,255,255,.14); color:#fff; font-size:18px; backdrop-filter:blur(6px)}
.nav.prev{left:10px} .nav.next{right:10px}
.nav:disabled{opacity:.25; cursor:default}
.pside .card{background:var(--card); border-radius:var(--r); padding:var(--s4); margin-bottom:var(--s3)}
.pbrand{font-size:20px; font-weight:800; letter-spacing:-.5px}
.pprice{font-size:30px; font-weight:800; letter-spacing:-1.1px; margin-top:2px}
.pprice em{font-style:normal; font-size:14px; font-weight:600; color:var(--sub); margin-left:3px}
.plabel{font-size:11.5px; font-weight:700; color:var(--sub); letter-spacing:.2px}
.hist{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.hist span{font-size:12px; font-weight:700; background:var(--bg); border-radius:6px; padding:3px 7px; font-variant-numeric:tabular-nums}
.hist span.cur{background:var(--accent); color:#fff}
.acts{display:grid; grid-template-columns:1fr 1fr; gap:var(--s2)}
.act{
  border:1px solid var(--line); background:var(--card); border-radius:11px; padding:13px 10px;
  font-size:14px; font-weight:700; letter-spacing:-.2px; color:var(--txt); text-align:left;
  transition:background .2s ease-out,border-color .2s ease-out,color .2s ease-out;
}
.act kbd{float:right; font:inherit; font-size:11px; color:var(--dim); background:var(--bg); border-radius:4px; padding:1px 5px}
.act.full{grid-column:1/-1}
.act[aria-pressed="true"] kbd{color:rgba(255,255,255,.6); background:rgba(255,255,255,.16)}
.act.ok[aria-pressed="true"]{background:var(--ok); border-color:var(--ok); color:#fff}
.act.err[aria-pressed="true"]{background:var(--err); border-color:var(--err); color:#fff}
.act.hold[aria-pressed="true"]{background:var(--hold); border-color:var(--hold); color:#fff}
.field{margin-top:var(--s3)}
.field label{display:block; font-size:11.5px; font-weight:700; color:var(--sub); margin-bottom:5px}
.field input{width:100%}
.ptop{display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s3)}
.ptop .pos{font-size:12.5px; font-weight:700; color:var(--sub); font-variant-numeric:tabular-nums}
.x{margin-left:auto; border:1px solid var(--line); background:var(--card); border-radius:9px; padding:7px 12px; font-size:13px; font-weight:700}
.src{font-size:11.5px; color:var(--dim); word-break:break-all; margin-top:10px; display:block}

/* ── bottom bar ─────────────────────────── */
.actionbar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:color-mix(in srgb,var(--bg) 94%,transparent); backdrop-filter:blur(12px);
  border-top:1px solid var(--line); padding:10px var(--s4) calc(10px + env(safe-area-inset-bottom));
}
.actionbar-in{max-width:1240px; margin:0 auto; display:flex; gap:var(--s2); align-items:center}
.btn{border:0; border-radius:11px; background:var(--accent); color:#fff; font-size:14px; font-weight:700; padding:12px 18px; letter-spacing:-.2px}
.btn.ghost{background:var(--card); color:var(--txt); border:1px solid var(--line)}
.hint{font-size:12px; color:var(--sub); margin-right:auto}
.toast{
  position:fixed; left:50%; bottom:88px; transform:translateX(-50%); z-index:70; pointer-events:none;
  background:var(--accent); color:#fff; font-size:13px; font-weight:600; padding:10px 16px; border-radius:10px;
  opacity:0; transition:opacity .2s ease-out;
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="hdr-top">
      <h1>브랜드·가격 검증<span id="src">브랜드_가격.xlsx · 300건</span></h1>
      <div class="spacer"></div>
      <div class="count">검수 완료 <b class="num" id="done">0</b> / <span class="num" id="total">0</span></div>
    </div>
    <div class="bar" id="bar"></div>
    <div class="tools">
      <button class="chip" data-filter="all" aria-pressed="true">전체<span class="n" id="c-all">0</span></button>
      <button class="chip" data-filter="none" aria-pressed="false">미검수<span class="n" id="c-none">0</span></button>
      <button class="chip" data-filter="ok" aria-pressed="false">정상<span class="n" id="c-ok">0</span></button>
      <button class="chip" data-filter="price" aria-pressed="false">가격 오류<span class="n" id="c-price">0</span></button>
      <button class="chip" data-filter="brand" aria-pressed="false">브랜드 오류<span class="n" id="c-brand">0</span></button>
      <button class="chip" data-filter="both" aria-pressed="false">둘 다 오류<span class="n" id="c-both">0</span></button>
      <button class="chip" data-filter="hold" aria-pressed="false">보류<span class="n" id="c-hold">0</span></button>
      <input type="search" id="q" placeholder="브랜드 검색" autocomplete="off">
      <select id="sort">
        <option value="orig">원본 순서</option>
        <option value="brand">브랜드순</option>
        <option value="phigh">가격 높은순</option>
        <option value="plow">가격 낮은순</option>
        <option value="spread">브랜드 내 가격 편차순</option>
      </select>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden><b>해당하는 항목이 없습니다</b>필터나 검색어를 바꿔보세요.</div>
</main>

<div class="ovl" id="ovl">
  <div class="panel" role="dialog" aria-modal="true" aria-label="검수 패널">
    <div class="pv">
      <img id="pImg" alt="">
      <div class="fail" id="pFail" hidden>이미지를 불러오지 못했습니다. 아래 원본 주소를 확인해주세요.</div>
      <button class="nav prev" id="prev" aria-label="이전">←</button>
      <button class="nav next" id="next" aria-label="다음">→</button>
    </div>
    <div class="pside">
      <div class="ptop">
        <span class="pos num" id="pPos">1 / 300</span>
        <button class="x" id="close">닫기 (Esc)</button>
      </div>
      <div class="card">
        <div class="plabel">등록된 브랜드</div>
        <div class="pbrand" id="pBrand">—</div>
        <div class="plabel" style="margin-top:12px">등록된 가격</div>
        <div class="pprice num" id="pPrice">—<em>원</em></div>
        <div id="pHistWrap" hidden>
          <div class="plabel" style="margin-top:14px">같은 브랜드에 등록된 가격대</div>
          <div class="hist num" id="pHist"></div>
        </div>
        <span class="src" id="pSrc"></span>
      </div>
      <div class="card">
        <div class="plabel" style="margin-bottom:9px">판정</div>
        <div class="acts">
          <button class="act ok" data-set="ok" aria-pressed="false">정상<kbd>1</kbd></button>
          <button class="act err" data-set="price" aria-pressed="false">가격 오류<kbd>2</kbd></button>
          <button class="act err" data-set="brand" aria-pressed="false">브랜드 오류<kbd>3</kbd></button>
          <button class="act err" data-set="both" aria-pressed="false">둘 다 오류<kbd>4</kbd></button>
          <button class="act hold full" data-set="hold" aria-pressed="false">판단 보류<kbd>5</kbd></button>
        </div>
        <div class="field">
          <label for="pFix">수정 제안 가격 (원)</label>
          <input type="text" id="pFix" inputmode="numeric" placeholder="예: 129,000">
        </div>
        <div class="field">
          <label for="pMemo">메모</label>
          <input type="text" id="pMemo" placeholder="예: 정품 라벨 기준 다른 모델">
        </div>
        <div class="field" style="font-size:12px;color:var(--sub)">
          판정하면 자동으로 다음 항목으로 넘어갑니다. ← → 로 이동, Esc 로 닫기.
        </div>
      </div>
    </div>
  </div>
</div>

<div class="actionbar">
  <div class="actionbar-in">
    <span class="hint" id="hint">이미지를 클릭하면 크게 보면서 검수합니다.</span>
    <button class="btn ghost" id="load">이어서 검수</button>
    <button class="btn ghost" id="reset">판정 초기화</button>
    <button class="btn" id="export">결과 내보내기 (CSV)</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".json" hidden>

3ad53.jpeg"}, {"brand": "LAP", "price": 59000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090409_10aad948beb647d08859593fb0823b76.jpeg"}, {"brand": "스톤 아일랜드", "price": 280000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090409_94639071edb44e85a39afe466b3aafe3.jpeg"}, {"brand": "GENERAL IDEA", "price": 59000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090309_05c470633b46423c8806db2d168184bd.jpeg"}, {"brand": "renoma PARIS", "price": 59000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090309_0a0b4039753b489e8e92095dd0eb4207.jpeg"}, {"brand": "폴로 랄프 로렌", "price": 169000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090309_9a707eae2a704583a4c2ff65741d78b9.jpeg"}, {"brand": "루이비통", "price": 3500000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090309_5d07925d4db845fa9277b06a376d44db.jpeg"}, {"brand": "루이비통", "price": 3500000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090309_8e4340d1da71466c9ef33aa9356b9b69.jpeg"}, {"brand": "나이키", "price": 55000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090209_0ab6074e20054f209f4046147cc1d956.jpeg"}, {"brand": "MAESTRO", "price": 150000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090209_fc2439c6d42d4fe6a160f17d7b5e03d0.jpeg"}, {"brand": "renoma", "price": 70000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090209_949d1a91791a4cafa61a2ea2dff7cf4b.jpeg"}, {"brand": "디올", "price": 1200000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090209_5c2eff77a2d9483d80d6a66917ffa4cc.jpeg"}, {"brand": "SPAO", "price": 29900, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090209_6c8a0503a3664aacac693bb739b51201.jpeg"}, {"brand": "나이키", "price": 45000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090209_6bfc03a3699b4326a2c3662e6fd8c64e.jpeg"}, {"brand": "LHBW", "price": 45000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090209_a8529d59576040e7bbd3e2d5ed1e758e.jpeg"}, {"brand": "LHBW", "price": 45000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090209_d5b1b9fb2d74479195f5a01cfe5cf620.jpeg"}, {"brand": "LHBW", "price": 45000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090209_240e3bf8728a44518f6615e0173a9489.jpeg"}, {"brand": "dunhill", "price": 1500000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090209_e3275a4afe1942a7a71e7b1a4adc49e1.jpeg"}, {"brand": "DAKS", "price": 125000, "img_url": "https://cloudfront.laundrygo.com/smartfactory/smartfactory_20260820090109_193b9b1b883740058b107535f7f7d483.jpeg"}];
const LABEL = {ok:'정상', price:'가격 오류', brand:'브랜드 오류', both:'둘 다 오류', hold:'판단 보류', none:'미검수'};
const MARK  = {ok:'✓', price:'!', brand:'!', both:'!', hold:'?'};

const state = DATA.map((d,i)=>({...d, i, status:'none', fix:'', memo:''}));
let filter='all', query='', sortBy='orig', view=[], cur=-1;

/* 같은 브랜드의 다른 가격 (표기 흔들림 흡수: 공백·대소문자 무시) */
const key = b => b.toLowerCase().replace(/\s+/g,'');
const byBrand = {};
state.forEach(r => (byBrand[key(r.brand)] ||= []).push(r.price));
const priceSet = k => [...new Set(byBrand[k])].sort((a,b)=>a-b);
state.forEach(r => { const s=priceSet(key(r.brand)); r.spread = s.length>1 ? s[s.length-1]/s[0] : 1; });

const won = n => n.toLocaleString('ko-KR');
const $ = id => document.getElementById(id);

/* ── 저장 (window.storage 있으면 자동 저장) ── */
const KEY = 'price-verify:v1';
async function save(){
  try{ await window.storage.set(KEY, JSON.stringify(state.map(r=>[r.status,r.fix,r.memo]))); }catch(e){}
}
async function restore(){
  try{
    const r = await window.storage.get(KEY);
    if(!r) return false;
    const saved = JSON.parse(r.value);
    if(saved.length !== state.length) return false;
    saved.forEach(([s,f,m],i)=>{ state[i].status=s; state[i].fix=f; state[i].memo=m; });
    return true;
  }catch(e){ return false; }
}

/* ── 목록 계산 ── */
function compute(){
  const q = query.trim().toLowerCase();
  view = state.filter(r=>{
    if(filter!=='all' && r.status!==filter) return false;
    if(q && !r.brand.toLowerCase().includes(q)) return false;
    return true;
  });
  const cmp = {
    orig:(a,b)=>a.i-b.i,
    brand:(a,b)=>a.brand.localeCompare(b.brand,'ko')||a.price-b.price,
    phigh:(a,b)=>b.price-a.price,
    plow:(a,b)=>a.price-b.price,
    spread:(a,b)=>b.spread-a.spread||a.brand.localeCompare(b.brand,'ko')
  }[sortBy];
  view.sort(cmp);
}

function render(){
  compute();
  const g = $('grid');
  g.innerHTML = view.map(r=>`
    <article class="item s-${r.status}" data-i="${r.i}">
      <button class="thumb" data-open="${r.i}" aria-label="${r.brand} 크게 보기">
        <img src="${r.img_url}" alt="${r.brand} 상품 이미지" loading="lazy"
             onerror="this.closest('.thumb').classList.add('broken');this.remove()">
        <span class="fail">이미지 없음</span>
        <span class="idx">${r.i+1}</span>
        <span class="mark">${MARK[r.status]||''}</span>
      </button>
      <div class="meta">
        <div class="brand" title="${r.brand}">${r.brand}</div>
        <div class="price num">${won(r.price)}<em>원</em></div>
        ${r.spread>=3 ? `<span class="flag">브랜드 내 가격 편차 ${r.spread.toFixed(1)}배</span>` : ''}
      </div>
    </article>`).join('');
  $('empty').hidden = view.length>0;
  stats();
}

function stats(){
  const c = {all:state.length, none:0, ok:0, price:0, brand:0, both:0, hold:0};
  state.forEach(r=>c[r.status]++);
  for(const k in c) $('c-'+k).textContent = c[k];
  const done = state.length - c.none;
  $('done').textContent = done; $('total').textContent = state.length;
  $('bar').innerHTML =
    `<i style="width:${c.ok/state.length*100}%;background:var(--ok)"></i>`+
    `<i style="width:${(c.price+c.brand+c.both)/state.length*100}%;background:var(--err)"></i>`+
    `<i style="width:${c.hold/state.length*100}%;background:var(--hold)"></i>`;
}

/* ── 검수 패널 ── */
function open(i){
  const pos = view.findIndex(r=>r.i===i);
  cur = pos>=0 ? pos : 0;
  $('ovl').classList.add('on');
  document.body.style.overflow='hidden';
  paint();
}
function paint(){
  const r = view[cur]; if(!r) return close();
  $('pPos').textContent = `${cur+1} / ${view.length}`;
  $('pBrand').textContent = r.brand;
  $('pPrice').innerHTML = `${won(r.price)}<em>원</em>`;
  const img = $('pImg'); img.hidden=false; $('pFail').hidden=true;
  img.onerror = ()=>{ img.hidden=true; $('pFail').hidden=false; };
  img.src = r.img_url; img.alt = `${r.brand} 상품 이미지`;
  $('pSrc').textContent = r.img_url;
  const list = priceSet(key(r.brand));
  $('pHistWrap').hidden = list.length<2;
  $('pHist').innerHTML = list.map(p=>`<span class="${p===r.price?'cur':''}">${won(p)}</span>`).join('');
  document.querySelectorAll('.act').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.set===r.status)));
  $('pFix').value = r.fix; $('pMemo').value = r.memo;
  $('prev').disabled = cur===0; $('next').disabled = cur===view.length-1;
}
function close(){ $('ovl').classList.remove('on'); document.body.style.overflow=''; cur=-1; render(); }
function step(d){ const n=cur+d; if(n<0||n>=view.length) return; cur=n; paint(); }
function mark(s){
  const r = view[cur]; if(!r) return;
  r.status = r.status===s ? 'none' : s;
  paint(); stats();
  const card = document.querySelector(`.item[data-i="${r.i}"]`);
  if(card){ card.className = `item s-${r.status}`; card.querySelector('.mark').textContent = MARK[r.status]||''; }
  save();
  if(r.status!=='none' && cur<view.length-1) setTimeout(()=>step(1),120);
}

/* ── 이벤트 ── */
$('grid').addEventListener('click', e=>{
  const t = e.target.closest('[data-open]'); if(!t) return;
  open(+t.dataset.open);
});
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); filter=b.dataset.filter; render();
}));
$('q').addEventListener('input', e=>{ query=e.target.value; render(); });
$('sort').addEventListener('change', e=>{ sortBy=e.target.value; render(); });
document.querySelectorAll('.act').forEach(b=>b.addEventListener('click',()=>mark(b.dataset.set)));
$('prev').onclick = ()=>step(-1);
$('next').onclick = ()=>step(1);
$('close').onclick = close;
$('ovl').addEventListener('click', e=>{ if(e.target===$('ovl')) close(); });
$('pFix').addEventListener('input', e=>{
  const raw = e.target.value.replace(/[^\d]/g,'');
  e.target.value = raw ? (+raw).toLocaleString('ko-KR') : '';
  if(view[cur]){ view[cur].fix = raw; save(); }
});
$('pMemo').addEventListener('input', e=>{ if(view[cur]){ view[cur].memo = e.target.value; save(); } });
document.addEventListener('keydown', e=>{
  if(!$('ovl').classList.contains('on')) return;
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ if(e.key==='Escape') e.target.blur(); return; }
  const map = {'1':'ok','2':'price','3':'brand','4':'both','5':'hold'};
  if(map[e.key]){ e.preventDefault(); mark(map[e.key]); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); step(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); step(-1); }
  else if(e.key==='Escape'){ close(); }
});

/* ── 내보내기 / 불러오기 ── */
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text],{type}));
  const a = Object.assign(document.createElement('a'),{href:url,download:name});
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
$('export').onclick = ()=>{
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const rows = [['no','brand','price','판정','수정제안가격','메모','img_url']];
  state.forEach(r=>rows.push([r.i+1,r.brand,r.price,LABEL[r.status],r.fix,r.memo,r.img_url]));
  download('가격검증_결과.csv', '\ufeff'+rows.map(r=>r.map(esc).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
  download('가격검증_진행상태.json', JSON.stringify(state.map(r=>[r.status,r.fix,r.memo])), 'application/json');
  toast('CSV와 진행상태 파일을 저장했습니다');
};
$('load').onclick = ()=>$('file').click();
$('file').onchange = async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const saved = JSON.parse(await f.text());
    if(saved.length !== state.length) throw new Error('행 수가 다릅니다');
    saved.forEach(([s,fx,m],i)=>{ state[i].status=s; state[i].fix=fx; state[i].memo=m; });
    render(); save(); toast('이전 판정을 불러왔습니다');
  }catch(err){ toast('불러오지 못했습니다. 내보낸 진행상태 JSON 파일인지 확인해주세요'); }
  e.target.value='';
};
$('reset').onclick = ()=>{
  if(!confirm('모든 판정과 메모를 지웁니다. 계속할까요?')) return;
  state.forEach(r=>{ r.status='none'; r.fix=''; r.memo=''; });
  render(); save(); toast('판정을 초기화했습니다');
};

/* ── 시작 ── */
(async ()=>{
  $('src').textContent = `브랜드_가격.xlsx · ${state.length}건`;
  const had = await restore();
  render();
  if(had) toast('이전 검수 내용을 이어서 표시합니다');
})();
</script>
</body>
</html>
