<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>세탁비 확인 | 런드리고</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: #1a1a1a;
    }

    /* ── APP SHELL ── */
    #app {
      position: fixed; inset: 0;
      max-width: 430px; margin: 0 auto;
      overflow: hidden;
      background: #f5f5f5;
    }

    /* ── SCREEN SYSTEM ── */
    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background: #fff;
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .screen.active { transform: translateX(0); }
    .screen.prev   { transform: translateX(-28%); }

    /* ── HEADER ── */
    .nav-header {
      display: flex; align-items: center;
      padding: 0 8px;
      height: 52px; flex-shrink: 0;
      background: #fff;
      border-bottom: 1px solid #ededed;
      position: relative; z-index: 10;
    }
    .nav-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border-radius: 50%; font-size: 22px; color: #222;
      flex-shrink: 0;
    }
    .nav-title {
      flex: 1; text-align: center;
      font-size: 17px; font-weight: 700; color: #111;
    }

    /* ── PRIMARY BUTTON ── */
    .btn-primary {
      width: 100%; height: 54px;
      background: #2BAE66; color: #fff;
      font-size: 16px; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:hover { background: #249958; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

    .footer-bar {
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      background: #fff;
      border-top: 1px solid #ededed;
      flex-shrink: 0;
    }

    /* ═══════════════════════════════════════
       SCREEN 2 – 세탁비 확인설명
    ═══════════════════════════════════════ */
    #screen2 { background: #fff; }
    #screen2 .body {
      flex: 1; overflow-y: auto;
      padding: 0 16px 8px;
    }
    .s2-back {
      font-size: 22px; color: #111; font-weight: 300;
      padding: 14px 16px 0; display: block; line-height: 1;
    }
    .explain-title {
      font-size: 21px; font-weight: 800; line-height: 1.35; color: #111;
      padding: 10px 0 14px;
    }
    /* 히어로 카드 - 정적 3단계 아이콘 */
    .explain-img-wrap {
      width: 100%; border-radius: 18px; overflow: hidden;
      background: #f5f9f5; border: 0.5px solid #d4edd9;
      margin-bottom: 12px;
      padding: 22px 16px 16px;
    }
    .s2-steps-row {
      display: flex; align-items: flex-start; justify-content: center; gap: 0;
    }
    .s2-step {
      display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1;
    }
    .s2-step-ico {
      width: 64px; height: 64px; border-radius: 18px;
      background: #fff; border: 1px solid #e8e8e8;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
    }
    .s2-step-ico.active {
      background: #e1f5ee; border-color: #9FE1CB;
    }
    .s2-step-lbl {
      font-size: 14px; font-weight: 600; color: #999; text-align: center;
    }
    .s2-step-lbl.active { color: #1AC073; font-weight: 700; }
    .s2-step-arrow {
      font-size: 20px; color: #ccc; padding-top: 22px; flex-shrink: 0;
    }
    .hero-dots {
      display: flex; gap: 5px; justify-content: center; margin-top: 14px;
    }
    .hero-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(0,0,0,0.15);
    }
    .hero-dot.active { background: #2BAE66; width: 14px; border-radius: 3px; }
    /* 설명 인포 카드 */
    .explain-info-card {
      background: #f0faf5; border-radius: 14px;
      border: 0.5px solid #b6e8d0;
      padding: 11px 14px; margin-bottom: 14px;
    }
    .explain-info-title { font-size: 14px; font-weight: 700; color: #1AC073; margin-bottom: 4px; }
    .explain-info-desc  { font-size: 13px; color: #444; line-height: 1.6; }
    /* 카메라·앨범 버튼 - 둘 다 아웃라인 */
    .btn-camera {
      width: 100%; height: 58px;
      background: #1AC073; color: #fff;
      border: none;
      font-size: 17px; font-weight: 800;
      border-radius: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-bottom: 8px;
      transition: background 0.15s;
    }
    .btn-camera:hover { background: #17a866; }
    .btn-album-s2 {
      width: 100%; height: 52px;
      background: #fff; color: #222;
      border: 1.5px solid #ddd;
      font-size: 15px; font-weight: 700;
      border-radius: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.15s;
    }
    .btn-album-s2:hover { background: #f8f8f8; }

    /* ═══════════════════════════════════════
       SCREEN 3 – 카메라
    ═══════════════════════════════════════ */
    #screen3 { background: #000; }

    #cameraVideo {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .cam-header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      padding: 10px 12px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      display: flex; align-items: center;
    }
    .cam-back {
      width: 42px; height: 42px;
      background: rgba(0,0,0,0.45); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 22px; cursor: pointer;
    }

    /* Guide frame — 썸네일과 안 겹치도록 위쪽 정렬 */
    .cam-guide {
      position: absolute; inset: 0; z-index: 5;
      pointer-events: none;
      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 72px;
    }
    .guide-rect {
      width: 75%; aspect-ratio: 3/4;
      position: relative;
    }
    /* Corner brackets */
    .guide-rect::before, .guide-rect::after,
    .guide-rect .br, .guide-rect .bl {
      content: '';
      position: absolute; width: 24px; height: 24px;
    }
    .guide-rect::before {
      top: 0; left: 0;
      border-top: 3px solid #fff; border-left: 3px solid #fff;
      border-radius: 4px 0 0 0;
    }
    .guide-rect::after {
      top: 0; right: 0;
      border-top: 3px solid #fff; border-right: 3px solid #fff;
      border-radius: 0 4px 0 0;
    }
    .guide-rect .br {
      bottom: 0; right: 0;
      border-bottom: 3px solid #fff; border-right: 3px solid #fff;
      border-radius: 0 0 4px 0;
    }
    .guide-rect .bl {
      bottom: 0; left: 0;
      border-bottom: 3px solid #fff; border-left: 3px solid #fff;
      border-radius: 0 0 0 4px;
    }
    .guide-hint {
      position: absolute; bottom: -42px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff; font-size: 13px; font-weight: 500;
      padding: 7px 18px; border-radius: 20px;
      white-space: nowrap;
    }

    /* Overlay dimming outside guide */
    .guide-dim {
      position: absolute; inset: 0; z-index: 4;
      pointer-events: none;
    }

    /* Camera error */
    #camErr {
      position: absolute; inset: 0; z-index: 30;
      background: #111;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff; text-align: center; padding: 32px;
      gap: 12px;
    }
    #camErr.show { display: flex; }
    #camErr .err-ico { font-size: 52px; }
    #camErr h3 { font-size: 16px; font-weight: 700; }
    #camErr p { font-size: 13px; color: #aaa; line-height: 1.6; }
    #camErr button {
      margin-top: 8px; padding: 12px 28px;
      background: #2BAE66; color: #fff; border: none;
      border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
    }

    /* Bottom area */
    .cam-bottom {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      background: linear-gradient(transparent, rgba(0,0,0,0.72) 40%);
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }

    /* Thumbnail strip */
    .thumb-row {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px 6px;
    }
    .thumb-count-badge {
      color: #fff; font-size: 13px; font-weight: 700;
      min-width: 28px; flex-shrink: 0;
    }
    #thumbStrip {
      display: flex; gap: 6px; flex: 1;
      overflow-x: auto; scroll-behavior: smooth;
      scrollbar-width: none;
    }
    #thumbStrip::-webkit-scrollbar { display: none; }
    .thumb-item {
      position: relative; width: 53px; height: 53px; flex-shrink: 0;
      border-radius: 9px; overflow: hidden;
      border: 2px solid rgba(255,255,255,0.5);
      cursor: pointer;
    }
    .thumb-item.latest { border-color: #2BAE66; border-width: 2.5px; }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-del {
      position: absolute; top: 3px; right: 3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(0,0,0,0.65);
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; color: #fff; font-weight: 900; line-height: 1;
      cursor: pointer;
    }

    /* Camera controls — captureBtn 절대 중앙 */
    .cam-controls {
      position: relative;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 28px 4px;
    }
    #captureBtn {
      position: absolute !important;
      left: 50%; transform: translateX(-50%);
    }
    .btn-album {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 600;
      background: none; border: none; cursor: pointer;
      width: 72px;
    }
    .album-thumb {
      width: 50px; height: 50px; border-radius: 14px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .album-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }

    #captureBtn {
      width: 74px; height: 74px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.9);
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.12s;
      flex-shrink: 0; z-index: 1;
    }
    #captureBtn:active { transform: scale(0.9); }
    #captureBtn .cap-inner {
      width: 58px; height: 58px; border-radius: 50%;
      background: rgba(255,255,255,0.9);
    }

    /* 사진 카운트 뱃지 */
    .cam-count-badge {
      position: absolute; top: 12px; right: 12px; z-index: 21;
      background: rgba(43,174,102,0.92); border-radius: 12px;
      padding: 4px 10px; font-size: 11px; font-weight: 700; color: #fff;
      display: none;
    }
    .cam-count-badge.show { display: block; }
    /* 분석하기 래퍼 (버튼 + 라벨) */
    .btn-analyze-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 6px; width: 72px;
    }
    .btn-analyze-wrap span {
      font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.45);
      transition: color 0.2s;
    }
    .btn-analyze-wrap.on span { color: rgba(255,255,255,0.9); }
    .btn-price {
      width: 50px; height: 50px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      font-size: 24px; font-weight: 700; color: rgba(255,255,255,0.2);
      cursor: not-allowed; pointer-events: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-price.on {
      background: #1AC073; color: #fff; border-color: #1AC073;
      cursor: pointer; pointer-events: auto;
    }

    #albumInput { display: none; }

    /* Flash */
    .cam-flash {
      position: absolute; inset: 0; z-index: 40;
      background: #fff; opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease-out;
    }

    /* ═══════════════════════════════════════
       SCREEN 4 – 세탁비 결과
    ═══════════════════════════════════════ */
    #screen4 { background: #f5f5f5; }
    #screen4 .body { flex: 1; overflow-y: auto; padding: 12px 12px 0; }

    /* ── Summary card ── */
    .summary-card {
      background: #fff; border-radius: 18px;
      padding: 14px 20px 12px; margin-bottom: 10px;
      text-align: center;
    }
    .summary-eyebrow { font-size: 14px; color: #888; margin-bottom: 4px; }
    .summary-price-row { display: flex; align-items: baseline; justify-content: center; gap: 2px; margin-bottom: 3px; }
    .summary-price-row .price-num { font-size: 26px; font-weight: 900; color: #1AC073; line-height: 1; }
    .summary-price-row .price-unit { font-size: 18px; font-weight: 700; color: #111; }
    .summary-price .price-sub { font-size: 13px; color: #bbb; margin-top: 2px; display: block; }

    /* ── 업셀 (summary 바로 아래) ── */
    .sub-upsell-incard {
      margin-bottom: 10px; display: none;
      border-radius: 12px;
      border: 1.5px solid #A7F3D0;
      border-left: 4px solid #1AC073;
      background: #F0FDF6;
      padding: 14px 14px;
    }
    .sub-upsell-incard.show { display: block; }
    .upsell-incard {
      margin-bottom: 10px; display: none;
      border-radius: 12px;
      border: 1.5px solid #FED7AA;
      border-left: 4px solid #F97316;
      background: #FFF7ED;
      padding: 14px 14px;
    }
    .upsell-incard.show { display: block; }

    /* ── Pill 탭 ── */
    .tab-header {
      display: flex; margin: 0 0 10px;
      background: #E8E8E8; border-radius: 14px; padding: 4px;
    }
    .tab-hbtn {
      flex: 1; height: 46px; border: none; background: transparent;
      font-size: 17px; font-weight: 800; color: #999;
      cursor: pointer; border-radius: 11px; transition: all 0.15s;
      letter-spacing: -0.3px;
    }
    .tab-hbtn.active {
      background: #fff; color: #111;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .tab-hbtn.tab-s.active { color: #1AC073; }

    /* ── TABLE CARD ── */
    .table-card {
      background: #fff; border-radius: 18px;
      margin-bottom: 10px; overflow: hidden; padding: 0 16px;
    }

    /* ── ITEM ROW ── */
    .item-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 0; border-bottom: 1px solid #F5F5F5;
      animation: fadeUp 0.25s ease forwards; opacity: 0;
    }
    .item-row:last-child { border-bottom: none; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    .item-thumb {
      width: 72px; height: 72px; border-radius: 14px;
      flex-shrink: 0; background: #F0F0F0; overflow: hidden;
    }
    .item-thumb img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; display: block; }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 16px; font-weight: 700; color: #111; word-break: keep-all; line-height: 1.3; }
    .item-badges { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; }
    .item-right { flex-shrink: 0; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .price-main       { font-size: 16px; font-weight: 800; color: #111; white-space: nowrap; }
    .price-main.prem  { color: #6D28D9; }

    /* 구독탭 세탁권 */
    .ticket-badge {
      display: inline-block; font-size: 12px; font-weight: 700;
      background: #E6FBF1; color: #065F46;
      border-radius: 7px; padding: 3px 9px; white-space: nowrap;
    }
    .ticket-badge.shortage { background: #FEF3C7; color: #92400E; }
    .soaked-price { font-size: 11px; color: #B0B0B0; white-space: nowrap; margin-top: 1px; }
    .soaked-price.amber { color: #D97706; font-weight: 700; }

    /* 배지 */
    .brand-chip {
      display: inline-block; font-size: 11px; font-weight: 700;
      background: #F2F2F2; color: #555;
      border-radius: 6px; padding: 2px 7px; white-space: nowrap;
    }
    .prem-chip {
      display: inline-block; font-size: 11px; font-weight: 800;
      background: #EDE9FE; color: #5B21B6;
      border-radius: 6px; padding: 2px 7px; white-space: nowrap;
    }

    /* 삭제 버튼 */
    .item-del-btn {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid #EBEBEB; background: #FAFAFA;
      color: #C8C8C8; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* 합계 푸터 */
    .table-foot { padding: 2px 0 10px; }
    .foot-divider-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; font-size: 14px; color: #999;
    }
    .foot-divider-row .fdr-val { font-weight: 600; color: #555; }
    .foot-divider-row .fdr-val.green { color: #1AC073; }
    .foot-divider-row .fdr-val.amber { color: #D97706; }
    .foot-divider-row .fdr-val.blue  { color: #2563EB; }
    .foot-total-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0 4px; border-top: 1.5px solid #111; margin-top: 4px;
    }
    .foot-total-lbl { font-size: 17px; font-weight: 800; color: #111; }
    .foot-total-val { font-size: 19px; font-weight: 900; color: #111; }
    .foot-total-val.green { color: #1AC073; }
    .foot-section-sep { border-top: 1px dashed #EBEBEB; margin: 4px 0; }

    /* 잔여 세탁권 칩 */
    .remain-chip {
      background: #EFF6FF; border: 1px solid #BFDBFE;
      border-radius: 10px; padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
      margin: 8px 0;
    }
    .remain-chip-lbl { font-size: 13px; font-weight: 700; color: #1D4ED8; }
    .remain-chip-val { font-size: 14px; font-weight: 800; color: #2563EB; }

    /* 구독 플랜 선택기 */
    .plan-selector {
      display: flex; gap: 8px; padding: 14px 0 10px;
      border-bottom: 1px solid #F5F5F5; margin-bottom: 4px;
    }
    .plan-card {
      flex: 1; border-radius: 13px; border: 1.5px solid #E8E8E8;
      background: #FAFAFA; padding: 10px 6px 9px;
      cursor: pointer; text-align: center; transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .plan-card.active {
      border-color: #1AC073; background: #F0FDF6;
      box-shadow: 0 2px 8px rgba(26,192,115,0.15);
    }
    .plan-card.auto-tag::after {
      content: '추천'; font-size: 9px; font-weight: 800;
      background: #1AC073; color: #fff;
      border-radius: 4px; padding: 1px 4px; margin-left: 3px;
      vertical-align: middle;
    }
    .plan-card-name { font-size: 12px; font-weight: 800; color: #888; margin-bottom: 4px; }
    .plan-card.active .plan-card-name { color: #065F46; }
    .plan-card-price { font-size: 14px; font-weight: 900; color: #111; }
    .plan-card.active .plan-card-price { color: #1AC073; }
    .plan-card-info { font-size: 10px; color: #C0C0C0; margin-top: 3px; line-height: 1.4; }
    .plan-card.active .plan-card-info { color: #34D399; }

    /* 구독 절약 배너 */
    .sub-upsell-card { display: none; }
    .sub-upsell-card.show { display: block; }
    .sub-upsell-incard { background: #F0FDF6; }
    .sub-upsell-title { font-size: 16px; font-weight: 900; line-height: 1.4; }
    .sub-upsell-card.save .sub-upsell-title { color: #065F46; }
    .sub-upsell-incard .sub-upsell-title { color: #065F46; }
    .sub-upsell-card.more .sub-upsell-title { color: #5B21B6; }
    .sub-upsell-sub { font-size: 12px; margin-top: 3px; }
    .sub-upsell-card.save .sub-upsell-sub { color: #34D399; }
    .sub-upsell-card.more .sub-upsell-sub { color: #A78BFA; }
    .sub-upsell-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .sub-plan-btn {
      flex-shrink: 0; padding: 9px 14px; border-radius: 10px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 800; line-height: 1.4; text-align: center;
      background: #1AC073; color: #fff; white-space: nowrap;
    }
    .sub-plan-btn.more { background: #5B21B6; }

function initHeroAnimation() {
  const frames = [
    document.getElementById('heroF0'),
    document.getElementById('heroF1'),
    document.getElementById('heroF2')
  ];
  const dots = [
    document.getElementById('heroDot0'),
    document.getElementById('heroDot1'),
    document.getElementById('heroDot2')
  ];
  if (frames.some(f => !f) || dots.some(d => !d)) return;
  const holds = [2000, 1500, 2500];
  let cur = 0;
  let timer = null;
  function next() {
    frames[cur].classList.add('hidden');
    dots[cur].classList.remove('active');
    cur = (cur + 1) % 3;
    frames[cur].classList.remove('hidden');
    dots[cur].classList.add('active');
    timer = setTimeout(next, holds[cur]);
  }
  timer = setTimeout(next, holds[0]);
}

const ORDER = ['screen2','screen3','screen4'];

function navTo(id) {
  const from = document.getElementById(curScreen);
  const to   = document.getElementById(id);
  const fwd  = ORDER.indexOf(id) > ORDER.indexOf(curScreen);
  if (fwd) {
    from.classList.add('prev');
    from.classList.remove('active');
  } else {
    from.classList.remove('active', 'prev');
  }
  to.classList.remove('prev');
  to.classList.add('active');
  curScreen = id;
}

function goToCamera() {
  navTo('screen3');

function backFromCamera() {

function backFromResult() {

// CAMERA
// ═══════════════════════════════════════
async function startCam() {
  const vid = document.getElementById('cameraVideo');
  const err = document.getElementById('camErr');
  if (stream) { vid.srcObject = stream; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    vid.srcObject = stream;
    err.classList.remove('show');

    // Try 0.5× (ultra-wide) zoom
    const track = stream.getVideoTracks()[0];
    const caps  = track.getCapabilities?.();
    if (caps?.zoom) {
      track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }).catch(() => {});
    }
  } catch (e) {
    console.warn('Camera:', e);
    err.classList.add('show');
  }
}

function stopCam() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function capturePhoto() {
  const vid = document.getElementById('cameraVideo');
  if (!vid.videoWidth) { toast('카메라가 준비 중이에요'); return; }

  // 이미지 최대 1024px로 다운스케일 (API 전송 속도 개선)
  const MAX = 1024;
  const c = document.createElement('canvas');
  const ratio = Math.min(1, MAX / Math.max(vid.videoWidth, vid.videoHeight));
  c.width  = Math.round(vid.videoWidth  * ratio);
  c.height = Math.round(vid.videoHeight * ratio);
  c.getContext('2d').drawImage(vid, 0, 0, c.width, c.height);
  photos.push(c.toDataURL('image/jpeg', 0.80));
  refreshThumbs();
  doFlash();
}

function doFlash() {
  const f = document.getElementById('camFlash');
  f.style.opacity = '0.75';
  setTimeout(() => { f.style.opacity = '0'; }, 160);
}

function refreshThumbs() {
  const strip = document.getElementById('thumbStrip');
  const badge = document.getElementById('thumbCount');
  const btn   = document.getElementById('priceBtn');

  strip.innerHTML = '';
  photos.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'thumb-item' + (i === photos.length - 1 ? ' latest' : '');
    d.innerHTML = `<img src="${p}"><div class="thumb-del" onclick="removePhoto(${i})">✕</div>`;
    strip.appendChild(d);
  });

  const n = photos.length;
  badge.textContent = n ? `${n}개` : '';
  btn.classList.toggle('on', n > 0);
  const wrap = document.getElementById('analyzeBtnWrap');
  if (wrap) wrap.classList.toggle('on', n > 0);

  // 카운트 뱃지 (우측 상단)
  const countBadge = document.getElementById('camCountBadge');
  if (countBadge) {
    countBadge.textContent = n ? `📷 ${n}장 선택됨` : '';
    countBadge.classList.toggle('show', n > 0);
  }

  setTimeout(() => { strip.scrollLeft = strip.scrollWidth; }, 40);
}

function removePhoto(i) {
  photos.splice(i, 1);
  refreshThumbs();
}

function openAlbum() { document.getElementById('albumInput').click(); }

function handleAlbum(inp) {
  Array.from(inp.files).forEach(f => {
    photosLoading++;
    const r = new FileReader();
    r.onload = e => {
      // 앨범 사진도 카메라와 동일하게 max 1024px로 리사이즈
      const img = new Image();
      img.onload = () => {
        const MAX = 1024;
        const ratio = Math.min(1, MAX / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width  = Math.round(img.width  * ratio);
        c.height = Math.round(img.height * ratio);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const resized = c.toDataURL('image/jpeg', 0.80);
        photos.push(resized);
        photosLoading--;
        refreshThumbs();
        const prev = document.getElementById('albumPreview');
        prev.innerHTML = `<img src="${resized}">`;
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(f);
  });
  inp.value = '';
}

async function waitPhotosReady() {
  while (photosLoading > 0) {
    await new Promise(r => setTimeout(r, 50));
  }
}

// ═══════════════════════════════════════
// VISION API
// ═══════════════════════════════════════
async function doAnalyze() {
  if (!photos.length && photosLoading === 0) return;
  showLoad('사진 준비 중...');
  await waitPhotosReady();       // 앨범 사진 로드 완료 대기
  if (!photos.length) { hideLoad(); return; }
  showLoad('품목을 인식하고 있어요...');
  try {
    items = await callClaude();
    hideLoad();
    renderResult();
    navTo('screen4');
  } catch (e) {
    hideLoad();
    toast('분석 실패: ' + e.message);
  }
}

async function callClaude() {
  // 사진 base64 추출 (data URL → raw base64)
  const b64Photos = photos.map(p => p.split(',')[1]);

  const res = await fetch('/api/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ photos: b64Photos })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `서버 오류 (${res.status})`);
  }

  const d = await res.json();

  return (d.items || []).map((it, i) => {
    const name  = it.소분류;
    const brand = it.브랜드 || null;
    const photoIdx = it.사진 != null
      ? Math.min(Math.max(it.사진 - 1, 0), photos.length - 1)
      : (i % photos.length);
    return {
      name,
      qty:        it.수량 || 1,
      brand,
      autoPremium: isAutoPremium(name, brand),
      thumb:      photos[photoIdx]
    };
  });
}

function totals() {
  let 정가=0, 구독=0, 차감=0;
  items.forEach((it, idx) => {
    const p = pLookup(it.name); if (!p) return;
    const q = it.qty;
    const isPrem = premiumSet.has(idx) && p.프리미엄 > 0;
    if (isPrem) {
      정가 += p.프리미엄 * q;
      구독 += p.프리미엄 * q;   // 프리미엄은 소진시도 동일
    } else {
      정가 += p.정가 * q;
      구독 += p.구독 * q;
      차감 += p.차감 * q;
    }
  });
  return { 정가, 구독, 차감 };
}

function getDeliveryFee(subtotal) {
  if (subtotal <= 0) return 0;
  return subtotal >= 19500 ? 3800 : 7800;
}

// 구독 플랜 상수
const PLANS = [
  { name: '베이직',   price: 44000, tickets: 6,  deliveries: 1 },
  { name: '스탠다드', price: 65300, tickets: 10, deliveries: 1 },
  { name: '시그니처', price: 88100, tickets: 14, deliveries: 2 },
];

function selectPlan(regularSubtotal) {
  // 3개 플랜 중 실제 총비용(plan.price + overflow + premium)이 가장 낮은 플랜 추천
  return PLANS.reduce((best, p) => {
    const costP = calcSub(p).totalCost;
    const costB = calcSub(best).totalCost;
    return costP < costB ? p : best;
  });
}

function renderPlanSelector() {
  const sel = document.getElementById('planSelector');
  if (!sel) return;
  const t = totals();
  const recPlan = selectPlan(t.정가);
  sel.innerHTML = `<div class="plan-selector">${PLANS.map(p => {
    const isActive = activePlan && activePlan.name === p.name;
    const isRec = p.name === recPlan.name;
    return `<div class="plan-card${isActive ? ' active' : ''}${isRec && !activePlan ? ' active' : ''}${isRec ? ' auto-tag' : ''}"
      onclick="choosePlan('${p.name}')">
      <div class="plan-card-name">${p.name}</div>
      <div class="plan-card-price">${w(p.price)}원</div>
      <div class="plan-card-info">세탁권 ${p.tickets}개<br>배송 ${p.deliveries}회</div>
    </div>`;
  }).join('')}</div>`;
}

function choosePlan(name) {
  activePlan = PLANS.find(p => p.name === name) || null;
  renderRows();
  renderFoot();
  updateSummary();
}

function calcSub(plan) {
  const rows = items.map((it, idx) => {
    const p = pLookup(it.name);
    if (!p) return { it, idx, p: null, isPrem: false, tickets: 0, soakedPrice: 0, regularPrice: 0, premPrice: 0 };
    const isPrem = premiumSet.has(idx) && p.프리미엄 > 0;
    return {
      it, idx, p, isPrem,
      tickets: isPrem ? 0 : p.차감 * it.qty,   // 프리미엄은 세탁권 차감 불가
      soakedPrice: p.구독 * it.qty,             // 비프리미엄 소진시 가격
      premPrice: isPrem ? p.프리미엄 * it.qty : 0, // 프리미엄 가격
      regularPrice: isPrem ? p.프리미엄 * it.qty : p.정가 * it.qty,
    };
  });

  // 비싼 품목부터 세탁권 배정 (프리미엄 제외)
  const sorted = [...rows].sort((a, b) => b.regularPrice - a.regularPrice);
  let tLeft = plan.tickets;
  const useTicketSet = new Set();
  sorted.forEach(x => {
    if (!x.isPrem && x.tickets > 0 && tLeft >= x.tickets) {
      useTicketSet.add(x.idx);
      tLeft -= x.tickets;
    }
  });

  let ticketsUsed = 0, soakedCost = 0, premiumCost = 0;
  const finalRows = rows.map(x => {
    if (x.isPrem) {
      premiumCost += x.premPrice;
    } else {
      const useTicket = useTicketSet.has(x.idx);
      if (useTicket) ticketsUsed += x.tickets;
      else           soakedCost += x.soakedPrice;
    }
    const useTicket = useTicketSet.has(x.idx);
    return { ...x, useTicket };
  });

  return {
    plan,
    totalTicketsNeeded: rows.filter(x => !x.isPrem).reduce((s, x) => s + x.tickets, 0),
    ticketsUsed,
    ticketsRemain: plan.tickets - ticketsUsed,
    soakedCost,
    premiumCost,
    finalRows,
    totalCost: plan.price + soakedCost + premiumCost,
  };
}

function delItem(idx) {
  items.splice(idx, 1);
  premiumSet = new Set([...premiumSet].filter(i => i !== idx).map(i => i > idx ? i - 1 : i));
  if (!items.length) {
    renderResult();
  } else {
    renderRows();
    renderFoot();
    renderUpsell();
    updateSummary();
  }
}

function updateSummary() {

    const total = t.정가 + getDeliveryFee(t.정가);
    sn.textContent = w(total);
    su && (su.textContent = '원');
  } else {
    const plan = activePlan || selectPlan(t.정가);
    const sub = calcSub(plan);
    sn.textContent = w(sub.totalCost);
    su && (su.textContent = '원');
  }
}


// ═══════════════════════════════════════
// UPSELLING
// ═══════════════════════════════════════
function getUpsell(subtotal) {
  // subtotal = 정가 소계 (배송비 제외) — 구간 사이 gap 없이 연속 처리
  if (subtotal <= 0) return null;

  // 구간 1: ~19,499원 → 배송비 50% 할인까지
  if (subtotal < 19500) {
    const gap = 19500 - subtotal;
    return {
      color: '#F97316', icon: '🚚', progress: subtotal / 19500,
      msg: `<strong>${w(gap)}원</strong>만 더 담으면 배송비 50% 할인!`,
      sub: '19,500원 달성 시 배송비 7,800원 → 3,800원'
    };
  }
  // 구간 2: 19,500~29,999원 → 배송비 무료까지
  if (subtotal < 30000) {
    const gap = 45000 - subtotal;
    return {
      color: '#F97316', icon: '🚚', progress: subtotal / 45000,
      msg: `<strong>${w(gap)}원</strong>만 더 담으면 배송비 무료!`,
      sub: '45,000원 달성 시 배송비 0원'
    };
  }
  // 구간 3: 30,000~44,999원 → 배송비 무료까지
  if (subtotal < 45000) {
    const gap = 45000 - subtotal;
    return {
      color: '#2BAE66', icon: '🎉', progress: subtotal / 45000,
      msg: `<strong>${w(gap)}원</strong>만 더 담으면 배송비 무료!`,
      sub: '45,000원 달성 시 배송비 0원'
    };
  }
  // 구간 4: 45,000~59,999원 → 배송비 무료 + 이불압축포장까지
  if (subtotal < 60000) {
    const gap = 60000 - subtotal;
    return {
      color: '#7C3AED', icon: '🛏️', progress: subtotal / 60000,
      msg: `<strong>${w(gap)}원</strong>만 더 담으면 배송비 무료 + 이불압축포장!`,
      sub: '60,000원 달성 시 이불 압축 포장 서비스 제공'
    };
  }
  // 구간 5: 60,000~70,000원 → 런드리고X 20% 할인
  if (subtotal <= 70000) {
    return {
      color: '#2BAE66', icon: '⭐', progress: 1,
      msg: `<strong>런드리고X 스탠다드 20% 할인</strong> 혜택을 받으실 수 있어요!`,
      sub: '지금 구독 신청하면 20% 할인된 가격으로 이용 가능해요'
    };
  }
  // 구간 6: 70,000원 초과 → 구독 크로스셀
  return {
    color: '#2BAE66', icon: '⭐', progress: 1,
    msg: `<strong>세탁 자주 맡기신다면</strong> 구독이 훨씬 저렴해요!`,
    sub: '런드리고X 구독 플랜으로 매달 최대 30% 절약'
  };
}

function renderUpsell() {
  const el    = document.getElementById('upsellCard');
  const subEl = document.getElementById('subUpsellCard');
  if (!el) return;

  // 구독탭: 배너 전부 숨김
  if (activeTab !== '일반') {
    el.classList.remove('show');
    el.innerHTML = '';
    if (subEl) { subEl.classList.remove('show'); subEl.innerHTML = ''; }
    return;
  }

  // 정가탭: 구독합계 vs 정가합계 비교
  const t = totals();
  const delivery = getDeliveryFee(t.정가);
  const regularTotal = t.정가 + delivery;
  const recPlan = selectPlan(t.정가);
  const sub = calcSub(recPlan);
  const diff = regularTotal - sub.totalCost;

  if (diff > 0) {
    // ── 구독이 더 저렴 → 초록 절약 배너 (subUpsellCard) ──
    el.classList.remove('show'); el.innerHTML = '';
    const remainStr = sub.ticketsRemain > 0
      ? `<div class="sub-upsell-sub" style="margin-top:4px">🎟️ 잔여 세탁권 <strong>${sub.ticketsRemain}개</strong>로 더 많이 맡겨보세요</div>` : '';
    subEl.classList.add('show');
    subEl.innerHTML = `
      <div class="sub-upsell-row">
        <div>
          <div class="sub-upsell-title">💚 구독하면 <strong>${w(diff)}원</strong> 절약!</div>
          <div class="sub-upsell-sub">(구독가 ${w(sub.totalCost)}원)</div>
        </div>
        <button class="sub-plan-btn" onclick="selectTab('구독')">구독가 보기</button>
      </div>
    `;
  } else {
    // ── 정가가 더 저렴 → CSV 업셀링 배너 (upsellCard) ──
    if (subEl) { subEl.classList.remove('show'); subEl.innerHTML = ''; }
    const u = getUpsell(t.정가);
    if (!u) { el.classList.remove('show'); return; }
    const barHtml = u.progress < 1
      ? `<div class="upsell-bar-wrap"><div class="upsell-bar" style="width:${Math.min(u.progress*100,100).toFixed(1)}%;background:${u.color}"></div></div>`
      : '';
    el.classList.add('show');
    el.innerHTML = `
      <div class="upsell-top">
        <span class="upsell-icon">${u.icon}</span>
        <div class="upsell-body">
          <div class="upsell-msg">${u.msg}</div>
          <div class="upsell-sub">${u.sub}</div>
        </div>
      </div>
      ${barHtml}
    `;
  }
}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function w(n) { return n.toLocaleString('ko-KR'); }

function showLoad(msg) {
  document.getElementById('loadSub').textContent = msg;
  document.getElementById('loadingMask').classList.add('on');
}
function hideLoad() { document.getElementById('loadingMask').classList.remove('on'); }

let _tt;
function toast(msg) {
  const el = document.getElementById('toastEl');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('on'), 2600);
}
</script>

<div class="toast" id="toastEl"></div>
</body>
</html>
